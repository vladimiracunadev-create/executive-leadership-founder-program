<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 522.06" width="1040" role="img" aria-labelledby="t-s174 d-s174" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s174">Clase 174 · Niveles de la cultura: de lo visible a lo que se da por sentado</title>
<desc id="d-s174">Cuatro niveles para observar una cultura: artefactos, comportamientos y rutinas, valores declarados y supuestos básicos.</desc>
<defs><marker id="p-s174" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="522.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 174 · Niveles de la cultura: de lo visible a lo que se da por sentado</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Schein &amp; Schein (2017) · Schein (1990) · Edmondson</text>
<rect x="130" y="96" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="130" y="96" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<circle cx="162" cy="127.625" r="15" fill="#1a7f37"/>
<text x="162" y="132.625" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="190" y="120" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Supuestos básicos</text>
<text x="190" y="138" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Creencias tácitas sobre cómo funcionan las cosas.</text>
<rect x="96" y="169.25" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<rect x="96" y="169.25" width="6" height="63.25" rx="3" fill="#bc4c00"/>
<circle cx="128" cy="200.875" r="15" fill="#bc4c00"/>
<text x="128" y="205.875" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="156" y="193.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Valores declarados</text>
<text x="156" y="211.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Lo que la organización dice que le importa.</text>
<rect x="62" y="242.5" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="62" y="242.5" width="6" height="63.25" rx="3" fill="#0969da"/>
<circle cx="94" cy="274.125" r="15" fill="#0969da"/>
<text x="94" y="279.125" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="122" y="266.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Comportamientos y rutinas</text>
<text x="122" y="284.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Qué hace la gente, qué se premia y qué se tolera en la práctica.</text>
<rect x="28" y="315.75" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.8" />
<rect x="28" y="315.75" width="6" height="63.25" rx="3" fill="#59636e"/>
<circle cx="60" cy="347.375" r="15" fill="#59636e"/>
<text x="60" y="352.375" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="88" y="339.75" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Artefactos visibles</text>
<text x="88" y="357.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Espacios, símbolos, lenguaje, historias y ceremonias.</text>
<rect x="28" y="395" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="417" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Schein distingue tres niveles (artefactos, valores declarados y supuestos); aquí se separan los comportamientos observados de los</text>
<text x="44" y="434.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >artefactos para que se puedan registrar. Las brechas entre niveles revelan la cultura real.</text>
<text x="28" y="481.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Una cultura se infiere de lo observado en varias fuentes y personas; una sola entrevista o encuesta no basta.</text>
</svg>
