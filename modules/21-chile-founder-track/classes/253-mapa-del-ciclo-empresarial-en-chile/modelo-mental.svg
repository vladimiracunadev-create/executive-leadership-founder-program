<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616.48" width="1040" role="img" aria-labelledby="t-g253 d-g253" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g253">Ficha visual de la clase 253: Mapa del ciclo empresarial en Chile</title>
<desc id="d-g253">Conceptos: formalization; RES; SII; municipal permit; compliance calendar. Método: definir actividad y riesgos → seleccionar estructura y constituir → iniciar ciclo tributario → resolver permisos y registro sectorial → crear calendario laboral tributario y corporativo.</desc>
<defs><marker id="p-g253" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="616.48" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#59636e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 253 · Mapa del ciclo empresarial en Chile</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 21 · Fundador, propietario e independencia</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#59636e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >formalization</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >proceso de operar bajo estructuras y registros exigidos</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >por la normativa</text>
<circle cx="38" cy="184.12" r="5" fill="#59636e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >RES</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Registro de Empresas y Sociedades para constitución y</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >actos disponibles en Chile</text>
<circle cx="38" cy="256.24" r="5" fill="#59636e"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >SII</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Servicio de Impuestos Internos responsable del ciclo</text>
<text x="54" y="295.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tributario</text>
<circle cx="38" cy="328.36" r="5" fill="#59636e"/>
<text x="54" y="333.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >municipal permit</text>
<text x="54" y="351.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >autorización local que puede corresponder según</text>
<text x="54" y="367.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >actividad</text>
<circle cx="38" cy="400.48" r="5" fill="#59636e"/>
<text x="54" y="405.48" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >compliance calendar</text>
<text x="54" y="423.48" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >calendario de obligaciones recurrentes y responsables</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#59636e"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >definir actividad y riesgos</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#59636e"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >seleccionar estructura y constituir</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#59636e"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >iniciar ciclo tributario</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#59636e"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >resolver permisos y registro</text>
<text x="690" y="199.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >sectorial</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#59636e"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >crear calendario laboral tributario</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >y corporativo</text>
<text x="28" y="472.48" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="484.48" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="41" cy="497.48" r="3.5" fill="#59636e"/>
<text x="52" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >registration status</text>
<rect x="195.1" y="484.48" width="95" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="208.1" cy="497.48" r="3.5" fill="#59636e"/>
<text x="219.1" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >SII status</text>
<rect x="300.1" y="484.48" width="129.5" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="313.1" cy="497.48" r="3.5" fill="#59636e"/>
<text x="324.1" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >permit coverage</text>
<rect x="439.6" y="484.48" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="452.6" cy="497.48" r="3.5" fill="#59636e"/>
<text x="463.6" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >deadline compliance</text>
<rect x="606.7" y="484.48" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="619.7" cy="497.48" r="3.5" fill="#59636e"/>
<text x="630.7" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >open obligations</text>
<rect x="28" y="530.48" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="530.48" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="550.48" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="568.48" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Los requisitos cambian por actividad, comuna y fecha. Este mapa enseña secuencia y preguntas; no sustituye revisión oficial ni</text>
<text x="48" y="585.73" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >asesoría contable o legal para el caso real.</text>
</svg>
