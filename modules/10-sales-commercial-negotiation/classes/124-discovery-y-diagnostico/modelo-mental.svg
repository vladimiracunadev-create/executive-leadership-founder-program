<rect x="28" y="474" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="474" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="494" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="512" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Discovery no debe convertirse en interrogatorio manipulativo ni en terapia gratuita interminable. Entrega valor y respeta cuando no</text>
<text x="48" y="529.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >existe fit o urgencia suficiente.</text>
