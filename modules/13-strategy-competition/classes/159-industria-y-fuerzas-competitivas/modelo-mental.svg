<text x="518" y="236" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >3</text>
<text x="538" y="236" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >identificar pools de beneficio</text>
<rect x="521" y="272" width="440" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.77"/>
<text x="535" y="292" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >4</text>
<text x="555" y="292" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >cambiar lente hacia sustitutos y complementos</text>
<rect x="538" y="328" width="406" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.7"/>
<text x="552" y="348" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >5</text>
<text x="572" y="348" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >traducir estructura a elección estratégica</text>
<text x="28" y="458.36" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="470.36" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="41" cy="483.36" r="3.5" fill="#bc4c00"/>
<text x="52" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >industry margins</text>
<rect x="174.4" y="470.36" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="187.4" cy="483.36" r="3.5" fill="#bc4c00"/>
<text x="198.4" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >concentration</text>
<rect x="300.1" y="470.36" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="313.1" cy="483.36" r="3.5" fill="#bc4c00"/>
<text x="324.1" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >switching cost</text>
<rect x="432.7" y="470.36" width="95" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="445.7" cy="483.36" r="3.5" fill="#bc4c00"/>
<text x="456.7" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >entry rate</text>
<rect x="537.7" y="470.36" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="550.7" cy="483.36" r="3.5" fill="#bc4c00"/>
<text x="561.7" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >substitution rate</text>
<rect x="28" y="516.36" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="516.36" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="536.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="554.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Las fronteras de industria cambian y las fuerzas no predicen movimientos específicos. Complementa con ecosistemas, tecnología,</text>
<text x="48" y="571.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >regulación y capacidades internas.</text>
</svg>
