id: 134
part: 11
title: "Investigación de mercado"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "entender mercado, posicionamiento, canales, conversión, retención y crecimiento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Formular una investigación a partir de una decisión pendiente y sus hipótesis."
  - "Elegir entre fuentes secundarias, entrevistas, encuestas, observación y experimentos."
  - "Diseñar una muestra y un cuestionario que reduzcan sesgos."
  - "Interpretar resultados con sus límites y niveles de confianza."
  - "Traducir hallazgos en decisiones y definir cuándo volver a medir."
deliverable: "leadership-decision-brief.md"
references:
  - "Philip Kotler & Kevin Lane Keller — *Marketing Management*"
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
  - "Ron Kohavi, Diane Tang & Ya Xu — *Trustworthy Online Controlled Experiments*"
  - "David J. Bland & Alexander Osterwalder — *Testing Business Ideas*"
  - "Byron Sharp — *How Brands Grow*"
limits:
  - "Las encuestas con muestras de conveniencia no se generalizan."
evidence_signals:
  - "decisión pendiente definida"
  - "hipótesis contrastables"
  - "método elegido según la pregunta"
  - "sesgos y límites declarados"
