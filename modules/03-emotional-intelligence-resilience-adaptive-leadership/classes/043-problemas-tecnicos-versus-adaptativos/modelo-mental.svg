<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 630.6" width="1040" role="img" aria-labelledby="t-g43 d-g43" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g43">Ficha visual de la clase 043: Problemas técnicos versus adaptativos</title>
<desc id="d-g43">Conceptos: problema técnico; desafío adaptativo; pérdida; holding environment; work avoidance. Método: diagnosticar qué parte es técnica y cuál adaptativa → mapear pérdidas y grupos afectados → regular tensión sin eliminarla → devolver trabajo a quienes deben aprender → proteger voces marginales y revisar adaptación.</desc>
<defs><marker id="p-g43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="630.6" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 043 · Problemas técnicos versus adaptativos</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 03 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >problema técnico</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >brecha con solución conocida y autoridad capaz de</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >implementarla</text>
<circle cx="38" cy="184.12" r="5" fill="#1a7f37"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >desafío adaptativo</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >brecha que requiere aprendizaje y cambio de conducta de</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >stakeholders</text>
<circle cx="38" cy="256.24" r="5" fill="#1a7f37"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >pérdida</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >valor, estatus, identidad o comodidad que alguien debe</text>
<text x="54" y="295.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >abandonar</text>
<circle cx="38" cy="328.36" r="5" fill="#1a7f37"/>
<text x="54" y="333.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >holding environment</text>
<text x="54" y="351.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >espacio suficientemente seguro para sostener tensión</text>
<text x="54" y="367.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >productiva</text>
<circle cx="38" cy="400.48" r="5" fill="#1a7f37"/>
<text x="54" y="405.48" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >work avoidance</text>
<text x="54" y="423.48" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >conducta que desplaza atención para evitar el cambio</text>
<text x="54" y="440.04" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >real</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="542" height="50" rx="9" fill="#1a7f37" stroke="#1a7f37" stroke-width="0" fill-opacity="0.98"/>
<text x="484" y="124" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >1</text>
<text x="504" y="124" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >diagnosticar qué parte es técnica y cuál adaptativa</text>
<rect x="487" y="160" width="508" height="50" rx="9" fill="#1a7f37" stroke="#1a7f37" stroke-width="0" fill-opacity="0.9099999999999999"/>
<text x="501" y="180" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >2</text>
<text x="521" y="180" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >mapear pérdidas y grupos afectados</text>
<rect x="504" y="216" width="474" height="50" rx="9" fill="#1a7f37" stroke="#1a7f37" stroke-width="0" fill-opacity="0.84"/>
<text x="518" y="236" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >3</text>
<text x="538" y="236" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >regular tensión sin eliminarla</text>
<rect x="521" y="272" width="440" height="50" rx="9" fill="#1a7f37" stroke="#1a7f37" stroke-width="0" fill-opacity="0.77"/>
<text x="535" y="292" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >4</text>
<text x="555" y="292" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >devolver trabajo a quienes deben aprender</text>
<rect x="538" y="328" width="406" height="50" rx="9" fill="#1a7f37" stroke="#1a7f37" stroke-width="0" fill-opacity="0.7"/>
<text x="552" y="348" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >5</text>
<text x="572" y="348" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >proteger voces marginales y revisar adaptación</text>
<text x="28" y="486.6" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="498.6" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="52" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >adopción real</text>
<rect x="153.7" y="498.6" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="166.7" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="177.7" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >conductas nuevas</text>
<rect x="300.1" y="498.6" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="313.1" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="324.1" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >resistencia por grupo</text>
<rect x="481" y="498.6" width="164" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="494" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="505" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >pérdidas reconocidas</text>
<rect x="655" y="498.6" width="184.7" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="668" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="679" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >dependencia de expertos</text>
<rect x="28" y="544.6" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="544.6" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="564.6" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="582.6" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No uses 'adaptativo' para justificar falta de expertise técnico. Muchos desafíos mezclan ambos; arreglar infraestructura defectuosa</text>
<text x="48" y="599.85" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >puede ser condición previa para el trabajo cultural.</text>
</svg>
