<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >comparar opciones por valor y</text>
<text x="690" y="199.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >downside</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
