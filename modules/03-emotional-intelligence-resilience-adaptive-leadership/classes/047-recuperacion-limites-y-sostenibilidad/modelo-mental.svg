<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" role="img" aria-labelledby="t-047 d-047" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-047">Agotamiento y recuperación</title>
<desc id="d-047">Las tres dimensiones del burnout, las seis áreas donde el trabajo se desajusta con la persona y las cuatro experiencias de recuperación fuera del trabajo.</desc>
<defs><marker id="p-047" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="600" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 047 · Sostener el rendimiento sin agotarse</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Maslach, Schaufeli &amp; Leiter (2001) · Sonnentag &amp; Fritz (2007)</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">BURNOUT: TRES DIMENSIONES</text>
<rect x="28" y="104" width="330" height="82" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="28" y="104" width="6" height="82" rx="3" fill="#cf222e"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Agotamiento</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Cansancio emocional y físico prolongado.</text>
<rect x="28" y="198" width="330" height="82" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="28" y="198" width="6" height="82" rx="3" fill="#bc4c00"/>
<text x="46" y="220" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Cinismo</text>
<text x="46" y="238" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Distancia y actitud negativa hacia el</text>
<text x="46" y="255.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >trabajo.</text>
<rect x="28" y="292" width="330" height="82" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="28" y="292" width="6" height="82" rx="3" fill="#59636e"/>
<text x="46" y="314" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Menor eficacia</text>
<text x="46" y="332" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Sensación de logro reducido.</text>
<text x="380" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">SEIS ÁREAS DE DESAJUSTE</text>
<rect x="380" y="104" width="140" height="82" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<text x="450" y="152" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle" >Carga de trabajo</text>
<rect x="530" y="104" width="140" height="82" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<text x="600" y="152" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle" >Control</text>
<rect x="380" y="198" width="140" height="82" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<text x="450" y="246" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle" >Reconocimiento</text>
<rect x="530" y="198" width="140" height="82" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<text x="600" y="246" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle" >Comunidad</text>
<rect x="380" y="292" width="140" height="82" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<text x="450" y="340" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle" >Justicia</text>
<rect x="530" y="292" width="140" height="82" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<text x="600" y="340" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle" >Valores</text>
<text x="700" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CUATRO EXPERIENCIAS DE RECUPERACIÓN</text>
<rect x="700" y="104" width="312" height="66" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<text x="716" y="130" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Desconexión psicológica</text>
<text x="716" y="150" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >No pensar en el trabajo fuera de él.</text>
<rect x="700" y="178" width="312" height="66" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<text x="716" y="204" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Relajación</text>
<text x="716" y="224" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Reducir la activación.</text>
<rect x="700" y="252" width="312" height="66" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<text x="716" y="278" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Dominio</text>
<text x="716" y="298" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Aprender o lograr algo fuera del trabajo.</text>
<rect x="700" y="326" width="312" height="66" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<text x="716" y="352" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Control del tiempo libre</text>
<text x="716" y="372" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Decidir cómo usarlo.</text>
<rect x="28" y="410" width="650" height="116" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="434" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El agotamiento suele ser un problema del trabajo y de la persona. Por eso la solución</text>
<text x="44" y="451.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >no es solo individual: se revisan carga, control, reconocimiento y valores, y se</text>
<text x="44" y="468.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >protege el descanso con reglas del equipo.</text>
<text x="28" y="566" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Burnout no es un diagnóstico clínico en todos los sistemas y esta clase no reemplaza atención profesional de salud.</text>
</svg>
