<text x="880" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >asignar roles y</text>
<text x="880" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >derechos de</text>
<text x="880" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >decisión</text>
<rect x="846" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
