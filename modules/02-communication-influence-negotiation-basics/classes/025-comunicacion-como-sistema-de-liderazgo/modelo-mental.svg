<text x="48" y="558.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Más comunicación no siempre mejora coordinación. Exceso de mensajes sin jerarquía aumenta ruido; diseña arquitectura y fuentes</text>
