id: 112
part: 09
title: "Flujo de caja"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "leer la economía del negocio y decidir con estados, caja, márgenes, retorno y valoración"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir operating cash flow de investing cash flow mediante evidencia observable."
  - "Aplicar la secuencia: partir de resultado o cobros-pagos → ajustar partidas no caja → incorporar capital de trabajo → separar CAPEX → conciliar financiamiento y saldo final."
  - "Interpretar operating cash flow, free cash flow, cash conversion sin atribuir causalidad automática."
  - "Resolver el caso de flujo de caja con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Donald E. Kieso, Jerry J. Weygandt & Terry D. Warfield — *Intermediate Accounting*"
  - "Stephen H. Penman — *Financial Statement Analysis and Security Valuation*"
  - "Charles Horngren et al. — *Cost Accounting: A Managerial Emphasis*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Howard Schilit, Jeremy Perler & Yoni Engelhart — *Financial Shenanigans*"
  - "Krishna G. Palepu, Paul M. Healy & Erik Peek — *Business Analysis and Valuation*"
  - "IFRS Foundation — normas IFRS/IAS aplicables a presentación y lectura de estados financieros. Verificar edición vigente en <https://www.ifrs.org/>."
limits:
  - "No existe una única definición universal de free cash flow o burn. Declara fórmula y propósito antes de comparar; evita tratar caja puntual como capacidad recurrente."
evidence_signals:
  - "operating cash flow"
  - "free cash flow"
  - "cash conversion"
  - "burn rate"
  - "ending cash"
