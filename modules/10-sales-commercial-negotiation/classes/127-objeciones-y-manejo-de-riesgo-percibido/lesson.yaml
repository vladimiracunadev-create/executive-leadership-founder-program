id: 127
part: 10
title: "Objeciones y manejo de riesgo percibido"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "construir ingresos mediante un proceso comercial medible y negociación disciplinada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir objection de concern mediante evidencia observable."
  - "Aplicar la secuencia: escuchar sin defender → clarificar categoría y severidad → confirmar que es la objeción real → responder con evidencia o alternativa → pedir siguiente paso verificable."
  - "Interpretar objection resolution, stalls, next-step conversion sin atribuir causalidad automática."
  - "Resolver el caso de objeciones y manejo de riesgo percibido con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Neil Rackham — *SPIN Selling*"
  - "Matthew Dixon & Brent Adamson — *The Challenger Sale*"
  - "Thomas T. Nagle, John E. Hogan & Joseph Zale — *The Strategy and Tactics of Pricing*"
  - "Chris Voss & Tahl Raz — *Never Split the Difference*"
  - "Neil Rackham — *Major Account Sales Strategy*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
limits:
  - "No toda objeción debe superarse. Si el producto no cumple un requisito crítico o el cliente no tiene fit, retirarse protege margen, confianza y éxito futuro."
evidence_signals:
  - "objection resolution"
  - "stalls"
  - "next-step conversion"
  - "discount requested"
  - "loss reason"
