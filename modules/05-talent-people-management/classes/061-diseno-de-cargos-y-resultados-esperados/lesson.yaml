id: 61
part: 05
title: "Diseño de cargos y resultados esperados"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "diseñar un sistema de talento desde el cargo hasta la salida responsable"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir cargo, tarea y resultado esperado."
  - "Describir las cinco características centrales de un puesto y su efecto motivacional."
  - "Redactar un cargo con propósito, resultados, decisiones y relaciones."
  - "Detectar cargos mal diseñados: sobrecarga, conflicto de rol, falta de autonomía."
  - "Rediseñar un cargo sin romper el proceso del que forma parte."
deliverable: "role-scorecard.md"
references:
  - "J. Richard Hackman & Greg R. Oldham — *Motivation through the design of work: test of a theory*"
  - "Frederick P. Morgeson & Stephen E. Humphrey — *The Work Design Questionnaire (WDQ): Developing and validating a comprehensive measure for assessing job design and the nature of work*"
  - "Peter F. Drucker — *The Effective Executive*"
  - "Laszlo Bock — *Work Rules!*"
  - "Michael C. Mankins & Eric Garton — *Time, Talent, Energy*"
  - "Marcus Buckingham & Curt Coffman — *First, Break All the Rules*"
limits:
  - "El modelo de Hackman y Oldham es de los años setenta, y los estudios posteriores encuentran efectos moderados y dependientes de la persona y del contexto."
evidence_signals:
  - "propósito y resultados del cargo"
  - "cinco características evaluadas"
  - "decisiones y relaciones definidas"
  - "carga verificada con quien lo ocupa"
