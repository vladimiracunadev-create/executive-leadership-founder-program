<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 606.12" width="1040" role="img" aria-labelledby="t-g25 d-g25" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g25">Ficha visual de la clase 025: Comunicación como sistema de liderazgo</title>
<desc id="d-g25">Conceptos: mensaje; canal; ruido; closed loop; cadencia. Método: definir propósito y audiencia → seleccionar canal según ambigüedad y sensibilidad → estructurar mensaje y contexto → confirmar comprensión y decisión → cerrar con owner, acción y registro.</desc>
<defs><marker id="p-g25" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
