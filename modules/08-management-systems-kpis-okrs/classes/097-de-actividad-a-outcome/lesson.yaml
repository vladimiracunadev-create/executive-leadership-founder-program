id: 97
part: 08
title: "De actividad a outcome"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "dirigir mediante outcomes, métricas, revisiones y asignación explícita de recursos"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir activity de output mediante evidencia observable."
  - "Aplicar la secuencia: nombrar outcome y stakeholder → mapear outputs que plausiblemente lo habilitan → explicitar mecanismo causal → seleccionar métricas de outcome y driver → revisar si los outputs realmente mueven la señal."
  - "Interpretar outputs utilizados, outcome trend, conversion output-to-outcome sin atribuir causalidad automática."
  - "Resolver el caso de de actividad a outcome con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "John Doerr — *Measure What Matters*"
  - "Robert S. Kaplan & David P. Norton — *The Balanced Scorecard*"
  - "John Doerr — *Speed & Scale*"
  - "Andrew S. Grove — *High Output Management*"
  - "Larry Bossidy & Ram Charan — *Execution*"
  - "Bernard Marr — *Key Performance Indicators*"
limits:
  - "Un outcome puede estar influido por factores fuera del equipo. No lo conviertas en evaluación simplista de una persona; combina controlabilidad, contribución y contexto."
evidence_signals:
  - "outputs utilizados"
  - "outcome trend"
  - "conversion output-to-outcome"
  - "cost per outcome"
  - "acciones sin efecto"
