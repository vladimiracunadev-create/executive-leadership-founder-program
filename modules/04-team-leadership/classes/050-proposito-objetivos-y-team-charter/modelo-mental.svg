<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g50 d-g50" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g50">Ficha visual de la clase 050: Propósito, objetivos y team charter</title>
<desc id="d-g50">Conceptos: propósito; objetivo; norma; derecho de decisión; working agreement. Método: formular propósito externo → definir 3–5 outcomes y métricas → asignar roles y derechos de decisión → acordar normas observables → revisar charter después de 30–60 días.</desc>
<defs><marker id="p-g50" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
