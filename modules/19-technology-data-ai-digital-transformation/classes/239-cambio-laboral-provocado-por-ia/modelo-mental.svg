<title id="t-s239">Clase 239 · Gestionar el cambio laboral por IA</title>
<desc id="d-s239">Cinco pasos: mapear tareas y exposición, evaluar valor y riesgo, diseñar roles y controles, reentrenar y planificar la transición, y medir.</desc>
<defs><marker id="p-s239" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
