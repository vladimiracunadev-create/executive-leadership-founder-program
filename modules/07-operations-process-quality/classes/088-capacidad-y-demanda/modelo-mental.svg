<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >demand rate</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ritmo de llegada de trabajo</text>
<circle cx="38" cy="170" r="5" fill="#0969da"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >capacity rate</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ritmo máximo sostenible de procesamiento</text>
<circle cx="38" cy="228" r="5" fill="#0969da"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >utilization</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >porcentaje de capacidad ocupado</text>
<circle cx="38" cy="286" r="5" fill="#0969da"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >queue</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trabajo esperando servicio</text>
<circle cx="38" cy="344" r="5" fill="#0969da"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >buffer</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >reserva de capacidad, inventario o tiempo para absorber</text>
<text x="54" y="383.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >variabilidad</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#0969da" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#0969da"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >medir demanda por tipo y periodo</text>
<circle cx="485" cy="176" r="14" fill="#0969da"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >medir capacidad efectiva</text>
<circle cx="485" cy="230" r="14" fill="#0969da"/>
<text x="485" y="235.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >segmentar variabilidad y picos</text>
