id: 125
part: 10
title: "Propuesta de valor y business case"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "construir ingresos mediante un proceso comercial medible y negociación disciplinada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir value proposition de business case mediante evidencia observable."
  - "Aplicar la secuencia: recuperar problema cuantificado → traducir capacidades a outcomes → estimar beneficio y costo con supuestos → añadir prueba relevante → comparar contra no hacer y alternativas."
  - "Interpretar business cases accepted, ROI assumptions, proposal-to-close sin atribuir causalidad automática."
  - "Resolver el caso de propuesta de valor y business case con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Neil Rackham — *SPIN Selling*"
  - "Matthew Dixon & Brent Adamson — *The Challenger Sale*"
  - "Mark Roberge — *The Sales Acceleration Formula*"
  - "Robert B. Cialdini — *Influence*"
  - "Chris Voss & Tahl Raz — *Never Split the Difference*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
limits:
  - "Un business case no debe inventar ahorros ni atribuir todo el beneficio al proveedor. Usa rangos acordados con el comprador y deja visibles supuestos."
evidence_signals:
  - "business cases accepted"
  - "ROI assumptions"
  - "proposal-to-close"
  - "discount rate"
  - "time to decision"
