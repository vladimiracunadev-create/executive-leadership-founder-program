id: 161
part: 13
title: "Ventaja competitiva"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "formular y ejecutar elecciones coherentes sobre dónde jugar y cómo ganar"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir competitive advantage de willingness to pay mediante evidencia observable."
  - "Aplicar la secuencia: definir valor creado para segmento → medir precio y costo relativos → identificar mecanismo de defensa → testear imitabilidad y sustitución → invertir en reforzar o abandonar ventaja."
  - "Interpretar price premium, relative gross margin, retention sin atribuir causalidad automática."
  - "Resolver el caso de ventaja competitiva con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "strategy-memo.md"
references:
  - "Michael E. Porter — *Competitive Strategy*"
  - "Michael E. Porter — *Competitive Advantage*"
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
  - "Rita Gunther McGrath — *The End of Competitive Advantage*"
  - "David J. Teece — *Dynamic Capabilities and Strategic Management*"
  - "W. Chan Kim & Renée Mauborgne — *Blue Ocean Strategy*"
limits:
  - "Un moat no es eterno y puede encerrar a la empresa en un modelo que pierde relevancia. Distingue defensa de capacidad para adaptarse."
evidence_signals:
  - "price premium"
  - "relative gross margin"
  - "retention"
  - "share of wallet"
  - "time-to-copy"
