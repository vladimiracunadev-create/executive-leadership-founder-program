<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g274 d-g274" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g274">Ficha visual de la clase 274: Delegar decisiones sin perder control</title>
<desc id="d-g274">Conceptos: delegation; guardrail; management by exception; context; escalation trigger. Método: inventariar decisiones owner-dependent → definir outcomes y guardrails → transferir autoridad y contexto → crear reporting y exception triggers → revisar calidad y ampliar límites.</desc>
<defs><marker id="p-g274" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
