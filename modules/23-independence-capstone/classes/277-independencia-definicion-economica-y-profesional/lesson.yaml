id: 277
part: 23
title: "Independencia: definición económica y profesional"
duration_minutes: 150
level: "Etapa 6 — Independencia"
outcome: "construir independencia mediante capacidades monetizables, sistemas comerciales y diversificación prudente"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir financial independence de professional independence mediante evidencia observable."
  - "Aplicar la secuencia: definir necesidades y objetivo → medir runway y concentración → mapear capabilities y assets → crear vías de ingreso compatibles → revisar riesgo y optionality trimestralmente."
  - "Interpretar personal runway, top-income-source share, recurring income sin atribuir causalidad automática."
  - "Resolver el caso de independencia: definición económica y profesional con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Peter F. Drucker — *The Effective Executive*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
  - "Michael D. Watkins — *The First 90 Days*"
  - "Nassim Nicholas Taleb — *Antifragile*"
  - "Eric Ries — *The Lean Startup*"
  - "Michael E. Gerber — *The E-Myth Revisited*"
limits:
  - "Diversificar demasiado pronto puede fragmentar foco y reducir ingresos. Construye independencia por etapas, protegiendo capacidad principal y evitando apuestas simultáneas sin tracción."
evidence_signals:
  - "personal runway"
  - "top-income-source share"
  - "recurring income"
  - "pipeline"
  - "asset income"
