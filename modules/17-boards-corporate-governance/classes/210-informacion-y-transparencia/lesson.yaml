id: 210
part: 17
title: "Información y transparencia"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "separar propiedad, administración y supervisión para gobernar estrategia, riesgo y sucesión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir audiencias y criterios de materialidad para decidir qué informar."
  - "Seleccionar indicadores y riesgos con definiciones únicas y comparables."
  - "Explicar variaciones y supuestos con una narrativa causal."
  - "Asegurar consistencia y controles sobre la información."
  - "Decidir cuándo publicar o escalar según obligaciones y límites legítimos."
deliverable: "risk-governance-brief.md"
references:
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "Bob Tricker — *Corporate Governance*"
  - "Robert A. G. Monks & Nell Minow — *Corporate Governance*"
  - "Robert S. Kaplan & David P. Norton — *The Balanced Scorecard*"
  - "COSO — *Internal Control - Integrated Framework*"
  - "Comisión para el Mercado Financiero — *Portal oficial de la CMF de Chile*"
limits:
  - "La transparencia tiene límites legítimos de confidencialidad, privilegio y competitividad; el objetivo no es publicar todo."
evidence_signals:
  - "audiencias y materialidad definidas"
  - "indicadores con definición única"
  - "variaciones explicadas con causas"
  - "protocolo de divulgación y escalamiento"
