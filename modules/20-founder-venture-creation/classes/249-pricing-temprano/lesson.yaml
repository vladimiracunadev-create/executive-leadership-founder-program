id: 249
part: 20
title: "Pricing temprano"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir price de value metric mediante evidencia observable."
  - "Aplicar la secuencia: estimar alternatives y value → proponer 2 o 3 price points → testear con compra real → analizar objections y segment → refinar package y value metric."
  - "Interpretar close rate by price, discount rate, ARPA sin atribuir causalidad automática."
  - "Resolver el caso de pricing temprano con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "commercial-decision-brief.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Alexander Osterwalder & Yves Pigneur — *Business Model Generation*"
  - "Noam Wasserman — *The Founder's Dilemmas*"
  - "David J. Bland & Alexander Osterwalder — *Testing Business Ideas*"
  - "Alexander Osterwalder et al. — *Value Proposition Design*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
limits:
  - "Precios tempranos tienen muestras pequeñas y sesgo. No extrapoles elasticidad; usa experimentos éticos y coherencia contractual entre clientes."
evidence_signals:
  - "close rate by price"
  - "discount rate"
  - "ARPA"
  - "gross margin"
  - "expansion"
