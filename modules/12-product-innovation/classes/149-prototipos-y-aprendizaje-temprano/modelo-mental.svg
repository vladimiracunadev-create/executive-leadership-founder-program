<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 504.81" width="1040" role="img" aria-labelledby="t-s149 d-s149" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s149">Clase 149 · Subir en fidelidad solo cuando ya se aprendió lo anterior</title>
<desc id="d-s149">Cuatro niveles de prototipo y qué pregunta responde cada uno: bosquejo, maqueta navegable, prototipo funcional y piloto real.</desc>
