<text x="48" y="540.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="558.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Descentralizar decisiones sin capacidades, datos o límites puede aumentar riesgo. Delegación requiere contexto, controles y feedback,</text>
