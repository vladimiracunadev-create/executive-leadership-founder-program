<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g268 d-g268" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g268">Ficha visual de la clase 268: Escalar ventas sin destruir margen</title>
<desc id="d-g268">Conceptos: sales scale; contribution margin; cost-to-serve; discount leakage; customization debt. Método: segmentar revenue y margin → identificar sales motion repetible → estandarizar pricing y discounts → reducir custom delivery → escalar capacity según unit economics.</desc>
<defs><marker id="p-g268" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
