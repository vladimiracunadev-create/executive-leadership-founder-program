<title id="t-g206">Ficha visual de la clase 206: Qué hace un directorio</title>
<desc id="d-g206">Conceptos: board mandate; oversight; management accountability; reserved matter; board calendar. Método: definir mandato y reserved matters → crear calendario anual → establecer información mínima → desafiar estrategia riesgo y performance → seguir acciones sin microgestión.</desc>
