<text x="219.1" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >free cash flow</text>
<rect x="327.7" y="456.24" width="129.5" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
