<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s138 d-s138" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s138">Clase 138 · El recorrido del cliente: preguntas, momentos de verdad y señales</title>
<desc id="d-s138">Etapas del recorrido del cliente, la pregunta que se hace en cada una, los momentos críticos y la señal de que funciona.</desc>
<defs><marker id="p-s138" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 138 · El recorrido del cliente: preguntas, momentos de verdad y señales</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Lemon &amp; Verhoef…</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Etapa</text>
<text x="220.169" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué se pregunta el cliente</text>
<text x="497.352" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Momento crítico</text>
<text x="774.535" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Señal</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Descubrir</text>
<text x="220.169" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Existe algo para mi problema?</text>
<text x="497.352" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Primer contacto con la marca.</text>
<text x="774.535" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Visitas calificadas.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Considerar</text>
<text x="220.169" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Esta opción sirve y es confiable?</text>
<text x="497.352" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Comparación con alternativas.</text>
<text x="774.535" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Solicitudes y consultas.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Comprar</text>
<text x="220.169" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Puedo decidir sin riesgo?</text>
<text x="497.352" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Precio, condiciones, proceso.</text>
<text x="774.535" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Conversión y abandonos.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Usar</text>
<text x="220.169" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Obtengo el resultado prometido?</text>
<text x="497.352" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Primeros días de uso.</text>
<text x="774.535" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Activación y uso.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Renovar y recomendar</text>
<text x="220.169" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Me conviene seguir y contarlo?</text>
<text x="497.352" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Renovación y soporte.</text>
<text x="774.535" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Retención y recomendaciones.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El recorrido real no es lineal ni ocurre en un solo canal. Se mapea con clientes reales y se mejoran primero los momentos donde más se</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >pierde valor o confianza.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los mapas basados solo en opinión interna reproducen supuestos; se contrastan con datos de comportamiento y entrevistas.</text>
</svg>
