<text x="296.5" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >conflictos</text>
<rect x="377.5" y="456.24" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="390.5" cy="469.24" r="3.5" fill="#0969da"/>
<text x="401.5" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >claridad de roles</text>
<rect x="530.8" y="456.24" width="184.7" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="543.8" cy="469.24" r="3.5" fill="#0969da"/>
<text x="554.8" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >dependencia del manager</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No todos los equipos se recuperan solo con coaching. Puede ser necesario cambiar estructura, prioridades, staffing o conductas</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >incompatibles; evitar decisiones difíciles también es una decisión.</text>
