id: 124
part: 10
title: "Discovery y diagnóstico"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "construir ingresos mediante un proceso comercial medible y negociación disciplinada"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Preparar una reunión de diagnóstico con hipótesis e investigación previa."
  - "Formular preguntas de situación, problema, implicación y necesidad de solución."
  - "Escuchar y resumir con precisión lo que dice el comprador."
  - "Cuantificar el efecto del problema con el comprador."
  - "Decidir si existe una oportunidad real y cuál es el siguiente paso."
deliverable: "product-evidence-brief.md"
references:
  - "Neil Rackham — *SPIN Selling*"
  - "Matthew Dixon & Brent Adamson — *The Challenger Sale*"
  - "Chris Voss & Tahl Raz — *Never Split the Difference*"
  - "Robert B. Cialdini — *Influence*"
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
limits:
  - "La evidencia de Rackham proviene de estudios de décadas atrás, centrados en ventas complejas; en ventas simples un diagnóstico extenso puede ser innecesario."
evidence_signals:
  - "hipótesis previas a la reunión"
  - "preguntas de implicación formuladas"
  - "resumen de comprensión validado"
  - "siguiente paso con decisores"
