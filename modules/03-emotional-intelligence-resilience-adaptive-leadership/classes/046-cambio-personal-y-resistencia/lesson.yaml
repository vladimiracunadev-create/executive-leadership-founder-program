id: 46
part: 03
title: "Cambio personal y resistencia"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Explicar por qué un cambio deseado puede resistirse con un compromiso en competencia."
  - "Construir un mapa de inmunidad con sus cuatro columnas."
  - "Formular un gran supuesto y diseñar un experimento seguro para ponerlo a prueba."
  - "Identificar la etapa del cambio en que estás y qué ayuda a avanzar."
  - "Aplicar lo anterior a la resistencia de otros sin atribuirles mala voluntad."
deliverable: "risk-governance-brief.md"
references:
  - "Robert Kegan & Lisa Laskow Lahey — *Immunity to Change*"
  - "James O. Prochaska & Carlo C. DiClemente — *Stages and Processes of Self-Change of Smoking: Toward an Integrative Model of Change*"
  - "James Clear — *Atomic Habits*"
  - "Ronald A. Heifetz, Alexander Grashow & Marty Linsky — *The Practice of Adaptive Leadership*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
limits:
  - "El mapa de inmunidad es un método de consultoría y desarrollo que se apoya en estudios de caso, con poca evaluación experimental independiente."
evidence_signals:
  - "compromiso en competencia"
  - "gran supuesto como hipótesis"
  - "experimento seguro y su resultado"
  - "etapa del cambio"
