<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Calendario de obligaciones.</text>
<circle cx="719.3333333333334" cy="181.25" r="4" fill="#bc4c00"/>
<text x="733.333" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Controles y responsables.</text>
