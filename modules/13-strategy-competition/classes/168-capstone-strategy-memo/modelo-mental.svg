<text x="44" y="314.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El memo de estrategia es una pieza breve que nombra el desafío, elige y renuncia, y define cómo se sabrá si funciona. No es una</text>
<text x="44" y="331.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >descripción de la empresa.</text>
<text x="28" y="378.75" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las cifras y los casos del capstone son ilustrativos; una decisión real exige datos propios y asesoría especializada.</text>
