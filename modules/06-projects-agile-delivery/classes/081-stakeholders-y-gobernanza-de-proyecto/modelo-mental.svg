<rect x="543.1" y="442.12" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="556.1" cy="455.12" r="3.5" fill="#0969da"/>
<text x="567.1" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >reuniones sin decisión</text>
<rect x="730.9" y="442.12" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="743.9" cy="455.12" r="3.5" fill="#0969da"/>
<text x="754.9" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >stakeholder surprises</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="488.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Governance excesivo ralentiza decisiones y transfiere responsabilidad al comité. Diseña niveles proporcionales al tamaño, riesgo e</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >irreversibilidad.</text>
