<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Registrar acuerdos con dueño y fecha.</text>
<circle cx="719.3333333333334" cy="181.25" r="4" fill="#1a7f37"/>
<text x="733.333" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Ajustar objetivos y umbrales</text>
<text x="733.333" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >(098–099).</text>
<circle cx="719.3333333333334" cy="225.75" r="4" fill="#1a7f37"/>
<text x="733.333" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Revisar el ritmo semanal, mensual y</text>
<text x="733.333" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >trimestral (103).</text>
<rect x="28" y="292.25" width="984" height="43.25" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="314.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La disciplina gerencial no es una reunión: es un sistema donde objetivos, indicadores, ritmo y decisiones se refuerzan entre sí.</text>
<text x="28" y="361.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los umbrales, metas y cifras del capstone son ilustrativos; cada organización fija los propios con sus datos.</text>
