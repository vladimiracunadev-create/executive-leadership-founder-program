<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g52 d-g52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g52">Ficha visual de la clase 052: Confianza y vulnerabilidad profesional</title>
<desc id="d-g52">Conceptos: vulnerabilidad profesional; confianza; fiabilidad; benevolencia; reparación. Método: modelar límites y errores desde liderazgo → pedir ayuda de forma concreta → cumplir compromisos pequeños → responder sin humillar a malas noticias → reparar rupturas con hechos y seguimiento.</desc>
<defs><marker id="p-g52" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#0969da"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 052 · Confianza y vulnerabilidad profesional</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 04 · Liderazgo de equipos y ejecución</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#0969da"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >vulnerabilidad profesional</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >acto de reconocer incertidumbre, error o necesidad de</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ayuda relevante al trabajo</text>
<circle cx="38" cy="184.12" r="5" fill="#0969da"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >confianza</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >expectativa de conducta fiable bajo vulnerabilidad</text>
<circle cx="38" cy="242.12" r="5" fill="#0969da"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >fiabilidad</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cumplimiento consistente de compromisos</text>
<circle cx="38" cy="300.12" r="5" fill="#0969da"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >benevolencia</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >percepción de que el otro no explotará intencionalmente</text>
<text x="54" y="339.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >la vulnerabilidad</text>
<circle cx="38" cy="372.24" r="5" fill="#0969da"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >reparación</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >acciones que restauran confianza después de una ruptura</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#0969da" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#0969da"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >modelar límites y errores desde liderazgo</text>
<circle cx="485" cy="176" r="14" fill="#0969da"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >pedir ayuda de forma concreta</text>
<circle cx="485" cy="230" r="14" fill="#0969da"/>
<text x="485" y="235.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >cumplir compromisos pequeños</text>
<circle cx="485" cy="284" r="14" fill="#0969da"/>
<text x="485" y="289.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="512" y="280" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >responder sin humillar a malas noticias</text>
<circle cx="485" cy="338" r="14" fill="#0969da"/>
<text x="485" y="343.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >reparar rupturas con hechos y seguimiento</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="212.3" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="41" cy="469.24" r="3.5" fill="#0969da"/>
<text x="52" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >errores reportados temprano</text>
<rect x="250.3" y="456.24" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="263.3" cy="469.24" r="3.5" fill="#0969da"/>
<text x="274.3" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >peticiones de ayuda</text>
<rect x="417.4" y="456.24" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="430.4" cy="469.24" r="3.5" fill="#0969da"/>
<text x="441.4" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >compromisos cumplidos</text>
<rect x="598.3" y="456.24" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="611.3" cy="469.24" r="3.5" fill="#0969da"/>
<text x="622.3" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >silencio ante riesgos</text>
<rect x="779.2" y="456.24" width="191.6" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="792.2" cy="469.24" r="3.5" fill="#0969da"/>
<text x="803.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >reparaciones completadas</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Vulnerabilidad sin confiabilidad no crea confianza. Compartir dudas y emociones no compensa incumplimientos, incompetencia o abuso; la</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >seguridad se sostiene con conducta repetida.</text>
</svg>
