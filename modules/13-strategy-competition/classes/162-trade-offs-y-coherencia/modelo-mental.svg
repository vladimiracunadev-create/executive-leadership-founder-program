<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g162 d-g162" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g162">Ficha visual de la clase 162: Trade-offs y coherencia</title>
<desc id="d-g162">Conceptos: trade-off; fit; activity system; straddling; strategic consistency. Método: declarar posición deseada → listar actividades necesarias → identificar incompatibilidades → mapear refuerzos y dependencias → eliminar iniciativas que erosionan fit.</desc>
<defs><marker id="p-g162" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
