<title id="t-g164">Ficha visual de la clase 164: Escenarios estratégicos</title>
<desc id="d-g164">Conceptos: scenario; critical uncertainty; signpost; robust move; option. Método: identificar fuerzas y certezas → seleccionar incertidumbres materiales → construir escenarios contrastantes → stress-test estrategia y economics → definir robust moves opciones y signposts.</desc>
