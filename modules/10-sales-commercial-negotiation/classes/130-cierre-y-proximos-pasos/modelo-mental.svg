<title id="t-s130">Clase 130 · Un plan de cierre mutuo con fechas y evidencias</title>
<desc id="d-s130">Pasos de un plan de cierre acordado con el comprador: qué, quién, cuándo y qué evidencia confirma que ocurrió.</desc>
