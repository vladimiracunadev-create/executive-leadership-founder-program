<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >decisión</text>
<circle cx="38" cy="184.12" r="5" fill="#8250df"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >NPV</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >valor presente de flujos incrementales descontados</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >menos inversión</text>
<circle cx="38" cy="256.24" r="5" fill="#8250df"/>
