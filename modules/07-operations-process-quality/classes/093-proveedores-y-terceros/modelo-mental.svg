<circle cx="159.8" cy="469.24" r="3.5" fill="#0969da"/>
<text x="170.8" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >concentración de gasto</text>
<rect x="334.6" y="456.24" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
