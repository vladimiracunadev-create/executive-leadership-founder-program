<title id="t">Modelo mental de la clase 043: Problemas técnicos versus adaptativos</title>
<desc id="d">1. diagnosticar qué parte es técnica y cuál adaptativa → 2. mapear pérdidas y grupos afectados → 3. regular tensión sin eliminarla → 4. devolver trabajo a quienes deben aprender → 5. proteger voces marginales y revisar adaptación</desc>
