id: 197
part: 16
title: "Agenda y tiempo del CEO"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Auditar el uso del tiempo con datos de calendario y de decisiones."
  - "Definir categorías de alto apalancamiento acordes con las prioridades de la empresa."
  - "Eliminar o delegar reuniones y decisiones que no requieren al CEO."
  - "Diseñar bloques estructurales de pensamiento, de personas y de partes interesadas."
  - "Revisar la agenda con indicadores y conservar margen para lo imprevisto."
deliverable: "board-or-executive-memo.md"
references:
  - "Peter F. Drucker — *The Effective Executive*"
  - "Andrew S. Grove — *High Output Management*"
  - "Cal Newport — *Deep Work*"
  - "Michael C. Mankins & Eric Garton — *Time, Talent, Energy*"
  - "Greg McKeown — *Essentialism*"
  - "Matt Mochary — *The Great CEO Within*"
limits:
  - "Una agenda rígida falla en crisis y en transiciones; se protegen los bloques estructurales, pero se conserva capacidad de reordenar."
evidence_signals:
  - "auditoría de tiempo con datos"
  - "categorías de alto apalancamiento"
  - "eliminar, delegar o automatizar"
  - "margen y revisión mensual"
