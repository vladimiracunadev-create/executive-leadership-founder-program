<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >cost of equity</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >retorno requerido por accionistas por asumir riesgo</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >residual</text>
<circle cx="38" cy="184.12" r="5" fill="#cf222e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >cost of debt</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >retorno exigido por prestamistas ajustado por</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >condiciones</text>
<circle cx="38" cy="256.24" r="5" fill="#cf222e"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >WACC</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >costo promedio ponderado de capital para riesgo del</text>
<text x="54" y="295.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >negocio financiado</text>
<circle cx="38" cy="328.36" r="5" fill="#cf222e"/>
<text x="54" y="333.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >beta</text>
<text x="54" y="351.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >medida de sensibilidad sistemática usada en CAPM</text>
<circle cx="38" cy="386.36" r="5" fill="#cf222e"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >hurdle rate</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tasa mínima exigida para aceptar una inversión</text>
