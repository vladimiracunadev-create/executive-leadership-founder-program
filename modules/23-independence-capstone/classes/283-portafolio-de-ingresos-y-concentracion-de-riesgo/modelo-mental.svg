<text x="575.5" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >recurring share</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="488.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Diversificación nominal puede no diversificar riesgo. Analiza drivers comunes y no sacrifiques profundidad de una fuente rentable por</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >reducir un porcentaje abstracto.</text>
