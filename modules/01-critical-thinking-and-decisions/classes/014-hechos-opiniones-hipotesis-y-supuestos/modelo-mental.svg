<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620.24" width="1040" role="img" aria-labelledby="t-g14 d-g14" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g14">Ficha visual de la clase 014: Hechos, opiniones, hipótesis y supuestos</title>
<desc id="d-g14">Conceptos: hecho; opinión; hipótesis; supuesto; inferencia. Método: inventariar afirmaciones clave → clasificarlas por tipo → registrar fuente y calidad → convertir explicaciones en hipótesis refutables → definir qué evidencia cambiaría la decisión.</desc>
<defs><marker id="p-g14" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="620.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
