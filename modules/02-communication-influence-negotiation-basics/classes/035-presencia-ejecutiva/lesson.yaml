id: 35
part: 02
title: "Presencia ejecutiva"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir presencia ejecutiva, imagen profesional, estilo, apariencia, reputación y competencia."
  - "Analizar un contexto con las variables de industria, organización, audiencia, cultura, modalidad y clima."
  - "Decidir una presentación personal por función y coherencia, no por una receta."
  - "Preparar el canal de una reunión remota o híbrida con criterios de audio, encuadre, luz y accesibilidad."
  - "Observar la comunicación no verbal como dato descriptivo y no como diagnóstico."
deliverable: "risk-governance-brief.md"
references:
  - "Yingyi Chang & Jose M. Cortina — *What should I wear to work? An integrative review of the impact of clothing in the workplace*"
  - "Judith A. Hall, Terrence G. Horgan & Nora A. Murphy — *Nonverbal Communication*"
  - "Amy Cuddy — *Presence*"
  - "Nancy Duarte — *Resonate*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Occupational Safety and Health Administration — *Computer Workstations eTool: Monitors*"
limits:
  - "La evidencia sobre el efecto de la apariencia en el trabajo es contextual y no permite recetas; la lectura no verbal es probabilística y depende de la cultura y de la persona; y las guías de formalidad son convenciones locales."
evidence_signals:
  - "variables del contexto investigadas"
  - "objetivo de la reunión"
  - "preparación del canal"
  - "feedback sobre conducta e impacto"
