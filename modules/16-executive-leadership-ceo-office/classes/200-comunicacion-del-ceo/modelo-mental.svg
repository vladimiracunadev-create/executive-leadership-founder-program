<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" role="img" aria-labelledby="t-200 d-200" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-200">Cómo la responsabilidad atribuida decide la respuesta pública</title>
<desc id="d-200">Matriz de la teoría situacional de comunicación de crisis: tres grupos de crisis según la responsabilidad que el público atribuye (víctima, accidental, evitable) y la postura de respuesta que corresponde, siempre precedida de información e instrucción.</desc>
<defs><marker id="p-200" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="600" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#cf222e"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 200 · La respuesta del CEO sigue a la responsabilidad atribuida</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Coombs (2007), teoría situacional</text>
<rect x="28" y="76" width="984" height="62" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="2" />
<text x="48" y="100" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="start" letter-spacing="1.4">SIEMPRE PRIMERO</text>
<text x="48" y="124" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" >Informar e instruir: qué pasó, qué debe hacer quien está en riesgo, y reconocer el daño humano antes de hablar de la imagen.</text>
<rect x="28" y="160" width="320" height="330" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M28,194 V172 a12,12 0 0 1 12,-12 H336 a12,12 0 0 1 12,12 V194 Z" fill="#0969da"/>
<text x="44" y="182" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.2">VÍCTIMA</text>
<text x="44" y="216" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >responsabilidad atribuida mínima</text>
<text x="44" y="246" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Ejemplos del grupo</text>
<text x="44" y="264" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Desastre natural, rumor, violencia ajena,</text>
<text x="44" y="281.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >manipulación maliciosa del producto.</text>
<text x="44" y="312.5" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Postura</text>
<text x="44" y="330.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >Informar y mostrar apoyo. Reafirmar lo</text>
<text x="44" y="349.13" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >que la organización sí hace bien.</text>
<text x="44" y="379.76" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Cuidado</text>
<text x="44" y="397.76" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Bastan información y cuidado; no hace</text>
<text x="44" y="415.01" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >falta disculparse por lo que no se hizo.</text>
<path d="M351,325 L365,325" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-200)"/>
<rect x="368" y="160" width="320" height="330" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M368,194 V172 a12,12 0 0 1 12,-12 H676 a12,12 0 0 1 12,12 V194 Z" fill="#bc4c00"/>
<text x="384" y="182" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.2">ACCIDENTAL</text>
<text x="384" y="216" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >responsabilidad atribuida moderada</text>
<text x="384" y="246" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Ejemplos del grupo</text>
<text x="384" y="264" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Falla técnica o error no deliberado, un</text>
<text x="384" y="281.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >reto de terceros, un accidente.</text>
<text x="384" y="312.5" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Postura</text>
<text x="384" y="330.5" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >Informar y explicar el contexto con</text>
<text x="384" y="349.13" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >evidencia. Disminuir: justificar solo</text>
<text x="384" y="367.76" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >lo que se pruebe.</text>
<text x="384" y="398.39" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Cuidado</text>
<text x="384" y="416.39" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >La explicación vale solo si es</text>
<text x="384" y="433.64" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >verificable; una excusa que cae agrava.</text>
<path d="M691,325 L705,325" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-200)"/>
<rect x="708" y="160" width="320" height="330" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<path d="M708,194 V172 a12,12 0 0 1 12,-12 H1016 a12,12 0 0 1 12,12 V194 Z" fill="#cf222e"/>
<text x="724" y="182" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.2">EVITABLE</text>
<text x="724" y="216" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >responsabilidad atribuida fuerte</text>
<text x="724" y="246" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Ejemplos del grupo</text>
<text x="724" y="264" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Error humano evitable, falta de</text>
<text x="724" y="281.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >supervisión, conducta indebida de la</text>
<text x="724" y="298.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >organización.</text>
<text x="724" y="329.75" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Postura</text>
<text x="724" y="347.75" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >Reconstruir: asumir responsabilidad,</text>
<text x="724" y="366.38" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >disculparse, reparar y compensar.</text>
<text x="724" y="397.01" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Cuidado</text>
<text x="724" y="415.01" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Negar o minimizar aquí es la peor opción:</text>
<text x="724" y="432.26" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >el público ya atribuye culpa.</text>
<text x="28" y="514" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Sube un escalón cuando hay crisis previas similares o una reputación ya dañada.</text>
<path d="M28,526 H1012" stroke="#59636e" stroke-width="2" marker-end="url(#p-200)"/>
<text x="28" y="548" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >más responsabilidad atribuida  →  respuesta más cercana a asumir y reparar</text>
<text x="28" y="580" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Antes de elegir la postura, el CEO comprueba que lo que dirá coincide con lo que la empresa sabe y hace por dentro.</text>
</svg>
