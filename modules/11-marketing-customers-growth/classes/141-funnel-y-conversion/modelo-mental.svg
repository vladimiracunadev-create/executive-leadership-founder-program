<text x="461.714" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >70,0 %</text>
<text x="630.4" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Revisión de valor y señales de uso.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La etapa con mayor pérdida relativa no siempre es la de mayor oportunidad: se prioriza por volumen afectado, facilidad de cambio y</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >efecto en el resultado final.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Se experimenta con grupo de control; las mejoras de un porcentaje pequeño necesitan muestras suficientes para distinguirlas del azar.</text>
