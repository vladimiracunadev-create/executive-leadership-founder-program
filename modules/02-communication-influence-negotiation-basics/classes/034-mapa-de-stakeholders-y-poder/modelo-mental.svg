<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-034 d-034" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-034">Prominencia de un interesado según poder, legitimidad y urgencia</title>
<desc id="d-034">Tres círculos que se solapan, poder, legitimidad y urgencia, definen siete clases de interesado: latentes (durmiente, discrecional, demandante), expectantes (dominante, peligroso, dependiente) y definitivo cuando reúne los tres atributos.</desc>
<defs><marker id="p-034" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 034 · Quién cuenta y por qué: los tres atributos</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Mitchell, Agle &amp; Wood (1997)</text>
<circle cx="190" cy="205" r="112" fill="#cf222e" fill-opacity="0.16" stroke="#cf222e" stroke-width="2"/>
<circle cx="330" cy="205" r="112" fill="#0969da" fill-opacity="0.16" stroke="#0969da" stroke-width="2"/>
<circle cx="260" cy="322" r="112" fill="#bc4c00" fill-opacity="0.16" stroke="#bc4c00" stroke-width="2"/>
<text x="120" y="98" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle" letter-spacing="1.4">PODER</text>
<text x="120" y="114" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle" >puede imponer su voluntad</text>
<text x="400" y="98" font-size="13" font-weight="700" fill="#0969da" text-anchor="middle" letter-spacing="1.4">LEGITIMIDAD</text>
<text x="400" y="114" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle" >su reclamo se reconoce como apropiado</text>
<text x="260" y="478" font-size="13" font-weight="700" fill="#bc4c00" text-anchor="middle" letter-spacing="1.4">URGENCIA</text>
<text x="260" y="494" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle" >no admite espera y es crítico</text>
<text x="140" y="190" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle" >Durmiente</text>
<text x="140" y="205" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle" >solo poder</text>
<text x="380" y="190" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle" >Discrecional</text>
<text x="380" y="205" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle" >solo legitimidad</text>
<text x="260" y="372" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle" >Demandante</text>
<text x="260" y="387" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle" >solo urgencia</text>
<text x="260" y="168" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle" >Dominante</text>
<text x="260" y="183" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle" >poder + legitimidad</text>
<text x="186" y="292" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle" >Peligroso</text>
<text x="186" y="307" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle" >poder + urgencia</text>
<text x="336" y="292" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle" >Dependiente</text>
<text x="336" y="307" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle" >legitimidad + urgencia</text>
<text x="260" y="244" font-size="13.5" font-weight="800" fill="#1f2328" text-anchor="middle" letter-spacing="0.6">DEFINITIVO</text>
<text x="260" y="259" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle" >los tres</text>
<rect x="560" y="76" width="452" height="436" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
<text x="580" y="106" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HACER SEGÚN LA CLASE</text>
<rect x="580" y="126" width="6" height="42" rx="3" fill="#cf222e"/>
<text x="598" y="142" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Definitivo</text>
<text x="598" y="159" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Prioridad máxima. Atender ya y dejar registro de lo</text>
<text x="598" y="176.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >acordado.</text>
<rect x="580" y="180" width="6" height="42" rx="3" fill="#cf222e"/>
<text x="598" y="196" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Dominante</text>
<text x="598" y="213" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Institucionalizar la relación: cauce regular, no</text>
<text x="598" y="230.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >atención ocasional.</text>
<rect x="580" y="234" width="6" height="42" rx="3" fill="#cf222e"/>
<text x="598" y="250" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Peligroso</text>
<text x="598" y="267" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Contener sin ignorar: dialogar antes de que el poder se</text>
<text x="598" y="284.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >use por la fuerza.</text>
<rect x="580" y="288" width="6" height="42" rx="3" fill="#0969da"/>
<text x="598" y="304" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Dependiente</text>
<text x="598" y="321" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Depende de otro para ser oído: protege su acceso y su</text>
<text x="598" y="338.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >voz.</text>
<rect x="580" y="342" width="6" height="42" rx="3" fill="#0969da"/>
<text x="598" y="358" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Discrecional</text>
<text x="598" y="375" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Sin poder ni urgencia: es decisión de la empresa cuánto</text>
<text x="598" y="392.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >atender.</text>
<rect x="580" y="396" width="6" height="42" rx="3" fill="#bc4c00"/>
<text x="598" y="412" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Demandante</text>
<text x="598" y="429" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Ruido urgente sin poder ni legitimidad: escuchar, no</text>
<text x="598" y="446.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >reaccionar.</text>
<rect x="580" y="450" width="6" height="42" rx="3" fill="#59636e"/>
<text x="598" y="466" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Durmiente</text>
<text x="598" y="483" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Poder sin interés hoy: vigilar si adquiere legitimidad</text>
<text x="598" y="500.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >o urgencia.</text>
<rect x="28" y="520" width="504" height="28" rx="0" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="1.2" />
<text x="28" y="538" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los atributos son variables y construidos socialmente: un interesado puede ganar o perder uno.</text>
</svg>
