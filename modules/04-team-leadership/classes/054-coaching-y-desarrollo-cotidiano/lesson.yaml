id: 54
part: 04
title: "Coaching y desarrollo cotidiano"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "crear equipos con propósito, coordinación, confianza, aprendizaje y accountability"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir coaching de mentoring mediante evidencia observable."
  - "Aplicar la secuencia: diagnosticar brecha de skill versus juicio → acordar objetivo de desarrollo → usar preguntas antes de consejo cuando existe capacidad → dar instrucción cuando falta conocimiento base → cerrar con experimento y seguimiento."
  - "Interpretar autonomía, problemas resueltos sin escalamiento, conductas practicadas sin atribuir causalidad automática."
  - "Resolver el caso de coaching y desarrollo cotidiano con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "people-decision-brief.md"
references:
  - "J. Richard Hackman — *Leading Teams*"
  - "Patrick Lencioni — *The Five Dysfunctions of a Team*"
  - "John Whitmore — *Coaching for Performance*"
  - "Liz Wiseman — *Multipliers*"
  - "Jon R. Katzenbach & Douglas K. Smith — *The Wisdom of Teams*"
  - "Andrew S. Grove — *High Output Management*"
limits:
  - "Coaching no reemplaza feedback claro, formación técnica ni decisiones urgentes. El estilo debe responder a tarea, madurez y riesgo, no a una identidad de 'coach'."
evidence_signals:
  - "autonomía"
  - "problemas resueltos sin escalamiento"
  - "conductas practicadas"
  - "calidad de preguntas"
  - "progreso de habilidad"
