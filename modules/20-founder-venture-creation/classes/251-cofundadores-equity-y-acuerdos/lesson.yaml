id: 251
part: 20
title: "Cofundadores, equity y acuerdos"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Evaluar la complementariedad, el compromiso y la confianza de un posible cofundador."
  - "Proponer un reparto de propiedad con criterios explícitos y no con una división automática."
  - "Calcular el efecto de adquisición gradual, salida y dilución sobre cada participación."
  - "Listar los puntos que debe cubrir un acuerdo entre socios, para revisarlos con asesoría."
  - "Preparar una salida ordenada y un mecanismo de resolución de conflictos."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Noam Wasserman — *The Founder's Dilemmas*"
  - "Thomas Hellmann & Noam Wasserman — *The First Deal: The Division of Founder Equity in New Ventures*"
  - "Martin Ruef, Howard E. Aldrich & Nancy M. Carter — *The Structure of Founding Teams: Homophily, Strong Ties, and Isolation among U.S. Entrepreneurs*"
  - "Brad Feld & Jason Mendelson — *Venture Deals*"
  - "Jon R. Katzenbach & Douglas K. Smith — *The Wisdom of Teams*"
limits:
  - "Ninguna fórmula elimina la necesidad de confianza."
evidence_signals:
  - "cofundadores evaluados"
  - "reparto con criterios"
  - "adquisición gradual y dilución modeladas"
  - "acuerdo y salida ordenada"
