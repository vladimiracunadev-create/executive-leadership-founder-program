<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >espacio de aclaración que no reabre una decisión</text>
<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cerrada salvo nueva evidencia</text>
<circle cx="38" cy="386.36" r="5" fill="#1a7f37"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >consistencia</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >coherencia entre mensaje, políticas y acciones</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >posteriores</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
