<rect x="543.1" y="470.36" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="556.1" cy="483.36" r="3.5" fill="#0969da"/>
<text x="567.1" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >internal mobility</text>
