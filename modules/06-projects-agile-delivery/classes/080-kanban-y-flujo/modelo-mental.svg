<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g80 d-g80" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g80">Ficha visual de la clase 080: Kanban y flujo</title>
<desc id="d-g80">Conceptos: WIP; cycle time; lead time; throughput; pull. Método: mapear flujo real → visualizar estados y bloqueos → establecer límites WIP → definir políticas de pull y clases → medir cycle time y mejorar cuello.</desc>
<defs><marker id="p-g80" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#0969da"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 080 · Kanban y flujo</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 06 · Liderazgo de equipos y ejecución</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#0969da"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >WIP</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trabajo iniciado pero no terminado</text>
<circle cx="38" cy="170" r="5" fill="#0969da"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >cycle time</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tiempo desde inicio hasta finalización</text>
<circle cx="38" cy="228" r="5" fill="#0969da"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >lead time</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tiempo desde solicitud hasta entrega</text>
<circle cx="38" cy="286" r="5" fill="#0969da"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >throughput</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >items terminados por periodo</text>
<circle cx="38" cy="344" r="5" fill="#0969da"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >pull</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >principio de iniciar trabajo cuando existe capacidad en</text>
<text x="54" y="383.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >la etapa siguiente</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#0969da" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#0969da"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >mapear flujo real</text>
<circle cx="485" cy="176" r="14" fill="#0969da"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >visualizar estados y bloqueos</text>
<circle cx="485" cy="230" r="14" fill="#0969da"/>
<text x="485" y="235.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >establecer límites WIP</text>
<circle cx="485" cy="284" r="14" fill="#0969da"/>
<text x="485" y="289.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="512" y="280" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >definir políticas de pull y clases</text>
<circle cx="485" cy="338" r="14" fill="#0969da"/>
<text x="485" y="343.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >medir cycle time y mejorar cuello</text>
<text x="28" y="430.12" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="442.12" width="46.7" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
