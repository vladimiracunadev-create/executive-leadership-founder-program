<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >objetivo coherente que da flexibilidad al trabajo del</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >sprint</text>
<circle cx="38" cy="242.12" r="5" fill="#0969da"/>
