<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g165 d-g165" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g165">Ficha visual de la clase 165: Opciones de crecimiento</title>
<desc id="d-g165">Conceptos: market penetration; market development; product development; diversification; adjacency. Método: definir objetivo de crecimiento → mapear opciones y sinergias → estimar TAM economics y capacidades → comparar riesgo y reversibilidad → secuenciar prueba antes de escalar.</desc>
