<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456.06" width="1040" role="img" aria-labelledby="t-s268 d-s268" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s268">Clase 268 · Crecer ventas sin perder margen</title>
<desc id="d-s268">Cuadrante de margen de contribución y repetibilidad de la entrega para decidir qué ventas escalar, reparar, aceptar con cuidado o abandonar.</desc>
<defs><marker id="p-s268" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="456.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 268 · Crecer ventas sin perder margen</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Koller et al. · Harnish · Gil · Drucker</text>
<text x="362.5" y="100" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >Margen bajo</text>
<text x="799.5" y="100" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >Margen alto</text>
<text transform="translate(120,160.25) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">Entrega repetible</text>
<text transform="translate(120,268.75) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">Entrega a medida</text>
<rect x="150" y="112" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<rect x="150.0" y="112.0" width="425.0" height="34" rx="12" fill="#bc4c00"/>
<text x="166" y="135" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Reparar precio o costo</text>
<text x="166" y="170" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Entrega repetible con margen bajo: ajustar precio,</text>
<text x="166" y="187.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >descuentos o costo.</text>
<rect x="587" y="112" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="587.0" y="112.0" width="425.0" height="34" rx="12" fill="#1a7f37"/>
<text x="603" y="135" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Escalar</text>
<text x="603" y="170" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Margen alto y entrega repetible: invertir en capacidad y</text>
<text x="603" y="187.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >canal.</text>
<rect x="150" y="220.5" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<rect x="150.0" y="220.5" width="425.0" height="34" rx="12" fill="#cf222e"/>
<text x="166" y="243.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Salir o rediseñar</text>
<text x="166" y="278.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Margen bajo y entrega a medida: costoso y poco aprende.</text>
<rect x="587" y="220.5" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="587.0" y="220.5" width="425.0" height="34" rx="12" fill="#0969da"/>
<text x="603" y="243.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >A medida solo si enseña</text>
<text x="603" y="278.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Margen alto pero artesanal: aceptar si compra</text>
<text x="603" y="295.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >aprendizaje y con criterio de salida.</text>
<rect x="28" y="329" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="351" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Estandarizar demasiado pronto puede perder clientes estratégicos. Se acepta trabajo a medida cuando compra aprendizaje o ventaja,</text>
<text x="44" y="368.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >cuantificando su costo.</text>
<text x="28" y="415.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La capacidad se amplía según la economía por cliente y el período de recuperación.</text>
</svg>
