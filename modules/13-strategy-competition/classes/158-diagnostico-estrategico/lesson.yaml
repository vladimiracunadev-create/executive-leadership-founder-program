id: 158
part: 13
title: "Diagnóstico estratégico"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "formular y ejecutar elecciones coherentes sobre dónde jugar y cómo ganar"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Formular las preguntas del diagnóstico: entorno, industria, capacidades y resultados."
  - "Reunir evidencia con fuentes y distinguir hechos de interpretaciones."
  - "Identificar las causas de fondo de un desempeño."
  - "Condensar el diagnóstico en un desafío crítico con sus supuestos."
  - "Evitar los errores típicos: inventario, anclaje y atribución a la suerte."
deliverable: "strategy-memo.md"
references:
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
  - "Michael E. Porter — *Competitive Strategy*"
  - "A.G. Lafley & Roger L. Martin — *Playing to Win*"
  - "Avinash K. Dixit & Barry J. Nalebuff — *The Art of Strategy*"
  - "Daniel Kahneman, Olivier Sibony & Cass R. Sunstein — *Noise*"
limits:
  - "Los datos disponibles son imperfectos y las explicaciones de resultados pasados no garantizan el futuro."
evidence_signals:
  - "hechos con fuente separados de interpretaciones"
  - "resultados descompuestos en causas"
  - "hipótesis rivales contrastadas"
  - "desafío crítico con supuestos"
