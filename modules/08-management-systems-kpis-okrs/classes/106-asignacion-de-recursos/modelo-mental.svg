<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474.06" width="1040" role="img" aria-labelledby="t-s106 d-s106" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s106">Clase 106 · Asignar recursos con criterio frente a la inercia</title>
<desc id="d-s106">La asignación por inercia frente a la asignación deliberada de tiempo, talento y dinero.</desc>
<defs><marker id="p-s106" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="474.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 106 · Asignar recursos con criterio frente a la inercia</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Mankins &amp; Garton (2017) · Rumelt (2011) · Kahnema…</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">LO QUE OCURRE POR INERCIA</text>
<rect x="28" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="63.25" rx="3" fill="#59636e"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se repite el presupuesto</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Cada área recibe lo del año anterior más un ajuste.</text>
<rect x="28" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="28.0" y="177.25" width="6" height="63.25" rx="3" fill="#bc4c00"/>
<text x="46" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Gana quien negocia mejor</text>
<text x="46" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >El volumen de la queja pesa más que el valor esperado.</text>
<rect x="28" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="28.0" y="250.5" width="6" height="63.25" rx="3" fill="#cf222e"/>
<text x="46" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Todo se financia a medias</text>
<text x="46" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Muchas iniciativas, ninguna con recursos suficientes.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">ASIGNACIÓN DELIBERADA</text>
<rect x="532" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se parte de las prioridades</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Primero se eligen las apuestas, luego se reparten recursos.</text>
<rect x="532" y="177.25" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="532.0" y="177.25" width="6" height="80.5" rx="3" fill="#0969da"/>
<text x="550" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se revisa lo que ya se financia</text>
<text x="550" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se compara lo existente con lo nuevo y se libera lo que ya no</text>
<text x="550" y="234.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >rinde.</text>
<rect x="532" y="267.75" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.7" />
<rect x="532.0" y="267.75" width="6" height="63.25" rx="3" fill="#8250df"/>
<text x="550" y="289.75" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se tratan tiempo y talento como recursos</text>
<text x="550" y="307.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se asignan con el mismo rigor que el dinero.</text>
<rect x="28" y="347" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="369" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El recurso más escaso suele ser la atención de la dirección y el talento clave, no el dinero. Asignarlos con deliberación es una</text>
<text x="44" y="386.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >decisión estratégica.</text>
<text x="28" y="433.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Mover recursos tiene costo de transición y de moral; las reasignaciones se explican y se acompañan.</text>
</svg>
