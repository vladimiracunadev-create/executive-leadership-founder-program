<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 066 · Un ciclo de gestión del desempeño que se usa todo el año</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Locke &amp; Latham (2002) · Kluger &amp; D…</text>
