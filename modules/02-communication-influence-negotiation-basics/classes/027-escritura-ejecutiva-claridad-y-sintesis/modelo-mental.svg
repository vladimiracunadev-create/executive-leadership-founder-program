<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" width="1040" role="img" aria-labelledby="t-027 d-027" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-027">Pirámide: primero la respuesta, luego las razones, luego los datos</title>
<desc id="d-027">Estructura descendente de un documento ejecutivo: respuesta arriba, tres líneas clave que la sostienen, datos de apoyo debajo, con una introducción de situación, complicación y pregunta.</desc>
<defs><marker id="p-027" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="590" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 027 · Escribir para que decidan</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Minto (2005)</text>
<rect x="240" y="100" width="300" height="84" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="2" />
<text x="390" y="134" font-size="14" font-weight="800" fill="#cf222e" text-anchor="middle" letter-spacing="1.2">RESPUESTA</text>
<text x="390" y="154" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" >Lo que quieres que se decida, en una</text>
<text x="390" y="171.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" >frase</text>
<rect x="150" y="202" width="480" height="84" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="2" />
<text x="390" y="236" font-size="14" font-weight="800" fill="#bc4c00" text-anchor="middle" letter-spacing="1.2">LÍNEAS CLAVE</text>
<text x="390" y="256" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" >Tres razones, agrupadas y ordenadas</text>
<rect x="50" y="304" width="680" height="84" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="2" />
<text x="390" y="338" font-size="14" font-weight="800" fill="#0969da" text-anchor="middle" letter-spacing="1.2">DATOS Y SUPUESTOS</text>
<text x="390" y="358" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" >Hechos, cifras y fuentes que sostienen cada razón</text>
<path d="M390,186 L390,200" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-027)"/>
<path d="M390,288 L390,302" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-027)"/>
<path d="M752,120 V380" stroke="#1a7f37" stroke-width="2" marker-end="url(#p-027)"/>
<path d="M782,380 V120" stroke="#cf222e" stroke-width="2" marker-end="url(#p-027)"/>
<text x="804" y="112" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="start" >El lector pregunta</text>
<text x="804" y="130" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿por qué? ¿cómo lo sabes?</text>
<text x="804" y="148" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >y se baja un nivel</text>
<text x="804" y="330" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" >El autor comprueba</text>
<text x="804" y="348" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿y entonces?</text>
<text x="804" y="366" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >y se sube un nivel</text>
<rect x="28" y="410" width="480" height="120" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<text x="46" y="434" font-size="11.5" font-weight="700" fill="#8250df" text-anchor="start" letter-spacing="0.8">INTRODUCCIÓN: SITUACIÓN → COMPLICACIÓN → PREGUNTA</text>
<text x="46" y="454" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Lo que ya se sabe y nadie discute; lo que cambió o se</text>
<text x="46" y="471.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >complica; la pregunta que la respuesta contesta.</text>
<rect x="530" y="410" width="482" height="120" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<text x="548" y="434" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="start" letter-spacing="0.8">CADA GRUPO DE IDEAS</text>
<text x="548" y="454" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Debe ser de un mismo tipo, sin solaparse y sin dejar fuera lo</text>
<text x="548" y="471.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >importante (excluyentes y exhaustivas).</text>
<text x="28" y="566" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Orden dentro de un grupo: por tiempo, por estructura o por importancia; elige uno y dilo.</text>
</svg>
