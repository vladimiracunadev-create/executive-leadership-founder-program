<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 494.98" width="1040" role="img" aria-labelledby="t-s173 d-s173" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s173">Clase 173 · Cinco roles en una decisión importante</title>
<desc id="d-s173">Roles de una decisión: quién recomienda, quién debe estar de acuerdo, quién aporta, quién decide y quién ejecuta.</desc>
<defs><marker id="p-s173" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="494.98" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 173 · Cinco roles en una decisión importante</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Galbraith · McChrystal et al. (2015) · Rizzo, House &amp; Lirtzman (1970)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Rol</text>
<text x="258.667" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué hace</text>
<text x="668.667" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Riesgo si falta o sobra</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Recomienda</text>
<text x="258.667" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Reúne datos, propone una opción y la argumenta.</text>
<text x="668.667" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Sin recomendación, nadie se hace cargo de la</text>
<text x="668.667" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >propuesta.</text>
<rect x="28" y="189.12" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Acuerda</text>
<text x="258.667" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Tiene un veto o una condición necesaria (por ejemplo,</text>
<text x="258.667" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >legal).</text>
<text x="668.667" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Demasiados vetos paralizan.</text>
<rect x="28" y="242.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="262.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Aporta</text>
<text x="258.667" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Ofrece información o experiencia; no decide.</text>
<text x="668.667" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se confunde aportar con decidir.</text>
<rect x="28" y="278.8" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="298.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Decide</text>
<text x="258.667" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Elige entre opciones y asume la responsabilidad.</text>
<text x="668.667" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Sin decisor único, la decisión se diluye.</text>
<rect x="28" y="315.36" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="335.36" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Ejecuta</text>
<text x="258.667" y="335.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Implementa lo decidido.</text>
<text x="668.667" y="335.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Si no participó, ejecuta sin comprender.</text>
<rect x="28" y="367.92" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="389.92" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La ambigüedad de roles y los conflictos de rol dañan el desempeño y el bienestar. Un buen reparto de derechos de decisión reduce</text>
<text x="44" y="407.17" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >reuniones y reprocesos.</text>
<text x="28" y="454.42" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los marcos de roles (RACI, RAPID y similares) son herramientas; su valor está en la conversación que obligan a tener.</text>
</svg>
