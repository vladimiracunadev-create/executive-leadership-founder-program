<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >governance</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >reglas sobre decisiones representación y ownership</text>
