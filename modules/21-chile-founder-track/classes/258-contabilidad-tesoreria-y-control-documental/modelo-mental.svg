<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >proceso periódico para cerrar y revisar información</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >financiera</text>
