<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474.06" width="1040" role="img" aria-labelledby="t-s57 d-s57" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s57">Clase 057 · Reconocimiento que motiva y el que no</title>
<desc id="d-s57">Dos listas enfrentadas: reconocimiento que sostiene la motivación y reconocimiento que la daña.</desc>
<defs><marker id="p-s57" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="474.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 057 · Reconocimiento que motiva y el que no</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Ryan &amp; Deci (2000) · Amabile &amp; Kramer (2011)</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">SOSTIENE LA MOTIVACIÓN</text>
<rect x="28" y="104" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="80.5" rx="3" fill="#1a7f37"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Específico</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Dice qué hizo bien y qué efecto tuvo; informa sobre la</text>
<text x="46" y="161.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >competencia.</text>
<rect x="28" y="194.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="194.5" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="216.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Oportuno</text>
<text x="46" y="234.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Llega cerca del hecho y hace visible el progreso.</text>
<rect x="28" y="267.75" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.7" />
<rect x="28.0" y="267.75" width="6" height="63.25" rx="3" fill="#8250df"/>
<text x="46" y="289.75" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Propio de la persona</text>
<text x="46" y="307.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Respeta cómo prefiere ser reconocida.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">LA DAÑA</text>
<rect x="532" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="63.25" rx="3" fill="#cf222e"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Genérico</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >«Buen trabajo» sin dato no informa ni orienta.</text>
<rect x="532" y="177.25" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="532.0" y="177.25" width="6" height="80.5" rx="3" fill="#bc4c00"/>
<text x="550" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Controlador</text>
<text x="550" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >«Si lo haces, recibes» convierte la tarea en un medio para un</text>
<text x="550" y="234.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >premio.</text>
<rect x="532" y="267.75" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="532.0" y="267.75" width="6" height="63.25" rx="3" fill="#59636e"/>
<text x="550" y="289.75" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Comparativo injusto</text>
<text x="550" y="307.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Rankings individuales que minan la colaboración.</text>
<rect x="28" y="347" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="369" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El reconocimiento informa sobre la competencia y apoya el vínculo; cuando se percibe como control, tiende a desplazar la motivación</text>
<text x="44" y="386.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >propia.</text>
<text x="28" y="433.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las preferencias de reconocimiento varían por persona y cultura: se pregunta, no se supone.</text>
</svg>
