<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 488.06" width="1040" role="img" aria-labelledby="t-s266 d-s266" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s266">Clase 266 · Convertir lo heroico en sistema</title>
<desc id="d-s266">Cinco pasos para construir sistemas: identificar procesos críticos, capturar estándar y excepciones, asignar dueños de proceso, instrumentar métricas y controles, y mejorar desde incidentes.</desc>
