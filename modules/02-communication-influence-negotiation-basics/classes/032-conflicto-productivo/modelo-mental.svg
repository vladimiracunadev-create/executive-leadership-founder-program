<circle cx="485" cy="338" r="14" fill="#1a7f37"/>
<text x="485" y="343.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >registrar decisión y desacuerdo residual</text>
<text x="28" y="416" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="428" width="239.9" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="441" r="3.5" fill="#1a7f37"/>
<text x="52" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >ideas alternativas consideradas</text>
<rect x="277.9" y="428" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="290.9" cy="441" r="3.5" fill="#1a7f37"/>
<text x="301.9" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >decisiones reabiertas</text>
<rect x="458.8" y="428" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="471.8" cy="441" r="3.5" fill="#1a7f37"/>
<text x="482.8" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >ataques personales</text>
<rect x="619" y="428" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="632" cy="441" r="3.5" fill="#1a7f37"/>
<text x="643" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >participación desigual</text>
<rect x="806.8" y="428" width="184.7" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="819.8" cy="441" r="3.5" fill="#1a7f37"/>
<text x="830.8" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >tiempo hasta commitment</text>
<rect x="28" y="474" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="474" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="494" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="512" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No todos los desacuerdos merecen consenso. La organización necesita derechos de decisión claros; debate abierto sin mecanismo de</text>
<text x="48" y="529.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cierre consume energía y crea ambigüedad.</text>
</svg>
