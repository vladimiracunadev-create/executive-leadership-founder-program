<title id="t-g228">Ficha visual de la clase 228: Capstone: comité de capital</title>
<desc id="d-g228">Conceptos: capital allocation framework; capital budget; portfolio return; risk-adjusted return; capital recycling. Método: establecer cash floor y constraints → comparar oportunidades por return y risk → considerar strategic options → asignar capital y talent → revisar post-investment y recycle.</desc>
