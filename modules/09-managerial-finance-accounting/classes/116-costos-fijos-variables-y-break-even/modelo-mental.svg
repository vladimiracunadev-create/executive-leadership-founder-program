<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 498.42" width="1040" role="img" aria-labelledby="t-s116 d-s116" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s116">Clase 116 · El punto de equilibrio con números</title>
<desc id="d-s116">Cálculo del punto de equilibrio a partir del precio, el costo variable y los costos fijos.</desc>
<defs><marker id="p-s116" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="498.42" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 116 · El punto de equilibrio con números</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Horngren et al. · Kaplan &amp; Cooper (1998)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Dato</text>
<text x="358.353" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Valor (ejemplo)</text>
<text x="589.882" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cálculo o lectura</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Precio por unidad</text>
<text x="358.353" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >USD 50</text>
<text x="589.882" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Lo que paga el cliente.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Costo variable por unidad</text>
<text x="358.353" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >USD 30</text>
<text x="589.882" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Materiales, comisión, envío.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Margen de contribución</text>
<text x="358.353" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >USD 20 (40 %)</text>
<text x="589.882" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >50 − 30; lo que cada venta aporta a lo fijo.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Costos fijos mensuales</text>
<text x="358.353" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >USD 80.000</text>
<text x="589.882" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Arriendo, sueldos base, sistemas.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Punto de equilibrio</text>
<text x="358.353" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >4.000 unidades</text>
<text x="589.882" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >80.000 / 20; ventas por USD 200.000.</text>
<rect x="28" y="318.8" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="338.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Margen de seguridad</text>
<text x="358.353" y="338.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Si se venden 5.000</text>
<text x="589.882" y="338.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Utilidad antes de impuestos de USD 20.000.</text>
<rect x="28" y="371.36" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="393.36" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El punto de equilibrio no es una meta sino una referencia: indica cuánto riesgo operativo hay. Más costos fijos exigen más ventas para</text>
<text x="44" y="410.61" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >cubrirlos y aumentan la sensibilidad a la caída de ventas.</text>
<text x="28" y="457.86" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Supone precio, costos unitarios y mezcla constantes en el rango analizado; fuera de ese rango, los costos cambian de comportamiento.</text>
</svg>
