id: 42
part: 03
title: "Seguridad psicológica y aprendizaje"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir seguridad psicológica y distinguirla de comodidad, confianza y amabilidad."
  - "Explicar la cadena entre la conducta del líder, la seguridad, el aprendizaje y el desempeño."
  - "Ubicar a un equipo en el cuadrante de seguridad y estándares."
  - "Reconocer las conductas que construyen o destruyen la seguridad."
  - "Diseñar prácticas concretas para construirla sin reducir la exigencia."
deliverable: "leadership-decision-brief.md"
references:
  - "Amy C. Edmondson — *Psychological Safety and Learning Behavior in Work Teams*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Kim Scott — *Radical Candor*"
  - "Karl E. Weick & Kathleen M. Sutcliffe — *Managing the Unexpected*"
limits:
  - "El estudio de Edmondson de 1999 fue en equipos concretos y su relación con el desempeño depende de la tarea; la seguridad psicológica es una condición necesaria, no suficiente."
evidence_signals:
  - "preguntas de seguridad al equipo"
  - "conducta del líder ante un error"
  - "errores reportados a tiempo"
  - "estándares mantenidos"
