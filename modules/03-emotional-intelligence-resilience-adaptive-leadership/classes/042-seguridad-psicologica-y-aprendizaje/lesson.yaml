id: 42
part: 03
title: "Seguridad psicológica y aprendizaje"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir seguridad psicológica de voice mediante evidencia observable."
  - "Aplicar la secuencia: observar cuándo la gente calla → modelar falibilidad y preguntas → responder productivamente a malas noticias → separar error de negligencia → mantener estándares y seguimiento."
  - "Interpretar near misses reportados, preguntas y disenso, errores ocultos sin atribuir causalidad automática."
  - "Resolver el caso de seguridad psicológica y aprendizaje con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Daniel Goleman — *Emotional Intelligence*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Ronald A. Heifetz — *Leadership Without Easy Answers*"
  - "Daniel H. Pink — *Drive*"
  - "Adam Grant — *Think Again*"
  - "Ronald Heifetz & Marty Linsky — *Leadership on the Line*"
limits:
  - "Seguridad psicológica no protege conducta abusiva, bajo desempeño deliberado ni ausencia de accountability. El espacio para hablar debe coexistir con consecuencias claras y justas."
evidence_signals:
  - "near misses reportados"
  - "preguntas y disenso"
  - "errores ocultos"
  - "tiempo para escalar problemas"
  - "calidad con autonomía"
