id: 226
part: 18
title: "Due diligence"
duration_minutes: 150
level: "Etapa 5 — CEO → Capital allocator"
outcome: "decidir estructura de capital, valoración, fundraising y transacciones"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Convertir la tesis de la operación en preguntas verificables."
  - "Organizar frentes de trabajo con criterios de materialidad."
  - "Analizar la calidad de las utilidades y las deudas implícitas."
  - "Cuantificar hallazgos y su efecto en valor, precio y condiciones."
  - "Decidir entre ajustar el precio, pedir protecciones o retirarse."
deliverable: "leadership-decision-brief.md"
references:
  - "Donald DePamphilis — *Mergers, Acquisitions, and Other Restructuring Activities*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Stephen H. Penman — *Financial Statement Analysis and Security Valuation*"
  - "Krishna G. Palepu, Paul M. Healy & Erik Peek — *Business Analysis and Valuation*"
  - "Atul Gawande — *The Checklist Manifesto*"
limits:
  - "La información proviene en gran parte del vendedor y puede ser incompleta."
evidence_signals:
  - "supuestos convertidos en preguntas"
  - "calidad de utilidades ajustada"
  - "deuda implícita y capital de trabajo"
  - "hallazgos cuantificados y clasificados"
