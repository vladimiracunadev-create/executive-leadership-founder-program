<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g115 d-g115" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g115">Ficha visual de la clase 115: Presupuesto y forecast</title>
<desc id="d-g115">Conceptos: budget; forecast; variance; driver-based model; scenario. Método: definir drivers y baseline → construir budget con recursos → actualizar actuals → reforecast sin manipular para alcanzar plan → usar escenarios para decisiones de capacidad y caja.</desc>
<defs><marker id="p-g115" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
