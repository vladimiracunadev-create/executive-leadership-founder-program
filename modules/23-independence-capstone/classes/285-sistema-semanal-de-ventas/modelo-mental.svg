<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g285 d-g285" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g285">Ficha visual de la clase 285: Sistema semanal de ventas</title>
<desc id="d-g285">Conceptos: sales cadence; pipeline; prospecting; referral; follow-up. Método: definir ICP y oferta → crear target list semanal → ejecutar outreach y referrals → hacer discovery y proposals → revisar pipeline y conversion cada semana.</desc>
