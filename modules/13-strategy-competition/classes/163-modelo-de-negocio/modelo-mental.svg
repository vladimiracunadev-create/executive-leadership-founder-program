<title id="t-g163">Ficha visual de la clase 163: Modelo de negocio</title>
<desc id="d-g163">Conceptos: value proposition; revenue model; cost structure; key activity; business model coherence. Método: definir segmento y problema → articular propuesta y canal → modelar recursos actividades y partners → construir revenue y cost logic → testear coherencia y economics.</desc>
