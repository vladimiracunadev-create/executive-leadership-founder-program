<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >identificar riesgos por objetivo</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#0969da"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#0969da" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >priorizar exposición material</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#0969da"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#0969da" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >asignar mitigación y contingency</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#0969da"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#0969da" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >mapear dependencias con fechas y</text>
<text x="690" y="199.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >owners</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#0969da"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#0969da" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >revisar triggers semanalmente</text>
<text x="28" y="430.12" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="442.12" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="41" cy="455.12" r="3.5" fill="#0969da"/>
<text x="52" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >riesgos vencidos</text>
<rect x="174.4" y="442.12" width="226.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="187.4" cy="455.12" r="3.5" fill="#0969da"/>
<text x="198.4" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >issues que antes eran riesgos</text>
<rect x="410.5" y="442.12" width="212.3" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="423.5" cy="455.12" r="3.5" fill="#0969da"/>
<text x="434.5" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >dependencias sin compromiso</text>
<rect x="632.8" y="442.12" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="645.8" cy="455.12" r="3.5" fill="#0969da"/>
<text x="656.8" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >exposición residual</text>
<rect x="799.9" y="442.12" width="184.7" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="812.9" cy="455.12" r="3.5" fill="#0969da"/>
<text x="823.9" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >contingencias activadas</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="488.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un risk register enorme puede ocultar lo material. Distingue riesgos de proyecto de incertidumbre normal y escala los que afectan</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >estrategia, seguridad o compliance.</text>
</svg>
