<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >price waterfall</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >secuencia desde precio lista hasta precio/net revenue</text>
<text x="54" y="411.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >real</text>
