<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-026 d-026" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-026">Cuatro tipos de pregunta según cuánto controla quien pregunta</title>
<desc id="d-026">Indagación humilde, diagnóstica, confrontacional y de proceso: cada una con su pregunta típica, su función y su riesgo.</desc>
<defs><marker id="p-026" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 026 · Preguntar para entender, no para confirmar</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Schein (2013)</text>
<rect x="28" y="96" width="232" height="340" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M28,134 V108 a12,12 0 0 1 12,-12 H248 a12,12 0 0 1 12,12 V134 Z" fill="#1a7f37"/>
<text x="44" y="121" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.2">HUMILDE</text>
<text x="44" y="160" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Pregunta típica</text>
<text x="44" y="178" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" >¿Qué pasó? ¿Cómo lo ves</text>
<text x="44" y="197.32" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" >tú?</text>
<text x="44" y="230.64" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Qué hace</text>
<text x="44" y="248.64" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Invita a hablar sin dirigir.</text>
<text x="44" y="265.89" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Se pregunta algo que no se</text>
<text x="44" y="283.14" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >sabe.</text>
<text x="44" y="312.39" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Riesgo</text>
<text x="44" y="330.39" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Puede dispersarse si no hay</text>
<text x="44" y="347.64" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >foco.</text>
<rect x="284" y="96" width="232" height="340" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M284,134 V108 a12,12 0 0 1 12,-12 H504 a12,12 0 0 1 12,12 V134 Z" fill="#0969da"/>
<text x="300" y="121" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.2">DIAGNÓSTICA</text>
<text x="300" y="160" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Pregunta típica</text>
<text x="300" y="178" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" >¿Qué sentiste? ¿Por qué</text>
<text x="300" y="197.32" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" >crees que ocurrió?</text>
<text x="300" y="230.64" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Qué hace</text>
<text x="300" y="248.64" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Dirige la atención hacia</text>
<text x="300" y="265.89" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >causas o emociones del otro.</text>
<text x="300" y="295.14" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Riesgo</text>
<text x="300" y="313.14" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Puede inducir una</text>
<text x="300" y="330.39" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >explicación.</text>
<rect x="540" y="96" width="232" height="340" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M540,134 V108 a12,12 0 0 1 12,-12 H760 a12,12 0 0 1 12,12 V134 Z" fill="#bc4c00"/>
<text x="556" y="121" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.2">CONFRONTACIONAL</text>
<text x="556" y="160" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Pregunta típica</text>
<text x="556" y="178" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" >¿Has pensado en probar</text>
<text x="556" y="197.32" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" >otra cosa?</text>
<text x="556" y="230.64" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Qué hace</text>
<text x="556" y="248.64" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Introduce la idea de quien</text>
<text x="556" y="265.89" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >pregunta en forma de</text>
<text x="556" y="283.14" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >pregunta.</text>
<text x="556" y="312.39" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Riesgo</text>
<text x="556" y="330.39" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Es una opinión disfrazada;</text>
<text x="556" y="347.64" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >puede cerrar la</text>
<text x="556" y="364.89" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >conversación.</text>
<rect x="796" y="96" width="232" height="340" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<path d="M796,134 V108 a12,12 0 0 1 12,-12 H1016 a12,12 0 0 1 12,12 V134 Z" fill="#8250df"/>
<text x="812" y="121" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.2">DE PROCESO</text>
<text x="812" y="160" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Pregunta típica</text>
<text x="812" y="178" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" >¿Cómo vamos en esta</text>
<text x="812" y="197.32" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" >conversación?</text>
<text x="812" y="230.64" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Qué hace</text>
<text x="812" y="248.64" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Se pregunta por la</text>
<text x="812" y="265.89" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >conversación misma.</text>
<text x="812" y="295.14" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Riesgo</text>
<text x="812" y="313.14" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Mal usada, evade el</text>
<text x="812" y="330.39" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >contenido.</text>
<path d="M28,470 L1012,470" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-026)"/>
<text x="28" y="494" font-size="12" font-weight="600" fill="#59636e" text-anchor="start" >más abierta, más información del otro</text>
<text x="1012" y="494" font-size="12" font-weight="600" fill="#59636e" text-anchor="end" >más dirigida por quien pregunta</text>
<text x="28" y="528" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Regla de la clase: empieza humilde. Pasa a un tipo más dirigido solo después de haber escuchado, y dilo en voz alta.</text>
</svg>
