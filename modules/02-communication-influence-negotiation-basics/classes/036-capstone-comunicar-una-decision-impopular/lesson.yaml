id: 36
part: 02
title: "Capstone: comunicar una decisión impopular"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Describir las cuatro dimensiones de la justicia —distributiva, procedimental, interpersonal e informacional— y qué evalúan las personas en cada una."
  - "Diseñar el anuncio de una decisión impopular que cubra las cuatro."
  - "Secuenciar la comunicación: a quién primero, por qué canal y con qué mensaje."
  - "Anticipar las reacciones y preparar respuestas sin ocultar hechos ni prometer lo que no controlas."
  - "Evaluar el resultado con evidencia y corregir lo que falló."
deliverable: "leadership-decision-brief.md"
references:
  - "Jason A. Colquitt, Donald E. Conlon, Michael J. Wesson, Christopher O. L. H. Porter & K. Yee Ng — *Justice at the Millennium: A Meta-Analytic Review of 25 Years of Organizational Justice Research*"
  - "W. Timothy Coombs — *Protecting Organization Reputations During a Crisis: The Development and Application of Situational Crisis Communication Theory*"
  - "Richard L. Daft & Robert H. Lengel — *Organizational Information Requirements, Media Richness and Structural Design*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Ronald K. Mitchell, Bradley R. Agle & Donna J. Wood — *Toward a Theory of Stakeholder Identification and Salience: Defining the Principle of Who and What Really Counts*"
limits:
  - "El metaanálisis de Colquitt y colegas se basa en estudios de organizaciones, con sus sesgos de muestra y de medición; muestra tendencias, no garantiza la aceptación de una decisión concreta."
evidence_signals:
  - "cuatro dimensiones de justicia cubiertas"
  - "secuencia del anuncio cumplida"
  - "compromisos cumplidos en fecha"
  - "preguntas recibidas y respondidas"
