<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g153 d-g153" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g153">Ficha visual de la clase 153: Experimentos y evidencia</title>
<desc id="d-g153">Conceptos: experiment; control; metric guardrail; sample size; external validity. Método: formular hipótesis causal o conductual → elegir diseño proporcional → predefinir métrica y guardrails → ejecutar sin cambiar reglas a mitad → interpretar efecto incertidumbre y transferencia.</desc>
<defs><marker id="p-g153" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#bc4c00"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 153 · Experimentos y evidencia</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 12 · Dirección, estrategia y organización</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#bc4c00"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >experiment</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >intervención diseñada para aprender sobre una hipótesis</text>
<circle cx="38" cy="170" r="5" fill="#bc4c00"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >control</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >condición de comparación que permite atribución</text>
<circle cx="38" cy="228" r="5" fill="#bc4c00"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >metric guardrail</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >señal que no debe deteriorarse al optimizar otra</text>
<circle cx="38" cy="286" r="5" fill="#bc4c00"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >sample size</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tamaño requerido para detectar un efecto relevante con</text>
<text x="54" y="325.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >error controlado</text>
<circle cx="38" cy="358.12" r="5" fill="#bc4c00"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >external validity</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grado en que el aprendizaje se transfiere a otros</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >contextos</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >formular hipótesis causal o</text>
<text x="504" y="373.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >conductual</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >elegir diseño proporcional</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >predefinir métrica y guardrails</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >ejecutar sin cambiar reglas a mitad</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >interpretar efecto incertidumbre y</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >transferencia</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="41" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="52" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >primary metric</text>
<rect x="160.6" y="456.24" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="173.6" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="184.6" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >guardrail metrics</text>
<rect x="313.9" y="456.24" width="101.9" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="326.9" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="337.9" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >effect size</text>
<rect x="425.8" y="456.24" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="438.8" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="449.8" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >confidence interval</text>
<rect x="592.9" y="456.24" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="605.9" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="616.9" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >segment heterogeneity</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No todo puede o debe randomizarse. Experimentos pequeños, B2B enterprise o cambios irreversibles requieren métodos alternativos y</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >mucha cautela al atribuir causalidad.</text>
</svg>
