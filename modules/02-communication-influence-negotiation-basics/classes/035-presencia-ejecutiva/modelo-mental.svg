<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g35 d-g35" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g35">Ficha visual de la clase 035: Presencia ejecutiva</title>
<desc id="d-g35">Conceptos: gravitas; claridad; composure; credibilidad; adaptabilidad. Método: preparar tres mensajes y datos clave → regular ritmo, respiración y lenguaje → responder primero a la pregunta central → declarar incertidumbre y compromiso de seguimiento → solicitar feedback sobre impacto real.</desc>
