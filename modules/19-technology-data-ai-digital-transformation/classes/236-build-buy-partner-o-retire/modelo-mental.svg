<circle cx="223.4" cy="441" r="3.5" fill="#cf222e"/>
<text x="234.4" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >vendor concentration</text>
<rect x="384.4" y="428" width="164" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="397.4" cy="441" r="3.5" fill="#cf222e"/>
<text x="408.4" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >engineering capacity</text>
<rect x="558.4" y="428" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="571.4" cy="441" r="3.5" fill="#cf222e"/>
<text x="582.4" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >switching cost</text>
<rect x="28" y="474" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="474" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="494" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="512" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Comprar no transfiere accountability ni elimina integración. Para capabilities centrales, dependencia estratégica de vendor puede ser</text>
<text x="48" y="529.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >más costosa que desarrollar.</text>
