<title id="t-g122">Ficha visual de la clase 122: ICP y segmentación comercial</title>
<desc id="d-g122">Conceptos: ICP; segment; fit; disqualifier; TAM/SAM/SOM. Método: analizar clientes ganados y perdidos → identificar atributos de éxito → definir ICP y disqualifiers → priorizar segmentos por valor y acceso → probar messaging y win rate.</desc>
