<text x="303.5" y="257.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text>
<text x="323.5" y="250.5" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Incorporación</text>
<text x="295.5" y="282.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Primer valor en pocos días.</text>
<path d="M512,274.75 L528,274.75" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s250)"/>
<rect x="531" y="226.5" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<circle cx="555.0" cy="252.5" r="13" fill="#1a7f37"/>
<text x="555" y="257.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >7</text>
<text x="575" y="250.5" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Patrón</text>
<text x="547" y="282.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Qué se repite y qué se</text>
<text x="547" y="299.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >rechaza.</text>
<path d="M645.75,325.0 V345.0 H142.75 V196.5" stroke="#59636e" stroke-width="2" fill="none" stroke-dasharray="7 6" marker-end="url(#p-s250)"/>
<text x="394.25" y="339" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >cada cliente ajusta el perfil</text>
<rect x="28" y="361" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="383" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Cada cliente enseña antes de aportar ingreso. Se rechazan encargos a medida que desvían el producto y se registra por qué compró cada</text>
<text x="44" y="400.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >uno.</text>
<text x="28" y="447.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Se decide qué repetir y qué rechazar antes de contratar vendedores.</text>
</svg>
