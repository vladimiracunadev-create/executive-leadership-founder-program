<text x="44" y="282.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Valor logrado frente a lo</text>
<text x="44" y="299.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >prometido.</text>
