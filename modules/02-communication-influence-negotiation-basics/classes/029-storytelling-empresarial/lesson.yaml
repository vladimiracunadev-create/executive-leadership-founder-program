id: 29
part: 02
title: "Storytelling empresarial"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Aplicar los seis rasgos (simple, inesperada, concreta, creíble, emocional, historia) a un mensaje y detectar cuál falta."
  - "Construir una historia breve con personaje, tensión, decisión y resultado."
  - "Elegir el caso que ilustra mejor el punto, sin elegir el que más conviene."
  - "Verificar que la historia sea cierta y representativa, y declarar lo que no lo es."
  - "Combinar historia y datos de modo que cada una refuerce a la otra."
deliverable: "risk-governance-brief.md"
references:
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Nancy Duarte — *Resonate*"
  - "Robert B. Cialdini — *Influence*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Barbara Minto — *The Pyramid Principle*"
limits:
  - "Los rasgos de Heath y Heath provienen de un análisis de ideas que perduraron y de ejemplos seleccionados; ayudan a revisar un mensaje, pero no predicen cuál se recordará."
evidence_signals:
  - "rasgo faltante detectado"
  - "historia verificada y representativa"
  - "dato que acompaña al caso"
  - "acción posterior de la audiencia"
