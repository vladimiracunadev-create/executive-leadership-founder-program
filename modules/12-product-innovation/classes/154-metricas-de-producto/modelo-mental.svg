<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616.48" width="1040" role="img" aria-labelledby="t-g154 d-g154" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g154">Ficha visual de la clase 154: Métricas de producto</title>
<desc id="d-g154">Conceptos: north star metric; activation; retention; engagement; vanity metric. Método: definir valor entregado → mapear funnel y eventos → seleccionar métrica de outcome y drivers → segmentar cohortes y ventanas → establecer review y decisiones asociadas.</desc>
