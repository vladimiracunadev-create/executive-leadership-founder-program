<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" role="img" aria-labelledby="t-137 d-137" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-137">Qué sostiene la confianza y cómo se repara según lo que falló</title>
<desc id="d-137">Modelo de confianza: capacidad, benevolencia e integridad forman la confiabilidad percibida, que junto a la propensión a confiar y al riesgo percibido produce confianza y conducta de riesgo. A la derecha, cómo cambia la reparación según la falla haya sido de competencia o de integridad.</desc>
<defs><marker id="p-137" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="600" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#8250df"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 137 · Qué sostiene la confianza y qué reparar</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Mayer, Davis &amp; Schoorman (1995) · Kim et al. (2004)</text>
<text x="28" y="84" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">MODELO DE CONFIANZA</text>
<rect x="28" y="100" width="250" height="70" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<text x="44" y="126" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >Capacidad</text>
<text x="44" y="145" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >habilidad y conocimiento para el</text>
<text x="44" y="161.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >asunto</text>
<path d="M278,135 L318,178" stroke="#0969da" stroke-width="1.8" fill="none" stroke-linecap="round"  marker-end="url(#p-137)"/>
<rect x="28" y="184" width="250" height="70" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<text x="44" y="210" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >Benevolencia</text>
<text x="44" y="229" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >quiere el bien de quien confía,</text>
<text x="44" y="245.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >más allá de su interés</text>
<path d="M278,219 L318,178" stroke="#1a7f37" stroke-width="1.8" fill="none" stroke-linecap="round"  marker-end="url(#p-137)"/>
<rect x="28" y="268" width="250" height="70" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<text x="44" y="294" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >Integridad</text>
<text x="44" y="313" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >se rige por principios que quien</text>
<text x="44" y="329.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >confía acepta</text>
<path d="M278,303 L318,178" stroke="#cf222e" stroke-width="1.8" fill="none" stroke-linecap="round"  marker-end="url(#p-137)"/>
<rect x="318" y="142" width="170" height="72" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="2" />
<text x="403" y="170" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle" >Confiabilidad</text>
<text x="403" y="188" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle" >percibida</text>
<text x="403" y="205" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle" >lo que observa quien confía</text>
<rect x="318" y="280" width="170" height="48" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.2" />
<text x="403" y="301" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle" >Propensión a confiar</text>
<text x="403" y="317" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle" >rasgo de quien confía</text>
<rect x="318" y="340" width="170" height="48" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.2" />
<text x="403" y="361" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle" >Riesgo percibido</text>
<text x="403" y="377" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle" >lo que está en juego</text>
<path d="M403,214 L403,236" stroke="#8250df" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-137)"/>
<circle cx="403" cy="250" r="14" fill="#8250df"/>
<text x="403" y="255" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >+</text>
<path d="M403,328 L403,268" stroke="#59636e" stroke-width="1.4" fill="none" stroke-linecap="round"  marker-end="url(#p-137)"/>
<rect x="28" y="400" width="460" height="64" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="2" />
<text x="258" y="427" font-size="15" font-weight="800" fill="#8250df" text-anchor="middle" letter-spacing="1.2">CONFIANZA</text>
<text x="258" y="448" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" >disposición a ser vulnerable ante la acción del otro, sin poder vigilarlo ni controlarlo</text>
<path d="M403,388 L403,398" stroke="#8250df" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-137)"/>
<text x="540" y="84" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">REPARAR: PRIMERO, DIAGNOSTICAR QUÉ FALLÓ</text>
<rect x="540" y="100" width="472" height="160" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="540" y="100" width="472" height="34" rx="12" fill="#0969da"/>
<text x="558" y="122" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Falla de competencia: se equivocó, no mintió</text>
<text x="558" y="158" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Se repara con reconocimiento del error, explicación de</text>
<text x="558" y="175.94" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >la causa y corrección verificable.</text>
<text x="558" y="199.88" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >En los experimentos de Kim et al., la disculpa repara</text>
<text x="558" y="217.13" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >mejor este tipo de falla que negarla.</text>
<rect x="540" y="280" width="472" height="190" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<rect x="540" y="280" width="472" height="34" rx="12" fill="#cf222e"/>
<text x="558" y="302" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Falla de integridad: se duda de su honestidad</text>
<text x="558" y="338" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Lo que se discute no es la habilidad sino el carácter:</text>
<text x="558" y="355.94" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >cuesta más y tarda más.</text>
<text x="558" y="379.88" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Los experimentos hallaron que, con evidencia ambigua,</text>
<text x="558" y="397.13" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >negar rindió más que disculparse. La clase fija un</text>
<text x="558" y="414.38" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >límite: nunca se niega lo que se sabe cierto.</text>
<rect x="540" y="490" width="472" height="70" rx="0" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="1.2" />
<text x="540" y="506" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >En ambos casos la reparación se mide por conducta sostenida que un</text>
<text x="540" y="523.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >tercero pueda comprobar, no por lo que la organización anuncia.</text>
<text x="28" y="584" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los hallazgos de Kim et al. provienen de escenarios experimentales; orientan el diagnóstico, no sustituyen el juicio ante hechos reales.</text>
</svg>
