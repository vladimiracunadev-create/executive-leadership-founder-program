id: 170
part: 14
title: "Estructuras funcionales, divisionales y matriciales"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "diseñar estructura, derechos de decisión, cultura y cambio como un sistema"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir functional structure de divisional structure mediante evidencia observable."
  - "Aplicar la secuencia: mapear variedad e interdependencia → identificar unidad primaria de accountability → evaluar economías de escala → diseñar interfaces entre ejes → probar decisiones críticas en el modelo."
  - "Interpretar decision conflicts, duplicate roles, shared-service SLA sin atribuir causalidad automática."
  - "Resolver el caso de estructuras funcionales, divisionales y matriciales con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Jay R. Galbraith — *Designing Organizations*"
  - "Edgar H. Schein & Peter A. Schein — *Organizational Culture and Leadership*"
  - "Patrick Lencioni — *The Advantage*"
  - "Aaron Dignan — *Brave New Work*"
  - "Michael C. Mankins & Eric Garton — *Time, Talent, Energy*"
  - "John P. Kotter — *Leading Change*"
limits:
  - "Una matriz no corrige falta de confianza o derechos de decisión ambiguos; puede amplificarlos. Úsala solo cuando los beneficios de dos dimensiones justifican el costo de coordinación."
evidence_signals:
  - "decision conflicts"
  - "duplicate roles"
  - "shared-service SLA"
  - "P&L clarity"
  - "coordination load"
