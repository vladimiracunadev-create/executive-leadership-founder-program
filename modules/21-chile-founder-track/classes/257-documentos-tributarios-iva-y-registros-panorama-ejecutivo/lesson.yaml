id: 257
part: 21
title: "Documentos tributarios, IVA y registros: panorama ejecutivo"
duration_minutes: 150
level: "Etapa 6 — Founder en Chile"
outcome: "formalizar y operar una empresa chilena con comprensión ejecutiva de obligaciones y escalamiento profesional"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir DTE de IVA mediante evidencia observable."
  - "Aplicar la secuencia: mapear transacciones y documentos → configurar emisión y recepción → reconciliar ventas compras y caja → revisar tratamiento IVA con contador → cerrar periodo y conservar soporte."
  - "Interpretar DTE completeness, reconciliation breaks, tax filing timeliness sin atribuir causalidad automática."
  - "Resolver el caso de documentos tributarios, IVA y registros: panorama ejecutivo con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Servicio de Impuestos Internos (Chile) — *Guías, normativa y servicios oficiales*"
  - "Registro de Empresas y Sociedades (Chile) — *Portal y documentación oficial*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
  - "Superintendencia de Pensiones (Chile) — *Normativa y sistema previsional*"
  - "Sercotec (Chile) — *Programas, capacitación y Centros de Desarrollo de Negocios*"
  - "Corporación de Fomento de la Producción (Chile) — *Programas, instrumentos y apoyo empresarial*"
  - "SII — normativa, documentos tributarios electrónicos e IVA: <https://www.sii.cl/>."
  - "Código Tributario y Ley sobre Impuesto a las Ventas y Servicios, textos vigentes en BCN LeyChile: <https://www.bcn.cl/leychile/>."
limits:
  - "El tratamiento de IVA depende del hecho y norma vigente. No uses esta clase para determinar un impuesto específico sin revisar SII y asesoría contable."
evidence_signals:
  - "DTE completeness"
  - "reconciliation breaks"
  - "tax filing timeliness"
  - "unsupported entries"
  - "credit-debit variance"
