<path d="M28.0,136 V108 a12,12 0 0 1 12,-12 H330.6666666666667 a12,12 0 0 1 12,12 V136 Z" fill="#0969da"/>
<text x="44" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Quién paga y por qué</text>
<circle cx="50.0" cy="154" r="4" fill="#0969da"/>
<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Segmento, problema y propuesta.</text>
<circle cx="50.0" cy="181.25" r="4" fill="#0969da"/>
<text x="64" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Quién decide y quién paga.</text>
<circle cx="50.0" cy="208.5" r="4" fill="#0969da"/>
<text x="64" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Cuánto vale resolverlo.</text>
<rect x="362.667" y="96" width="314.667" height="163" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M362.6666666666667,136 V108 a12,12 0 0 1 12,-12 H665.3333333333334 a12,12 0 0 1 12,12 V136 Z" fill="#1a7f37"/>
<text x="378.667" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Cómo se entrega</text>
<circle cx="384.6666666666667" cy="154" r="4" fill="#1a7f37"/>
<text x="398.667" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Canal para llegar al cliente.</text>
<circle cx="384.6666666666667" cy="181.25" r="4" fill="#1a7f37"/>
<text x="398.667" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Cómo se produce y se presta el</text>
<text x="398.667" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >servicio.</text>
<circle cx="384.6666666666667" cy="225.75" r="4" fill="#1a7f37"/>
<text x="398.667" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Qué se hace a mano al comienzo.</text>
<rect x="697.333" y="96" width="314.667" height="163" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M697.3333333333334,136 V108 a12,12 0 0 1 12,-12 H1000.0 a12,12 0 0 1 12,12 V136 Z" fill="#bc4c00"/>
<text x="713.333" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Cuánto cuesta y deja</text>
<circle cx="719.3333333333334" cy="154" r="4" fill="#bc4c00"/>
<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Costo de adquirir y servir.</text>
<circle cx="719.3333333333334" cy="181.25" r="4" fill="#bc4c00"/>
<text x="733.333" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Margen por cliente.</text>
<circle cx="719.3333333333334" cy="208.5" r="4" fill="#bc4c00"/>
<text x="733.333" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Costos ocultos y su verificación.</text>
<rect x="28" y="275" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="297" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Un modelo temprano cambia rápido y no debe convertirse en un plan fijo: se mantienen las hipótesis con fechas de verificación, sobre</text>
<text x="44" y="314.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >todo en canal y costos ocultos.</text>
<text x="28" y="361.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Se prueba primero el eslabón más riesgoso: el que, si falla, invalida el resto.</text>
</svg>
