<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >hacer due diligence proporcional</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#0969da"/>
