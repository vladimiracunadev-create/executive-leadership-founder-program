<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >crecimiento repetible de adquisición y cierre</text>
<circle cx="38" cy="170" r="5" fill="#59636e"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >contribution margin</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ingreso menos costos variables atribuibles</text>
<circle cx="38" cy="228" r="5" fill="#59636e"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >cost-to-serve</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >costo de entregar y soportar un segmento</text>
