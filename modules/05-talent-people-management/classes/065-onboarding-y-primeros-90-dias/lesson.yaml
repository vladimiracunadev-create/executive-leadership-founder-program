  - "Definir expectativas y ganancias tempranas a 30, 60 y 90 días."
  - "Organizar el apoyo: jefe, acompañante, red de relaciones."
  - "Medir la efectividad del onboarding y corregirlo."
deliverable: "risk-governance-brief.md"
references:
  - "Talya N. Bauer, Todd Bodner, Berrin Erdogan, Donald M. Truxillo & Jennifer S. Tucker — *Newcomer adjustment during organizational socialization: A meta-analytic review of antecedents, outcomes, and methods*"
  - "Michael D. Watkins — *The First 90 Days*"
  - "Laszlo Bock — *Work Rules!*"
  - "Andrew S. Grove — *High Output Management*"
  - "Amy C. Edmondson — *The Fearless Organization*"
limits:
  - "Los factores del metaanálisis son asociaciones: no garantizan que aplicarlos producirá los resultados."
evidence_signals:
