<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616.48" width="1040" role="img" aria-labelledby="t-g229 d-g229" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g229">Ficha visual de la clase 229: Tecnología como capacidad empresarial</title>
<desc id="d-g229">Conceptos: business capability; technology asset; technical dependency; platform; technology portfolio. Método: partir de outcomes de negocio → mapear capabilities y tech enablers → identificar bottlenecks y debt → priorizar inversiones por value y risk → medir outcome y retire legacy.</desc>
<defs><marker id="p-g229" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="616.48" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#cf222e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 229 · Tecnología como capacidad empresarial</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 19 · Alta dirección y gobierno</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#cf222e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >business capability</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >habilidad organizacional necesaria para lograr un</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >outcome</text>
<circle cx="38" cy="184.12" r="5" fill="#cf222e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >technology asset</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >sistema o plataforma que habilita capacidades</text>
<circle cx="38" cy="242.12" r="5" fill="#cf222e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >technical dependency</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >relación donde una capacidad depende de tecnología</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >específica</text>
<circle cx="38" cy="314.24" r="5" fill="#cf222e"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >platform</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >conjunto reutilizable de servicios que acelera</text>
<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >múltiples productos</text>
<circle cx="38" cy="386.36" r="5" fill="#cf222e"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >technology portfolio</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cartera de sistemas e inversiones gestionada por valor</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >y riesgo</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
