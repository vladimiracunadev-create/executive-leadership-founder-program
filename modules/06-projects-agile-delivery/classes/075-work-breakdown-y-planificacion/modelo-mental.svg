<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g75 d-g75" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g75">Ficha visual de la clase 075: Work breakdown y planificación</title>
<desc id="d-g75">Conceptos: WBS; work package; dependency; milestone; critical path. Método: partir de entregables → descomponer hasta paquetes gestionables → mapear dependencias → estimar secuencia y recursos → identificar critical path y hitos.</desc>
