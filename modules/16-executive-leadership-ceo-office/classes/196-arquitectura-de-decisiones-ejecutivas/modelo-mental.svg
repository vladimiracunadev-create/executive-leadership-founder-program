<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >decision architecture</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >mapa de decisiones derechos foros e información</text>
<circle cx="38" cy="170" r="5" fill="#cf222e"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >reversibility</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grado en que una decisión puede deshacerse a costo</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >razonable</text>
<circle cx="38" cy="242.12" r="5" fill="#cf222e"/>
