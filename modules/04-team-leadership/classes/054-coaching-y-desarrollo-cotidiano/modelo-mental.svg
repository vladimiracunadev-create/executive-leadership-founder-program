<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Coaching no reemplaza feedback claro, formación técnica ni decisiones urgentes. El estilo debe responder a tarea, madurez y riesgo, no</text>
