<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tiempo desde necesidad hasta decisión ejecutable</text>
<circle cx="38" cy="300.12" r="5" fill="#cf222e"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >exception</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >caso fuera de políticas o tolerancias</text>
