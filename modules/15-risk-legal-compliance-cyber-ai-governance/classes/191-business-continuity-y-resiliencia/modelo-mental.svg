<title id="t-s191">Clase 191 · Continuidad: de qué depende el negocio</title>
<desc id="d-s191">Cinco pasos de la continuidad de negocio: análisis de impacto, objetivos de recuperación, estrategias, pruebas y mejora.</desc>
