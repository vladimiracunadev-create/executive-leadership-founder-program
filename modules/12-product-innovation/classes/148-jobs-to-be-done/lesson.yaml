  - "Identificar la competencia real: todo lo que el cliente contrata para ese trabajo."
  - "Mapear las fuerzas que empujan, atraen, frenan y mantienen una decisión."
  - "Traducir el trabajo en criterios de producto, mensaje y oferta."
deliverable: "leadership-decision-brief.md"
references:
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
  - "Alexander Osterwalder et al. — *Value Proposition Design*"
  - "Rob Fitzpatrick — *The Mom Test*"
  - "Teresa Torres — *Continuous Discovery Habits*"
  - "Clayton M. Christensen — *The Innovator's Dilemma*"
limits:
