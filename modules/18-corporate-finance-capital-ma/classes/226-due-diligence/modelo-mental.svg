<title id="t-g226">Ficha visual de la clase 226: Due diligence</title>
<desc id="d-g226">Conceptos: due diligence; quality of earnings; red flag; data room; confirmatory diligence. Método: partir de deal thesis → convertir supuestos en questions → asignar workstreams y materiality → analizar findings y cuantificar → actualizar price terms o walk-away.</desc>
