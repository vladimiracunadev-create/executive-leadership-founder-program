id: 225
part: 18
title: "M&A: lógica estratégica"
duration_minutes: 150
level: "Etapa 5 — CEO → Capital allocator"
outcome: "decidir estructura de capital, valoración, fundraising y transacciones"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir M&A de strategic rationale mediante evidencia observable."
  - "Aplicar la secuencia: definir rationale y alternativas → cuantificar stand-alone y synergies → establecer walk-away price → mapear risks e integration needs → aprobar thesis y diligence plan."
  - "Interpretar synergy NPV, purchase premium, ROIC sin atribuir causalidad automática."
  - "Resolver el caso de m&A: lógica estratégica con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "strategy-memo.md"
references:
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Stephen Ross, Randolph Westerfield et al. — *Corporate Finance*"
  - "David Skok — *SaaS Metrics resources*"
  - "Noam Wasserman — *The Founder's Dilemmas*"
  - "Aswath Damodaran — *Investment Valuation*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
limits:
  - "M&A puede destruir valor por sobrepago y sobreestimación de sinergias. Siempre compara con build, partner o no hacer nada."
evidence_signals:
  - "synergy NPV"
  - "purchase premium"
  - "ROIC"
  - "integration cost"
  - "deal downside"
