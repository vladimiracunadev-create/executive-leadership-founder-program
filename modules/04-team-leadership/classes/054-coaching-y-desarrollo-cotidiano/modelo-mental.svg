<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g54 d-g54" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g54">Ficha visual de la clase 054: Coaching y desarrollo cotidiano</title>
<desc id="d-g54">Conceptos: coaching; mentoring; instrucción; pregunta de coaching; experimento. Método: diagnosticar brecha de skill versus juicio → acordar objetivo de desarrollo → usar preguntas antes de consejo cuando existe capacidad → dar instrucción cuando falta conocimiento base → cerrar con experimento y seguimiento.</desc>
<defs><marker id="p-g54" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
