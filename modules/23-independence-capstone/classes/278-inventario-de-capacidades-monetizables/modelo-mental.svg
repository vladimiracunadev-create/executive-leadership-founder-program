<title id="t-g278">Ficha visual de la clase 278: Inventario de capacidades monetizables</title>
<desc id="d-g278">Conceptos: skill; domain knowledge; proof; reputation; capability stack. Método: inventariar experiencia y resultados → extraer problemas resueltos → mapear proof y network → combinar capabilities por demanda → probar con conversaciones y ofertas.</desc>
