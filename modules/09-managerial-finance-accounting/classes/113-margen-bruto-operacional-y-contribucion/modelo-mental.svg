<text x="337.9" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >operating margin</text>
<rect x="460.3" y="442.12" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="473.3" cy="455.12" r="3.5" fill="#8250df"/>
<text x="484.3" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >price variance</text>
<rect x="592.9" y="442.12" width="108.8" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="605.9" cy="455.12" r="3.5" fill="#8250df"/>
<text x="616.9" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >mix variance</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="488.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >El margen de contribución sirve en el rango relevante y horizonte apropiado. A largo plazo muchos costos 'fijos' cambian; no uses</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >análisis incremental para justificar precios estructuralmente insuficientes.</text>
</svg>
