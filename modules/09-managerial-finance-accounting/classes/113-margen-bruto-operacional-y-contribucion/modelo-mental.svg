<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g113 d-g113" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g113">Ficha visual de la clase 113: Margen bruto, operacional y contribución</title>
<desc id="d-g113">Conceptos: gross margin; operating margin; contribution margin; variable cost; fixed cost. Método: definir clasificación consistente → calcular márgenes por producto o segmento → comparar tendencia → identificar driver precio-volumen-mix-costo → usar contribución para decisiones incrementales.</desc>
<defs><marker id="p-g113" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#8250df"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 113 · Margen bruto, operacional y contribución</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 09 · Gestión de negocio</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#8250df"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >gross margin</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >(ventas−costo de ventas)/ventas</text>
<circle cx="38" cy="170" r="5" fill="#8250df"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >operating margin</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >resultado operativo/ventas</text>
<circle cx="38" cy="228" r="5" fill="#8250df"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >contribution margin</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ventas−costos variables atribuibles</text>
<circle cx="38" cy="286" r="5" fill="#8250df"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >variable cost</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >costo que cambia con volumen dentro del rango relevante</text>
<circle cx="38" cy="344" r="5" fill="#8250df"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >fixed cost</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >costo que no cambia inmediatamente con volumen dentro</text>
<text x="54" y="383.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >del rango relevante</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
