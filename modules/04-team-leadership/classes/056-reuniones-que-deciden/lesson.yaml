id: 56
part: 04
title: "Reuniones que deciden"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "crear equipos con propósito, coordinación, confianza, aprendizaje y accountability"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Decidir si una reunión es necesaria o si existe un medio mejor."
  - "Clasificar una reunión como informativa, de coordinación, de decisión o de exploración."
  - "Diseñar una reunión de decisión: propósito, participantes, agenda, criterios y responsable."
  - "Conducirla de modo que termine con una decisión registrada."
  - "Medir y mejorar las reuniones de un equipo."
deliverable: "leadership-decision-brief.md"
references:
  - "Steven G. Rogelberg — *The Surprising Science of Meetings*"
  - "Patrick Lencioni — *Death by Meeting*"
  - "Andrew S. Grove — *High Output Management*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "Jon R. Katzenbach & Douglas K. Smith — *The Wisdom of Teams*"
limits:
  - "Los resultados que Rogelberg reúne provienen de estudios con calidad desigual y de contextos variados; su aplicación depende de la cultura del equipo."
evidence_signals:
  - "tipo de reunión definido"
  - "decisión y responsable registrados"
  - "porcentaje de reuniones con resultado"
  - "acciones revisadas al inicio"
