<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 547.31" width="1040" role="img" aria-labelledby="t-s78 d-s78" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s78">Clase 078 · Los cuatro valores del manifiesto Agile</title>
<desc id="d-s78">Los cuatro valores del manifiesto Agile: lo que se valora más y lo que, aunque tiene valor, se valora menos.</desc>
<defs><marker id="p-s78" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="547.31" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 078 · Los cuatro valores del manifiesto Agile</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Beck et al. (2001) · Edmondson (1999)</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">SE VALORA MÁS</text>
<rect x="28" y="104" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="80.5" rx="3" fill="#1a7f37"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Individuos e interacciones</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Las personas y su colaboración antes que los procesos y las</text>
<text x="46" y="161.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >herramientas.</text>
<rect x="28" y="194.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="194.5" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="216.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Software funcionando</text>
<text x="46" y="234.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Un producto que funciona antes que documentación exhaustiva.</text>
<rect x="28" y="267.75" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="28.0" y="267.75" width="6" height="63.25" rx="3" fill="#bc4c00"/>
<text x="46" y="289.75" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Colaboración con el cliente</text>
<text x="46" y="307.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Trabajar con el cliente antes que negociar un contrato.</text>
<rect x="28" y="341" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.7" />
<rect x="28.0" y="341.0" width="6" height="63.25" rx="3" fill="#8250df"/>
<text x="46" y="363" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Responder al cambio</text>
<text x="46" y="381" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Adaptarse antes que seguir un plan.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUE SE VALORA MENOS</text>
<rect x="532" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="63.25" rx="3" fill="#59636e"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Procesos y herramientas</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Siguen teniendo valor, pero no sustituyen a las personas.</text>
<rect x="532" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="532.0" y="177.25" width="6" height="63.25" rx="3" fill="#59636e"/>
<text x="550" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Documentación exhaustiva</text>
<text x="550" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se documenta lo que ayuda, no por ritual.</text>
<rect x="532" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="532.0" y="250.5" width="6" height="63.25" rx="3" fill="#59636e"/>
<text x="550" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Negociación de contratos</text>
<text x="550" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se sigue necesitando un marco claro, y la relación pesa más.</text>
<rect x="532" y="323.75" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="532.0" y="323.75" width="6" height="63.25" rx="3" fill="#59636e"/>
<text x="550" y="345.75" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Seguir un plan</text>
<text x="550" y="363.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >El plan sirve para orientarse, no para impedir el aprendizaje.</text>
<rect x="28" y="420.25" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="442.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Agile es una forma de trabajar con incertidumbre mediante ciclos cortos, retroalimentación y adaptación. Se apoya en equipos con</text>
<text x="44" y="459.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >seguridad para aprender.</text>
<text x="28" y="506.75" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >El manifiesto surgió en el desarrollo de software; su aplicación a otros trabajos exige adaptar las prácticas, no solo los nombres.</text>
</svg>
