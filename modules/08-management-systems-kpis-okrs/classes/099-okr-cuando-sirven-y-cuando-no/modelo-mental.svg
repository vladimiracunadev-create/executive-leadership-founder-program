<circle cx="640.4" cy="469.24" r="3.5" fill="#8250df"/>
<text x="651.4" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >commitment misses</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >OKR no reemplaza presupuestos, SLA, compliance ni gestión operativa. Úsalo donde foco y aprendizaje agreguen valor, no como lenguaje</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >obligatorio para toda tarea.</text>
</svg>
