<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s267 d-s267" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s267">Clase 267 · Contratar a un líder con evidencia</title>
<desc id="d-s267">Cinco pasos para contratar un líder: resultado y contexto, scorecard y derechos de decisión, evidencia de escala, referencias y primeros noventa días.</desc>
<defs><marker id="p-s267" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 267 · Contratar a un líder con evidencia</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Harnish · Horowitz · OECD · Sutton y Rao</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Paso</text>
<text x="279.692" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué se define</text>
<text x="683.385" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué se verifica</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Resultado y contexto</text>
<text x="279.692" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué debe lograr y en qué situación de la empresa.</text>
<text x="683.385" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Que el cargo sea necesario y claro.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Scorecard y decisiones</text>
<text x="279.692" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Resultados esperados y qué decide solo.</text>
<text x="683.385" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Límites de autoridad por escrito.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Evidencia de escala</text>
<text x="279.692" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué hizo en un contexto parecido.</text>
<text x="683.385" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Resultados, no solo títulos.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Referencias</text>
<text x="279.692" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué dicen quienes trabajaron con él.</text>
<text x="683.385" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Referencias propias, no solo las que entrega.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Primeros 90 días</text>
<text x="279.692" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Aprendizaje, decisiones y entregables.</text>
<text x="683.385" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Revisiones y criterios de continuidad.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Contratar un líder no traspasa por sí solo el contexto: el fundador debe compartir información, decisiones y límites, y aceptar que</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >otro decida distinto.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Una mala contratación de un líder cuesta meses de rendimiento del equipo.</text>
</svg>
