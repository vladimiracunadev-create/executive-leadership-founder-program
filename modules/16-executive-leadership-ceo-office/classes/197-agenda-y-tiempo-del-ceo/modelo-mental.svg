<text x="48" y="494" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="512" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Una agenda rígida falla en crisis y transiciones. Protege bloques estructurales, pero conserva capacidad de reordenar atención cuando</text>
<text x="48" y="529.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cambia el riesgo o la oportunidad.</text>
