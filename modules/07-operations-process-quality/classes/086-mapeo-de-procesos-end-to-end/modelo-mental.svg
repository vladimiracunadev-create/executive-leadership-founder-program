<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g86 d-g86" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g86">Ficha visual de la clase 086: Mapeo de procesos end-to-end</title>
<desc id="d-g86">Conceptos: end-to-end process; handoff; touch time; wait time; rework. Método: definir inicio, fin y cliente → recorrer casos reales → registrar pasos, handoffs y tiempos → marcar rework y decisiones → calcular lead time versus touch time.</desc>
<defs><marker id="p-g86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
