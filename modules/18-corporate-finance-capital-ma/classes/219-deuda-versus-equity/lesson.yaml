id: 219
part: 18
title: "Deuda versus equity"
duration_minutes: 150
level: "Etapa 5 — CEO → Capital allocator"
outcome: "decidir estructura de capital, valoración, fundraising y transacciones"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir debt de equity mediante evidencia observable."
  - "Aplicar la secuencia: proyectar cash y downside → medir capacidad de servicio → cuantificar dilution y control → comparar términos y flexibilidad → seleccionar mezcla y plan B."
  - "Interpretar debt service coverage, dilution, runway sin atribuir causalidad automática."
  - "Resolver el caso de deuda versus equity con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Stephen Ross, Randolph Westerfield et al. — *Corporate Finance*"
  - "Aswath Damodaran — *Investment Valuation*"
  - "Donald DePamphilis — *Mergers, Acquisitions, and Other Restructuring Activities*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
limits:
  - "Comparar solo tasa versus porcentaje de equity es incompleto. Equity puede ser caro si el negocio escala; deuda puede ser fatal si cash es incierto. Modela escenarios."
evidence_signals:
  - "debt service coverage"
  - "dilution"
  - "runway"
  - "cash volatility"
  - "control rights"
