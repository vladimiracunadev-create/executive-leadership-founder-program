<title id="t-g201">Ficha visual de la clase 201: Leadership pipeline</title>
<desc id="d-g201">Conceptos: leadership passage; readiness; succession bench; critical role; development assignment. Método: mapear niveles y critical roles → definir work y values por passage → calibrar potencial y readiness → crear assignments y coaching → revisar bench y sucesión periódicamente.</desc>
