<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g42 d-g42" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g42">Ficha visual de la clase 042: Seguridad psicológica y aprendizaje</title>
<desc id="d-g42">Conceptos: seguridad psicológica; voice; learning behavior; accountability; silencio organizacional. Método: observar cuándo la gente calla → modelar falibilidad y preguntas → responder productivamente a malas noticias → separar error de negligencia → mantener estándares y seguimiento.</desc>
<defs><marker id="p-g42" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
