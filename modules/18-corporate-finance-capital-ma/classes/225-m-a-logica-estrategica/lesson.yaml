  - "Sara B. Moeller, Frederik P. Schlingemann & René M. Stulz — *Firm size and the gains from acquisitions*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
limits:
  - "La evidencia académica es promedio y no predice una operación concreta."
evidence_signals:
