id: 212
part: 17
title: "Supervisión de estrategia"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "separar propiedad, administración y supervisión para gobernar estrategia, riesgo y sucesión"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir strategy oversight de strategic assumption mediante evidencia observable."
  - "Aplicar la secuencia: revisar diagnóstico y choices → challenge supuestos y escenarios → verificar capital y capabilities → definir milestones y signposts → revisar aprendizaje y reallocation."
  - "Interpretar strategic milestone, assumption status, capital deployment sin atribuir causalidad automática."
  - "Resolver el caso de supervisión de estrategia con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "strategy-memo.md"
references:
  - "Bob Tricker — *Corporate Governance*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "Ram Charan — *Boards That Deliver*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Paul Polman & Andrew Winston — *Net Positive*"
  - "Richard Leblanc & James Gillies — *Inside the Boardroom*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*. Fuente primaria: <https://www.oecd.org/corporate/principles-corporate-governance/>."
limits:
  - "El board puede sobrepasar su rol si convierte challenge en diseño operativo. Formula preguntas y límites; deja al CEO accountable por ejecución y opciones detalladas."
evidence_signals:
  - "strategic milestone"
  - "assumption status"
  - "capital deployment"
  - "portfolio return"
  - "strategy review depth"
