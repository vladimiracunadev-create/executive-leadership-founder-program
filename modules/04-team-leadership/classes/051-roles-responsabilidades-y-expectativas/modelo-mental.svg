<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 051 · Matriz de responsabilidades: una sola persona responde</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Rizzo, House &amp; Lirtzman (1970)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Decisión</text>
<text x="304" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Decide (una persona)</text>
<text x="496" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Ejecuta</text>
<text x="664" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Se consulta</text>
<text x="856" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Se informa</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Prioridad del trimestre</text>
<text x="304" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Líder del equipo</text>
<text x="496" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Todo el equipo</text>
<text x="664" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Ventas, soporte</text>
<text x="856" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dirección</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Contratar un perfil</text>
<text x="304" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Líder del equipo</text>
<text x="496" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Personas</text>
<text x="664" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >El equipo</text>
<text x="856" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Finanzas</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Cambio de herramienta</text>
<text x="304" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Responsable técnico</text>
<text x="496" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >El equipo</text>
<text x="664" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Usuarios clave</text>
<text x="856" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Líder</text>
<rect x="28" y="245.68" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Cierre de un incidente</text>
<text x="304" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Quien comanda el</text>
<text x="304" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >incidente</text>
<text x="496" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Operación</text>
<text x="664" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Legal, comunicaciones</text>
<text x="856" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dirección</text>
<rect x="28" y="314.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="336.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Rizzo et al. midieron dos problemas de rol: la ambigüedad (no se sabe qué se espera) y el conflicto (se esperan cosas incompatibles).</text>
<text x="44" y="354.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Ambos se asocian con tensión y menor satisfacción; la matriz los reduce.</text>
<text x="28" y="401.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La matriz aclara expectativas; no sustituye la conversación sobre cómo se ejerce cada rol.</text>
</svg>
