<title id="t-g102">Ficha visual de la clase 102: Balanced Scorecard y tableros</title>
<desc id="d-g102">Conceptos: financial perspective; customer perspective; process perspective; learning perspective; strategy map. Método: traducir estrategia en outcomes financieros y de cliente → identificar procesos críticos → definir capacidades habilitadoras → conectar objetivos causalmente → seleccionar pocos indicadores por objetivo.</desc>
