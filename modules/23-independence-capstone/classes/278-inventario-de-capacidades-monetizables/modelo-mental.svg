<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s278 d-s278" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s278">Clase 278 · Inventario de capacidades que se pueden monetizar</title>
<desc id="d-s278">Cinco partes del inventario de capacidades: experiencia y resultados, problemas resueltos, pruebas y red, combinaciones por demanda, y conversaciones y ofertas.</desc>
<defs><marker id="p-s278" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 278 · Inventario de capacidades que se pueden monetizar</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Drucker · Wasserman · Aulet · Newport</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Parte del inventario</text>
<text x="298.3" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué se registra</text>
<text x="691.9" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cómo se contrasta</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Experiencia y resultados</text>
<text x="298.3" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué hiciste y qué lograste con cifras.</text>
<text x="691.9" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Documentos y testimonios.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Problemas resueltos</text>
<text x="298.3" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué problema repetido sabes resolver.</text>
<text x="691.9" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Frecuencia y quién paga por él.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Pruebas y red</text>
<text x="298.3" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Casos, referencias, publicaciones y contactos.</text>
<text x="691.9" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Solicitudes que llegan solas.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Combinaciones por demanda</text>
<text x="298.3" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué capacidades juntas valen más.</text>
<text x="691.9" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Competencia y canal accesible.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Conversaciones y ofertas</text>
<text x="298.3" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué se probó con clientes reales.</text>
<text x="691.9" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Interés, propuestas y pagos.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >No toda habilidad que se disfruta tiene un mercado accesible. El inventario se contrasta con demanda, competencia y canal antes de</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >invertir meses en posicionarse.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Una capacidad sin prueba ni demanda es solo una preferencia.</text>
</svg>
