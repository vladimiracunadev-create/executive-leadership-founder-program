id: 25
part: 02
title: "Comunicación como sistema de liderazgo"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir mensaje de canal mediante evidencia observable."
  - "Aplicar la secuencia: definir propósito y audiencia → seleccionar canal según ambigüedad y sensibilidad → estructurar mensaje y contexto → confirmar comprensión y decisión → cerrar con owner, acción y registro."
  - "Interpretar preguntas aclaratorias, retrabajo por malentendido, tiempo de decisión sin atribuir causalidad automática."
  - "Resolver el caso de comunicación como sistema de liderazgo con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Robert B. Cialdini — *Influence*"
  - "Nancy Duarte — *Resonate*"
  - "Chris Voss & Tahl Raz — *Never Split the Difference*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
limits:
  - "Más comunicación no siempre mejora coordinación. Exceso de mensajes sin jerarquía aumenta ruido; diseña arquitectura y fuentes confiables, no volumen."
evidence_signals:
  - "preguntas aclaratorias"
  - "retrabajo por malentendido"
  - "tiempo de decisión"
  - "acciones sin owner"
  - "mensajes que requieren corrección"
