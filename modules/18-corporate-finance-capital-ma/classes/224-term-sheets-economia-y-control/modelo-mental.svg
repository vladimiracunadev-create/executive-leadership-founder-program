<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Los términos dependen de jurisdicción y documentos definitivos. Esta clase enseña economics e issue spotting; usa abogados</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >especializados antes de firmar.</text>
