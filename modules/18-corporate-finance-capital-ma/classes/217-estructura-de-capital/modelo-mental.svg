<text x="637.6" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >covenant headroom</text>
<rect x="28" y="516.36" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="516.36" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="536.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="554.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Ratios sectoriales son referencia, no respuesta. Deuda tolerable depende de volatilidad, activos, moneda, vencimientos, regulación y</text>
<text x="48" y="571.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >acceso a capital.</text>
