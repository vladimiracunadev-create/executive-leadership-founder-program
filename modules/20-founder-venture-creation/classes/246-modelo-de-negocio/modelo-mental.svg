<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g246 d-g246" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g246">Ficha visual de la clase 246: Modelo de negocio</title>
<desc id="d-g246">Conceptos: business model; channel; revenue stream; key resource; unit economics. Método: dibujar hipótesis de modelo → identificar riskiest links → estimar revenue y cost → probar canal y delivery → actualizar con evidencia de clientes.</desc>
