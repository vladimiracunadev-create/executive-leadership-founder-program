<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 648.48" width="1040" role="img" aria-labelledby="t-g5 d-g5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g5">Ficha visual de la clase 005: De tareas a resultados: pensar en contribución</title>
<desc id="d-g5">Conceptos: actividad; output; outcome; contribución; valor. Método: nombrar el outcome externo → mapear qué outputs lo habilitan → eliminar actividades sin conexión defendible → acordar criterios de calidad y tiempo → medir si la contribución ocurrió realmente.</desc>
<defs><marker id="p-g5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="648.48" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 005 · De tareas a resultados: pensar en contribución</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Parte 00 · Autoliderazgo y fundamentos ejec…</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >actividad</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >acción realizada que consume tiempo o recursos</text>
<circle cx="38" cy="170" r="5" fill="#1a7f37"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >output</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >producto inmediato de una actividad, como un informe o</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >entrega</text>
<circle cx="38" cy="242.12" r="5" fill="#1a7f37"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >outcome</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cambio observable en comportamiento, desempeño o</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >condición del sistema</text>
<circle cx="38" cy="314.24" r="5" fill="#1a7f37"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >contribución</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >parte del outcome que tu rol puede influir de forma</text>
<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >defendible</text>
<circle cx="38" cy="386.36" r="5" fill="#1a7f37"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >valor</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >beneficio útil para un stakeholder respecto del costo y</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >riesgo incurridos</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >nombrar el outcome externo</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >mapear qué outputs lo habilitan</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >eliminar actividades sin conexión</text>
<text x="628" y="257.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >defendible</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >acordar criterios de calidad y</text>
<text x="690" y="199.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >tiempo</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >medir si la contribución ocurrió</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >realmente</text>
<text x="28" y="472.48" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="484.48" width="246.8" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="497.48" r="3.5" fill="#1a7f37"/>
<text x="52" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >horas invertidas versus outcomes</text>
<rect x="284.8" y="484.48" width="219.2" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="297.8" cy="497.48" r="3.5" fill="#1a7f37"/>
<text x="308.8" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >porcentaje de outputs usados</text>
<rect x="514" y="484.48" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="527" cy="497.48" r="3.5" fill="#1a7f37"/>
<text x="538" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >decisiones habilitadas</text>
<rect x="701.8" y="484.48" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="714.8" cy="497.48" r="3.5" fill="#1a7f37"/>
<text x="725.8" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >reducción de retrabajo</text>
<rect x="28" y="516.48" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="529.48" r="3.5" fill="#1a7f37"/>
<text x="52" y="533.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >valor o riesgo evitado</text>
<rect x="28" y="562.48" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="562.48" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="582.48" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="600.48" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No todo valor es inmediatamente cuantificable. Capacidades, confianza, aprendizaje y prevención pueden crear valor diferido; el error</text>
<text x="48" y="617.73" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >sería confundir 'difícil de medir' con 'sin propósito'.</text>
</svg>
