<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >sin dependencia inmediata de un único…</text>
<circle cx="38" cy="184.12" r="5" fill="#59636e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >professional independence</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad de generar oportunidades por reputación y</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidades</text>
