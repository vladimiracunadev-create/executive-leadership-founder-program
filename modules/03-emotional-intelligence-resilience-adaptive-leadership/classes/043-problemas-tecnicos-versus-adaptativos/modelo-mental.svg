<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" role="img" aria-labelledby="t-043 d-043" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-043">Problema técnico y problema adaptativo</title>
<desc id="d-043">Dos tipos de problema según si existe una respuesta conocida: los técnicos se resuelven con experticia y los adaptativos exigen que las personas aprendan y cambien valores, hábitos o lealtades.</desc>
<defs><marker id="p-043" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="580" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 043 · Qué tipo de problema es</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Heifetz (1994) · Heifetz, Grashow &amp; Linsky (2009)</text>
<rect x="28" y="92" width="480" height="360" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M28,142 V104 a12,12 0 0 1 12,-12 H496 a12,12 0 0 1 12,12 V142 Z" fill="#0969da"/>
<text x="46" y="116" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.2">PROBLEMA TÉCNICO</text>
<text x="46" y="134" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start" >Se conoce la definición y la solución</text>
<text x="46" y="180" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Quién trabaja</text>
<text x="46" y="198" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Quien tiene la experticia.</text>
<text x="46" y="250" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Qué se pide</text>
<text x="46" y="268" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Aplicar el conocimiento existente.</text>
<text x="46" y="320" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Qué se pierde</text>
<text x="46" y="338" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Poco: el cambio es técnico.</text>
<text x="46" y="390" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Ejemplo</text>
<text x="46" y="408" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Una falla de un sistema con procedimiento conocido.</text>
<rect x="532" y="92" width="480" height="360" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<path d="M532,142 V104 a12,12 0 0 1 12,-12 H1000 a12,12 0 0 1 12,12 V142 Z" fill="#cf222e"/>
<text x="550" y="116" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.2">PROBLEMA ADAPTATIVO</text>
<text x="550" y="134" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start" >Exige aprender y cambiar</text>
<text x="550" y="180" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Quién trabaja</text>
<text x="550" y="198" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Las personas con el problema.</text>
<text x="550" y="250" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Qué se pide</text>
<text x="550" y="268" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Revisar valores, hábitos y lealtades.</text>
<text x="550" y="320" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Qué se pierde</text>
<text x="550" y="338" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Algo que se valora: hay resistencia.</text>
<text x="550" y="390" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" >Ejemplo</text>
<text x="550" y="408" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Pasar de un modelo de ventas por relación a uno por datos.</text>
<rect x="28" y="468" width="984" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="490" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El error frecuente es tratar un problema adaptativo con una solución técnica: se «arregla» el síntoma y reaparece. Heifetz propone</text>
<text x="44" y="507.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >alternar entre la acción y el balcón, desde donde se observa el patrón.</text>
<text x="28" y="566" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La mayoría de los problemas reales mezcla ambos componentes: se separan para decidir qué parte exige aprendizaje.</text>
</svg>
