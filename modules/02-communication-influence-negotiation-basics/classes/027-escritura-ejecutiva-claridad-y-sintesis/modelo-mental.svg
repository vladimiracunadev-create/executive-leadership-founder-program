<text x="656.8" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >extensión del cuerpo versus anexos</text>
<rect x="28" y="488.24" width="233" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="501.24" r="3.5" fill="#1a7f37"/>
<text x="52" y="505.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >decisiones tomadas sin reunión</text>
<rect x="28" y="534.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="534.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="554.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="572.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >La pirámide no debe ocultar incertidumbre ni forzar una conclusión antes de analizar. Es una estructura de comunicación, no una excusa</text>
<text x="48" y="589.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >para cherry-picking.</text>
