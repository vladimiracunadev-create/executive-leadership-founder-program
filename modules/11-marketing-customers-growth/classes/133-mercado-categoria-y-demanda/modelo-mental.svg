<title id="t-g133">Ficha visual de la clase 133: Mercado, categoría y demanda</title>
<desc id="d-g133">Conceptos: market; category; demand; substitute; category creation. Método: definir job y compradores → mapear alternativas y sustitutos → estimar demanda accesible → decidir categoría existente versus nueva → probar lenguaje con clientes.</desc>
