id: 72
part: 05
title: "Capstone: construir un sistema de talento"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "diseñar un sistema de talento desde el cargo hasta la salida responsable"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Mapear el sistema de talento de una organización de la entrada a la salida."
  - "Diagnosticar su coherencia: qué se declara y qué se hace en cada práctica."
  - "Priorizar mejoras por impacto, costo y riesgo, empezando por las que condicionan al resto."
  - "Diseñar un sistema simple y proporcional al tamaño de la organización."
  - "Medir su efecto con indicadores de personas y de negocio."
deliverable: "people-decision-brief.md"
references:
  - "J. Richard Hackman & Greg R. Oldham — *Motivation through the design of work: test of a theory*"
  - "Frank L. Schmidt & John E. Hunter — *The validity and utility of selection methods in personnel psychology: Practical and theoretical implications of 85 years of research findings*"
  - "Talya N. Bauer, Todd Bodner, Berrin Erdogan, Donald M. Truxillo & Jennifer S. Tucker — *Newcomer adjustment during organizational socialization: A meta-analytic review of antecedents, outcomes, and methods*"
  - "J. Stacy Adams — *Towards an understanding of inequity*"
  - "Ram Charan, Stephen Drotter & James Noel — *The Leadership Pipeline*"
  - "Dave Ulrich — *Human Resource Champions*"
  - "John Boudreau & Peter Ramstad — *Beyond HR*"
limits:
  - "Los marcos de las clases provienen de investigación de calidad variable y de contextos específicos; su combinación en un sistema es una síntesis de la parte 05, no un modelo validado."
evidence_signals:
  - "mapa de extremo a extremo"
  - "coherencia entre lo declarado y lo hecho"
  - "indicadores de personas"
  - "dueño y revisión anual del sistema"
