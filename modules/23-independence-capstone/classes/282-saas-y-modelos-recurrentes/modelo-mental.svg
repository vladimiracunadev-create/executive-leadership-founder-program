<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 494.98" width="1040" role="img" aria-labelledby="t-s282 d-s282" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s282">Clase 282 · Métricas de un modelo recurrente</title>
<desc id="d-s282">Métricas de un modelo de suscripción, qué miden y qué cuidado requieren: ingreso recurrente mensual, retención neta de ingresos, cancelación de clientes, cohortes y recuperación del costo de adquisición.</desc>
<defs><marker id="p-s282" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="494.98" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 282 · Métricas de un modelo recurrente</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Skok · Ries · Drucker · Taleb</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Métrica</text>
<text x="289.114" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué mide</text>
<text x="662.785" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cuidado al interpretarla</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Ingreso recurrente mensual</text>
<text x="289.114" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Ingresos mensuales repetibles contratados.</text>
<text x="662.785" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >No incluye ingresos únicos.</text>
<rect x="28" y="172.56" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Retención neta de ingresos</text>
<text x="289.114" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Ingresos de clientes existentes tras bajas y</text>
<text x="289.114" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >ampliaciones.</text>
<text x="662.785" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Puede ocultar bajas si hay ampliaciones.</text>
<rect x="28" y="225.68" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="245.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Cancelación de clientes</text>
<text x="289.114" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Porcentaje de clientes que se va por período.</text>
<text x="662.785" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se separa por segmento y antigüedad.</text>
<rect x="28" y="262.24" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="282.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Retención por cohorte</text>
<text x="289.114" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué porción de cada grupo sigue activa.</text>
<text x="662.785" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Pocas cohortes dan resultados frágiles.</text>
<rect x="28" y="298.8" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="318.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Recuperación del costo de</text>
<text x="40" y="335.36" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >adquisición</text>
<text x="289.114" y="318.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Meses para recuperar lo gastado en conseguir un</text>
<text x="289.114" y="335.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >cliente.</text>
<text x="662.785" y="318.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Depende de descuentos y plazos.</text>
<rect x="28" y="367.92" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="389.92" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >No todo problema necesita una suscripción. Si el uso es episódico, un precio recurrente puede crear cancelaciones y desconfianza: el</text>
<text x="44" y="407.17" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >modelo sigue al valor entregado.</text>
<text x="28" y="454.42" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Se optimiza la adquisición después de comprobar que hay ajuste con el cliente.</text>
</svg>
