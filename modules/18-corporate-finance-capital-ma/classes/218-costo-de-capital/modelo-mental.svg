<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g218 d-g218" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g218">Ficha visual de la clase 218: Costo de capital</title>
<desc id="d-g218">Conceptos: cost of equity; cost of debt; WACC; beta; hurdle rate. Método: definir flujo y riesgo → estimar costo de deuda after-tax → estimar costo de equity → ponderar capital a valores económicos → ajustar hurdle si riesgo difiere.</desc>
<defs><marker id="p-g218" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
