<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >portfolio</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >conjunto de inversiones priorizadas por estrategia y</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >recursos</text>
