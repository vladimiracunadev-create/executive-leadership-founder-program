<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >forecast construido desde variables causales del</text>
<text x="54" y="325.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >negocio</text>
<circle cx="38" cy="358.12" r="5" fill="#8250df"/>
