<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >margen bruto</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ventas menos costo de ventas, como porcentaje de ventas</text>
<circle cx="38" cy="170" r="5" fill="#8250df"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >resultado operativo</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >resultado del negocio antes de estructura financiera e</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >impuestos según presentación</text>
<circle cx="38" cy="242.12" r="5" fill="#8250df"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >EBITDA</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >aproximación a resultado antes de intereses, impuestos,</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >depreciación y amortización, no flujo…</text>
