id: 213
part: 17
title: "Supervisión de riesgo y controles"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "separar propiedad, administración y supervisión para gobernar estrategia, riesgo y sucesión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Alinear el apetito de riesgo con la estrategia y los límites aprobados."
  - "Seleccionar los riesgos principales y los controles críticos que el directorio debe vigilar."
  - "Exigir aseguramiento independiente y evaluar su calidad."
  - "Seguir brechas, excesos y remediaciones hasta su cierre."
  - "Diseñar medidas defensivas frente a la influencia indebida, el acceso a información y las amenazas internas, sin vigilar la vida privada."
deliverable: "risk-governance-brief.md"
references:
  - "COSO — *Enterprise Risk Management—Integrating with Strategy and Performance*"
  - "NIST — *Cybersecurity Framework (CSF) 2.0*"
  - "Ross Anderson — *Security Engineering*"
  - "Ram Charan — *Boards That Deliver*"
  - "Robert B. Cialdini — *Influence*"
limits:
  - "El directorio no puede garantizar la ausencia de fallas; su estándar es una supervisión razonable y evidencia de gobierno, no certificar controles técnicos individuales."
evidence_signals:
  - "riesgos principales y apetito alineados"
  - "controles críticos y aseguramiento independiente"
  - "brechas seguidas hasta su cierre"
  - "protección defensiva sin vigilar la vida privada"
