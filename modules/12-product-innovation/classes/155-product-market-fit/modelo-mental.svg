<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 630.6" width="1040" role="img" aria-labelledby="t-g155 d-g155" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g155">Ficha visual de la clase 155: Product-market fit</title>
<desc id="d-g155">Conceptos: product-market fit; retention curve; pull; market segment; repeatability. Método: definir segmento específico → examinar retención y uso repetido → analizar demanda y referencias → validar unit economics iniciales → decidir escalar profundizar o seguir buscando fit.</desc>
<defs><marker id="p-g155" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="630.6" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#bc4c00"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 155 · Product-market fit</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 12 · Dirección, estrategia y organización</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#bc4c00"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >product-market fit</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grado en que un producto satisface de manera repetible</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >un mercado definido</text>
<circle cx="38" cy="184.12" r="5" fill="#bc4c00"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >retention curve</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trayectoria de permanencia de cohortes a lo largo del</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tiempo</text>
<circle cx="38" cy="256.24" r="5" fill="#bc4c00"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >pull</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >demanda que reduce esfuerzo necesario para convencer al</text>
<text x="54" y="295.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cliente</text>
<circle cx="38" cy="328.36" r="5" fill="#bc4c00"/>
<text x="54" y="333.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >market segment</text>
<text x="54" y="351.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grupo con problema y proceso de compra suficientemente</text>
<text x="54" y="367.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >homogéneos</text>
<circle cx="38" cy="400.48" r="5" fill="#bc4c00"/>
<text x="54" y="405.48" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >repeatability</text>
<text x="54" y="423.48" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad de reproducir adquisición y valor sin</text>
<text x="54" y="440.04" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >intervención artesanal extrema</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="542" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.98"/>
<text x="484" y="124" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >1</text>
<text x="504" y="124" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >definir segmento específico</text>
<rect x="487" y="160" width="508" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.9099999999999999"/>
<text x="501" y="180" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >2</text>
<text x="521" y="180" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >examinar retención y uso repetido</text>
<rect x="504" y="216" width="474" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.84"/>
<text x="518" y="236" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >3</text>
<text x="538" y="236" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >analizar demanda y referencias</text>
<rect x="521" y="272" width="440" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.77"/>
<text x="535" y="292" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >4</text>
<text x="555" y="292" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >validar unit economics iniciales</text>
<rect x="538" y="328" width="406" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.7"/>
<text x="552" y="348" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >5</text>
<text x="572" y="348" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >decidir escalar profundizar o seguir buscando fit</text>
<text x="28" y="486.6" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="498.6" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="41" cy="511.6" r="3.5" fill="#bc4c00"/>
<text x="52" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cohort retention</text>
<rect x="174.4" y="498.6" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="187.4" cy="511.6" r="3.5" fill="#bc4c00"/>
<text x="198.4" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >organic-referral share</text>
<rect x="362.2" y="498.6" width="101.9" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
