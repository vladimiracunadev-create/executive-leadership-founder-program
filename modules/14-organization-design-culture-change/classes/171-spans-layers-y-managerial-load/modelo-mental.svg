<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >span of control</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >número de reportes directos de un manager</text>
<circle cx="38" cy="170" r="5" fill="#bc4c00"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >layer</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >nivel jerárquico entre frontline y cima</text>
<circle cx="38" cy="228" r="5" fill="#bc4c00"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >managerial load</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >demanda de coordinación coaching y decisión que soporta</text>
<text x="54" y="267.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >un rol</text>
<circle cx="38" cy="300.12" r="5" fill="#bc4c00"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >delayering</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >reducción deliberada de niveles</text>
<circle cx="38" cy="358.12" r="5" fill="#bc4c00"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >manager ratio</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >proporción de managers respecto a contribuyentes</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >individuales</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
