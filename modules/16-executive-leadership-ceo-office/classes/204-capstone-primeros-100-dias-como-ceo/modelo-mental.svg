<title id="t-g204">Ficha visual de la clase 204: Capstone: primeros 100 días como CEO</title>
<desc id="d-g204">Conceptos: transition mandate; learning plan; stakeholder coalition; early decision; 100-day plan. Método: clarificar mandato y situación → diseñar learning agenda 30 días → evaluar equipo y riesgos → definir 3 a 5 prioridades y early wins → establecer operating cadence y revisión 100 días.</desc>
