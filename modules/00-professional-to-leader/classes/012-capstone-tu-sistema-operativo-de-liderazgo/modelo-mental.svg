<text x="48" y="568.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="586.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un sistema operativo no debe convertirse en dogma. Si la cadencia o la regla deja de servir al resultado, se cambia; la disciplina</text>
<text x="48" y="603.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >protege el aprendizaje, no el ritual.</text>
