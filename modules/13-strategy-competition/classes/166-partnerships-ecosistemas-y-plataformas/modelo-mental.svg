<text x="504" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >mapear actores y</text>
<text x="504" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >flujo de valor</text>
