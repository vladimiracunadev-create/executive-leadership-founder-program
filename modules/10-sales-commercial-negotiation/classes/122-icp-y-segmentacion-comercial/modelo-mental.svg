<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >TAM/SAM/SOM</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capas de tamaño de mercado con distinto alcance y</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >accesibilidad</text>
