id: 71
part: 05
title: "Desvinculación responsable y documentación"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "diseñar un sistema de talento desde el cargo hasta la salida responsable"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir una decisión de desvinculación fundada de una improvisada."
  - "Documentar hechos, expectativas, apoyo ofrecido y resultado de forma verificable."
  - "Identificar qué debe verificarse con asesoría antes de actuar."
  - "Conducir la conversación de término con claridad y dignidad."
  - "Gestionar la comunicación al equipo, la transición y el aprendizaje posterior."
deliverable: "leadership-decision-brief.md"
references:
  - "Jason A. Colquitt, Donald E. Conlon, Michael J. Wesson, Christopher O. L. H. Porter & K. Yee Ng — *Justice at the Millennium: A Meta-Analytic Review of 25 Years of Organizational Justice Research*"
  - "Biblioteca del Congreso Nacional de Chile — *LeyChile: Código del Trabajo (texto vigente)*"
  - "Avraham N. Kluger & Angelo DeNisi — *The Effects of Feedback Interventions on Performance: A Historical Review, a Meta-Analysis, and a Preliminary Feedback Intervention Theory*"
  - "Douglas Stone & Sheila Heen — *Thanks for the Feedback*"
  - "Amy C. Edmondson — *The Fearless Organization*"
limits:
  - "Esta clase no es asesoría legal: las causales, avisos, indemnizaciones y formalidades se verifican en la fuente vigente y con un asesor."
evidence_signals:
  - "documentación contemporánea"
  - "verificación legal previa"
  - "conversación digna"
  - "revisión sin culpas"
