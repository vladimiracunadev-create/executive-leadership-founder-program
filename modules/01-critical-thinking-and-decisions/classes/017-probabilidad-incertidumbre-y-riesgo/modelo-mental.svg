<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Probabilidades numéricas débiles pueden crear ilusión de precisión. Cuando no existe base suficiente, rangos, escenarios y decisiones</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >robustas son preferibles a porcentajes arbitrarios.</text>
