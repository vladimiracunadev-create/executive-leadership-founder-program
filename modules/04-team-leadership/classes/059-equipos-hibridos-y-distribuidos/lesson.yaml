id: 59
part: 04
title: "Equipos híbridos y distribuidos"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "crear equipos con propósito, coordinación, confianza, aprendizaje y accountability"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Explicar el problema del conocimiento mutuo y sus consecuencias en la colaboración."
  - "Describir cómo la distancia genera conflicto por falta de información y atribuciones."
  - "Diagnosticar qué problema de distancia afecta a un equipo."
  - "Diseñar acuerdos de comunicación, reunión y registro para equipos distribuidos e híbridos."
  - "Asegurar equidad entre quienes están en remoto y quienes están en la oficina."
deliverable: "people-decision-brief.md"
references:
  - "Catherine Durnell Cramton — *The Mutual Knowledge Problem and Its Consequences for Dispersed Collaboration*"
  - "Pamela J. Hinds & Diane E. Bailey — *Out of Sight, Out of Sync: Understanding Conflict in Distributed Teams*"
  - "J. Richard Hackman — *Leading Teams*"
  - "Amy C. Edmondson — *Psychological Safety and Learning Behavior in Work Teams*"
  - "Stanley McChrystal et al. — *Team of Teams*"
limits:
  - "Las investigaciones de Cramton y de Hinds y Bailey describen equipos de principios de los años 2000, con tecnologías y normas muy distintas; sus mecanismos siguen siendo útiles, pero sus recomendaciones concretas deben revisarse con evidencia más reciente."
evidence_signals:
  - "acuerdos de comunicación escritos"
  - "equidad en reuniones híbridas"
  - "decisiones registradas"
  - "contexto compartido semanalmente"
