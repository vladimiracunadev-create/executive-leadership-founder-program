<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g283 d-g283" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g283">Ficha visual de la clase 283: Portafolio de ingresos y concentración de riesgo</title>
<desc id="d-g283">Conceptos: income portfolio; concentration risk; correlation; recurring income; attention cost. Método: mapear fuentes y margen → medir concentración y correlación → clasificar effort y recurrence → priorizar 2 o 3 engines complementarios → retirar fuentes que destruyen foco.</desc>
