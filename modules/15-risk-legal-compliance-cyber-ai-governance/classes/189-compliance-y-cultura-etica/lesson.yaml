id: 189
part: 15
title: "Compliance y cultura ética"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "gobernar riesgo, legal, cumplimiento, ciberseguridad, datos e IA de forma integrada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir compliance de code of conduct mediante evidencia observable."
  - "Aplicar la secuencia: mapear obligaciones y conductas → diseñar políticas y training por riesgo → crear canales y protección → investigar con debido proceso → remediar causa y monitorear recurrencia."
  - "Interpretar hotline usage, substantiation rate, retaliation allegations sin atribuir causalidad automática."
  - "Resolver el caso de compliance y cultura ética con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "COSO — *Enterprise Risk Management—Integrating with Strategy and Performance*"
  - "John C. Hull — *Risk Management and Financial Institutions*"
  - "NIST — *AI Risk Management Framework (AI RMF 1.0)*"
  - "ISO — *ISO 31000 Risk management*"
  - "Richard A. Clarke & Robert K. Knake — *The Fifth Domain*"
  - "NIST — *Cybersecurity Framework (CSF) 2.0*"
  - "NIST — *AI Risk Management Framework*. Fuente primaria: <https://www.nist.gov/itl/ai-risk-management-framework>."
limits:
  - "Más reportes no implican peor cultura y menos reportes no implican cumplimiento. Interpreta speak-up con confianza, calidad de investigación y contexto."
evidence_signals:
  - "hotline usage"
  - "substantiation rate"
  - "retaliation allegations"
  - "repeat violations"
  - "training effectiveness"
