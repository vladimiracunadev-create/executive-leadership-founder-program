<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g129 d-g129" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g129">Ficha visual de la clase 129: Pricing y concesiones</title>
<desc id="d-g129">Conceptos: list price; value-based pricing; discount; concession; price waterfall. Método: definir segmento y valor → calcular floor económico → establecer arquitectura y paquetes → crear reglas de descuento y give-get → medir realized price y pocket margin.</desc>
<defs><marker id="p-g129" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="602.36" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#8250df"/>
