<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s230 d-s230" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s230">Clase 230 · Digitalizar o tener una estrategia digital</title>
<desc id="d-s230">Diferencias entre digitalizar un proceso y definir una estrategia digital: pregunta, alcance y resultado esperado.</desc>
<defs><marker id="p-s230" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 230 · Digitalizar o tener una estrategia digital</text>
<text x="1012" y="43" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="end" >Westerman et al. · Iansiti &amp; Lakhani · Shapiro &amp; Varian</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Aspecto</text>
<text x="252.757" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Digitalizar</text>
<text x="611.784" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Estrategia digital</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Pregunta</text>
<text x="252.757" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Cómo hago este proceso en un sistema?</text>
<text x="611.784" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Cómo cambia la economía y la propuesta de valor?</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Alcance</text>
<text x="252.757" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Un proceso o una función.</text>
<text x="611.784" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Clientes, modelo de negocio y operación.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Resultado</text>
<text x="252.757" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Menos papel y menos errores.</text>
<text x="611.784" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Costos, ingresos o ventajas distintas.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Riesgo</text>
<text x="252.757" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Automatizar desperdicio.</text>
<text x="611.784" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Competir con reglas que otros dominan.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Responsable</text>
<text x="252.757" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Tecnología o el área usuaria.</text>
<text x="611.784" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >El comité de dirección.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La estrategia digital parte de la estrategia de la empresa y del recorrido del cliente, y elige dónde la tecnología cambia la economía.</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Digitalizar un mal proceso solo automatiza el desperdicio.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Rediseñar el proceso y la decisión va antes o junto con la tecnología.</text>
</svg>
