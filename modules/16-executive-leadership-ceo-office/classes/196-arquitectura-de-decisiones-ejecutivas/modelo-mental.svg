<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 606.12" width="1040" role="img" aria-labelledby="t-g196 d-g196" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g196">Ficha visual de la clase 196: Arquitectura de decisiones ejecutivas</title>
<desc id="d-g196">Conceptos: decision architecture; reversibility; decision velocity; exception; delegation boundary. Método: inventariar decisiones materiales → clasificar reversibilidad y frecuencia → asignar owner y autoridad → diseñar pre-read y foro → medir latencia overrides y calidad.</desc>
<defs><marker id="p-g196" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
