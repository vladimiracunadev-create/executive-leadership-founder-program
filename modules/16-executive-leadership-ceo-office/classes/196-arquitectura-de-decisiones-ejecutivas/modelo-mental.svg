<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456.06" width="1040" role="img" aria-labelledby="t-s196 d-s196" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s196">Clase 196 · Qué foro y qué autoridad según reversibilidad</title>
<desc id="d-s196">Cuadrante de reversibilidad de la decisión y materialidad para asignar foro, dueño y nivel de revisión.</desc>
<defs><marker id="p-s196" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="456.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 196 · Qué foro y qué autoridad según reversibilidad</text>
<text x="1012" y="43" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="end" >Mankins &amp; Garton · Kahneman et al. (Noise) · Duke</text>
<text x="362.5" y="100" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >Reversible</text>
<text x="799.5" y="100" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >Irreversible</text>
<text transform="translate(120,160.25) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">Alta materialidad</text>
<text transform="translate(120,268.75) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">Baja materialidad</text>
<rect x="150" y="112" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="150.0" y="112.0" width="425.0" height="34" rx="12" fill="#0969da"/>
<text x="166" y="135" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Decidir rápido y revisar</text>
<text x="166" y="170" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Alta materialidad y reversible: un dueño decide pronto y</text>
<text x="166" y="187.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >se corrige con datos.</text>
<rect x="587" y="112" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<rect x="587.0" y="112.0" width="425.0" height="34" rx="12" fill="#cf222e"/>
<text x="603" y="135" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Foro ejecutivo con desafío</text>
<text x="603" y="170" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Alta materialidad e irreversible: pre-lectura, desafío</text>
<text x="603" y="187.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >independiente y registro.</text>
<rect x="150" y="220.5" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="150.0" y="220.5" width="425.0" height="34" rx="12" fill="#1a7f37"/>
<text x="166" y="243.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Delegar con límites</text>
<text x="166" y="278.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Baja materialidad y reversible: el equipo decide dentro</text>
<text x="166" y="295.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >de reglas conocidas.</text>
<rect x="587" y="220.5" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<rect x="587.0" y="220.5" width="425.0" height="34" rx="12" fill="#bc4c00"/>
<text x="603" y="243.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Regla y revisión del dueño</text>
<text x="603" y="278.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Baja materialidad e irreversible: una regla clara y una</text>
<text x="603" y="295.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >revisión periódica.</text>
<rect x="28" y="329" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="351" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La arquitectura de decisiones asigna a cada decisión un dueño, un foro y un criterio de revisión. Sin ella, todo sube al CEO o se</text>
<text x="44" y="368.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >decide en cualquier parte.</text>
<text x="28" y="415.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Delegar exige contexto, datos y límites; el permiso por sí solo aumenta el riesgo.</text>
</svg>
