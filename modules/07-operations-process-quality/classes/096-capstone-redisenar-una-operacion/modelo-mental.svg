<title id="t-g96">Ficha visual de la clase 096: Capstone: rediseñar una operación</title>
<desc id="d-g96">Conceptos: target operating model; baseline; future state; benefit case; transition plan. Método: medir baseline end-to-end → identificar constraint y causas → diseñar future state → calcular beneficio y riesgos → pilotear, migrar y estabilizar.</desc>
