id: 32
part: 02
title: "Conflicto productivo"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir conflicto de tarea de conflicto relacional mediante evidencia observable."
  - "Aplicar la secuencia: nombrar tema y objetivo común → separar persona de argumento → pedir evidencia y alternativa → usar un decisor o regla de cierre → registrar decisión y desacuerdo residual."
  - "Interpretar ideas alternativas consideradas, decisiones reabiertas, ataques personales sin atribuir causalidad automática."
  - "Resolver el caso de conflicto productivo con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Robert B. Cialdini — *Influence*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Nancy Duarte — *Resonate*"
  - "Dale Carnegie — *How to Win Friends and Influence People*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
limits:
  - "No todos los desacuerdos merecen consenso. La organización necesita derechos de decisión claros; debate abierto sin mecanismo de cierre consume energía y crea ambigüedad."
evidence_signals:
  - "ideas alternativas consideradas"
  - "decisiones reabiertas"
  - "ataques personales"
  - "participación desigual"
  - "tiempo hasta commitment"
