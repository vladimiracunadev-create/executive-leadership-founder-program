<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616.48" width="1040" role="img" aria-labelledby="t-g241 d-g241" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g241">Ficha visual de la clase 241: Founder versus freelance versus empresario</title>
<desc id="d-g241">Conceptos: freelancer; founder; business owner; self-employment; scalability. Método: definir objetivo personal y económico → mapear dependencia de tiempo → identificar activos acumulables → comparar riesgo y capital → seleccionar modelo y transición.</desc>
<defs><marker id="p-g241" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="616.48" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#59636e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 241 · Founder versus freelance versus empresario</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 20 · Fundador, propietario e independencia</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#59636e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >freelancer</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >persona que vende servicios profesionales directamente</text>
<circle cx="38" cy="170" r="5" fill="#59636e"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >founder</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >persona que crea y asume riesgo inicial de una nueva</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >empresa</text>
<circle cx="38" cy="242.12" r="5" fill="#59636e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >business owner</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >propietario de un sistema empresarial que puede operar</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >con otros líderes</text>
<circle cx="38" cy="314.24" r="5" fill="#59636e"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >self-employment</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trabajo por cuenta propia donde ingreso depende</text>
<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >fuertemente del trabajo personal</text>
<circle cx="38" cy="386.36" r="5" fill="#59636e"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >scalability</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad de crecer output o ingresos sin crecimiento</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >proporcional de esfuerzo</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#59636e"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >definir objetivo personal y</text>
<text x="504" y="373.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >económico</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#59636e"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >mapear dependencia de tiempo</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#59636e"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >identificar activos acumulables</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#59636e"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >comparar riesgo y capital</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#59636e"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >seleccionar modelo y transición</text>
<text x="28" y="472.48" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="484.48" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="41" cy="497.48" r="3.5" fill="#59636e"/>
<text x="52" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >revenue per owner hour</text>
<rect x="215.8" y="484.48" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="228.8" cy="497.48" r="3.5" fill="#59636e"/>
<text x="239.8" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >recurring revenue</text>
<rect x="369.1" y="484.48" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="382.1" cy="497.48" r="3.5" fill="#59636e"/>
<text x="393.1" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >owner dependency</text>
<rect x="515.5" y="484.48" width="108.8" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="528.5" cy="497.48" r="3.5" fill="#59636e"/>
<text x="539.5" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >gross margin</text>
<rect x="634.3" y="484.48" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="647.3" cy="497.48" r="3.5" fill="#59636e"/>
<text x="658.3" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >customer concentration</text>
<rect x="28" y="530.48" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="530.48" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="550.48" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="568.48" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No existe jerarquía moral: un freelance rentable puede ser mejor que una startup de alto burn. El modelo debe alinearse con metas,</text>
<text x="48" y="585.73" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >riesgo y estilo de vida.</text>
</svg>
