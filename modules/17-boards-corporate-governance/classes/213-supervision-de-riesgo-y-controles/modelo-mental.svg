<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 213 · Supervisar riesgos sin gestionarlos</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >COSO · NIST CSF 2.0 · Cialdini</text>
