id: 268
part: 22
title: "Escalar ventas sin destruir margen"
duration_minutes: 150
level: "Etapa 6 — Business Owner"
outcome: "reducir dependencia del fundador mediante sistemas, líderes, controles y gobierno proporcional"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir sales scale de contribution margin mediante evidencia observable."
  - "Aplicar la secuencia: segmentar revenue y margin → identificar sales motion repetible → estandarizar pricing y discounts → reducir custom delivery → escalar capacity según unit economics."
  - "Interpretar contribution margin, discount rate, CAC payback sin atribuir causalidad automática."
  - "Resolver el caso de escalar ventas sin destruir margen con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Michael E. Gerber — *The E-Myth Revisited*"
  - "Verne Harnish — *Scaling Up*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Robert I. Sutton & Huggy Rao — *Scaling Up Excellence*"
  - "Elad Gil — *High Growth Handbook*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
limits:
  - "Estandarizar demasiado pronto puede perder clientes estratégicos. Acepta custom work cuando compra aprendizaje o ventaja, pero cuantifica costo y criterio de salida."
evidence_signals:
  - "contribution margin"
  - "discount rate"
  - "CAC payback"
  - "cost-to-serve"
  - "custom work share"
