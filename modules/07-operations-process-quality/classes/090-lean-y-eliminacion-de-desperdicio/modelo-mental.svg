<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 498.42" width="1040" role="img" aria-labelledby="t-s90 d-s90" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s90">Clase 090 · Seis formas de desperdicio y cómo se reconocen</title>
<desc id="d-s90">Seis tipos de desperdicio de la tradición lean con una señal observable y un ejemplo de servicio u operación.</desc>
<defs><marker id="p-s90" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="498.42" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 090 · Seis formas de desperdicio y cómo se reconocen</text>
<text x="1012" y="43" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="end" >Ohno (1988) · Womack &amp; Jones · Rother &amp; Shook (1999)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Desperdicio</text>
<text x="274.286" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Señal observable</text>
<text x="633.524" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Ejemplo de oficina o servicio</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Espera</text>
<text x="274.286" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Trabajo detenido esperando una acción.</text>
<text x="633.524" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Una solicitud espera tres días la firma.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Defectos y retrabajo</text>
<text x="274.286" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se repite algo que ya se hizo.</text>
<text x="633.524" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se corrige un informe tres veces.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Sobreproducción</text>
<text x="274.286" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se hace más de lo que se necesita ahora.</text>
<text x="633.524" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Reportes que nadie lee.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Inventario</text>
<text x="274.286" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Trabajo acumulado entre pasos.</text>
<text x="633.524" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cola de pedidos sin procesar.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Movimiento y transporte</text>
<text x="274.286" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Idas y vueltas innecesarias.</text>
<text x="633.524" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Traspasos entre cuatro áreas.</text>
<rect x="28" y="318.8" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="338.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Sobreprocesamiento</text>
<text x="274.286" y="338.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Más pasos de los que el cliente valora.</text>
<text x="633.524" y="338.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cinco aprobaciones para un gasto menor.</text>
<rect x="28" y="371.36" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="393.36" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Valor es lo que el cliente reconocería y pagaría. El desperdicio se identifica en el mapa de flujo de valor, observando donde el</text>
<text x="44" y="410.61" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >trabajo espera, no donde se trabaja.</text>
<text x="28" y="457.86" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Lean no es recorte: la capacidad protectora y la seguridad no son desperdicio, aunque parezcan holgura.</text>
</svg>
