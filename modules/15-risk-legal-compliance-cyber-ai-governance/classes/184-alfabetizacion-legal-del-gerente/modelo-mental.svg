<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 491.54" width="1040" role="img" aria-labelledby="t-s184 d-s184" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s184">Clase 184 · Cuándo escalar al área legal</title>
<desc id="d-s184">Situaciones de distinta complejidad, quién decide, qué se documenta y señales para escalar a asesoría legal.</desc>
<defs><marker id="p-s184" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="491.54" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 184 · Cuándo escalar al área legal</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Fuentes oficiales · asesoría legal</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Situación</text>
<text x="260.105" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Quién decide</text>
<text x="467.263" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué se documenta</text>
<text x="713.263" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Señal para escalar</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Rutinaria con plantilla</text>
<text x="40" y="172.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >aprobada</text>
<text x="260.105" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >El gerente dentro de su</text>
<text x="260.105" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >límite.</text>
<text x="467.263" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Versión de la plantilla usada.</text>
<text x="713.263" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cualquier cambio de cláusulas esenciales.</text>
<rect x="28" y="189.12" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Variación de condiciones</text>
<text x="260.105" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Gerente con visto bueno del</text>
<text x="260.105" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >área legal.</text>
<text x="467.263" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué cambió, por qué y riesgo</text>
<text x="467.263" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >asumido.</text>
<text x="713.263" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Responsabilidad, datos o plazos fuera del</text>
<text x="713.263" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >estándar.</text>
<rect x="28" y="242.24" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="262.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Nueva obligación o regulación</text>
<text x="260.105" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Comité con asesoría legal.</text>
<text x="467.263" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Fuente oficial consultada y</text>
<text x="467.263" y="278.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >fecha.</text>
<text x="713.263" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Duda sobre vigencia o alcance de la norma.</text>
<rect x="28" y="295.36" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="315.36" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Disputa o requerimiento de</text>
<text x="40" y="331.92" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >una autoridad</text>
<text x="260.105" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dirección con asesoría</text>
<text x="260.105" y="331.92" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >especializada.</text>
<text x="467.263" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cronología, comunicaciones y</text>
<text x="467.263" y="331.92" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >plazos.</text>
<text x="713.263" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cualquier notificación formal: se escala de</text>
<text x="713.263" y="331.92" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >inmediato.</text>
<rect x="28" y="364.48" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="386.48" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El gerente no sustituye a un abogado: reconoce cuándo hay un tema legal, reúne los hechos y escala a tiempo con una pregunta bien</text>
<text x="44" y="403.73" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >formulada.</text>
<text x="28" y="450.98" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las normas cambian; toda decisión con efecto legal se verifica en la fuente oficial vigente y con asesoría.</text>
</svg>
