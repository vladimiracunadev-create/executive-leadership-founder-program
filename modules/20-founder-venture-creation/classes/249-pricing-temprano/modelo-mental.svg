<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g249 d-g249" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g249">Ficha visual de la clase 249: Pricing temprano</title>
<desc id="d-g249">Conceptos: price; value metric; willingness to pay; price sensitivity; discount. Método: estimar alternatives y value → proponer 2 o 3 price points → testear con compra real → analizar objections y segment → refinar package y value metric.</desc>
<defs><marker id="p-g249" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#59636e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 249 · Pricing temprano</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 20 · Fundador, propietario e independencia</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#59636e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >price</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >intercambio monetario exigido por la oferta</text>
<circle cx="38" cy="170" r="5" fill="#59636e"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >value metric</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >unidad según la cual precio escala con valor o uso</text>
<circle cx="38" cy="228" r="5" fill="#59636e"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >willingness to pay</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >máximo que un cliente considera razonable pagar</text>
<circle cx="38" cy="286" r="5" fill="#59636e"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >price sensitivity</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cambio de demanda frente a cambios de precio</text>
<circle cx="38" cy="344" r="5" fill="#59636e"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >discount</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >reducción deliberada que debe tener propósito y límite</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#59636e"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >estimar alternatives y value</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#59636e"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >proponer 2 o 3 price points</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#59636e"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >testear con compra real</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#59636e"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >analizar objections y segment</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#59636e"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >refinar package y value metric</text>
<text x="28" y="416" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="428" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="41" cy="441" r="3.5" fill="#59636e"/>
<text x="52" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >close rate by price</text>
<rect x="195.1" y="428" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="208.1" cy="441" r="3.5" fill="#59636e"/>
<text x="219.1" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >discount rate</text>
<rect x="320.8" y="428" width="53.6" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="333.8" cy="441" r="3.5" fill="#59636e"/>
<text x="344.8" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >ARPA</text>
<rect x="384.4" y="428" width="108.8" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="397.4" cy="441" r="3.5" fill="#59636e"/>
<text x="408.4" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >gross margin</text>
<rect x="503.2" y="428" width="88.1" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="516.2" cy="441" r="3.5" fill="#59636e"/>
<text x="527.2" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >expansion</text>
<rect x="28" y="474" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="474" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="494" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="512" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Precios tempranos tienen muestras pequeñas y sesgo. No extrapoles elasticidad; usa experimentos éticos y coherencia contractual entre</text>
<text x="48" y="529.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >clientes.</text>
</svg>
