<circle cx="38" cy="170" r="5" fill="#59636e"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >treasury</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >gestión de caja pagos cobros y liquidez</text>
<circle cx="38" cy="228" r="5" fill="#59636e"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >reconciliation</text>
