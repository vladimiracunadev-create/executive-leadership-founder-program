id: 90
part: 07
title: "Lean y eliminación de desperdicio"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "operar procesos end-to-end con capacidad, calidad, continuidad y mejora"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir valor de waste mediante evidencia observable."
  - "Aplicar la secuencia: definir valor desde cliente → mapear value stream → identificar espera, defectos y exceso → reducir lotes y crear pull → estandarizar mejora y repetir."
  - "Interpretar lead time, first-pass yield, WIP sin atribuir causalidad automática."
  - "Resolver el caso de lean y eliminación de desperdicio con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Nigel Slack & Alistair Brandon-Jones — *Operations Management*"
  - "Eliyahu M. Goldratt & Jeff Cox — *The Goal*"
  - "Geary A. Rummler & Alan P. Brache — *Improving Performance*"
  - "James P. Womack, Daniel T. Jones & Daniel Roos — *The Machine That Changed the World*"
  - "ISO — *ISO 22301 Business continuity management systems*"
  - "James P. Womack & Daniel T. Jones — *Lean Thinking*"
limits:
  - "Lean no es austeridad. Eliminar capacidad protectora sin comprender variabilidad puede hacer el sistema frágil; seguridad y calidad no son desperdicio."
evidence_signals:
  - "lead time"
  - "first-pass yield"
  - "WIP"
  - "rework"
  - "porcentaje de valor agregado"
