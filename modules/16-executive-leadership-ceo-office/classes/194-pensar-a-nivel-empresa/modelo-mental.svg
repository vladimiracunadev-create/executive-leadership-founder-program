<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 488.06" width="1040" role="img" aria-labelledby="t-s194 d-s194" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s194">Clase 194 · Pensar a nivel empresa en cinco movimientos</title>
<desc id="d-s194">Cinco movimientos: mapear los motores de valor, ver restricciones, comparar impactos entre funciones, equilibrar corto y largo plazo, y decidir y comunicar el trade-off.</desc>
<defs><marker id="p-s194" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
