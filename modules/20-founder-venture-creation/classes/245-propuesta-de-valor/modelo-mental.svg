<title id="t-g245">Ficha visual de la clase 245: Propuesta de valor</title>
<desc id="d-g245">Conceptos: value proposition; gain; pain reliever; differentiator; proof. Método: priorizar job o pain → mapear alternativas actuales → diseñar beneficio y mecanismo → probar mensaje y proof → cuantificar value y trade-offs.</desc>
