<text x="880" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >diseñar MVP mínimo</text>
<text x="880" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >viable</text>
