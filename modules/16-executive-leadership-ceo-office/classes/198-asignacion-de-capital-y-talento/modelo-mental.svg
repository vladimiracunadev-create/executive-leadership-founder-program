<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g198 d-g198" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g198">Ficha visual de la clase 198: Asignación de capital y talento</title>
<desc id="d-g198">Conceptos: capital allocation; talent allocation; sunk cost; hurdle rate; strategic capacity. Método: inventariar usos de capital y talento → estimar retorno riesgo y strategic fit → comparar contra hurdle y alternativas → reallocate desde bajo valor → revisar outcomes y kill decisions.</desc>
