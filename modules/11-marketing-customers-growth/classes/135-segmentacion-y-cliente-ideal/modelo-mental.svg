<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474.98" width="1040" role="img" aria-labelledby="t-s135 d-s135" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s135">Clase 135 · Cuatro criterios para segmentar y cuándo sirve cada uno</title>
<desc id="d-s135">Criterios de segmentación: qué agrupan, cuándo son útiles y su riesgo.</desc>
<defs><marker id="p-s135" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="474.98" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 135 · Cuatro criterios para segmentar y cuándo sirve cada uno</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Kotler &amp; Keller · Moore (2014) · Christensen et al.</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Criterio</text>
<text x="236.8" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Agrupa por</text>
<text x="472.96" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Es útil cuando</text>
<text x="761.6" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Riesgo</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Demográfico o firmográfico</text>
<text x="236.8" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Edad, ingreso, sector, tamaño.</text>
<text x="472.96" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Hay que llegar al segmento con canales.</text>
<text x="761.6" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Personas distintas con el mismo</text>
<text x="761.6" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >perfil.</text>
<rect x="28" y="189.12" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Geográfico</text>
<text x="236.8" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >País, región, ciudad.</text>
<text x="472.96" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >La logística o la regulación cambian.</text>
<text x="761.6" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Ignora diferencias dentro de la</text>
<text x="761.6" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >zona.</text>
<rect x="28" y="242.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="262.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Comportamental</text>
<text x="236.8" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Uso, frecuencia, lealtad, canal.</text>
<text x="472.96" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Los hábitos predicen valor.</text>
<text x="761.6" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Describe, no explica por qué.</text>
<rect x="28" y="278.8" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="298.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >De necesidades (trabajo a</text>
<text x="40" y="315.36" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >realizar)</text>
<text x="236.8" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >El problema que se quiere</text>
<text x="236.8" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >resolver.</text>
<text x="472.96" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se quiere diferenciar la propuesta.</text>
<text x="761.6" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Más difícil de identificar y</text>
<text x="761.6" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >alcanzar.</text>
<rect x="28" y="347.92" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="369.92" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Una buena segmentación combina un criterio que permite llegar al cliente con otro que explique por qué compra. Los segmentos se eligen</text>
<text x="44" y="387.17" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >por tamaño, accesibilidad, valor y ajuste con la propuesta.</text>
<text x="28" y="434.42" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La segmentación basada en rasgos personales sensibles debe respetar las normas de protección de datos y de no discriminación.</text>
</svg>
