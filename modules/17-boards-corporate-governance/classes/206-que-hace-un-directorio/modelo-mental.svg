<text x="555" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="575" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Información mínima</text>
<text x="547" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Lo necesario para decidir, a</text>
<text x="547" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >tiempo.</text>
