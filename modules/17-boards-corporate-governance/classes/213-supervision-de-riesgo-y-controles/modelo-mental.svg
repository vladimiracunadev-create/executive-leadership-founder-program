<title id="t-s213">Clase 213 · Supervisar riesgos sin gestionarlos</title>
<desc id="d-s213">Tres bloques de la supervisión de riesgos por el directorio: apetito y riesgos principales, controles críticos y aseguramiento independiente.</desc>
<defs><marker id="p-s213" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
