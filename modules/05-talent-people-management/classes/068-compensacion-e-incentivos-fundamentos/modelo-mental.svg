<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 508.56" width="1040" role="img" aria-labelledby="t-s68 d-s68" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s68">Clase 068 · Equidad percibida y efecto de los incentivos</title>
<desc id="d-s68">Dos paneles: cómo se juzga la equidad de una compensación y qué efectos tienen los incentivos monetarios sobre la conducta y la motivación.</desc>
<defs><marker id="p-s68" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="508.56" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 068 · Equidad percibida y efecto de los incentivos</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Adams (1963) · Deci, Koestner &amp; Ryan (1999) · Gneezy &amp; Rustichini (2000)</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">EQUIDAD SEGÚN ADAMS</text>
<rect x="28" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Aporte frente a resultado</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Las personas comparan lo que aportan con lo que reciben.</text>
<rect x="28" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.7" />
<rect x="28.0" y="177.25" width="6" height="63.25" rx="3" fill="#8250df"/>
<text x="46" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Con quién se comparan</text>
<text x="46" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Con pares, con el mercado y con su propio pasado.</text>
<rect x="28" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="28.0" y="250.5" width="6" height="63.25" rx="3" fill="#cf222e"/>
<text x="46" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Qué hacen si perciben inequidad</text>
<text x="46" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Reducen el esfuerzo, piden un cambio o se van.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">INCENTIVOS: LO QUE MUESTRA LA EVIDENCIA</text>
<rect x="532" y="104" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="80.5" rx="3" fill="#bc4c00"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Recompensas tangibles contingentes</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >En el metaanálisis de Deci et al., tendieron a reducir la</text>
<text x="550" y="161.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >motivación intrínseca.</text>
<rect x="532" y="194.5" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="532.0" y="194.5" width="6" height="80.5" rx="3" fill="#59636e"/>
<text x="550" y="216.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Una multa puede ser un precio</text>
<text x="550" y="234.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >En una guardería, cobrar multa por retraso aumentó los</text>
<text x="550" y="251.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >retrasos.</text>
<rect x="532" y="285" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="532.0" y="285.0" width="6" height="80.5" rx="3" fill="#1a7f37"/>
<text x="550" y="307" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Incentivo y resultado</text>
<text x="550" y="325" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se premia lo que se mide: pueden descuidarse lo no medido y la</text>
<text x="550" y="342.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >calidad.</text>
<rect x="28" y="381.5" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="403.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Un sistema de compensación comunica qué valora la organización. Antes de premiar una conducta, conviene preguntarse qué otra conducta</text>
<text x="44" y="420.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >incentivará sin querer.</text>
<text x="28" y="468" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los resultados varían por tipo de tarea y de recompensa; las normas de remuneración se verifican con asesoría.</text>
</svg>
