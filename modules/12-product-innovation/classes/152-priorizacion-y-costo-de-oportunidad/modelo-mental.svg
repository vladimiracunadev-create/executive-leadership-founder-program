<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 458.42" width="1040" role="img" aria-labelledby="t-s152 d-s152" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s152">Clase 152 · Cuatro perfiles de costo del retraso para ordenar el trabajo</title>
<desc id="d-s152">Perfiles de costo del retraso: cómo crece la pérdida al aplazar, un ejemplo y qué implica para la prioridad.</desc>
<defs><marker id="p-s152" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="458.42" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 152 · Cuatro perfiles de costo del retraso para ordenar el trabajo</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Reinertsen (2009) · Perri (2018)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Perfil</text>
<text x="225.391" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cómo crece la pérdida al aplazar</text>
<text x="539.13" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Ejemplo</text>
<text x="824.348" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Prioridad</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Urgente (expedite)</text>
<text x="225.391" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Alta y creciente cada día.</text>
<text x="539.13" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Falla que bloquea ventas.</text>
<text x="824.348" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Primero.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Fecha fija</text>
<text x="225.391" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Pequeña hasta la fecha; cae a cero después.</text>
<text x="539.13" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cumplimiento regulatorio con plazo.</text>
<text x="824.348" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Antes de la fecha.</text>
<rect x="28" y="209.12" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Estándar</text>
<text x="225.391" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Constante por semana.</text>
<text x="539.13" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Función que genera ingresos</text>
<text x="539.13" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >recurrentes.</text>
<text x="824.348" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Por valor sobre duración.</text>
<rect x="28" y="262.24" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="282.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Intangible</text>
<text x="225.391" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Baja al inicio y alta después.</text>
<text x="539.13" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Deuda técnica, capacidad.</text>
<text x="824.348" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Programar antes del punto</text>
<text x="824.348" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >crítico.</text>
<rect x="28" y="331.36" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="353.36" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Reinertsen propone ordenar por costo del retraso dividido por la duración: se hace antes lo que más pierde por semana de espera y menos</text>
<text x="44" y="370.61" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >tarda en hacerse.</text>
<text x="28" y="417.86" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las estimaciones de costo del retraso son juicios: se explicitan sus supuestos y se discuten entre áreas.</text>
</svg>
