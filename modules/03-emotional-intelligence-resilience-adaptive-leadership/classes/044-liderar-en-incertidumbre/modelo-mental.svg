<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g44 d-g44" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g44">Ficha visual de la clase 044: Liderar en incertidumbre</title>
<desc id="d-g44">Conceptos: ambigüedad; incertidumbre; orientación; trigger; cadencia de actualización. Método: declarar qué se sabe y no → definir norte y no microplan falso → establecer decisiones reversibles → crear triggers y cadencia → actualizar narrativa cuando cambia evidencia.</desc>
