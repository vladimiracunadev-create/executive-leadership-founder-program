id: 55
part: 04
title: "One-on-ones que producen información"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "crear equipos con propósito, coordinación, confianza, aprendizaje y accountability"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Explicar el propósito de la reunión uno a uno y qué la distingue de un informe de estado."
  - "Estructurar una reunión con tres bloques: agenda de la persona, desempeño y desarrollo, y compromisos."
  - "Formular preguntas que obtengan información que el colaborador no ofrecería de otro modo."
  - "Mantener la regularidad y la confidencialidad que la sostienen."
  - "Detectar señales tempranas de desmotivación, conflicto o sobrecarga."
deliverable: "one-on-one.md"
references:
  - "Andrew S. Grove — *High Output Management*"
  - "Kim Scott — *Radical Candor*"
  - "Michael Bungay Stanier — *The Coaching Habit*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "Douglas Stone & Sheila Heen — *Thanks for the Feedback*"
limits:
  - "Las recomendaciones de Grove provienen de su experiencia en gestión y no de estudios sistemáticos; la frecuencia ideal depende del rol y de la madurez de la persona."
evidence_signals:
  - "regularidad del uno a uno"
  - "agenda de la persona primero"
  - "señales tempranas detectadas"
  - "compromisos de ambos cumplidos"
