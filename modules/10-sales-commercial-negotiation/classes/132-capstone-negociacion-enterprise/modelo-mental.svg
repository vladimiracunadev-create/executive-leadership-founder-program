<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >negotiation plan</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >documento con intereses, BATNA, targets, issues y</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >estrategia</text>
<circle cx="38" cy="184.12" r="5" fill="#8250df"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >economic buyer</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >rol con autoridad económica final según contexto</text>
<circle cx="38" cy="242.12" r="5" fill="#8250df"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >give-get</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >concesión condicionada a recibir valor equivalente o</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >estratégico</text>
<circle cx="38" cy="314.24" r="5" fill="#8250df"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >redline</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >condición contractual o económica que no se acepta</text>
<circle cx="38" cy="372.24" r="5" fill="#8250df"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >walk-away</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >decisión de usar BATNA cuando el acuerdo cae bajo</text>
<text x="54" y="411.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >límite</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
