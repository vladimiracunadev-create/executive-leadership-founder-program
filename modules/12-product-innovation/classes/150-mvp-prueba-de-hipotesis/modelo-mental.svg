<text x="48" y="536.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="554.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un MVP no justifica exponer usuarios a inseguridad, incumplimiento o daño. En dominios regulados, la mínima versión debe respetar</text>
<text x="48" y="571.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >controles no negociables aunque eso aumente el costo.</text>
