<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >proyecto</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >esfuerzo temporal para crear un resultado definido</text>
<circle cx="38" cy="170" r="5" fill="#0969da"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >producto</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >activo o servicio gestionado durante un ciclo de valor</text>
<circle cx="38" cy="228" r="5" fill="#0969da"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >operación</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trabajo recurrente que mantiene una capacidad</text>
<circle cx="38" cy="286" r="5" fill="#0969da"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >programa</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >coordinación de proyectos y actividades relacionadas</text>
<text x="54" y="325.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >para beneficios conjuntos</text>
