<text x="518" y="236" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >3</text>
<text x="538" y="236" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >agrupar razones en 2–4 argumentos</text>
