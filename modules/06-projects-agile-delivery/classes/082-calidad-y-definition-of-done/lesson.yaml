id: 82
part: 06
title: "Calidad y Definition of Done"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir criterios de aceptación, definición de hecho y definición de listo."
  - "Redactar una definición de hecho verificable."
  - "Explicar por qué la calidad se construye en el proceso y no se inspecciona al final."
  - "Reconocer la deuda de calidad y sus costos."
  - "Usar listas de verificación y automatización para sostener la calidad."
deliverable: "operating-improvement-brief.md"
references:
  - "Ken Schwaber & Jeff Sutherland — *The Scrum Guide*"
  - "Nicole Forsgren, Jez Humble & Gene Kim — *Accelerate*"
  - "Atul Gawande — *The Checklist Manifesto*"
  - "W. Edwards Deming — *Out of the Crisis*"
  - "ISO — *ISO 9001 Quality management systems*"
limits:
  - "Una definición de hecho no garantiza calidad si los criterios son superficiales o si se cumplen de manera formal."
evidence_signals:
  - "definición de hecho acordada"
  - "verificaciones automatizadas"
  - "deuda registrada"
  - "calidad como criterio de decisión"
