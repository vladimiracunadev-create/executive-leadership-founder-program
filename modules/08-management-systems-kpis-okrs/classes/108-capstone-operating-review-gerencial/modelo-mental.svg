<title id="t-s108">Clase 108 · Un ciclo gerencial completo: preparar, conducir, cerrar</title>
<desc id="d-s108">Tres tramos del capstone: preparación del tablero y de la agenda, conducción de la revisión y cierre con decisiones y seguimiento.</desc>
<defs><marker id="p-s108" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
