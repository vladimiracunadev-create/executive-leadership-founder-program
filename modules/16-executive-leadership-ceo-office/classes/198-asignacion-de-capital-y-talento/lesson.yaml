id: 198
part: 16
title: "Asignación de capital y talento"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir capital allocation de talent allocation mediante evidencia observable."
  - "Aplicar la secuencia: inventariar usos de capital y talento → estimar retorno riesgo y strategic fit → comparar contra hurdle y alternativas → reallocate desde bajo valor → revisar outcomes y kill decisions."
  - "Interpretar ROIC, talent on top priorities, capital reallocation rate sin atribuir causalidad automática."
  - "Resolver el caso de asignación de capital y talento con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Ben Horowitz — *The Hard Thing About Hard Things*"
  - "Matt Mochary — *The Great CEO Within*"
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
  - "Larry Bossidy & Ram Charan — *Execution*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
  - "Ram Charan, Stephen Drotter & James Noel — *The Leadership Pipeline*"
limits:
  - "No reduzcas allocation a NPV cuando existen opciones estratégicas, capabilities o impactos difíciles de monetizar. Haz explícitas esas consideraciones en vez de ocultarlas en el cálculo."
evidence_signals:
  - "ROIC"
  - "talent on top priorities"
  - "capital reallocation rate"
  - "payback"
  - "portfolio concentration"
