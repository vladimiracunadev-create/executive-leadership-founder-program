<text x="485" y="343.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >probar market frame y mensaje</text>
