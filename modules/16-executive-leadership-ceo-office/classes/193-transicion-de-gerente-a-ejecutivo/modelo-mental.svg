<title id="t-g193">Ficha visual de la clase 193: Transición de gerente a ejecutivo</title>
<desc id="d-g193">Conceptos: enterprise perspective; transition; stakeholder map; learning agenda; early win. Método: diagnosticar mandato y contexto → construir learning agenda → mapear stakeholders y equipo → distinguir decisiones enterprise → secuenciar early wins y cambios estructurales.</desc>
