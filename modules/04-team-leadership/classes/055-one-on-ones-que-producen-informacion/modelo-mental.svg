<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 384.81" width="1040" role="img" aria-labelledby="t-s55 d-s55" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s55">Clase 055 · Una reunión uno a uno que produce información</title>
<desc id="d-s55">Tres bloques de una reunión uno a uno: lo que trae la persona, desempeño y desarrollo, y compromisos.</desc>
<defs><marker id="p-s55" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="384.81" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 055 · Una reunión uno a uno que produce información</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Grove (1983) · Scott (2017)</text>
<rect x="28" y="96" width="314.667" height="145.75" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M28.0,136 V108 a12,12 0 0 1 12,-12 H330.6666666666667 a12,12 0 0 1 12,12 V136 Z" fill="#0969da"/>
<text x="44" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Primero, su agenda</text>
<circle cx="50.0" cy="154" r="4" fill="#0969da"/>
<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >La persona elige los temas.</text>
<circle cx="50.0" cy="181.25" r="4" fill="#0969da"/>
<text x="64" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Obstáculos y decisiones que necesita.</text>
<circle cx="50.0" cy="208.5" r="4" fill="#0969da"/>
<text x="64" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >El líder escucha antes de hablar.</text>
<rect x="362.667" y="96" width="314.667" height="145.75" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M362.6666666666667,136 V108 a12,12 0 0 1 12,-12 H665.3333333333334 a12,12 0 0 1 12,12 V136 Z" fill="#1a7f37"/>
<text x="378.667" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Después, desempeño y desarrollo</text>
<circle cx="384.6666666666667" cy="154" r="4" fill="#1a7f37"/>
<text x="398.667" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Feedback concreto y oportuno.</text>
<circle cx="384.6666666666667" cy="181.25" r="4" fill="#1a7f37"/>
<text x="398.667" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Qué quiere aprender.</text>
<circle cx="384.6666666666667" cy="208.5" r="4" fill="#1a7f37"/>
<text x="398.667" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Cómo lo apoyas.</text>
<rect x="697.333" y="96" width="314.667" height="145.75" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M697.3333333333334,136 V108 a12,12 0 0 1 12,-12 H1000.0 a12,12 0 0 1 12,12 V136 Z" fill="#bc4c00"/>
<text x="713.333" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Cierra, con compromisos</text>
<circle cx="719.3333333333334" cy="154" r="4" fill="#bc4c00"/>
<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Qué hará cada uno.</text>
<circle cx="719.3333333333334" cy="181.25" r="4" fill="#bc4c00"/>
<text x="733.333" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Para cuándo.</text>
<circle cx="719.3333333333334" cy="208.5" r="4" fill="#bc4c00"/>
<text x="733.333" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Qué se revisará la próxima vez.</text>
<rect x="28" y="257.75" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="279.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Grove sostiene que la reunión es del subordinado: es el principal espacio de transferencia de conocimiento y de corrección entre jefe y</text>
<text x="44" y="297" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >colaborador. Una regularidad fija importa más que su duración.</text>
<text x="28" y="344.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La frecuencia y la duración dependen del rol y la madurez de la persona; no hay un ritmo universal.</text>
</svg>
