<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g236 d-g236" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g236">Ficha visual de la clase 236: Build, buy, partner o retire</title>
<desc id="d-g236">Conceptos: build; buy; partner; retire; TCO. Método: definir capability y diferenciación → modelar time y TCO → analizar control data y lock-in → evaluar talent e integration → decidir y diseñar exit strategy.</desc>
<defs><marker id="p-g236" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#cf222e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 236 · Build, buy, partner o retire</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 19 · Alta dirección y gobierno</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#cf222e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >build</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >desarrollar capacidad internamente</text>
<circle cx="38" cy="170" r="5" fill="#cf222e"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >buy</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >adquirir producto o servicio de mercado</text>
<circle cx="38" cy="228" r="5" fill="#cf222e"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >partner</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >compartir capacidad o riesgo con tercero</text>
<circle cx="38" cy="286" r="5" fill="#cf222e"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >retire</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >eliminar sistema o capability que ya no crea valor</text>
<circle cx="38" cy="344" r="5" fill="#cf222e"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >TCO</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >costo total de propiedad durante ciclo de vida</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#cf222e" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#cf222e"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >definir capability y diferenciación</text>
<circle cx="485" cy="176" r="14" fill="#cf222e"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >modelar time y TCO</text>
