id: 280
part: 23
title: "Productized services"
duration_minutes: 150
level: "Etapa 6 — Independencia"
outcome: "construir independencia mediante capacidades monetizables, sistemas comerciales y diversificación prudente"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir productized service de service package mediante evidencia observable."
  - "Aplicar la secuencia: identificar servicio repetido → definir ICP y outcome → estandarizar scope y process → fijar price y capacity → medir margin y exceptions."
  - "Interpretar delivery hours, gross margin, scope exception rate sin atribuir causalidad automática."
  - "Resolver el caso de productized services con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Peter F. Drucker — *The Effective Executive*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
  - "Cal Newport — *Deep Work*"
  - "Michael D. Watkins — *The First 90 Days*"
  - "Michael E. Gerber — *The E-Myth Revisited*"
limits:
  - "Estandarizar un problema complejo puede reducir calidad si clientes difieren demasiado. Mantén qualification fuerte y rechaza casos fuera del envelope."
evidence_signals:
  - "delivery hours"
  - "gross margin"
  - "scope exception rate"
  - "lead time"
  - "repeatability"
