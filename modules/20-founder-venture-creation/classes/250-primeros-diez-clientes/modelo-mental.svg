<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 488.06" width="1040" role="img" aria-labelledby="t-s250 d-s250" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s250">Clase 250 · Conseguir los primeros diez clientes</title>
<desc id="d-s250">Siete pasos de las primeras ventas: perfil ideal, lista, mensaje, conversación, cierre, incorporación y patrón.</desc>
<defs><marker id="p-s250" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
