<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 09 · Gestión de negocio</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#8250df"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >budget</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >plan aprobado que asigna recursos y objetivos</text>
<circle cx="38" cy="170" r="5" fill="#8250df"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >forecast</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >estimación actualizada basada en evidencia reciente</text>
<circle cx="38" cy="228" r="5" fill="#8250df"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >variance</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >diferencia entre actual y referencia</text>
<circle cx="38" cy="286" r="5" fill="#8250df"/>
