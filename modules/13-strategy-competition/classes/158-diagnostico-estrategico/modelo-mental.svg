<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474.98" width="1040" role="img" aria-labelledby="t-s158 d-s158" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s158">Clase 158 · Cuatro preguntas del diagnóstico estratégico</title>
<desc id="d-s158">Preguntas del diagnóstico, el dato que las responde y el error típico.</desc>
<defs><marker id="p-s158" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="474.98" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 158 · Cuatro preguntas del diagnóstico estratégico</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Porter · Rumelt · Lafley &amp; Martin</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Pregunta</text>
<text x="358.353" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué dato la responde</text>
<text x="705.647" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Error típico</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Qué cambió en el entorno?</text>
<text x="358.353" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Tendencias de clientes, tecnología, regulación y</text>
<text x="358.353" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >competencia.</text>
<text x="705.647" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Mirar solo el pasado propio.</text>
<rect x="28" y="189.12" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Cómo gana dinero la industria?</text>
<text x="358.353" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Márgenes por actor, fuerzas competitivas.</text>
<text x="705.647" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Confundir tamaño con rentabilidad.</text>
<rect x="28" y="225.68" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="245.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Qué hacemos mejor y por qué?</text>
<text x="358.353" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Resultados por cliente, producto y proceso.</text>
<text x="705.647" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Atribuir al azar o a la suerte lo que es</text>
<text x="705.647" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >capacidad.</text>
<rect x="28" y="278.8" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="298.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Cuál es el desafío crítico?</text>
<text x="358.353" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >El obstáculo que, si se supera, destraba lo</text>
<text x="358.353" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >demás.</text>
<text x="705.647" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Listar diez problemas sin jerarquía.</text>
<rect x="28" y="347.92" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="369.92" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Un buen diagnóstico simplifica: reduce la complejidad a un desafío sobre el cual se puede actuar. Un diagnóstico que lista todo no guía</text>
<text x="44" y="387.17" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >ninguna decisión.</text>
<text x="28" y="434.42" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los datos de industria y de clientes se contrastan con fuentes propias; los informes de terceros tienen sus propios sesgos.</text>
</svg>
