<text x="44" y="331.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Un plan de salida al mercado es un conjunto de hipótesis con métricas de éxito y de detención, no un calendario de actividades.</text>
<text x="28" y="378.75" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las cifras y plazos del capstone son ilustrativos; cada empresa fija los suyos con su caja y su capacidad.</text>
