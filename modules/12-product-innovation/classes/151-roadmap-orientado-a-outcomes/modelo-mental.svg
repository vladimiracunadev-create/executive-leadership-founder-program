<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g151 d-g151" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g151">Ficha visual de la clase 151: Roadmap orientado a outcomes</title>
<desc id="d-g151">Conceptos: roadmap; theme; commitment; now-next-later; roadmap confidence. Método: partir de objetivos estratégicos → traducirlos a outcomes y problemas → ordenar apuestas por valor y riesgo → expresar horizonte y confianza → revisar roadmap con evidencia y capacidad.</desc>
