<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g72 d-g72" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g72">Ficha visual de la clase 072: Capstone: construir un sistema de talento</title>
<desc id="d-g72">Conceptos: talent system; employee lifecycle; talent philosophy; governance; people analytics. Método: definir capacidades que exige estrategia → diseñar lifecycle coherente → asignar governance y datos → probar fairness y experiencia → instalar revisión trimestral del sistema.</desc>
<defs><marker id="p-g72" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
