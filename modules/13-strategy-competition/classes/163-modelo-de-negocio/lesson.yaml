objectives:
  - "Distinguir value proposition de revenue model mediante evidencia observable."
  - "Aplicar la secuencia: definir segmento y problema → articular propuesta y canal → modelar recursos actividades y partners → construir revenue y cost logic → testear coherencia y economics."
  - "Interpretar revenue per segment, gross margin, CAC-LTV sin atribuir causalidad automática."
  - "Resolver el caso de modelo de negocio con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "strategy-memo.md"
references:
  - "Michael E. Porter — *Competitive Strategy*"
