id: 74
part: 06
title: "Definición de alcance y éxito"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir problema, resultado de negocio, requisito y entregable."
  - "Redactar criterios de éxito medibles con línea base y fecha."
  - "Delimitar el alcance con inclusiones y exclusiones explícitas."
  - "Gobernar los cambios con un proceso de aprobación y su efecto en plazo y costo."
  - "Detectar y frenar la ampliación silenciosa del alcance."
deliverable: "leadership-decision-brief.md"
references:
  - "Project Management Institute — *A Guide to the Project Management Body of Knowledge (PMBOK Guide)*"
  - "Harold Kerzner — *Project Management*"
  - "Edwin A. Locke & Gary P. Latham — *Building a Practically Useful Theory of Goal Setting and Task Motivation: A 35-Year Odyssey*"
  - "Ken Schwaber & Jeff Sutherland — *The Scrum Guide*"
  - "Bent Flyvbjerg & Dan Gardner — *How Big Things Get Done*"
limits:
  - "Definir el alcance por completo al inicio es imposible cuando hay mucha incertidumbre; en esos casos se define por objetivos y se detalla por etapas."
evidence_signals:
  - "resultado de negocio explícito"
  - "criterios de éxito medibles"
  - "exclusiones escritas"
  - "cambios con decisión"
