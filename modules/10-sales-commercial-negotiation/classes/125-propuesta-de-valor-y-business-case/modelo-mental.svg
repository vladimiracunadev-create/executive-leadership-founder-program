<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >comparar contra no hacer y</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >alternativas</text>
