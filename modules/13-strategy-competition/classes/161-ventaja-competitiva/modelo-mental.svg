<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 419.31" width="1040" role="img" aria-labelledby="t-s161 d-s161" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s161">Clase 161 · Tres caminos clásicos hacia la ventaja competitiva</title>
<desc id="d-s161">Liderazgo en costos, diferenciación y enfoque: cómo funciona cada camino y qué exige.</desc>
<defs><marker id="p-s161" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="419.31" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 161 · Tres caminos clásicos hacia la ventaja competitiva</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Porter (1985) · Helmer (2016) · McGrath (2013)</text>
<rect x="28" y="96" width="314.667" height="180.25" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M28.0,136 V108 a12,12 0 0 1 12,-12 H330.6666666666667 a12,12 0 0 1 12,12 V136 Z" fill="#0969da"/>
<text x="44" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Liderazgo en costos</text>
<circle cx="50.0" cy="154" r="4" fill="#0969da"/>
<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Costo unitario menor que el de los</text>
<text x="64" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >rivales.</text>
<circle cx="50.0" cy="198.5" r="4" fill="#0969da"/>
<text x="64" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Escala, eficiencia, procesos.</text>
<circle cx="50.0" cy="225.75" r="4" fill="#0969da"/>
<text x="64" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Exige disciplina; vulnerable a quien</text>
<text x="64" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >copie.</text>
<rect x="362.667" y="96" width="314.667" height="180.25" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M362.6666666666667,136 V108 a12,12 0 0 1 12,-12 H665.3333333333334 a12,12 0 0 1 12,12 V136 Z" fill="#1a7f37"/>
<text x="378.667" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Diferenciación</text>
<circle cx="384.6666666666667" cy="154" r="4" fill="#1a7f37"/>
<text x="398.667" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Valor único que el cliente paga más</text>
<text x="398.667" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >por tener.</text>
<circle cx="384.6666666666667" cy="198.5" r="4" fill="#1a7f37"/>
<text x="398.667" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Marca, producto, servicio.</text>
<circle cx="384.6666666666667" cy="225.75" r="4" fill="#1a7f37"/>
<text x="398.667" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Exige conocer qué valora el cliente.</text>
<rect x="697.333" y="96" width="314.667" height="180.25" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M697.3333333333334,136 V108 a12,12 0 0 1 12,-12 H1000.0 a12,12 0 0 1 12,12 V136 Z" fill="#bc4c00"/>
<text x="713.333" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Enfoque en un segmento</text>
<circle cx="719.3333333333334" cy="154" r="4" fill="#bc4c00"/>
<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Servir a un grupo mejor que los</text>
<text x="733.333" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >generalistas.</text>
<circle cx="719.3333333333334" cy="198.5" r="4" fill="#bc4c00"/>
<text x="733.333" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Costo o diferenciación dentro del</text>
<text x="733.333" y="219.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >nicho.</text>
<circle cx="719.3333333333334" cy="243.0" r="4" fill="#bc4c00"/>
<text x="733.333" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Riesgo si el nicho se agota.</text>
<rect x="28" y="292.25" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="314.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Helmer propone que una ventaja duradera exige una fuente de poder (escala, efectos de red, marca, recurso exclusivo, entre otras) y un</text>
<text x="44" y="331.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >beneficio demostrable. McGrath advierte que las ventajas duran menos y requieren renovación.</text>
<text x="28" y="378.75" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las categorías son un marco para pensar; muchas empresas combinan ventajas o las construyen por etapas.</text>
</svg>
