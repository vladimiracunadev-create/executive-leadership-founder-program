<text x="817" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Relación con los que se</text>
<text x="817" y="264.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >van.</text>
<rect x="28" y="309.5" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="331.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Cada decisión de talento afecta a las demás: una selección débil exige más desempeño; una compensación incoherente daña el desarrollo.</text>
<text x="44" y="348.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El sistema se evalúa por la coherencia entre sus partes.</text>
<text x="28" y="396" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >El sistema se ajusta al tamaño y a la normativa; una empresa pequeña puede cumplir cada función con procesos simples.</text>
