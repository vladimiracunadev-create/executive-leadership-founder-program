id: 268
part: 22
title: "Escalar ventas sin destruir margen"
duration_minutes: 150
level: "Etapa 6 — Business Owner"
outcome: "reducir dependencia del fundador mediante sistemas, líderes, controles y gobierno proporcional"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Segmentar ingresos y margen de contribución por cliente, producto o canal."
  - "Identificar un movimiento comercial repetible y sus condiciones."
  - "Evaluar una política de precios y descuentos con efecto en volumen y contribución."
  - "Calcular el período de recuperación del costo de adquisición con y sin descuentos."
  - "Decidir cuándo y cuánto ampliar capacidad, o cuándo aceptar trabajo a medida."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Verne Harnish — *Scaling Up*"
