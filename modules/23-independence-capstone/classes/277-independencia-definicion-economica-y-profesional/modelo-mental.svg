<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >income concentration</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >proporción de ingreso atribuida a una sola fuente</text>
