<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s260 d-s260" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s260">Clase 260 · Honorarios o contrato: los hechos mandan</title>
<desc id="d-s260">Hechos observables de la relación de trabajo, la pregunta que plantean y dónde se verifican.</desc>
<defs><marker id="p-s260" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 260 · Honorarios o contrato: los hechos mandan</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Dirección del Trabajo · LeyChile · Noe et al. · Armstrong y Taylor</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Hecho observable</text>
<text x="292.308" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Pregunta</text>
<text x="708.615" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Dónde se verifica</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Dirección y dependencia</text>
<text x="292.308" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Quién dirige el trabajo y cómo?</text>
<text x="708.615" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dirección del Trabajo y asesoría laboral.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Jornada y horario</text>
<text x="292.308" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Hay horario fijado y control de asistencia?</text>
<text x="708.615" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Código del Trabajo vigente.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Continuidad</text>
<text x="292.308" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Es un servicio acotado o permanente?</text>
<text x="708.615" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Orientación oficial de la DT.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Remuneración</text>
<text x="292.308" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Cómo se paga y qué se retiene o cotiza?</text>
<text x="708.615" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >SII, previsión y asesoría.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Prevención y seguridad</text>
<text x="292.308" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué obligaciones de seguridad y salud existen?</text>
<text x="708.615" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Previsión Social y SUSESO.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El derecho laboral es sensible a los hechos y cambia. El nombre del contrato no decide: se revisan los hechos con fuentes oficiales y</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >asesoría laboral antes de contratar.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La jornada, Ley Karin y DS 44 se verifican en las fuentes vigentes.</text>
</svg>
