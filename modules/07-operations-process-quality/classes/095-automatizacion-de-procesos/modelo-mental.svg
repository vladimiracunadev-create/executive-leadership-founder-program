<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456.81" width="1040" role="img" aria-labelledby="t-s95 d-s95" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s95">Clase 095 · Qué se gana y qué se degrada al automatizar</title>
<desc id="d-s95">Lo que aporta automatizar un proceso y los efectos que aparecen en las personas que lo supervisan.</desc>
<defs><marker id="p-s95" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="456.81" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 095 · Qué se gana y qué se degrada al automatizar</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Bainbridge (1983) · Parasuraman &amp; Riley (1997) · Hammer &amp; Champy</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">LO QUE APORTA</text>
<rect x="28" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Consistencia</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Ejecuta igual cada vez, sin cansancio.</text>
<rect x="28" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="177.25" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Velocidad y escala</text>
<text x="46" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Procesa volúmenes que una persona no alcanzaría.</text>
<rect x="28" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.7" />
<rect x="28.0" y="250.5" width="6" height="63.25" rx="3" fill="#8250df"/>
<text x="46" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Trazabilidad</text>
<text x="46" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Deja registro de lo que hizo.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">LO QUE SE DEGRADA</text>
<rect x="532" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="63.25" rx="3" fill="#cf222e"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Habilidad</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Quien solo supervisa pierde práctica para intervenir.</text>
<rect x="532" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="532.0" y="177.25" width="6" height="63.25" rx="3" fill="#bc4c00"/>
<text x="550" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Vigilancia</text>
<text x="550" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Es difícil vigilar algo que casi nunca falla.</text>
<rect x="532" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="532.0" y="250.5" width="6" height="63.25" rx="3" fill="#59636e"/>
<text x="550" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Confianza mal calibrada</text>
<text x="550" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se confía de más o se desecha de menos.</text>
<rect x="28" y="329.75" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="351.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Automatizar un proceso malo lo hace malo más rápido: primero se simplifica y estandariza. Las excepciones, que son las que quedan para</text>
<text x="44" y="369" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >las personas, son las más difíciles.</text>
<text x="28" y="416.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los hallazgos de factores humanos provienen sobre todo de la aviación y de plantas de control; su traslado a otros procesos se evalúa caso a caso.</text>
</svg>
