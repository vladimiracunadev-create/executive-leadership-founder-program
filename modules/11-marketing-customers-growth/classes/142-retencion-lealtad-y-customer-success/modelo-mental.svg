<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456.81" width="1040" role="img" aria-labelledby="t-s142 d-s142" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s142">Clase 142 · Lealtad que se gana frente a cautividad que se acumula</title>
<desc id="d-s142">Dos formas de retener clientes: por valor recibido y por dificultad para irse, con sus señales y riesgos.</desc>
<defs><marker id="p-s142" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="456.81" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 142 · Lealtad que se gana frente a cautividad que se acumula</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Reichheld · Gupta &amp; Zeithaml (2006) · Moore</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">LEALTAD GANADA</text>
<rect x="28" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Resultado percibido</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >El cliente obtiene lo que busca y lo nota.</text>
<rect x="28" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="28.0" y="177.25" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<text x="46" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Recomienda</text>
<text x="46" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Habla bien sin que se lo pidan.</text>
<rect x="28" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="250.5" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Perdura</text>
<text x="46" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Resiste ofertas de la competencia.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CAUTIVIDAD ACUMULADA</text>
<rect x="532" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="63.25" rx="3" fill="#bc4c00"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Costo de salida alto</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Contratos, datos atrapados, integraciones.</text>
<rect x="532" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="532.0" y="177.25" width="6" height="63.25" rx="3" fill="#cf222e"/>
<text x="550" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se queda resentido</text>
<text x="550" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Permanece, pero critica y busca alternativas.</text>
<rect x="532" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="532.0" y="250.5" width="6" height="63.25" rx="3" fill="#59636e"/>
<text x="550" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se va a la primera oportunidad</text>
<text x="550" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Cuando cambia la regla o aparece una opción.</text>
<rect x="28" y="329.75" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="351.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La retención sana se mide por uso y resultados, no solo por renovaciones. La satisfacción declarada sin comportamiento asociado es una</text>
<text x="44" y="369" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >señal débil.</text>
<text x="28" y="416.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los costos de cambio se pueden usar de forma legítima, pero los obstáculos abusivos para irse pueden infringir normas de consumo.</text>
</svg>
