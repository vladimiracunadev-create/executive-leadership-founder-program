id: 34
part: 02
title: "Mapa de stakeholders y poder"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir stakeholder de poder mediante evidencia observable."
  - "Aplicar la secuencia: identificar afectados y decisores → mapear poder, interés y legitimidad → entender objetivos y temores → definir engagement por segmento → actualizar mapa cuando cambien coaliciones."
  - "Interpretar stakeholders omitidos, decisiones bloqueadas tarde, tiempo de aprobación sin atribuir causalidad automática."
  - "Resolver el caso de mapa de stakeholders y poder con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Robert B. Cialdini — *Influence*"
  - "Barbara Minto — *The Pyramid Principle*"
  - "Dale Carnegie — *How to Win Friends and Influence People*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
limits:
  - "Un mapa de poder puede volverse cínico si reduce personas a obstáculos. La participación no debe depender solo de poder formal; quienes absorben riesgos o daños merecen consideración aunque tengan poca influencia."
evidence_signals:
  - "stakeholders omitidos"
  - "decisiones bloqueadas tarde"
  - "tiempo de aprobación"
  - "conflictos por falta de consulta"
  - "confianza después de cambios"
