<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g59 d-g59" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g59">Ficha visual de la clase 059: Equipos híbridos y distribuidos</title>
<desc id="d-g59">Conceptos: remote-first; asincronía; overlap hours; documentation culture; proximity bias. Método: clasificar trabajo síncrono y asíncrono → definir fuente de verdad documental → establecer overlap y tiempos de respuesta → diseñar reuniones inclusivas → medir acceso y oportunidades sin proximity bias.</desc>
<defs><marker id="p-g59" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="602.36" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#0969da"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 059 · Equipos híbridos y distribuidos</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 04 · Liderazgo de equipos y ejecución</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#0969da"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >remote-first</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >diseño donde la información y los procesos funcionan</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >aunque nadie comparta sala</text>
<circle cx="38" cy="184.12" r="5" fill="#0969da"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >asincronía</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trabajo coordinado sin coincidencia temporal</text>
<circle cx="38" cy="242.12" r="5" fill="#0969da"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >overlap hours</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ventana mínima de tiempo compartido para interacción</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >sincrónica</text>
<circle cx="38" cy="314.24" r="5" fill="#0969da"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >documentation culture</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >hábito de registrar decisiones y contexto accesible</text>
<circle cx="38" cy="372.24" r="5" fill="#0969da"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >proximity bias</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >sobrevaloración de quienes están físicamente más</text>
<text x="54" y="411.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >visibles</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="542" height="50" rx="9" fill="#0969da" stroke="#0969da" stroke-width="0" fill-opacity="0.98"/>
<text x="484" y="124" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >1</text>
<text x="504" y="124" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >clasificar trabajo síncrono y asíncrono</text>
<rect x="487" y="160" width="508" height="50" rx="9" fill="#0969da" stroke="#0969da" stroke-width="0" fill-opacity="0.9099999999999999"/>
<text x="501" y="180" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >2</text>
<text x="521" y="180" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >definir fuente de verdad documental</text>
<rect x="504" y="216" width="474" height="50" rx="9" fill="#0969da" stroke="#0969da" stroke-width="0" fill-opacity="0.84"/>
<text x="518" y="236" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >3</text>
<text x="538" y="236" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >establecer overlap y tiempos de respuesta</text>
<rect x="521" y="272" width="440" height="50" rx="9" fill="#0969da" stroke="#0969da" stroke-width="0" fill-opacity="0.77"/>
<text x="535" y="292" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >4</text>
<text x="555" y="292" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >diseñar reuniones inclusivas</text>
<rect x="538" y="328" width="406" height="50" rx="9" fill="#0969da" stroke="#0969da" stroke-width="0" fill-opacity="0.7"/>
<text x="552" y="348" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >5</text>
<text x="572" y="348" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >medir acceso y oportunidades sin proximity bias</text>
<text x="28" y="458.36" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="470.36" width="184.7" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="41" cy="483.36" r="3.5" fill="#0969da"/>
<text x="52" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >decisiones documentadas</text>
<rect x="222.7" y="470.36" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="235.7" cy="483.36" r="3.5" fill="#0969da"/>
<text x="246.7" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >tiempo de respuesta</text>
<rect x="389.8" y="470.36" width="164" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="402.8" cy="483.36" r="3.5" fill="#0969da"/>
<text x="413.8" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >participación remota</text>
<rect x="563.8" y="470.36" width="198.5" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="576.8" cy="483.36" r="3.5" fill="#0969da"/>
<text x="587.8" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >promociones por modalidad</text>
<rect x="772.3" y="470.36" width="205.4" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="785.3" cy="483.36" r="3.5" fill="#0969da"/>
<text x="796.3" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >reuniones fuera de horario</text>
<rect x="28" y="516.36" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="516.36" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="536.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="554.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Remote-first no implica que toda interacción deba ser asíncrona. Conflictos, creatividad compleja y vínculos pueden beneficiarse de</text>
<text x="48" y="571.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >alta riqueza; el diseño elige intencionalmente.</text>
</svg>
