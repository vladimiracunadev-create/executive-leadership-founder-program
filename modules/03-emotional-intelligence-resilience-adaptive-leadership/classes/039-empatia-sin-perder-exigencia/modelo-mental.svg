<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" role="img" aria-labelledby="t-039 d-039" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-039">Interesarse por la persona y desafiarla directamente</title>
<desc id="d-039">Cuadrante de dos ejes, interesarse personalmente y desafiar de forma directa, con cuatro posturas: franqueza radical, empatía ruinosa, agresión odiosa e insinceridad manipuladora.</desc>
<defs><marker id="p-039" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="580" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 039 · Empatía sin perder exigencia</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Scott (2017) · Goleman (1996)</text>
<text x="305" y="86" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >PREOCUPARSE POR LA PERSONA:  poco</text>
<text x="647" y="86" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >mucho</text>
<text transform="translate(116,181.0) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">DESAFIAR: mucho</text>
<text transform="translate(116,363.0) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">DESAFIAR: poco</text>
<rect x="140" y="96" width="330" height="170" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<rect x="140" y="96" width="330" height="34" rx="12" fill="#bc4c00"/>
<text x="156" y="119" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Agresión odiosa</text>
<text x="156" y="154" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Dice lo directo sin importarle la persona:</text>
<text x="156" y="171.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >«esto es un desastre».</text>
<rect x="482" y="96" width="330" height="170" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="482" y="96" width="330" height="34" rx="12" fill="#1a7f37"/>
<text x="498" y="119" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Franqueza radical</text>
<text x="498" y="154" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Dice lo difícil porque le importa: «esto</text>
<text x="498" y="171.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >no está a tu nivel; te muestro por qué».</text>
<rect x="140" y="278" width="330" height="170" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="1.8" />
<rect x="140" y="278" width="330" height="34" rx="12" fill="#59636e"/>
<text x="156" y="301" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Insinceridad manipuladora</text>
<text x="156" y="336" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Ni se involucra ni dice lo que piensa:</text>
<text x="156" y="353.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >halaga o calla.</text>
<rect x="482" y="278" width="330" height="170" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<rect x="482" y="278" width="330" height="34" rx="12" fill="#cf222e"/>
<text x="498" y="301" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Empatía ruinosa</text>
<text x="498" y="336" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Cuida tanto la relación que evita decir lo</text>
<text x="498" y="353.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >que ayudaría.</text>
<text x="840" y="480" font-size="1" font-weight="400" fill="#1f2328" text-anchor="start" ></text>
<rect x="28" y="478" width="984" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="500" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Goleman describe la empatía como percibir y comprender las emociones de otros; la exigencia viene de los estándares. Ambas se</text>
<text x="44" y="517.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >necesitan: la empatía sin estándar no ayuda, y el estándar sin empatía no se escucha.</text>
<text x="28" y="566" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >El cuadrante es un marco práctico de la autora, no el resultado de una medición; sirve para revisar cómo se da un mensaje difícil.</text>
</svg>
