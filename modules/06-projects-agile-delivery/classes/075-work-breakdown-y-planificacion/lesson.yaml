id: 75
part: 06
title: "Work breakdown y planificación"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Descomponer un resultado en entregables y paquetes de trabajo."
  - "Verificar la completitud de la descomposición con la regla del cien por ciento."
  - "Identificar dependencias entre tareas y entre equipos."
  - "Calcular la ruta crítica y entender qué fija el plazo total."
  - "Proteger el plazo con márgenes agregados y no con márgenes en cada tarea."
deliverable: "leadership-decision-brief.md"
references:
  - "Project Management Institute — *A Guide to the Project Management Body of Knowledge (PMBOK Guide)*"
  - "Eliyahu M. Goldratt — *Critical Chain*"
  - "Harold Kerzner — *Project Management*"
  - "Bent Flyvbjerg & Dan Gardner — *How Big Things Get Done*"
  - "Donald G. Reinertsen — *The Principles of Product Development Flow*"
limits:
  - "La WBS y la ruta crítica suponen que el trabajo es descomponible y que las dependencias son conocidas; en trabajo de descubrimiento o muy incierto, funcionan peor y conviene un enfoque iterativo."
evidence_signals:
  - "entregables descompuestos"
  - "paquetes con dueño"
  - "ruta crítica identificada"
  - "márgenes visibles"
