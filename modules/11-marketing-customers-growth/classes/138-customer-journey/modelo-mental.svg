<title id="t-g138">Ficha visual de la clase 138: Customer journey</title>
<desc id="d-g138">Conceptos: journey; touchpoint; moment of truth; friction; handoff. Método: definir persona/job y alcance → reconstruir journey con evidencia → mapear touchpoints y emociones → priorizar moments of truth → asignar owner end-to-end.</desc>
