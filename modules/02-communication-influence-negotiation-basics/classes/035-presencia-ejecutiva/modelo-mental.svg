<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" role="img" aria-labelledby="t-035 d-035" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-035">Ajuste de contexto: la presencia se decide mirando el entorno</title>
<desc id="d-035">El propósito de la reunión, en el centro, se ajusta con variables de industria, organización, audiencia, cultura, modalidad y clima; apariencia no equivale a competencia.</desc>
<defs><marker id="p-035" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="580" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 035 · Presencia: claridad y criterio ante la atención</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Hall et al. (2019) · Chang &amp; Cortina (2024)</text>
<circle cx="330" cy="300" r="78" fill="#1a7f37" fill-opacity="0.14" stroke="#1a7f37" stroke-width="2"/>
<text x="330" y="296" font-size="14" font-weight="800" fill="#1a7f37" text-anchor="middle" letter-spacing="1.2">PROPÓSITO</text>
<text x="330" y="316" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" >qué debe lograr</text>
<text x="330" y="330" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle" >la reunión</text>
<path d="M330,222 L330,160" stroke="#d0d7de" stroke-width="1.6"/>
<rect x="260" y="123" width="140" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.4" />
<text x="330" y="145" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle" >Industria</text>
<path d="M385.154,244.846 L436.066,201.005" stroke="#d0d7de" stroke-width="1.6"/>
<rect x="394.35" y="169.863" width="140" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.4" />
<text x="464.35" y="191.863" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle" >Organización</text>
<path d="M408,300 L480,300" stroke="#d0d7de" stroke-width="1.6"/>
<rect x="450" y="283" width="140" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.4" />
<text x="520" y="305" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle" >Rol y responsabilidad</text>
<path d="M385.154,355.154 L436.066,398.995" stroke="#d0d7de" stroke-width="1.6"/>
<rect x="394.35" y="396.137" width="140" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.4" />
<text x="464.35" y="418.137" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle" >Audiencia</text>
<path d="M330,378 L330,440" stroke="#d0d7de" stroke-width="1.6"/>
<rect x="260" y="443" width="140" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.4" />
<text x="330" y="465" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle" >Tipo de reunión</text>
<path d="M274.846,355.154 L223.934,398.995" stroke="#d0d7de" stroke-width="1.6"/>
<rect x="125.65" y="396.137" width="140" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.4" />
<text x="195.65" y="418.137" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle" >Cultura y país</text>
<path d="M252,300 L180,300" stroke="#d0d7de" stroke-width="1.6"/>
<rect x="70" y="283" width="140" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.4" />
<text x="140" y="305" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle" >Modalidad</text>
<path d="M274.846,244.846 L223.934,201.005" stroke="#d0d7de" stroke-width="1.6"/>
<rect x="125.65" y="169.863" width="140" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.4" />
<text x="195.65" y="191.863" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle" >Clima</text>
<text x="650" y="100" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.2">DOS DESIGUALDADES QUE ORDENAN LA CLASE</text>
<rect x="650" y="118" width="362" height="114" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<text x="666" y="148" font-size="16" font-weight="800" fill="#1f2328" text-anchor="start" >apariencia  ≠  competencia</text>
<text x="666" y="172" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Una primera impresión no mide capacidad ni</text>
<text x="666" y="189.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >liderazgo, y puede reflejar sesgos de quien</text>
<text x="666" y="206.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >observa.</text>
<rect x="650" y="248" width="362" height="114" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<text x="666" y="278" font-size="16" font-weight="800" fill="#1f2328" text-anchor="start" >vestirse formal  ≠  presencia ejecutiva</text>
<text x="666" y="302" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >La presencia es claridad, estabilidad y</text>
<text x="666" y="319.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >criterio bajo atención.</text>
<rect x="650" y="390" width="362" height="120" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="666" y="414" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.2">CÓMO SE DECIDE</text>
<text x="666" y="434" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Investiga el contexto, identifica restricciones</text>
<text x="666" y="451.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >funcionales y elige una opción coherente con</text>
<text x="666" y="468.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >quien serás en el cargo, de modo que el mensaje</text>
<text x="666" y="485.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >concentre la atención.</text>
<text x="28" y="558" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Ninguna variable decide sola. Las impresiones dependen del contexto y del observador; esto no es un código de vestimenta.</text>
</svg>
