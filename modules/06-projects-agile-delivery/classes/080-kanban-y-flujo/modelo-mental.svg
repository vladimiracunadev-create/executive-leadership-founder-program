<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 384.81" width="1040" role="img" aria-labelledby="t-s80 d-s80" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s80">Clase 080 · Kanban: visualizar, limitar y gestionar el flujo</title>
<desc id="d-s80">Tres prácticas centrales de Kanban y la ley de Little que relaciona trabajo en curso, rendimiento y tiempo de ciclo.</desc>
<defs><marker id="p-s80" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="384.81" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 080 · Kanban: visualizar, limitar y gestionar el flujo</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Anderson (2010) · Little (1961) · Reinertsen (2009)</text>
<rect x="28" y="96" width="314.667" height="145.75" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M28.0,136 V108 a12,12 0 0 1 12,-12 H330.6666666666667 a12,12 0 0 1 12,12 V136 Z" fill="#0969da"/>
<text x="44" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Visualizar el trabajo</text>
<circle cx="50.0" cy="154" r="4" fill="#0969da"/>
<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un tablero con las etapas reales.</text>
<circle cx="50.0" cy="181.25" r="4" fill="#0969da"/>
<text x="64" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Cada elemento de trabajo, visible.</text>
<circle cx="50.0" cy="208.5" r="4" fill="#0969da"/>
<text x="64" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Bloqueos y esperas a la vista.</text>
<rect x="362.667" y="96" width="314.667" height="145.75" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M362.6666666666667,136 V108 a12,12 0 0 1 12,-12 H665.3333333333334 a12,12 0 0 1 12,12 V136 Z" fill="#bc4c00"/>
<text x="378.667" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Limitar el trabajo en curso</text>
<circle cx="384.6666666666667" cy="154" r="4" fill="#bc4c00"/>
<text x="398.667" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un máximo de elementos por etapa.</text>
<circle cx="384.6666666666667" cy="181.25" r="4" fill="#bc4c00"/>
<text x="398.667" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Terminar antes de empezar.</text>
<circle cx="384.6666666666667" cy="208.5" r="4" fill="#bc4c00"/>
<text x="398.667" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Menos cambio de contexto.</text>
<rect x="697.333" y="96" width="314.667" height="145.75" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M697.3333333333334,136 V108 a12,12 0 0 1 12,-12 H1000.0 a12,12 0 0 1 12,12 V136 Z" fill="#1a7f37"/>
<text x="713.333" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Gestionar el flujo</text>
<circle cx="719.3333333333334" cy="154" r="4" fill="#1a7f37"/>
<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Medir tiempo de ciclo y rendimiento.</text>
<circle cx="719.3333333333334" cy="181.25" r="4" fill="#1a7f37"/>
<text x="733.333" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Hacer explícitas las políticas.</text>
<circle cx="719.3333333333334" cy="208.5" r="4" fill="#1a7f37"/>
<text x="733.333" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Mejorar de forma colaborativa.</text>
<rect x="28" y="257.75" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="279.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Ley de Little: el trabajo en curso es igual al rendimiento por el tiempo de ciclo promedio. Con el mismo rendimiento, menos trabajo en</text>
<text x="44" y="297" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >curso implica menor tiempo de ciclo.</text>
<text x="28" y="344.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La ley de Little es una relación matemática para sistemas estables; en la práctica se usa como guía y no como cálculo exacto.</text>
</svg>
