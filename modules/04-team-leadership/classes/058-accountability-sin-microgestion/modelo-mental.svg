<text x="571" y="251" font-size="11" font-weight="600" fill="#59636e" text-anchor="start" >revisar y volver a empezar</text>
<text x="28" y="430.12" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="442.12" width="212.3" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="41" cy="455.12" r="3.5" fill="#0969da"/>
<text x="52" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >escalamientos por excepción</text>
<rect x="250.3" y="442.12" width="233" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="263.3" cy="455.12" r="3.5" fill="#0969da"/>
<text x="274.3" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >intervenciones no planificadas</text>
<rect x="493.3" y="442.12" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="506.3" cy="455.12" r="3.5" fill="#0969da"/>
<text x="517.3" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >decisiones anuladas</text>
<rect x="660.4" y="442.12" width="88.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="673.4" cy="455.12" r="3.5" fill="#0969da"/>
<text x="684.4" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >retrabajo</text>
<rect x="758.5" y="442.12" width="226.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="771.5" cy="455.12" r="3.5" fill="#0969da"/>
<text x="782.5" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >autonomía por nivel de riesgo</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="488.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Menos control no siempre es mejor. Riesgo alto, novedad, compliance o baja competencia pueden justificar checkpoints frecuentes; el</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >criterio es proporcionalidad, no una ideología de autonomía.</text>
