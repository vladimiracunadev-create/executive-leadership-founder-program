id: 116
part: 09
title: "Costos fijos, variables y break-even"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "leer la economía del negocio y decidir con estados, caja, márgenes, retorno y valoración"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir fixed cost de variable cost mediante evidencia observable."
  - "Aplicar la secuencia: clasificar costos por comportamiento → calcular contribución unitaria → obtener break-even → hacer sensibilidad de precio-volumen-costo → comparar capacidad y rango relevante."
  - "Interpretar break-even units, contribution margin, fixed cost coverage sin atribuir causalidad automática."
  - "Resolver el caso de costos fijos, variables y break-even con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Charles Horngren et al. — *Cost Accounting: A Managerial Emphasis*"
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Stephen Ross, Randolph Westerfield et al. — *Corporate Finance*"
  - "Donald E. Kieso, Jerry J. Weygandt & Terry D. Warfield — *Intermediate Accounting*"
  - "Stephen H. Penman — *Financial Statement Analysis and Security Valuation*"
  - "Aswath Damodaran — *Investment Valuation*"
limits:
  - "La clasificación fija/variable cambia con horizonte y escala. Un contrato anual puede ser fijo este mes y evitable el próximo año; modela según la decisión concreta."
evidence_signals:
  - "break-even units"
  - "contribution margin"
  - "fixed cost coverage"
  - "margin of safety"
  - "operating leverage"
