id: 265
part: 22
title: "De fundador-operador a propietario"
duration_minutes: 150
level: "Etapa 6 — Business Owner"
outcome: "reducir dependencia del fundador mediante sistemas, líderes, controles y gobierno proporcional"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir las tareas de propietario, de director y de operador."
  - "Medir la dependencia del fundador con horas, aprobaciones y concentración de personas clave."
  - "Priorizar qué tareas transferir según valor del tiempo y riesgo."
  - "Estimar el costo y el retorno de liberar tiempo del fundador con supuestos explícitos."
  - "Diseñar una transición gradual con criterios para avanzar, pausar o revertir."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Michael E. Gerber — *The E-Myth Revisited*"
  - "Verne Harnish — *Scaling Up*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Reid Hoffman & Chris Yeh — *Blitzscaling*"
  - "Robert I. Sutton & Huggy Rao — *Scaling Up Excellence*"
limits:
  - "Eliminar al fundador demasiado pronto puede destruir relaciones y conocimiento; las métricas de dependencia no prueban causalidad por sí solas."
evidence_signals:
  - "horas del dueño por rol"
  - "aprobaciones del fundador"
  - "concentración de personas clave"
  - "transferencia gradual con criterios"
