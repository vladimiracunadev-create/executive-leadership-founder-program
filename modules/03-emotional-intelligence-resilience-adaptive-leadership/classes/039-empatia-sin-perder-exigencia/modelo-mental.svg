<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g39 d-g39" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g39">Ficha visual de la clase 039: Empatía sin perder exigencia</title>
<desc id="d-g39">Conceptos: empatía cognitiva; empatía afectiva; compasión; exigencia; boundary. Método: escuchar contexto antes de concluir → validar experiencia sin confirmar toda interpretación → reafirmar estándar y propósito → co-diseñar apoyo proporcional → seguir desempeño y ajustar.</desc>
<defs><marker id="p-g39" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
