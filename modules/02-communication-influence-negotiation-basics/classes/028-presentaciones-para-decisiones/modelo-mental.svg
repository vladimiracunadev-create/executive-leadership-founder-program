<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" role="img" aria-labelledby="t-028 d-028" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-028">Anatomía de una presentación para decidir</title>
<desc id="d-028">Una lámina de decisión: el título es la afirmación, la evidencia la respalda, y al pie se pide la decisión.</desc>
<defs><marker id="p-028" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="600" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 028 · La lámina existe para que alguien decida</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Duarte (2010) · Minto (2005)</text>
<rect x="28" y="84" width="600" height="400" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<text x="52" y="128" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Mantener el proveedor actual cuesta 8 % menos en 3 años</text>
<line x1="52" y1="142" x2="604" y2="142" stroke="#d0d7de"/>
<rect x="68" y="304" width="26" height="120" fill="#0969da" fill-opacity="0.8"/>
<rect x="98" y="274" width="26" height="150" fill="#bc4c00" fill-opacity="0.8"/>
<rect x="138" y="284" width="26" height="140" fill="#0969da" fill-opacity="0.8"/>
<rect x="168" y="274" width="26" height="150" fill="#bc4c00" fill-opacity="0.8"/>
<rect x="208" y="274" width="26" height="150" fill="#0969da" fill-opacity="0.8"/>
<rect x="238" y="274" width="26" height="150" fill="#bc4c00" fill-opacity="0.8"/>
<text x="68" y="446" font-size="11" font-weight="400" fill="#59636e" text-anchor="start" >Año 1        Año 2        Año 3</text>
<text x="298" y="214" font-size="12" font-weight="700" fill="#0969da" text-anchor="start" >Actual</text>
<text x="298" y="232" font-size="12" font-weight="700" fill="#bc4c00" text-anchor="start" >Alternativa</text>
<text x="298" y="264" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Las tres cifras que sostienen el título,</text>
<text x="298" y="281.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >con la fuente y la fecha al pie.</text>
<rect x="28" y="440" width="600" height="44" rx="0" fill="#1a7f37" fill-opacity="0.14"/>
<text x="52" y="467" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Decisión pedida: renovar por 36 meses, antes del 30 de marzo.</text>
<circle cx="656" cy="128" r="13" fill="#1a7f37"/>
<text x="656" y="133" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="680" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >El título es una afirmación, no un tema: se</text>
<text x="680" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >puede aceptar o rebatir.</text>
<circle cx="656" cy="284" r="13" fill="#1a7f37"/>
<text x="656" y="289" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="680" y="280" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Una sola idea y la evidencia mínima que la</text>
<text x="680" y="297.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >sostiene.</text>
<circle cx="656" cy="462" r="13" fill="#1a7f37"/>
<text x="656" y="467" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="680" y="458" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Se pide una decisión concreta, con fecha.</text>
<rect x="648" y="354" width="364" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="664" y="380" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.2">ANTES DE LA LÁMINA</text>
<text x="664" y="400" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Cómo es hoy y cómo podría ser: el cambio que se</text>
<text x="664" y="417.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >propone es el puente entre ambos.</text>
<text x="28" y="556" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los datos del ejemplo son ilustrativos. Las alternativas que se descartaron van en un anexo, no en la lámina.</text>
</svg>
