<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 441.86" width="1040" role="img" aria-labelledby="t-s263 d-s263" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s263">Clase 263 · Ecosistema público: qué ofrece cada uno</title>
<desc id="d-s263">Tres actores del ecosistema público de apoyo y venta, para qué sirven y qué se verifica antes de postular.</desc>
<defs><marker id="p-s263" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="441.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 263 · Ecosistema público: qué ofrece cada uno</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >ChileCompra · Sercotec · Corfo · Drucker</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Actor</text>
<text x="267.077" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Para qué sirve</text>
<text x="658.154" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué se verifica antes de postular</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >ChileCompra y Mercado Público</text>
<text x="267.077" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Vender bienes y servicios a organismos del Estado.</text>
<text x="658.154" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Bases, requisitos, plazos y registro.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Sercotec</text>
<text x="267.077" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Capacitación, asesoría y apoyo a pequeñas empresas.</text>
<text x="658.154" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Convocatoria vigente y elegibilidad.</text>
<rect x="28" y="209.12" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Corfo</text>
<text x="267.077" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Instrumentos de fomento y apoyo al desarrollo</text>
<text x="267.077" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >empresarial.</text>
<text x="658.154" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Bases, cofinanciamiento y rendición.</text>
<rect x="28" y="262.24" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="282.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Costo real de postular</text>
<text x="267.077" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Horas, garantías y capital de trabajo.</text>
<text x="658.154" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Modelo de caja del caso.</text>
<rect x="28" y="314.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="336.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Los programas y las bases cambian con frecuencia. Montos, fechas y requisitos no son permanentes: se verifican en el sitio oficial y en</text>
<text x="44" y="354.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >las bases de cada convocatoria.</text>
<text x="28" y="401.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Postular tiene costo: se modela el esfuerzo y la caja antes de decidir.</text>
</svg>
