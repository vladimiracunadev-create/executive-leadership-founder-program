<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g58 d-g58" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g58">Ficha visual de la clase 058: Accountability sin microgestión</title>
<desc id="d-g58">Conceptos: accountability; microgestión; guardrail; checkpoint; management by exception. Método: definir outcome y estándar → acordar guardrails y señales → delegar método dentro del marco → revisar por excepción → usar postmortem para ajustar autonomía.</desc>
<defs><marker id="p-g58" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#0969da"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 058 · Accountability sin microgestión</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 04 · Liderazgo de equipos y ejecución</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#0969da"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >accountability</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >obligación de responder por compromisos y consecuencias</text>
<circle cx="38" cy="170" r="5" fill="#0969da"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >microgestión</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >control excesivo del método y decisiones de bajo nivel</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >sin necesidad proporcional</text>
<circle cx="38" cy="242.12" r="5" fill="#0969da"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >guardrail</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >límite que define cuándo escalar</text>
<circle cx="38" cy="300.12" r="5" fill="#0969da"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >checkpoint</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >revisión previamente acordada</text>
<circle cx="38" cy="358.12" r="5" fill="#0969da"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >management by exception</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >intervención cuando señales salen de rango</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<circle cx="486.0" cy="120" r="11" fill="#0969da"/>
<text x="486" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="504" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >definir outcome y</text>
<text x="504" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >estándar</text>
<rect x="658" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<circle cx="674.0" cy="120" r="11" fill="#0969da"/>
<text x="674" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="692" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >acordar guardrails</text>
<text x="692" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >y señales</text>
<rect x="846" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<circle cx="862.0" cy="120" r="11" fill="#0969da"/>
