id: 274
part: 22
title: "Delegar decisiones sin perder control"
duration_minutes: 150
level: "Etapa 6 — Business Owner"
outcome: "reducir dependencia del fundador mediante sistemas, líderes, controles y gobierno proporcional"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Inventariar las decisiones que hoy dependen del dueño y clasificarlas por tipo y riesgo."
  - "Asignar un nivel de delegación a cada decisión con resultado esperado y límites."
  - "Diseñar reportes y gatillos de excepción que mantengan el control sin microgestión."
  - "Medir latencia de decisión, tasa de escalamiento y calidad de lo delegado."
  - "Decidir cuándo ampliar, mantener o retirar una autoridad delegada."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Ben Horowitz — *The Hard Thing About Hard Things*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "Robert I. Sutton & Huggy Rao — *Scaling Up Excellence*"
  - "Verne Harnish — *Scaling Up*"
  - "Reid Hoffman & Chris Yeh — *Blitzscaling*"
  - "Michael E. Gerber — *The E-Myth Revisited*"
limits:
  - "Las métricas no prueban causalidad: una menor latencia no demuestra mejor calidad."
evidence_signals:
  - "decisiones inventariadas por nivel"
  - "límites y gatillos de excepción"
  - "latencia y escalamiento"
  - "calidad revisada"
