<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g187 d-g187" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g187">Ficha visual de la clase 187: Gobierno de ciberseguridad</title>
<desc id="d-g187">Conceptos: cyber risk; NIST CSF; critical asset; security control; incident response. Método: mapear activos y procesos críticos → definir escenarios e impacto → establecer governance y controles → medir detección respuesta y recuperación → reportar exposición residual y decisiones.</desc>
