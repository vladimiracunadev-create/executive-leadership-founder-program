id: 114
part: 09
title: "Capital de trabajo"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "leer la economía del negocio y decidir con estados, caja, márgenes, retorno y valoración"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir working capital de DSO mediante evidencia observable."
  - "Aplicar la secuencia: calcular componentes operativos → convertir saldos a días → identificar driver de variación → modelar caja liberada por mejoras → evitar trasladar riesgo abusivamente a proveedores o clientes."
  - "Interpretar DSO, DIO, DPO sin atribuir causalidad automática."
  - "Resolver el caso de capital de trabajo con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Aswath Damodaran — *Investment Valuation*"
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Stephen Ross, Randolph Westerfield et al. — *Corporate Finance*"
  - "Donald E. Kieso, Jerry J. Weygandt & Terry D. Warfield — *Intermediate Accounting*"
  - "Stephen H. Penman — *Financial Statement Analysis and Security Valuation*"
  - "IFRS Foundation — normas IFRS/IAS aplicables a presentación y lectura de estados financieros. Verificar edición vigente en <https://www.ifrs.org/>."
limits:
  - "Extender pagos o reducir inventario tiene límites de relación, resiliencia y servicio. Optimizar caja destruyendo proveedores críticos o fill rate puede empeorar valor total."
evidence_signals:
  - "DSO"
  - "DIO"
  - "DPO"
  - "cash conversion cycle"
  - "cash released"
