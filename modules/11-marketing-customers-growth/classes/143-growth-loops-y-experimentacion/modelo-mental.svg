<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 374.81" width="1040" role="img" aria-labelledby="t-s143 d-s143" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s143">Clase 143 · Un ciclo de crecimiento: cada cliente alimenta el siguiente</title>
<desc id="d-s143">Cuatro pasos de un ciclo de crecimiento: llega un usuario, recibe valor, genera una acción que atrae a otros y vuelve a ingresar.</desc>
<defs><marker id="p-s143" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="374.81" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 143 · Un ciclo de crecimiento: cada cliente alimenta el siguiente</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Ellis &amp; Brown · Eyal · Kohavi, Tang &amp; Xu</text>
<rect x="28" y="96" width="229.5" height="113.75" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<circle cx="52.0" cy="122.0" r="13" fill="#0969da"/>
<text x="52" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="72" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Llega un usuario</text>
<text x="44" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Por un canal pagado, propio</text>
<text x="44" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >o ganado.</text>
<path d="M260.5,152.875 L276.5,152.875" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s143)"/>
<rect x="279.5" y="96" width="229.5" height="113.75" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<circle cx="303.5" cy="122.0" r="13" fill="#1a7f37"/>
<text x="303.5" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="323.5" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Recibe valor pronto</text>
<text x="295.5" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Activación: el primer</text>
<text x="295.5" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >resultado ocurre rápido.</text>
<path d="M512,152.875 L528,152.875" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s143)"/>
<rect x="531" y="96" width="229.5" height="113.75" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<circle cx="555.0" cy="122.0" r="13" fill="#bc4c00"/>
<text x="555" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="575" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Genera una acción de</text>
<text x="575" y="138.63" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >crecimiento</text>
<text x="547" y="159.26" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Invita, comparte, publica o</text>
<text x="547" y="176.51" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >contribuye con su uso.</text>
<path d="M763.5,152.875 L779.5,152.875" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s143)"/>
<rect x="782.5" y="96" width="229.5" height="113.75" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<circle cx="806.5" cy="122.0" r="13" fill="#8250df"/>
<text x="806.5" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="826.5" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Atrae a otros</text>
<text x="798.5" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >La acción llega a nuevas</text>
<text x="798.5" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >personas que entran al</text>
<text x="798.5" y="186.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >ciclo.</text>
<path d="M897.25,211.75 V231.75 H142.75 V213.75" stroke="#59636e" stroke-width="2" fill="none" stroke-dasharray="7 6" marker-end="url(#p-s143)"/>
<text x="520" y="225.75" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >cada vuelta reduce el costo de adquirir al siguiente</text>
<rect x="28" y="247.75" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="269.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Un ciclo se diseña, se mide en cada paso y se mejora con experimentos controlados. Los ciclos que empujan a los usuarios a actuar</text>
<text x="44" y="287" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >contra sus intereses dañan la confianza.</text>
<text x="28" y="334.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los ciclos de crecimiento dependen del producto: no se pueden agregar a uno que no entrega valor.</text>
</svg>
