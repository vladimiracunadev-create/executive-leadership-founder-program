id: 195
part: 16
title: "Construir el executive team"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir el mandato colectivo y qué asuntos son del equipo y cuáles de cada función."
  - "Componer el equipo con complementariedad de capacidades y claridad de roles."
  - "Establecer normas de conflicto, de decisión y de compromiso."
  - "Diseñar una cadencia de reuniones y de trabajo de empresa."
  - "Medir el funcionamiento del equipo con conductas y resultados."
deliverable: "leadership-decision-brief.md"
references:
  - "Patrick Lencioni — *The Five Dysfunctions of a Team*"
  - "Ruth Wageman et al. — *Senior Leadership Teams*"
  - "J. Richard Hackman — *Leading Teams*"
  - "Jon R. Katzenbach & Douglas K. Smith — *The Wisdom of Teams*"
  - "Amy C. Edmondson — *Psychological Safety and Learning Behavior in Work Teams*"
limits:
  - "No todas las decisiones deben ser colectivas: un equipo efectivo reserva el trabajo conjunto para asuntos de empresa y mantiene la responsabilidad funcional clara."
evidence_signals:
  - "mandato colectivo escrito"
  - "normas de decisión y conflicto"
  - "cadencia del equipo diseñada"
  - "conductas del equipo medidas"
