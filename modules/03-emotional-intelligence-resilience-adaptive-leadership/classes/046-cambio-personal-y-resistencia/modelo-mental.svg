<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" role="img" aria-labelledby="t-046 d-046" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-046">Por qué no cambio aunque quiero: el mapa de inmunidad</title>
<desc id="d-046">Mapa de cuatro columnas: compromiso de mejora, lo que hago o dejo de hacer, compromisos en competencia con su miedo y gran supuesto; y las etapas del cambio personal.</desc>
<defs><marker id="p-046" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="600" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 046 · Resistencia: lo que protege el statu quo</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Kegan &amp; Lahey (2009) · Prochaska &amp; DiClemente (1983)</text>
<rect x="28" y="92" width="232" height="200" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M28,130 V104 a12,12 0 0 1 12,-12 H248 a12,12 0 0 1 12,12 V130 Z" fill="#1a7f37"/>
<text x="42" y="116" font-size="12" font-weight="800" fill="#ffffff" text-anchor="start" >1 · Compromiso de mejora</text>
<text x="42" y="152" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Ejemplo</text>
<text x="42" y="170" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Delegar más y confiar en mi</text>
<text x="42" y="187.94" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >equipo.</text>
<path d="M263,192 L281,192" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-046)"/>
<rect x="284" y="92" width="232" height="200" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M284,130 V104 a12,12 0 0 1 12,-12 H504 a12,12 0 0 1 12,12 V130 Z" fill="#0969da"/>
<text x="298" y="116" font-size="12" font-weight="800" fill="#ffffff" text-anchor="start" >2 · Lo que hago o dejo de hacer</text>
<text x="298" y="152" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Ejemplo</text>
<text x="298" y="170" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Reviso todo antes de</text>
<text x="298" y="187.94" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >enviarlo. Reasigno tareas ya</text>
<text x="298" y="205.88" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >delegadas.</text>
<path d="M519,192 L537,192" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-046)"/>
<rect x="540" y="92" width="232" height="200" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M540,130 V104 a12,12 0 0 1 12,-12 H760 a12,12 0 0 1 12,12 V130 Z" fill="#bc4c00"/>
<text x="554" y="116" font-size="12" font-weight="800" fill="#ffffff" text-anchor="start" >3 · Compromisos en competencia</text>
<text x="554" y="152" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Ejemplo</text>
<text x="554" y="170" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >No quiero que algo salga mal</text>
<text x="554" y="187.94" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >con mi nombre. Miedo:</text>
<text x="554" y="205.88" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >parecer descuidado.</text>
<path d="M775,192 L793,192" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-046)"/>
<rect x="796" y="92" width="232" height="200" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<path d="M796,130 V104 a12,12 0 0 1 12,-12 H1016 a12,12 0 0 1 12,12 V130 Z" fill="#cf222e"/>
<text x="810" y="116" font-size="12" font-weight="800" fill="#ffffff" text-anchor="start" >4 · Gran supuesto</text>
<text x="810" y="152" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Ejemplo</text>
<text x="810" y="170" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >«Si no superviso, el trabajo</text>
<text x="810" y="187.94" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >bajará de nivel y se notará</text>
<text x="810" y="205.88" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >en mí.»</text>
<text x="28" y="330" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">ETAPAS DEL CAMBIO PERSONAL</text>
<rect x="28" y="346" width="185.6" height="84" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.5" />
<rect x="28.0" y="346" width="185.6" height="8" rx="4" fill="#1a7f37" fill-opacity="0.25"/>
<text x="40" y="378" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Precontemplación</text>
<text x="40" y="396" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >No ve el problema</text>
<rect x="227.6" y="346" width="185.6" height="84" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.5" />
<rect x="227.6" y="346" width="185.6" height="8" rx="4" fill="#1a7f37" fill-opacity="0.43"/>
<text x="239.6" y="378" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Contemplación</text>
<text x="239.6" y="396" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Lo evalúa, aún sin</text>
<text x="239.6" y="411.87" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >decidir</text>
<rect x="427.2" y="346" width="185.6" height="84" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.5" />
<rect x="427.2" y="346" width="185.6" height="8" rx="4" fill="#1a7f37" fill-opacity="0.61"/>
<text x="439.2" y="378" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Preparación</text>
<text x="439.2" y="396" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Planea y prueba</text>
<rect x="626.8" y="346" width="185.6" height="84" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.5" />
<rect x="626.8" y="346" width="185.6" height="8" rx="4" fill="#1a7f37" fill-opacity="0.79"/>
<text x="638.8" y="378" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Acción</text>
<text x="638.8" y="396" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Cambia la conducta</text>
<rect x="826.4" y="346" width="185.6" height="84" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.5" />
<rect x="826.4" y="346" width="185.6" height="8" rx="4" fill="#1a7f37" fill-opacity="0.97"/>
<text x="838.4" y="378" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Mantenimiento</text>
<text x="838.4" y="396" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Sostiene y previene</text>
<text x="838.4" y="411.87" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >recaídas</text>
<rect x="28" y="446" width="984" height="82" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="468" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Si el gran supuesto parece obvio, se pone a prueba con un experimento pequeño y seguro: delegar una tarea de bajo riesgo y observar qué</text>
<text x="44" y="485.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >ocurre. La resistencia es protección, no pereza.</text>
<text x="28" y="566" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >El ejemplo es ilustrativo. Las etapas surgieron del estudio de cambio de conductas de salud y se aplican con cautela al trabajo.</text>
</svg>
