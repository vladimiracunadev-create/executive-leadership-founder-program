id: 35
part: 02
title: "Presencia ejecutiva"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir gravitas de claridad mediante evidencia observable."
  - "Aplicar la secuencia: preparar tres mensajes y datos clave → regular ritmo, respiración y lenguaje → responder primero a la pregunta central → declarar incertidumbre y compromiso de seguimiento → solicitar feedback sobre impacto real."
  - "Interpretar respuestas evasivas, tiempo para llegar al punto, follow-ups cumplidos sin atribuir causalidad automática."
  - "Resolver el caso de presencia ejecutiva con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
  - "Auditar la adecuación contextual de imagen profesional, conducta no verbal y videoconferencia sin inferir competencia desde la apariencia."
deliverable: "risk-governance-brief.md"
references:
  - "Amy Cuddy — *Presence*"
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Nancy Duarte — *Resonate*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Barbara Minto — *The Pyramid Principle*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Yingyi Chang & Jose M. Cortina — *What should I wear to work? An integrative review of the impact of clothing in the workplace*. **Uso en esta clase:** distinguir efectos de percepción, variación contextual y sesgos de atribución sin convertir vestuario en competencia. DOI: <https://doi.org/10.1037/apl0001158>."
  - "Judith A. Hall, Terrence G. Horgan & Nora A. Murphy — *Nonverbal Communication*. **Uso en esta clase:** tratar las señales no verbales como procesos de emisión y percepción cuya interpretación requiere contexto y cautela. DOI: <https://doi.org/10.1146/annurev-psych-010418-103145>."
  - "Occupational Safety and Health Administration — *Computer Workstations eTool: Monitors*. **Uso en esta clase:** fundamentar distancia, altura, orientación, postura neutral y control de reflejos en videoconferencia. Fuente primaria: <https://www.osha.gov/etools/computer-workstations/components/monitors>."
limits:
  - "Trabajar presencia no debe imponer un molde cultural o físico único ni penalizar introversión, neurodiversidad, discapacidad, edad, género, origen cultural, rasgos físicos o estilos de comunicación no dominantes. Evalúa claridad, criterio, comportamiento y adaptación; no belleza, precio, conformidad estética ni teatralidad."
evidence_signals:
  - "respuestas evasivas"
  - "tiempo para llegar al punto"
  - "follow-ups cumplidos"
  - "feedback de audiencia"
  - "decisiones entendidas"
