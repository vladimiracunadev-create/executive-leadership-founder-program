id: 230
part: 19
title: "Estrategia digital"
duration_minutes: 150
level: "Etapa 5 — CEO → Transformador digital"
outcome: "gobernar tecnología, datos e IA como capacidades económicas y organizacionales"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir digital strategy de digitization mediante evidencia observable."
  - "Aplicar la secuencia: partir de estrategia y customer journey → identificar economics cambiables por digital → elegir capabilities diferenciadoras → definir build buy o partner → secuenciar transformation y metrics."
  - "Interpretar digital revenue, self-service adoption, cost-to-serve sin atribuir causalidad automática."
  - "Resolver el caso de estrategia digital con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "strategy-memo.md"
references:
  - "Marco Iansiti & Karim R. Lakhani — *Competing in the Age of AI*"
  - "Thomas H. Davenport & Nitin Mittal — *All-In on AI*"
  - "Nicole Forsgren, Jez Humble & Gene Kim — *Accelerate*"
  - "Thomas H. Davenport & Jeanne G. Harris — *Competing on Analytics*"
  - "NIST — *Cybersecurity Framework (CSF) 2.0*"
  - "George Westerman, Didier Bonnet & Andrew McAfee — *Leading Digital*"
  - "NIST — *AI Risk Management Framework*. <https://www.nist.gov/itl/ai-risk-management-framework>."
limits:
  - "Digitalizar un mal proceso puede automatizar desperdicio. Rediseña proceso y decisión antes o junto con tecnología."
evidence_signals:
  - "digital revenue"
  - "self-service adoption"
  - "cost-to-serve"
  - "cycle time"
  - "data reuse"
