<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 453.81" width="1040" role="img" aria-labelledby="t-s133 d-s133" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s133">Clase 133 · Tres tamaños de mercado y cómo se estiman</title>
<desc id="d-s133">Mercado total, mercado alcanzable y mercado obtenible: qué mide cada uno, cómo se estima y para qué decisión sirve.</desc>
<defs><marker id="p-s133" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="453.81" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 133 · Tres tamaños de mercado y cómo se estiman</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Kotler &amp; Keller · Kim &amp; Mauborgne · Porter</text>
<rect x="28" y="96" width="314.667" height="214.75" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M28.0,136 V108 a12,12 0 0 1 12,-12 H330.6666666666667 a12,12 0 0 1 12,12 V136 Z" fill="#0969da"/>
<text x="44" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Mercado total</text>
<circle cx="50.0" cy="154" r="4" fill="#0969da"/>
<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Toda la demanda posible de la</text>
<text x="64" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >categoría.</text>
<circle cx="50.0" cy="198.5" r="4" fill="#0969da"/>
<text x="64" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Se estima por arriba (datos de</text>
<text x="64" y="219.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >industria) y por abajo (clientes ×</text>
<text x="64" y="237" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >precio).</text>
<circle cx="50.0" cy="260.25" r="4" fill="#0969da"/>
<text x="64" y="264.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Sirve para ver el techo, no para</text>
<text x="64" y="281.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >planificar.</text>
<rect x="362.667" y="96" width="314.667" height="214.75" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M362.6666666666667,136 V108 a12,12 0 0 1 12,-12 H665.3333333333334 a12,12 0 0 1 12,12 V136 Z" fill="#1a7f37"/>
<text x="378.667" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Mercado alcanzable</text>
<circle cx="384.6666666666667" cy="154" r="4" fill="#1a7f37"/>
<text x="398.667" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >La parte que el modelo, los canales y</text>
<text x="398.667" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >la geografía permiten atender.</text>
<circle cx="384.6666666666667" cy="198.5" r="4" fill="#1a7f37"/>
<text x="398.667" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Se define con los segmentos elegidos.</text>
<circle cx="384.6666666666667" cy="225.75" r="4" fill="#1a7f37"/>
<text x="398.667" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Sirve para decidir dónde jugar.</text>
<rect x="697.333" y="96" width="314.667" height="214.75" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M697.3333333333334,136 V108 a12,12 0 0 1 12,-12 H1000.0 a12,12 0 0 1 12,12 V136 Z" fill="#bc4c00"/>
<text x="713.333" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Mercado obtenible</text>
<circle cx="719.3333333333334" cy="154" r="4" fill="#bc4c00"/>
<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Lo que realista y razonablemente se</text>
<text x="733.333" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >puede capturar en un plazo.</text>
<circle cx="719.3333333333334" cy="198.5" r="4" fill="#bc4c00"/>
<text x="733.333" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Depende de capacidad, competencia y</text>
<text x="733.333" y="219.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >ciclo de venta.</text>
<circle cx="719.3333333333334" cy="243.0" r="4" fill="#bc4c00"/>
<text x="733.333" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Sirve para metas y presupuestos.</text>
<rect x="28" y="326.75" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="348.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Una estimación creíble parte de abajo: cuántos clientes concretos, a qué precio y con qué frecuencia. Una que parte de «el 1 % de un</text>
<text x="44" y="366" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >mercado enorme» no demuestra nada.</text>
<text x="28" y="413.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las cifras de mercado de terceros dependen de definiciones distintas de categoría; se cita su fuente y se contrasta con datos propios.</text>
</svg>
