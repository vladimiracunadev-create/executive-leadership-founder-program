id: 153
part: 12
title: "Experimentos y evidencia"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "convertir problemas de clientes en productos validados y outcomes medibles"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Formular una hipótesis con métrica, umbral y decisión asociada."
  - "Elegir un diseño: prueba controlada, prueba piloto, experimento cualitativo o análisis observacional."
  - "Definir la métrica principal, las métricas de protección y la muestra."
  - "Interpretar resultados distinguiendo señal, ruido y efectos secundarios."
  - "Registrar y compartir el aprendizaje."
deliverable: "product-evidence-brief.md"
references:
  - "Ron Kohavi, Diane Tang & Ya Xu — *Trustworthy Online Controlled Experiments*"
  - "Eric Ries — *The Lean Startup*"
  - "David J. Bland & Alexander Osterwalder — *Testing Business Ideas*"
  - "Marty Cagan — *Inspired*"
  - "Daniel Kahneman, Olivier Sibony & Cass R. Sunstein — *Noise*"
limits:
  - "Con poco tráfico o con ciclos de decisión largos (ventas empresariales) los experimentos A/B son inviables o lentos; se usan diseños cualitativos y pilotos."
evidence_signals:
  - "hipótesis con métrica y umbral previos"
  - "muestra y duración calculadas"
  - "métricas de protección definidas"
  - "aprendizaje registrado"
