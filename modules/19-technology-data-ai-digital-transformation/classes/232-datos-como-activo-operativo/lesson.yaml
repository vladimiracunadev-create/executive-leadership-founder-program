id: 232
part: 19
title: "Datos como activo operativo"
duration_minutes: 150
level: "Etapa 5 — CEO → Transformador digital"
outcome: "gobernar tecnología, datos e IA como capacidades económicas y organizacionales"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir data product de data quality mediante evidencia observable."
  - "Aplicar la secuencia: identificar decisiones y productos de datos → definir dominios y owners → establecer calidad y contracts → habilitar acceso con governance → medir uso incidents y value."
  - "Interpretar data quality SLA, time-to-data, duplicate definitions sin atribuir causalidad automática."
  - "Resolver el caso de datos como activo operativo con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Marco Iansiti & Karim R. Lakhani — *Competing in the Age of AI*"
  - "Thomas H. Davenport & Nitin Mittal — *All-In on AI*"
  - "Andrew McAfee & Erik Brynjolfsson — *Machine, Platform, Crowd*"
  - "Thomas H. Davenport & Jeanne G. Harris — *Competing on Analytics*"
  - "NIST — *Cybersecurity Framework (CSF) 2.0*"
  - "George Westerman, Didier Bonnet & Andrew McAfee — *Leading Digital*"
limits:
  - "Una única fuente física no siempre es necesaria; lo crítico es semántica y governance. Evita centralización total si destruye velocidad sin mejorar consistencia."
evidence_signals:
  - "data quality SLA"
  - "time-to-data"
  - "duplicate definitions"
  - "data incidents"
  - "decision adoption"
