<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >medir realized price y pocket</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >margin</text>
