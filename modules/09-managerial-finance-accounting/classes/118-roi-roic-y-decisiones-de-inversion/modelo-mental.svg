<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456.06" width="1040" role="img" aria-labelledby="t-s118 d-s118" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s118">Clase 118 · Crecer solo crea valor si el retorno supera el costo del capital</title>
<desc id="d-s118">Cuadrante de retorno del capital frente a su costo y velocidad de crecimiento, con la decisión de inversión que sugiere cada zona.</desc>
<defs><marker id="p-s118" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="456.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 118 · Crecer solo crea valor si el retorno supera el costo del capital</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Koller et al. · Brealey, Myers &amp; Allen · Graham &amp; Harvey (2001)</text>
<text x="362.5" y="100" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >Retorno bajo el costo de capital</text>
<text x="799.5" y="100" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >Retorno sobre el costo de capital</text>
<text transform="translate(120,160.25) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">Crece mucho</text>
<text transform="translate(120,268.75) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">Crece poco</text>
<rect x="150" y="112" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<rect x="150.0" y="112.0" width="425.0" height="34" rx="12" fill="#cf222e"/>
<text x="166" y="135" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Crecer destruye valor</text>
<text x="166" y="170" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Crece mucho con retorno bajo el costo del capital:</text>
<text x="166" y="187.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >frenar o rediseñar antes de invertir más.</text>
<rect x="587" y="112" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="587.0" y="112.0" width="425.0" height="34" rx="12" fill="#1a7f37"/>
<text x="603" y="135" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Invertir para crecer</text>
<text x="603" y="170" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Crece mucho con retorno sobre el costo del capital: la</text>
<text x="603" y="187.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >zona de creación de valor.</text>
<rect x="150" y="220.5" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="1.8" />
<rect x="150.0" y="220.5" width="425.0" height="34" rx="12" fill="#59636e"/>
<text x="166" y="243.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Corregir o salir</text>
<text x="166" y="278.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No crece y rinde poco: reestructurar, vender o liquidar.</text>
<rect x="587" y="220.5" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="587.0" y="220.5" width="425.0" height="34" rx="12" fill="#0969da"/>
<text x="603" y="243.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Mejorar y cosechar</text>
<text x="603" y="278.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Crece poco con buen retorno: mejorar márgenes y</text>
<text x="603" y="295.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >distribuir caja.</text>
<rect x="28" y="329" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="351" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El crecimiento solo vale si cada dólar adicional rinde más que su costo. ROIC (retorno sobre el capital invertido) frente al costo de</text>
<text x="44" y="368.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >capital es la medida central.</text>
<text x="28" y="415.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las empresas usan reglas distintas en la práctica (periodo de recuperación, TIR, VPN); lo importante es comparar con el costo del capital.</text>
</svg>
