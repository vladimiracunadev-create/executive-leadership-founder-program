<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g64 d-g64" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g64">Ficha visual de la clase 064: Entrevistas estructuradas</title>
<desc id="d-g64">Conceptos: entrevista estructurada; behavioral question; situational question; scoring anchor; inter-rater reliability. Método: seleccionar competencias del scorecard → crear preguntas conductuales y situacionales → definir anchors antes de entrevistar → puntuar independientemente antes de debatir → calibrar discrepancias y guardar evidencia.</desc>
<defs><marker id="p-g64" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
