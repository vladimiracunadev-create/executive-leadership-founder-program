<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 491.54" width="1040" role="img" aria-labelledby="t-s73 d-s73" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s73">Clase 073 · Proyecto, producto, operación y programa no se gestionan igual</title>
<desc id="d-s73">Cuatro tipos de trabajo comparados por su fin, su medida de éxito y su gobierno.</desc>
<defs><marker id="p-s73" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="491.54" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 073 · Proyecto, producto, operación y programa no se gestionan igual</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >PMI (PMBOK) · Kerzner (2017)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Tipo</text>
<text x="188.274" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué es</text>
<text x="511.781" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cuándo termina</text>
<text x="727.452" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >El éxito se mide por</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Proyecto</text>
<text x="188.274" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Esfuerzo temporal para crear un resultado</text>
<text x="188.274" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >único.</text>
<text x="511.781" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Al entregar el resultado.</text>
<text x="727.452" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Alcance, plazo, costo y beneficio</text>
<text x="727.452" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >logrado.</text>
<rect x="28" y="189.12" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Producto</text>
<text x="188.274" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Algo que evoluciona y se mantiene mientras</text>
<text x="188.274" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >haya valor.</text>
<text x="511.781" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Al retirarlo del mercado.</text>
<text x="727.452" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Valor para clientes y resultados del</text>
<text x="727.452" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >negocio.</text>
<rect x="28" y="242.24" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="262.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Operación</text>
<text x="188.274" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Trabajo continuo y repetitivo que sostiene el</text>
<text x="188.274" y="278.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >negocio.</text>
<text x="511.781" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >No termina.</text>
<text x="727.452" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Calidad, costo unitario y continuidad.</text>
<rect x="28" y="295.36" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="315.36" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Programa</text>
<text x="188.274" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Conjunto de proyectos relacionados que se</text>
<text x="188.274" y="331.92" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >gestionan para obtener beneficios.</text>
<text x="511.781" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Al lograr los beneficios.</text>
<text x="727.452" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Beneficios que ningún proyecto logra</text>
<text x="727.452" y="331.92" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >solo.</text>
<rect x="28" y="364.48" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="386.48" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Un error frecuente es gestionar un producto como si fuera un proyecto con fecha de fin, o un proyecto como si fuera operación sin</text>
<text x="44" y="403.73" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >plazo. El tipo de trabajo decide el método, el gobierno y la medida de éxito.</text>
<text x="28" y="450.98" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las fronteras son prácticas: muchas iniciativas combinan tipos y conviene declararlo.</text>
</svg>
