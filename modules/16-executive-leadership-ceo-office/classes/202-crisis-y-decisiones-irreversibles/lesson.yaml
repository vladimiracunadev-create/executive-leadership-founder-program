id: 202
part: 16
title: "Crisis y decisiones irreversibles"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Clasificar una decisión según su reversibilidad y su daño potencial."
  - "Buscar el peor caso razonable y alternativas antes de comprometerte."
  - "Organizar un desafío independiente y evitar el pensamiento de grupo."
  - "Fraccionar el compromiso y definir reglas de parada y de reapertura."
  - "Decidir sobre una persona clave y con intervención de IA asignando responsabilidad humana."
deliverable: "leadership-decision-brief.md"
references:
  - "Gary Klein — *Sources of Power*"
  - "Karl E. Weick — *The Collapse of Sensemaking in Organizations: The Mann Gulch Disaster*"
  - "Ben Horowitz — *The Hard Thing About Hard Things*"
  - "Nassim Nicholas Taleb — *Antifragile*"
  - "Annie Duke — *How to Decide*"
limits:
  - "En una crisis real no siempre hay tiempo para un análisis completo; el objetivo es adaptar el rigor a la irreversibilidad y al daño, no exigir un proceso idéntico para todo."
evidence_signals:
  - "decisión clasificada por reversibilidad"
  - "peor caso y alternativas"
  - "desafío independiente organizado"
  - "regla de parada y registro"
