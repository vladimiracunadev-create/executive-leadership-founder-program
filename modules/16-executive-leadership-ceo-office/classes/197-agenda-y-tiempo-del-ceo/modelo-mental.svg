<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 402.06" width="1040" role="img" aria-labelledby="t-s197 d-s197" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s197">Clase 197 · La agenda del CEO: proteger, delegar, dejar margen</title>
<desc id="d-s197">Tres decisiones sobre el tiempo del CEO: qué se protege, qué se delega o elimina y qué margen se deja para lo imprevisto.</desc>
<defs><marker id="p-s197" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="402.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 197 · La agenda del CEO: proteger, delegar, dejar margen</text>
<text x="1012" y="43" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="end" >Drucker · Grove · Newport · Mankins &amp; Garton</text>
<rect x="28" y="96" width="314.667" height="163" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M28.0,136 V108 a12,12 0 0 1 12,-12 H330.6666666666667 a12,12 0 0 1 12,12 V136 Z" fill="#1a7f37"/>
<text x="44" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Proteger</text>
<circle cx="50.0" cy="154" r="4" fill="#1a7f37"/>
<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Bloques para pensar y decidir.</text>
<circle cx="50.0" cy="181.25" r="4" fill="#1a7f37"/>
<text x="64" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Tiempo con clientes, equipo y</text>
<text x="64" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >directorio.</text>
<circle cx="50.0" cy="225.75" r="4" fill="#1a7f37"/>
<text x="64" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Revisión mensual de la agenda.</text>
<rect x="362.667" y="96" width="314.667" height="163" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M362.6666666666667,136 V108 a12,12 0 0 1 12,-12 H665.3333333333334 a12,12 0 0 1 12,12 V136 Z" fill="#bc4c00"/>
<text x="378.667" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Delegar o eliminar</text>
<circle cx="384.6666666666667" cy="154" r="4" fill="#bc4c00"/>
<text x="398.667" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Reuniones de estado y de informe.</text>
<circle cx="384.6666666666667" cy="181.25" r="4" fill="#bc4c00"/>
<text x="398.667" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Decisiones que otro puede tomar.</text>
<circle cx="384.6666666666667" cy="208.5" r="4" fill="#bc4c00"/>
<text x="398.667" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Aprobaciones sin valor agregado.</text>
<rect x="697.333" y="96" width="314.667" height="163" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M697.3333333333334,136 V108 a12,12 0 0 1 12,-12 H1000.0 a12,12 0 0 1 12,12 V136 Z" fill="#0969da"/>
<text x="713.333" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Dejar margen</text>
<circle cx="719.3333333333334" cy="154" r="4" fill="#0969da"/>
<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Capacidad para crisis y</text>
<text x="733.333" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >oportunidades.</text>
<circle cx="719.3333333333334" cy="198.5" r="4" fill="#0969da"/>
<text x="733.333" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Espacio para reordenar prioridades.</text>
<circle cx="719.3333333333334" cy="225.75" r="4" fill="#0969da"/>
<text x="733.333" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Atención a señales débiles.</text>
<rect x="28" y="275" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="297" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El recurso más escaso del CEO es la atención. Una agenda debe reflejar las prioridades de la empresa; si no coincide con ellas, la</text>
<text x="44" y="314.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >agenda decide por el CEO.</text>
<text x="28" y="361.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Una agenda rígida falla en una crisis: conviene proteger lo estructural sin perder la capacidad de reordenar.</text>
</svg>
