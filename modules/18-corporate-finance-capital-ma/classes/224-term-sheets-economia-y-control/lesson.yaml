id: 224
part: 18
title: "Term sheets: economía y control"
duration_minutes: 150
level: "Etapa 5 — CEO → Capital allocator"
outcome: "decidir estructura de capital, valoración, fundraising y transacciones"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir liquidation preference de participation mediante evidencia observable."
  - "Aplicar la secuencia: separar economics de control → modelar waterfall en exits → revisar dilution protections → mapear veto y board rights → negociar conjunto y escenarios."
  - "Interpretar founder proceeds by exit, investor preference, board control sin atribuir causalidad automática."
  - "Resolver el caso de term sheets: economía y control con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Stephen Ross, Randolph Westerfield et al. — *Corporate Finance*"
  - "Donald DePamphilis — *Mergers, Acquisitions, and Other Restructuring Activities*"
  - "Ben Horowitz — *The Hard Thing About Hard Things*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Aswath Damodaran — *Investment Valuation*"
limits:
  - "Los términos dependen de jurisdicción y documentos definitivos. Esta clase enseña economics e issue spotting; usa abogados especializados antes de firmar."
evidence_signals:
  - "founder proceeds by exit"
  - "investor preference"
  - "board control"
  - "protective provisions"
  - "vesting exposure"
