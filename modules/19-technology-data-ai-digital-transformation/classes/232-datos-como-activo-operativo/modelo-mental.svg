<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g232 d-g232" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g232">Ficha visual de la clase 232: Datos como activo operativo</title>
<desc id="d-g232">Conceptos: data product; data quality; data owner; lineage; single source of truth. Método: identificar decisiones y productos de datos → definir dominios y owners → establecer calidad y contracts → habilitar acceso con governance → medir uso incidents y value.</desc>
<defs><marker id="p-g232" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
