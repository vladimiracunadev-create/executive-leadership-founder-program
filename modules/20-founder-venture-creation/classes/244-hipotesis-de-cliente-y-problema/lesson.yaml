id: 244
part: 20
title: "Hipótesis de cliente y problema"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir customer hypothesis de problem hypothesis mediante evidencia observable."
  - "Aplicar la secuencia: especificar segmento y contexto → redactar problema y consecuencia → listar evidencia esperada y contraria → priorizar supuesto de mayor riesgo → diseñar test y actualizar."
  - "Interpretar hypothesis pass-fail, early adopter density, contradictory interviews sin atribuir causalidad automática."
  - "Resolver el caso de hipótesis de cliente y problema con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "commercial-decision-brief.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Alexander Osterwalder & Yves Pigneur — *Business Model Generation*"
  - "David J. Bland & Alexander Osterwalder — *Testing Business Ideas*"
  - "Ben Horowitz — *The Hard Thing About Hard Things*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
  - "Noam Wasserman — *The Founder's Dilemmas*"
limits:
  - "Falsar una hipótesis no invalida todo el emprendimiento. Permite pivotar segmento, problema o propuesta; evita apego a formulación inicial."
evidence_signals:
  - "hypothesis pass-fail"
  - "early adopter density"
  - "contradictory interviews"
  - "workaround strength"
  - "commitment"
