<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g219 d-g219" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g219">Ficha visual de la clase 219: Deuda versus equity</title>
<desc id="d-g219">Conceptos: debt; equity; dilution; runway; default risk. Método: proyectar cash y downside → medir capacidad de servicio → cuantificar dilution y control → comparar términos y flexibilidad → seleccionar mezcla y plan B.</desc>
<defs><marker id="p-g219" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#cf222e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 219 · Deuda versus equity</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 18 · Alta dirección y gobierno</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#cf222e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >debt</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capital con obligación contractual de repago e interés</text>
<circle cx="38" cy="170" r="5" fill="#cf222e"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >equity</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capital residual con participación en propiedad</text>
<circle cx="38" cy="228" r="5" fill="#cf222e"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >dilution</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >reducción porcentual de propiedad por nueva emisión</text>
<circle cx="38" cy="286" r="5" fill="#cf222e"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >runway</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tiempo financiable antes de agotar caja</text>
<circle cx="38" cy="344" r="5" fill="#cf222e"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >default risk</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >riesgo de incumplir obligaciones de deuda</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="542" height="50" rx="9" fill="#cf222e" stroke="#cf222e" stroke-width="0" fill-opacity="0.98"/>
