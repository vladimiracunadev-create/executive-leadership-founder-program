<title id="t-g266">Ficha visual de la clase 266: Sistemas antes que heroicidad</title>
<desc id="d-g266">Conceptos: business system; standard work; SOP; exception path; process owner. Método: identificar procesos críticos → capturar standard y exceptions → asignar process owners → instrumentar métricas y controls → mejorar desde incidentes y feedback.</desc>
