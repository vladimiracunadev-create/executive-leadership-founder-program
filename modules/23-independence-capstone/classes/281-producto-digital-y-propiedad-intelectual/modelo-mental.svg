<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g281 d-g281" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g281">Ficha visual de la clase 281: Producto digital y propiedad intelectual</title>
<desc id="d-g281">Conceptos: digital product; IP; license; distribution; maintenance burden. Método: elegir problema repetible → crear minimum paid asset → definir IP y license → probar distribution y price → medir support y maintenance e iterate.</desc>
<defs><marker id="p-g281" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#59636e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 281 · Producto digital y propiedad intelectual</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 23 · Fundador, propietario e independencia</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#59636e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >digital product</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >activo digital reproducible vendido o licenciado</text>
<circle cx="38" cy="170" r="5" fill="#59636e"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >IP</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >activos protegibles o controlables mediante derechos y</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >contratos</text>
<circle cx="38" cy="242.12" r="5" fill="#59636e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >license</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >permiso para usar un activo bajo condiciones</text>
<circle cx="38" cy="300.12" r="5" fill="#59636e"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >distribution</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >canal para llegar de forma repetible a compradores</text>
<circle cx="38" cy="358.12" r="5" fill="#59636e"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >maintenance burden</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >costo continuo de actualización soporte y</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >compatibilidad</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#59636e"/>
