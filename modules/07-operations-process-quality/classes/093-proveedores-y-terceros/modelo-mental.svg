<rect x="522.4" y="456.24" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="535.4" cy="469.24" r="3.5" fill="#0969da"/>
<text x="546.4" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >tiempo de reemplazo</text>
<rect x="689.5" y="456.24" width="164" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="702.5" cy="469.24" r="3.5" fill="#0969da"/>
<text x="713.5" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >controles pendientes</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Duplicar proveedores no siempre es económico ni reduce riesgo si comparten la misma infraestructura. Analiza concentración real y</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >costo de salida, no solo número de contratos.</text>
