id: 67
part: 05
title: "Feedback, coaching y planes de mejora"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "diseñar un sistema de talento desde el cargo hasta la salida responsable"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Diagnosticar la causa de un desempeño insuficiente: claridad, capacidad, recursos o motivación."
  - "Elegir entre feedback, coaching, plan de mejora o decisión de gestión."
  - "Diseñar un plan de mejora con hechos, apoyo, metas, plazos y revisiones."
  - "Conducir la conversación con respeto y sin atribuir intención."
  - "Decidir al final del plan con evidencia y proceso, verificando la norma aplicable."
deliverable: "people-decision-brief.md"
references:
  - "Avraham N. Kluger & Angelo DeNisi — *The Effects of Feedback Interventions on Performance: A Historical Review, a Meta-Analysis, and a Preliminary Feedback Intervention Theory*"
  - "Douglas Stone & Sheila Heen — *Thanks for the Feedback*"
  - "John Whitmore — *Coaching for Performance*"
  - "Edwin A. Locke & Gary P. Latham — *Building a Practically Useful Theory of Goal Setting and Task Motivation: A 35-Year Odyssey*"
  - "Amy C. Edmondson — *The Fearless Organization*"
limits:
  - "No todo desempeño insuficiente es mejorable con un plan, y a veces la causa es un desajuste entre persona y cargo que se resuelve con un cambio."
evidence_signals:
  - "causa del desempeño diagnosticada"
  - "plan con apoyo y plazos"
  - "revisiones registradas"
  - "decisión justificada con hechos"
