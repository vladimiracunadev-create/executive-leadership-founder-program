<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g152 d-g152" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g152">Ficha visual de la clase 152: Priorización y costo de oportunidad</title>
<desc id="d-g152">Conceptos: priority; opportunity cost; RICE; WSJF; confidence. Método: definir criterio ligado a estrategia → estimar valor riesgo y costo → hacer explícita confianza → comparar cartera y dependencias → decidir y registrar qué se posterga.</desc>
<defs><marker id="p-g152" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#bc4c00"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 152 · Priorización y costo de oportunidad</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 12 · Dirección, estrategia y organización</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#bc4c00"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >priority</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >orden relativo de asignación de atención y recursos</text>
<circle cx="38" cy="170" r="5" fill="#bc4c00"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >opportunity cost</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >valor de la mejor alternativa sacrificada</text>
<circle cx="38" cy="228" r="5" fill="#bc4c00"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >RICE</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >alcance por impacto por confianza dividido por esfuerzo</text>
<circle cx="38" cy="286" r="5" fill="#bc4c00"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >WSJF</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cost of delay dividido por job size</text>
<circle cx="38" cy="344" r="5" fill="#bc4c00"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >confidence</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grado de evidencia que sustenta los supuestos de</text>
<text x="54" y="383.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >puntuación</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
