id: 110
part: 09
title: "Estado de resultados"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "leer la economía del negocio y decidir con estados, caja, márgenes, retorno y valoración"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Leer el estado de resultados por escalones: ingresos, margen bruto, resultado operacional, antes de impuestos y neto."
  - "Calcular márgenes y variaciones entre períodos y frente al plan."
  - "Separar lo recurrente de lo extraordinario."
  - "Explicar cómo el reconocimiento de ingresos y la clasificación de costos afectan la utilidad."
  - "Formular hipótesis sobre dónde se origina un problema de rentabilidad."
deliverable: "leadership-decision-brief.md"
references:
  - "Krishna G. Palepu, Paul M. Healy & Erik Peek — *Business Analysis and Valuation*"
  - "Stephen H. Penman — *Financial Statement Analysis and Security Valuation*"
  - "Charles Horngren et al. — *Cost Accounting: A Managerial Emphasis*"
  - "Howard Schilit, Jeremy Perler & Yoni Engelhart — *Financial Shenanigans*"
  - "IFRS Foundation — *IFRS Accounting Standards*"
limits:
  - "Los resultados dependen de estimaciones y criterios (vidas útiles, provisiones, reconocimiento), y de las políticas de cada empresa."
evidence_signals:
  - "lectura por escalones y en porcentajes"
  - "resultado recurrente separado del puntual"
  - "variación descompuesta en volumen, precio y mezcla"
  - "utilidad contrastada con caja operativa"
