<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g134 d-g134" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g134">Ficha visual de la clase 134: Investigación de mercado</title>
<desc id="d-g134">Conceptos: secondary research; qualitative research; quantitative research; sample; bias. Método: formular decisión de investigación → revisar fuentes secundarias → explorar cualitativamente → diseñar medición cuantitativa si procede → triangular y declarar límites.</desc>
<defs><marker id="p-g134" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="602.36" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
