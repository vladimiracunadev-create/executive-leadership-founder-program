<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g149 d-g149" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g149">Ficha visual de la clase 149: Prototipos y aprendizaje temprano</title>
<desc id="d-g149">Conceptos: prototype; fidelity; desirability risk; usability risk; technical spike. Método: formular pregunta de aprendizaje → elegir incertidumbre dominante → seleccionar fidelidad mínima → observar conducta durante prueba → registrar evidencia y decidir siguiente incremento.</desc>
<defs><marker id="p-g149" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
