<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >comparar costo y control</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#cf222e"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#cf222e" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >stress-test covenants y liquidez</text>
