<text x="52" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >gross margin</text>
<rect x="146.8" y="442.12" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="159.8" cy="455.12" r="3.5" fill="#8250df"/>
<text x="170.8" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >contribution margin</text>
<rect x="313.9" y="442.12" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
