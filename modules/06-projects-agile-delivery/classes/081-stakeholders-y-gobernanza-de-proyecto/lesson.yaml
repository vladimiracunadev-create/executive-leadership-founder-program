id: 81
part: 06
title: "Stakeholders y gobernanza de proyecto"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Identificar y clasificar a los interesados de un proyecto con poder, legitimidad y urgencia."
  - "Diseñar una estructura de gobernanza con roles, foros y frecuencias."
  - "Definir tolerancias de plazo, costo y alcance que determinen cuándo se escala."
  - "Planificar el compromiso y la comunicación con cada interesado."
  - "Preparar informes que permitan decidir y no solo informar."
deliverable: "leadership-decision-brief.md"
references:
  - "Harold Kerzner — *Project Management*"
  - "Project Management Institute — *A Guide to the Project Management Body of Knowledge (PMBOK Guide)*"
  - "Ronald K. Mitchell, Bradley R. Agle & Donna J. Wood — *Toward a Theory of Stakeholder Identification and Salience: Defining the Principle of Who and What Really Counts*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "Bent Flyvbjerg & Dan Gardner — *How Big Things Get Done*"
limits:
  - "Las estructuras formales no reemplazan las relaciones con los interesados: se necesita confianza y comunicación informal."
evidence_signals:
  - "interesados mapeados"
  - "decisiones con dueño"
  - "tolerancias definidas"
  - "reportes con decisiones pedidas"
