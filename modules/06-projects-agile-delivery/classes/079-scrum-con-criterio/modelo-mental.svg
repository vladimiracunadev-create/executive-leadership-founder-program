<text x="806.5" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="826.5" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Retrospectiva</text>
<text x="798.5" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >El equipo inspecciona cómo</text>
<text x="798.5" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >trabajó y acuerda mejoras.</text>
<path d="M897.25,229.0 V249.0 H142.75 V231.0" stroke="#59636e" stroke-width="2" fill="none" stroke-dasharray="7 6" marker-end="url(#p-s79)"/>
<text x="520" y="243" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >el siguiente Sprint empieza al terminar el anterior</text>
<rect x="28" y="265" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="287" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Tres roles: dueño del producto, desarrolladores y Scrum Master. Tres artefactos con su compromiso: backlog del producto (objetivo del</text>
<text x="44" y="304.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >producto), backlog del Sprint (objetivo del Sprint) e incremento (definición de hecho).</text>
<text x="28" y="351.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Scrum es un marco, no una metodología completa: deja sin definir muchas prácticas, que cada equipo debe decidir.</text>
</svg>
