<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 036 · Capstone: comunicar una decisión impopular</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 02 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >decisión impopular</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >elección legítima que impone costos a parte de los</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >stakeholders</text>
<circle cx="38" cy="184.12" r="5" fill="#1a7f37"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >criterio</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >regla usada para comparar alternativas</text>
<circle cx="38" cy="242.12" r="5" fill="#1a7f37"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >impacto humano</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >efecto sobre carga, seguridad, rol, identidad o</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >confianza</text>
<circle cx="38" cy="314.24" r="5" fill="#1a7f37"/>
