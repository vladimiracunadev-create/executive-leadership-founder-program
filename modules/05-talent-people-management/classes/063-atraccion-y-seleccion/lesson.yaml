id: 63
part: 05
title: "Atracción y selección"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "diseñar un sistema de talento desde el cargo hasta la salida responsable"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Explicar qué significa la validez de un método de selección y cómo se estima."
  - "Comparar métodos de selección según su capacidad predictiva y sus riesgos."
  - "Diseñar un proceso con varias fuentes de información y criterios previos."
  - "Atraer candidatos adecuados con un aviso claro y honesto."
  - "Reducir sesgos y evitar discriminación en el proceso."
deliverable: "people-decision-brief.md"
references:
  - "Frank L. Schmidt & John E. Hunter — *The validity and utility of selection methods in personnel psychology: Practical and theoretical implications of 85 years of research findings*"
  - "Paul R. Sackett, Charlene Zhang, Christopher M. Berry & Filip Lievens — *Revisiting meta-analytic estimates of validity in personnel selection: Addressing systematic overcorrection for restriction of range*"
  - "Julia Levashina, Christopher J. Hartwell, Frederick P. Morgeson & Michael A. Campion — *The Structured Employment Interview: Narrative and Quantitative Review of the Research Literature*"
  - "Laszlo Bock — *Work Rules!*"
  - "Daniel Kahneman, Olivier Sibony & Cass R. Sunstein — *Noise*"
limits:
  - "Los metaanálisis ofrecen promedios; la validez en un cargo concreto puede ser distinta, y la revisión de 2022 muestra que las estimaciones son discutibles."
evidence_signals:
  - "criterios previos al proceso"
  - "métodos con evidencia de validez"
  - "sesgos controlados"
  - "evaluación del proceso tras contratar"
