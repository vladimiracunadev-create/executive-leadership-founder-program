id: 252
part: 20
title: "Capstone: launch readiness"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir launch readiness de go-no-go criterion mediante evidencia observable."
  - "Aplicar la secuencia: revisar customer y value evidence → validar product ops y security → confirmar pricing channel y support → definir cohort y success-stop metrics → decidir go limited-go o no-go."
  - "Interpretar activation, support load, critical defects sin atribuir causalidad automática."
  - "Resolver el caso de capstone: launch readiness con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Alexander Osterwalder & Yves Pigneur — *Business Model Generation*"
  - "Noam Wasserman — *The Founder's Dilemmas*"
  - "Rob Fitzpatrick — *The Mom Test*"
  - "Ben Horowitz — *The Hard Thing About Hard Things*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
limits:
  - "Un checklist puede crear falsa seguridad. Prioriza riesgos que pueden dañar clientes, caja o reputación y limita rollout cuando incertidumbre sigue alta."
evidence_signals:
  - "activation"
  - "support load"
  - "critical defects"
  - "cash runway"
  - "paid conversion"
