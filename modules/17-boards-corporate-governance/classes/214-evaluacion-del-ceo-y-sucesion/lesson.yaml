id: 214
part: 17
title: "Evaluación del CEO y sucesión"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "separar propiedad, administración y supervisión para gobernar estrategia, riesgo y sucesión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir expectativas ex ante con objetivos y conductas acordados."
  - "Equilibrar resultados financieros, estratégicos y conductas de liderazgo."
  - "Reunir evidencia y contexto de varias fuentes."
  - "Reducir el ruido y los sesgos del juicio de los directores."
  - "Conectar la evaluación con la compensación, el desarrollo y la sucesión."
deliverable: "people-decision-brief.md"
references:
  - "Ram Charan — *Boards That Deliver*"
  - "Elena L. Botelho, Kim R. Powell & Tahl Raz — *The CEO Next Door*"
  - "Bob Tricker — *Corporate Governance*"
  - "Daniel Kahneman, Olivier Sibony & Cass R. Sunstein — *Noise*"
  - "Robert S. Kaplan & David P. Norton — *The Balanced Scorecard*"
limits:
  - "La evaluación requiere juicio, pero anclado en objetivos, contexto y evidencia acordados; evita cambiar criterios retroactivamente para justificar una opinión."
evidence_signals:
  - "expectativas fijadas antes del período"
  - "resultados y conductas evaluados"
  - "ruido reducido con calibración"
  - "vínculo con compensación y sucesión"
