<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Resultados deseados y KPI con ficha</text>
<text x="64" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >(097–101).</text>
<circle cx="50.0" cy="198.5" r="4" fill="#0969da"/>
<text x="64" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Tablero con pocas perspectivas (102).</text>
<circle cx="50.0" cy="225.75" r="4" fill="#0969da"/>
<text x="64" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Datos acordados antes de la reunión</text>
<text x="64" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >(104).</text>
<rect x="362.667" y="96" width="314.667" height="180.25" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M362.6666666666667,136 V108 a12,12 0 0 1 12,-12 H665.3333333333334 a12,12 0 0 1 12,12 V136 Z" fill="#bc4c00"/>
<text x="378.667" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Conducir</text>
