id: 108
part: 08
title: "Capstone: operating review gerencial"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "dirigir mediante outcomes, métricas, revisiones y asignación explícita de recursos"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir operating review de scorecard mediante evidencia observable."
  - "Aplicar la secuencia: preparar scorecard y variances → actualizar forecast → identificar top risks y asks → decidir recursos y acciones → registrar y revisar en próxima cadencia."
  - "Interpretar forecast accuracy, actions closed, resource shifts sin atribuir causalidad automática."
  - "Resolver el caso de capstone: operating review gerencial con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "John Doerr — *Measure What Matters*"
  - "Robert S. Kaplan & David P. Norton — *The Balanced Scorecard*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
  - "Bernard Marr — *Key Performance Indicators*"
  - "Robert S. Kaplan & David P. Norton — *Strategy Maps*"
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
limits:
  - "Un review no debe sustituir trabajo diario ni convertirse en mecanismo de vigilancia individual. Mantén foco en sistema, decisiones y accountability del nivel correcto."
evidence_signals:
  - "forecast accuracy"
  - "actions closed"
  - "resource shifts"
  - "risks escalated"
  - "outcome trend"
