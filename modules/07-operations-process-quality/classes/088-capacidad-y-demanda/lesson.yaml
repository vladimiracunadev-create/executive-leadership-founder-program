id: 88
part: 07
title: "Capacidad y demanda"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "operar procesos end-to-end con capacidad, calidad, continuidad y mejora"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir demand rate de capacity rate mediante evidencia observable."
  - "Aplicar la secuencia: medir demanda por tipo y periodo → medir capacidad efectiva → segmentar variabilidad y picos → diseñar buffer o flex capacity → regular ingreso cuando supera sistema."
  - "Interpretar utilization, queue length, wait time sin atribuir causalidad automática."
  - "Resolver el caso de capacidad y demanda con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "operating-improvement-brief.md"
references:
  - "Nigel Slack & Alistair Brandon-Jones — *Operations Management*"
  - "Eliyahu M. Goldratt & Jeff Cox — *The Goal*"
  - "Michael Hammer & James Champy — *Reengineering the Corporation*"
  - "James P. Womack & Daniel T. Jones — *Lean Thinking*"
  - "Geary A. Rummler & Alan P. Brache — *Improving Performance*"
  - "James P. Womack, Daniel T. Jones & Daniel Roos — *The Machine That Changed the World*"
limits:
  - "Más buffer cuesta dinero. La meta no es baja utilización universal, sino equilibrar costo de capacidad con costo de espera, pérdida de demanda y criticidad."
evidence_signals:
  - "utilization"
  - "queue length"
  - "wait time"
  - "lost demand"
  - "overtime"
