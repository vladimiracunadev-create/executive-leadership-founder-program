<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g15 d-g15" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g15">Ficha visual de la clase 015: Pensamiento sistémico para líderes</title>
<desc id="d-g15">Conceptos: sistema; feedback loop; stock; demora; apalancamiento. Método: definir frontera y propósito del sistema → mapear variables y relaciones causales → identificar loops reforzadores y balanceadores → localizar demoras y acumulaciones → probar intervenciones en puntos de apalancamiento.</desc>
<defs><marker id="p-g15" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="602.36" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
