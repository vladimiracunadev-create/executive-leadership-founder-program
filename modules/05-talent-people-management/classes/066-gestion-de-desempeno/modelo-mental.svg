<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 522.56" width="1040" role="img" aria-labelledby="t-s66 d-s66" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s66">Clase 066 · Un ciclo de gestión del desempeño que se usa todo el año</title>
<desc id="d-s66">Ciclo de gestión del desempeño: expectativas, conversaciones frecuentes, evidencia, revisión y decisiones sobre las personas.</desc>
<defs><marker id="p-s66" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
