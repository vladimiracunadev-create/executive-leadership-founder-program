<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g176 d-g176" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g176">Ficha visual de la clase 176: Diagnóstico de cambio</title>
<desc id="d-g176">Conceptos: change diagnosis; stakeholder; readiness; resistance; reinforcement. Método: definir conducta futura observable → mapear stakeholders y pérdidas → diagnosticar conocimiento motivación y capacidad → identificar barreras de sistema → diseñar intervención segmentada y feedback.</desc>
<defs><marker id="p-g176" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
