id: 80
part: 06
title: "Kanban y flujo"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Explicar las prácticas centrales del método Kanban."
  - "Construir un tablero que refleje el flujo real y sus políticas."
  - "Definir límites de trabajo en curso y justificar su efecto con la ley de Little."
  - "Medir tiempo de ciclo, rendimiento y trabajo en curso."
  - "Decidir cuándo conviene Kanban y cuándo Scrum o ambos."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "David J. Anderson — *Kanban*"
  - "John D. C. Little — *A Proof for the Queuing Formula: L = λW*"
  - "Donald G. Reinertsen — *The Principles of Product Development Flow*"
  - "Eliyahu M. Goldratt & Jeff Cox — *The Goal*"
  - "Ken Schwaber & Jeff Sutherland — *The Scrum Guide*"
limits:
  - "La ley de Little describe promedios en sistemas estables y puede distorsionarse con cambios fuertes de demanda."
evidence_signals:
  - "flujo visible"
  - "límites de trabajo en curso"
  - "tiempo de ciclo medido"
  - "cuellos de botella atendidos"
