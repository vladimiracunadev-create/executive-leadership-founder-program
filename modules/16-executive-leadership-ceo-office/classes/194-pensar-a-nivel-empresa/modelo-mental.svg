<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 194 · Pensar a nivel empresa en cinco movimientos</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Rumelt · Kaplan &amp; Norton · Koller et al.</text>
