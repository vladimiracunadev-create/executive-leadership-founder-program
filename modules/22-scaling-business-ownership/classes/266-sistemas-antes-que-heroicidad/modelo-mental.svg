<text x="52" y="257.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="72" y="250.5" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Mejora desde</text>
<text x="72" y="269.13" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >incidentes</text>
<text x="44" y="289.76" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Cada falla ajusta el</text>
<text x="44" y="307.01" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >sistema.</text>
<path d="M142.75,325.0 V345.0 H142.75 V196.5" stroke="#59636e" stroke-width="2" fill="none" stroke-dasharray="7 6" marker-end="url(#p-s266)"/>
<text x="142.75" y="339" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >las excepciones actualizan el estándar</text>
<rect x="28" y="361" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="383" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Un sistema demasiado rígido o prematuro frena el aprendizaje. Se documenta lo que ya se repite y se deja espacio al criterio donde cada</text>
<text x="44" y="400.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >caso es distinto.</text>
<text x="28" y="447.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Si una persona heroica sostiene el proceso, el proceso aún no existe.</text>
</svg>
