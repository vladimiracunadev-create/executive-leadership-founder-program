<text x="692" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >comparar proceso y</text>
<text x="692" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >resultado sin</text>
<text x="692" y="276.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >hindsight</text>
