<text x="337.9" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >conversion output-to-outcome</text>
<rect x="543.1" y="442.12" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="556.1" cy="455.12" r="3.5" fill="#8250df"/>
<text x="567.1" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cost per outcome</text>
<rect x="689.5" y="442.12" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="702.5" cy="455.12" r="3.5" fill="#8250df"/>
<text x="713.5" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >acciones sin efecto</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="488.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un outcome puede estar influido por factores fuera del equipo. No lo conviertas en evaluación simplista de una persona; combina</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >controlabilidad, contribución y contexto.</text>
</svg>
