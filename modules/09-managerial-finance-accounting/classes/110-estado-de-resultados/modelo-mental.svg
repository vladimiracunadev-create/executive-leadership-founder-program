<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g110 d-g110" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g110">Ficha visual de la clase 110: Estado de resultados</title>
<desc id="d-g110">Conceptos: margen bruto; resultado operativo; EBITDA; partida no recurrente; resultado normalizado. Método: reconstruir cascada de resultados → calcular márgenes por nivel → separar operativo y no operativo → normalizar no recurrentes → comparar tendencia y explicar drivers.</desc>
<defs><marker id="p-g110" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
