<title id="t-g260">Ficha visual de la clase 260: Contratación, honorarios y obligaciones laborales: panorama</title>
<desc id="d-g260">Conceptos: contrato indefinido; plazo fijo; obra o faena; honorarios; subordinación y dependencia. Método: clasificar hechos de la relación → elegir contrato y modalidad → redactar cláusulas y anexos → registrar y operar jornada cotizaciones y prevención → gestionar cambios y término con evidencia.</desc>
