<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474.06" width="1040" role="img" aria-labelledby="t-s115 d-s115" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s115">Clase 115 · Presupuesto y forecast cumplen funciones distintas</title>
<desc id="d-s115">El presupuesto como compromiso y asignación frente al forecast como mejor estimación actualizada.</desc>
<defs><marker id="p-s115" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="474.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 115 · Presupuesto y forecast cumplen funciones distintas</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Jensen (2003) · Palepu, Healy &amp; Peek · Brealey, Myers &amp; Allen</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">PRESUPUESTO</text>
<rect x="28" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Compromiso</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Fija metas y asigna recursos para el período.</text>
<rect x="28" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="177.25" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se congela</text>
<text x="46" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Sirve de referencia para evaluar desvíos.</text>
<rect x="28" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="28.0" y="250.5" width="6" height="63.25" rx="3" fill="#cf222e"/>
<text x="46" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Riesgo</text>
<text x="46" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Si se usa para pagar bonos, se negocia a la baja.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">FORECAST</text>
<rect x="532" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Expectativa</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Es la mejor estimación actual de lo que ocurrirá.</text>
<rect x="532" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="532.0" y="177.25" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<text x="550" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se actualiza</text>
<text x="550" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se revisa con regularidad y cambia con la información.</text>
<rect x="532" y="250.5" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="532.0" y="250.5" width="6" height="80.5" rx="3" fill="#bc4c00"/>
<text x="550" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Riesgo</text>
<text x="550" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Sin disciplina se ajusta para coincidir con lo que pasa y no</text>
<text x="550" y="307.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >enseña nada.</text>
<rect x="28" y="347" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="369" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Jensen advierte que atar el pago al cumplimiento de un presupuesto acordado premia a quien miente al negociarlo. Conviene separar la</text>
<text x="44" y="386.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >planificación de la evaluación.</text>
<text x="28" y="433.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Algunas organizaciones usan presupuestos móviles o planes por objetivos; el principio de separar estimación y evaluación se mantiene.</text>
</svg>
