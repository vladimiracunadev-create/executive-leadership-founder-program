<title id="t-g195">Ficha visual de la clase 195: Construir el executive team</title>
<desc id="d-g195">Conceptos: executive team; functional advocacy; collective accountability; constructive conflict; team charter. Método: definir mandato colectivo → seleccionar complementariedad y roles → crear normas de conflicto y decisión → diseñar cadencia enterprise → medir comportamiento y resultados colectivos.</desc>
