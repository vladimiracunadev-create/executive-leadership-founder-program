<text x="880" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >y comprobar</text>
<text x="880" y="276.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >comprensión</text>
