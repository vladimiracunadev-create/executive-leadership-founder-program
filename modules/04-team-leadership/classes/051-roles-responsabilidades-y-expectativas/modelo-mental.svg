<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 441.86" width="1040" role="img" aria-labelledby="t-s51 d-s51" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s51">Clase 051 · Matriz de responsabilidades: una sola persona responde</title>
<desc id="d-s51">Ejemplo de matriz de responsabilidades con quien decide, quien ejecuta, quien es consultado y quien es informado en cuatro decisiones.</desc>
<defs><marker id="p-s51" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
