<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 478.42" width="1040" role="img" aria-labelledby="t-s63 d-s63" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s63">Clase 063 · Qué métodos de selección predicen el desempeño</title>
<desc id="d-s63">Comparación cualitativa de métodos de selección según su capacidad para predecir desempeño y sus cuidados.</desc>
<defs><marker id="p-s63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="478.42" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 063 · Qué métodos de selección predicen el desempeño</text>
<text x="1012" y="43" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="end" >Schmidt &amp; Hunter (1998) · Sackett et al. (2022)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Método</text>
<text x="281.967" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué aporta</text>
<text x="636.852" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cuidado</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Entrevista estructurada</text>
<text x="281.967" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Entre los métodos más predictivos, según la</text>
<text x="281.967" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >revisión de 2022.</text>
<text x="636.852" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Exige diseño: preguntas y escala previas.</text>
<rect x="28" y="189.12" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Muestra de trabajo</text>
<text x="281.967" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Mide lo que se hará en el cargo.</text>
<text x="636.852" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Costo de diseño; debe ser realista.</text>
<rect x="28" y="225.68" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="245.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Capacidad cognitiva general</text>
<text x="281.967" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Predice aprendizaje y desempeño en muchos cargos.</text>
<text x="636.852" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Puede generar impacto adverso; usar con criterio.</text>
<rect x="28" y="262.24" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="282.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Entrevista no estructurada</text>
<text x="281.967" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Predice menos que la estructurada.</text>
<text x="636.852" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Más sesgos de quien entrevista.</text>
<rect x="28" y="298.8" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="318.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Años de experiencia</text>
<text x="281.967" y="318.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Predice poco por sí solos.</text>
<text x="636.852" y="318.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Confunde tiempo con aprendizaje.</text>
<rect x="28" y="351.36" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="373.36" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Sackett et al. revisaron a la baja varias estimaciones clásicas de Schmidt y Hunter (1998) al corregir la sobrecorrección por</text>
<text x="44" y="390.61" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >restricción de rango; el lugar de la entrevista estructurada salió reforzado.</text>
<text x="28" y="437.86" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las estimaciones son promedios de metaanálisis; la validez en un cargo concreto depende del diseño y de la muestra.</text>
</svg>
