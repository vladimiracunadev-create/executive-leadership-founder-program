id: 50
part: 04
title: "Propósito, objetivos y team charter"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "crear equipos con propósito, coordinación, confianza, aprendizaje y accountability"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir propósito de objetivo mediante evidencia observable."
  - "Aplicar la secuencia: formular propósito externo → definir 3–5 outcomes y métricas → asignar roles y derechos de decisión → acordar normas observables → revisar charter después de 30–60 días."
  - "Interpretar objetivos entendidos, conflictos por decisión, normas incumplidas sin atribuir causalidad automática."
  - "Resolver el caso de propósito, objetivos y team charter con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "J. Richard Hackman — *Leading Teams*"
  - "Patrick Lencioni — *The Five Dysfunctions of a Team*"
  - "Kim Scott — *Radical Candor*"
  - "Michael Bungay Stanier — *The Coaching Habit*"
  - "Liz Wiseman — *Multipliers*"
  - "Jon R. Katzenbach & Douglas K. Smith — *The Wisdom of Teams*"
limits:
  - "Un charter excesivamente detallado se vuelve burocracia y envejece rápido. Documenta las ambigüedades que generan costo, no cada comportamiento imaginable."
evidence_signals:
  - "objetivos entendidos"
  - "conflictos por decisión"
  - "normas incumplidas"
  - "reuniones reabiertas"
  - "claridad de propósito"
