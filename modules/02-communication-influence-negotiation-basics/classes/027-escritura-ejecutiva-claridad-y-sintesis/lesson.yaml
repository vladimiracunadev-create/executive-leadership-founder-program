id: 27
part: 02
title: "Escritura ejecutiva: claridad y síntesis"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir bottom line de pirámide mediante evidencia observable."
  - "Aplicar la secuencia: definir decisión del lector → escribir conclusión provisional → agrupar razones en 2–4 argumentos → adjuntar evidencia a cada claim → editar redundancia y cerrar con acción."
  - "Interpretar tiempo de lectura, preguntas que el memo deja abiertas, claims sin evidencia sin atribuir causalidad automática."
  - "Resolver el caso de escritura ejecutiva: claridad y síntesis con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Robert B. Cialdini — *Influence*"
  - "Dale Carnegie — *How to Win Friends and Influence People*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Barbara Minto — *The Pyramid Principle*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
limits:
  - "La pirámide no debe ocultar incertidumbre ni forzar una conclusión antes de analizar. Es una estructura de comunicación, no una excusa para cherry-picking."
evidence_signals:
  - "tiempo de lectura"
  - "preguntas que el memo deja abiertas"
  - "claims sin evidencia"
  - "extensión del cuerpo versus anexos"
  - "decisiones tomadas sin reunión"
