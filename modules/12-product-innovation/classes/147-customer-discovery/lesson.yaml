id: 147
part: 12
title: "Customer discovery"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "convertir problemas de clientes en productos validados y outcomes medibles"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Preparar entrevistas con las tres preguntas que más importa responder."
  - "Formular preguntas sobre comportamiento pasado y no sobre intenciones."
  - "Clasificar lo que dice el cliente en hechos, opiniones, cortesías e ideas."
  - "Pedir compromisos que muestren interés real."
  - "Sintetizar aprendizajes y decidir qué hacer con ellos."
deliverable: "product-evidence-brief.md"
references:
  - "Rob Fitzpatrick — *The Mom Test*"
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Teresa Torres — *Continuous Discovery Habits*"
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
  - "Alexander Osterwalder et al. — *Value Proposition Design*"
limits:
  - "Las entrevistas no permiten estimar el tamaño del mercado ni la probabilidad de compra."
evidence_signals:
  - "preguntas sobre hechos pasados"
  - "cortesías distinguidas de evidencia"
  - "compromisos y avances buscados"
  - "notas sintetizadas por patrones"
