  - "Hamilton Helmer — *7 Powers*"
  - "David J. Teece — *Dynamic Capabilities and Strategic Management*"
  - "W. Chan Kim & Renée Mauborgne — *Blue Ocean Strategy*"
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
limits:
  - "Un Canvas es una fotografía. No reemplaza estados financieros, procesos, regulación ni estrategia competitiva; úsalo como mapa para formular y probar hipótesis."
evidence_signals:
