<title id="t-g114">Ficha visual de la clase 114: Capital de trabajo</title>
<desc id="d-g114">Conceptos: working capital; DSO; DIO; DPO; cash conversion cycle. Método: calcular componentes operativos → convertir saldos a días → identificar driver de variación → modelar caja liberada por mejoras → evitar trasladar riesgo abusivamente a proveedores o clientes.</desc>
