<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Validación técnica con el equipo usuario</text>
<text x="358.353" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cliente y preventa</text>
