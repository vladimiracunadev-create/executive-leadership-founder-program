<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >agrupación por producto cliente o geografía con mayor</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >autonomía</text>
<circle cx="38" cy="242.12" r="5" fill="#bc4c00"/>
