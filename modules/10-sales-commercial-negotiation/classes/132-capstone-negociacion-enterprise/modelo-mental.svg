<text x="44" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Quién decide, influye,</text>
<text x="44" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >bloquea y paga (122, 124).</text>
