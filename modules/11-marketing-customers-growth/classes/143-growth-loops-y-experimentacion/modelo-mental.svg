<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616.48" width="1040" role="img" aria-labelledby="t-g143 d-g143" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g143">Ficha visual de la clase 143: Growth loops y experimentación</title>
<desc id="d-g143">Conceptos: growth loop; viral loop; content loop; experiment; incrementality. Método: mapear input-action-output-reinvestment → identificar tasa de ciclo → formular palanca → experimentar con control o baseline → escalar solo efecto incremental sostenible.</desc>
<defs><marker id="p-g143" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="616.48" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#8250df"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 143 · Growth loops y experimentación</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 11 · Gestión de negocio</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#8250df"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >growth loop</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ciclo donde una acción de usuarios produce recursos que</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >alimentan nuevo crecimiento</text>
<circle cx="38" cy="184.12" r="5" fill="#8250df"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >viral loop</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >crecimiento impulsado por exposición o invitación entre</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >usuarios</text>
<circle cx="38" cy="256.24" r="5" fill="#8250df"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >content loop</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >contenido generado o financiado por uso que atrae nueva</text>
<text x="54" y="295.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >demanda</text>
<circle cx="38" cy="328.36" r="5" fill="#8250df"/>
<text x="54" y="333.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >experiment</text>
<text x="54" y="351.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >prueba con hipótesis, métrica y comparación</text>
<circle cx="38" cy="386.36" r="5" fill="#8250df"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >incrementality</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >crecimiento causado por intervención más allá de lo que</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >habría ocurrido</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="542" height="50" rx="9" fill="#8250df" stroke="#8250df" stroke-width="0" fill-opacity="0.98"/>
<text x="484" y="124" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >1</text>
<text x="504" y="124" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >mapear input-action-output-reinvestment</text>
<rect x="487" y="160" width="508" height="50" rx="9" fill="#8250df" stroke="#8250df" stroke-width="0" fill-opacity="0.9099999999999999"/>
<text x="501" y="180" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >2</text>
<text x="521" y="180" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >identificar tasa de ciclo</text>
<rect x="504" y="216" width="474" height="50" rx="9" fill="#8250df" stroke="#8250df" stroke-width="0" fill-opacity="0.84"/>
<text x="518" y="236" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >3</text>
<text x="538" y="236" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >formular palanca</text>
<rect x="521" y="272" width="440" height="50" rx="9" fill="#8250df" stroke="#8250df" stroke-width="0" fill-opacity="0.77"/>
<text x="535" y="292" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >4</text>
<text x="555" y="292" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >experimentar con control o baseline</text>
<rect x="538" y="328" width="406" height="50" rx="9" fill="#8250df" stroke="#8250df" stroke-width="0" fill-opacity="0.7"/>
<text x="552" y="348" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >5</text>
<text x="572" y="348" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >escalar solo efecto incremental sostenible</text>
<text x="28" y="472.48" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="484.48" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="41" cy="497.48" r="3.5" fill="#8250df"/>
<text x="52" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >loop coefficient</text>
<rect x="174.4" y="484.48" width="95" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="187.4" cy="497.48" r="3.5" fill="#8250df"/>
<text x="198.4" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cycle time</text>
<rect x="279.4" y="484.48" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="292.4" cy="497.48" r="3.5" fill="#8250df"/>
<text x="303.4" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >incremental lift</text>
<rect x="425.8" y="484.48" width="212.3" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="438.8" cy="497.48" r="3.5" fill="#8250df"/>
<text x="449.8" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >retention of acquired users</text>
<rect x="648.1" y="484.48" width="74.3" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="661.1" cy="497.48" r="3.5" fill="#8250df"/>
<text x="672.1" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >payback</text>
<rect x="28" y="530.48" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="530.48" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="550.48" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="568.48" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No todo negocio tiene loops fuertes y forzarlos puede producir spam. A veces canales lineales rentables son suficientes; el</text>
<text x="48" y="585.73" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >crecimiento debe preservar calidad y confianza.</text>
</svg>
