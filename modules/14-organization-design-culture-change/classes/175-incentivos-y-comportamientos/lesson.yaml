id: 175
part: 14
title: "Incentivos y comportamientos"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "diseñar estructura, derechos de decisión, cultura y cambio como un sistema"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir incentive de principal-agent problem mediante evidencia observable."
  - "Aplicar la secuencia: definir outcome real → mapear conductas deseadas y no deseadas → identificar métricas manipulables → diseñar recompensa y guardrails → monitorear efectos y corregir."
  - "Interpretar metric gaming, quality guardrail, bonus distribution sin atribuir causalidad automática."
  - "Resolver el caso de incentivos y comportamientos con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Jay R. Galbraith — *Designing Organizations*"
  - "Edgar H. Schein & Peter A. Schein — *Organizational Culture and Leadership*"
  - "Aaron Dignan — *Brave New Work*"
  - "John P. Kotter — *Accelerate*"
  - "Chip Heath & Dan Heath — *Switch*"
  - "John P. Kotter — *Leading Change*"
limits:
  - "No toda motivación responde a dinero y recompensas externas pueden desplazar motivación intrínseca. Usa compensación como parte de un sistema, no como única palanca."
evidence_signals:
  - "metric gaming"
  - "quality guardrail"
  - "bonus distribution"
  - "unintended behavior"
  - "customer harm"
