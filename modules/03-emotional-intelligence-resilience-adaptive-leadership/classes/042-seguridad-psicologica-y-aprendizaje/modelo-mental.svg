<text x="880" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >separar error de</text>
<text x="880" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >negligencia</text>
