<text x="880" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >modelar economics</text>
<text x="880" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >y dependencia</text>
<rect x="658" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
