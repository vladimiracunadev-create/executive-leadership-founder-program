  - "Elad Gil — *High Growth Handbook*"
  - "Reid Hoffman & Chris Yeh — *Blitzscaling*"
limits:
  - "Tres semanas pueden no capturar los ciclos anuales, las crisis ni las renovaciones de contratos."
evidence_signals:
  - "contactos al fundador"
  - "continuidad del servicio"
