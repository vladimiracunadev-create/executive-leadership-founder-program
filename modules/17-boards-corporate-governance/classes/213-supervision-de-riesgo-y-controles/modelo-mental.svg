<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >control cuya falla podría producir impacto material</text>
<circle cx="38" cy="242.12" r="5" fill="#cf222e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >assurance</text>
