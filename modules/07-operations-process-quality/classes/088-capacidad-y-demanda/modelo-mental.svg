<circle cx="152.9" cy="455.12" r="3.5" fill="#0969da"/>
<text x="163.9" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >queue length</text>
<rect x="258.7" y="442.12" width="88.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="271.7" cy="455.12" r="3.5" fill="#0969da"/>
<text x="282.7" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >wait time</text>
<rect x="356.8" y="442.12" width="101.9" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="369.8" cy="455.12" r="3.5" fill="#0969da"/>
<text x="380.8" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >lost demand</text>
<rect x="468.7" y="442.12" width="81.2" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="481.7" cy="455.12" r="3.5" fill="#0969da"/>
<text x="492.7" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >overtime</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="488.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Más buffer cuesta dinero. La meta no es baja utilización universal, sino equilibrar costo de capacidad con costo de espera, pérdida de</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >demanda y criticidad.</text>
