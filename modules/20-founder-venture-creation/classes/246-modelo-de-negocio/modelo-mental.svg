<title id="t-s246">Clase 246 · Un modelo de negocio es una cadena de hipótesis</title>
<desc id="d-s246">Tres bloques del modelo de negocio inicial: quién paga y por qué, cómo se entrega y cuánto cuesta y deja.</desc>
<defs><marker id="p-s246" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
