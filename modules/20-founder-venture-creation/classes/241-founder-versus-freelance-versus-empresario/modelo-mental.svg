<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 438.42" width="1040" role="img" aria-labelledby="t-s241 d-s241" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s241">Clase 241 · Freelance, empresario y founder</title>
<desc id="d-s241">Tres modelos de trabajo independiente comparados por lo que construyen, cómo escalan y su riesgo principal.</desc>
<defs><marker id="p-s241" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="438.42" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 241 · Freelance, empresario y founder</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Evans &amp; Jovanovic (1989) · Kerr et al. (2014) · Wasserman</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Modelo</text>
<text x="224.5" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué construye</text>
<text x="482.8" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cómo escala</text>
<text x="741.1" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Riesgo principal</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Freelance</text>
<text x="224.5" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Ingresos propios por tiempo y</text>
<text x="224.5" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >reputación.</text>
<text x="482.8" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Con precio y especialización.</text>
<text x="741.1" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Depende del tiempo de una persona.</text>
<rect x="28" y="189.12" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Empresario (negocio</text>
<text x="40" y="225.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >estable)</text>
<text x="224.5" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Un negocio con clientes, equipo y</text>
<text x="224.5" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >procesos.</text>
<text x="482.8" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Con sucursales o mejores márgenes.</text>
<text x="741.1" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dueño que es cuello de botella.</text>
<rect x="28" y="242.24" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="262.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Founder de alto</text>
<text x="40" y="278.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >crecimiento</text>
<text x="224.5" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Un modelo repetible que multiplique</text>
<text x="224.5" y="278.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >ingresos.</text>
<text x="482.8" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Con producto, tecnología y capital.</text>
<text x="741.1" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Quemar capital antes de probar la</text>
<text x="741.1" y="278.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >demanda.</text>
<rect x="28" y="311.36" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="333.36" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >No hay jerarquía moral: un freelance rentable puede ser mejor que una startup que quema caja. El modelo debe alinearse con las metas,</text>
<text x="44" y="350.61" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >el riesgo aceptable y el estilo de vida.</text>
<text x="28" y="397.86" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La elección se revisa a medida que cambian las metas personales y la evidencia del mercado.</text>
</svg>
