id: 128
part: 10
title: "Negociación basada en intereses"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "construir ingresos mediante un proceso comercial medible y negociación disciplinada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir position de interest mediante evidencia observable."
  - "Aplicar la secuencia: definir intereses propios y ajenos → fortalecer BATNA → establecer reservation y target → crear opciones intercambiando diferencias → usar criterios y cerrar términos completos."
  - "Interpretar concessions, value captured, BATNA quality sin atribuir causalidad automática."
  - "Resolver el caso de negociación basada en intereses con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "commercial-decision-brief.md"
references:
  - "Neil Rackham — *SPIN Selling*"
  - "Matthew Dixon & Brent Adamson — *The Challenger Sale*"
  - "Robert B. Cialdini — *Influence*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
  - "Deepak Malhotra & Max H. Bazerman — *Negotiation Genius*"
  - "Mark Roberge — *The Sales Acceleration Formula*"
limits:
  - "Cooperación no elimina tácticas duras ni asimetrías. Protege tu BATNA, verifica autoridad y documenta términos; buena relación no sustituye preparación."
evidence_signals:
  - "concessions"
  - "value captured"
  - "BATNA quality"
  - "issues traded"
  - "post-deal implementation"
