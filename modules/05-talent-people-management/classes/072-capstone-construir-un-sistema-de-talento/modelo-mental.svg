<circle cx="485" cy="338" r="14" fill="#0969da"/>
<text x="485" y="343.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >instalar revisión trimestral del sistema</text>
