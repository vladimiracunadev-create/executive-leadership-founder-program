<text x="571" y="251" font-size="11" font-weight="600" fill="#59636e" text-anchor="start" >revisar y volver a empezar</text>
<text x="28" y="458.36" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="470.36" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="483.36" r="3.5" fill="#1a7f37"/>
