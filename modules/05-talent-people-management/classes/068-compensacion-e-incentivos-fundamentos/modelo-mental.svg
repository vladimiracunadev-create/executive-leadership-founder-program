<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >rango de compensación para un nivel o rol</text>
<circle cx="38" cy="242.12" r="5" fill="#0969da"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >internal equity</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >coherencia de pago entre trabajos comparables</text>
