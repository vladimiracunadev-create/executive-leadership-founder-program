id: 97
part: 08
title: "De actividad a outcome"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "dirigir mediante outcomes, métricas, revisiones y asignación explícita de recursos"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir actividad, producto entregado, resultado (outcome) e impacto."
  - "Reescribir un plan de actividades como una cadena de resultados con hipótesis."
  - "Elegir el eslabón en que un equipo debe ser responsable."
  - "Detectar métricas de vanidad y de actividad."
  - "Formular la pregunta que conecta cada eslabón con el siguiente."
deliverable: "leadership-decision-brief.md"
references:
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
  - "Robert S. Kaplan & David P. Norton — *Strategy Maps*"
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
  - "Bernard Marr — *Key Performance Indicators*"
  - "John Doerr — *Measure What Matters*"
limits:
  - "No todo resultado es fácil de medir en el corto plazo (reputación, aprendizaje, cultura); en esos casos se usan indicadores indirectos con cautela."
evidence_signals:
  - "cadena actividad–producto–resultado–impacto"
  - "hipótesis causales explícitas"
  - "eslabón donde se pide cuentas"
  - "actividades sin resultado eliminadas"
