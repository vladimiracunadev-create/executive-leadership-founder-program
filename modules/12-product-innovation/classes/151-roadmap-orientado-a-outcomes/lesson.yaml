id: 151
part: 12
title: "Roadmap orientado a outcomes"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "convertir problemas de clientes en productos validados y outcomes medibles"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir roadmap de theme mediante evidencia observable."
  - "Aplicar la secuencia: partir de objetivos estratégicos → traducirlos a outcomes y problemas → ordenar apuestas por valor y riesgo → expresar horizonte y confianza → revisar roadmap con evidencia y capacidad."
  - "Interpretar outcome progress, roadmap churn, commitment reliability sin atribuir causalidad automática."
  - "Resolver el caso de roadmap orientado a outcomes con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "product-evidence-brief.md"
references:
  - "Marty Cagan — *Inspired*"
  - "Teresa Torres — *Continuous Discovery Habits*"
  - "David J. Bland & Alexander Osterwalder — *Testing Business Ideas*"
  - "Melissa Perri — *Escaping the Build Trap*"
  - "Rob Fitzpatrick — *The Mom Test*"
  - "Clayton M. Christensen — *The Innovator's Dilemma*"
limits:
  - "Hay contextos con compromisos contractuales o regulatorios que requieren fechas. Outcome roadmaps no eliminan compromisos; separan lo negociable de lo no negociable y hacen visible la certeza real."
evidence_signals:
  - "outcome progress"
  - "roadmap churn"
  - "commitment reliability"
  - "discovery evidence"
  - "capacity allocation"
