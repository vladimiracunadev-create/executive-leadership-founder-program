<circle cx="38" cy="300.12" r="5" fill="#bc4c00"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >dynamic capability</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >habilidad para detectar aprovechar y reconfigurar</text>
<text x="54" y="339.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >frente al cambio</text>
