id: 156
part: 12
title: "Capstone: comité de producto"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "convertir problemas de clientes en productos validados y outcomes medibles"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Estructurar una propuesta de producto con problema, evidencia, valor, riesgos y decisión solicitada."
  - "Evaluar la fuerza de la evidencia de cada afirmación."
  - "Decidir la inversión por etapas, con hitos y criterios de detención."
  - "Distinguir tipos de innovación y su riesgo organizacional."
  - "Registrar la decisión y el aprendizaje del comité."
deliverable: "product-evidence-brief.md"
references:
  - "Marty Cagan — *Inspired*"
  - "Melissa Perri — *Escaping the Build Trap*"
  - "Rebecca M. Henderson & Kim B. Clark — *Architectural Innovation: The Reconfiguration of Existing Product Technologies and the Failure of Established Firms*"
  - "Robert G. Cooper — *Stage-gate systems: A new tool for managing new products*"
  - "Clayton M. Christensen — *The Innovator's Dilemma*"
limits:
  - "Los comités pueden volverse lentos y burocráticos; la rapidez se logra con criterios claros y delegación para decisiones pequeñas."
evidence_signals:
  - "evidencia clasificada por fuerza"
  - "inversión por etapas con criterios de detención"
  - "preguntas críticas y premortem"
  - "decisión registrada con fecha de revisión"
