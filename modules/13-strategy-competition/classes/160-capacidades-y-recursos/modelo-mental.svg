<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >capability</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >habilidad organizacional repetible para realizar una</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >actividad</text>
<circle cx="38" cy="242.12" r="5" fill="#bc4c00"/>
