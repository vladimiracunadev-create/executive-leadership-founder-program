<text x="575" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Calidad y contratos</text>
<text x="547" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Definiciones y acuerdos de</text>
<text x="547" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >servicio.</text>
