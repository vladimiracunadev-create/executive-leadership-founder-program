<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 488.06" width="1040" role="img" aria-labelledby="t-s202 d-s202" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s202">Clase 202 · Decidir lo irreversible bajo presión</title>
<desc id="d-s202">Cinco pasos antes de una decisión difícil de revertir: clasificar, buscar el peor caso y alternativas, desafío independiente, fraccionar el compromiso y fijar una regla de parada.</desc>
<defs><marker id="p-s202" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="488.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 202 · Decidir lo irreversible bajo presión</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Klein · Weick (1993) · Horowitz · Taleb</text>
<rect x="28" y="96" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<circle cx="52.0" cy="122.0" r="13" fill="#0969da"/>
<text x="52" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="72" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Clasificar</text>
<text x="44" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >¿Se puede revertir y a qué</text>
<text x="44" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >costo?</text>
<path d="M260.5,144.25 L276.5,144.25" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s202)"/>
<rect x="279.5" y="96" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<circle cx="303.5" cy="122.0" r="13" fill="#1a7f37"/>
<text x="303.5" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="323.5" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Peor caso y</text>
<text x="323.5" y="138.63" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >alternativas</text>
<text x="295.5" y="159.26" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Qué se pierde y qué otras</text>
<text x="295.5" y="176.51" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >opciones hay.</text>
<path d="M512,144.25 L528,144.25" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s202)"/>
<rect x="531" y="96" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<circle cx="555.0" cy="122.0" r="13" fill="#bc4c00"/>
<text x="555" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="575" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Desafío independiente</text>
<text x="547" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Alguien ajeno busca lo que</text>
<text x="547" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >no se ve.</text>
<path d="M763.5,144.25 L779.5,144.25" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s202)"/>
<rect x="782.5" y="96" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<circle cx="806.5" cy="122.0" r="13" fill="#8250df"/>
<text x="806.5" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="826.5" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Fraccionar</text>
<text x="798.5" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Comprometer por etapas si se</text>
<text x="798.5" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >puede.</text>
<path d="M897.25,194.5 V206.5 H142.75 V224.5" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#p-s202)"/>
<rect x="28" y="226.5" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<circle cx="52.0" cy="252.5" r="13" fill="#cf222e"/>
<text x="52" y="257.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="72" y="250.5" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Regla de parada y</text>
<text x="72" y="269.13" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >registro</text>
<text x="44" y="289.76" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Qué evidencia reabre la</text>
<text x="44" y="307.01" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >decisión.</text>
<path d="M142.75,325.0 V345.0 H142.75 V196.5" stroke="#59636e" stroke-width="2" fill="none" stroke-dasharray="7 6" marker-end="url(#p-s202)"/>
<text x="142.75" y="339" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >la evidencia nueva reabre la decisión</text>
<rect x="28" y="361" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="383" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El rigor se adapta a la irreversibilidad y al daño potencial. En una crisis real no hay tiempo para todo, pero siempre se puede decidir</text>
<text x="44" y="400.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >quién desafía y qué evidencia cambia el rumbo.</text>
<text x="28" y="447.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Una decisión irreversible sin registro de supuestos no se puede aprender ni defender.</text>
</svg>
