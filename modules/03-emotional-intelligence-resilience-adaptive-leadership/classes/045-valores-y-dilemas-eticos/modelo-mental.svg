<text x="433" y="138" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle" >Individuo</text>
<rect x="526" y="104" width="150" height="56" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<text x="601" y="138" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle" >Comunidad</text>
<path d="M510,132 H524" stroke="#59636e" stroke-width="2"/>
<rect x="28" y="184" width="150" height="56" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<text x="103" y="218" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle" >Corto plazo</text>
<rect x="196" y="184" width="150" height="56" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<text x="271" y="218" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle" >Largo plazo</text>
<path d="M180,212 H194" stroke="#59636e" stroke-width="2"/>
<rect x="358" y="184" width="150" height="56" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<text x="433" y="218" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle" >Justicia</text>
<rect x="526" y="184" width="150" height="56" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<text x="601" y="218" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle" >Misericordia</text>
<path d="M510,212 H524" stroke="#59636e" stroke-width="2"/>
<text x="28" y="290" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">TRES LENTES PARA RESOLVER</text>
<rect x="28" y="306" width="320" height="110" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="28" y="306" width="6" height="110" rx="3" fill="#cf222e"/>
<text x="46" y="328" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Consecuencias</text>
<text x="46" y="346" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >¿Qué decisión produce el mayor bien para</text>
<text x="46" y="363.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >el mayor número?</text>
<rect x="368" y="306" width="320" height="110" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="368" y="306" width="6" height="110" rx="3" fill="#0969da"/>
<text x="386" y="328" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Reglas</text>
<text x="386" y="346" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >¿Qué haría yo si mi decisión fuera una</text>
<text x="386" y="363.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >regla para todos?</text>
<rect x="708" y="306" width="320" height="110" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="708" y="306" width="6" height="110" rx="3" fill="#1a7f37"/>
<text x="726" y="328" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Cuidado</text>
<text x="726" y="346" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >¿Cómo querría ser tratado si estuviera en</text>
<text x="726" y="363.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >el lugar del otro?</text>
<path d="M520,420 L520,440" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-045)"/>
<rect x="28" y="442" width="984" height="86" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<text x="46" y="466" font-size="11.5" font-weight="700" fill="#8250df" text-anchor="start" letter-spacing="1.2">DECISIÓN CON REGISTRO</text>
<text x="46" y="486" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Escribe qué valor cedió, por qué y qué harías distinto con otra información. Bazerman y Moore advierten que solemos subestimar nuestra</text>
<text x="46" y="503.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >propia parcialidad: consulta a un tercero independiente.</text>
<text x="28" y="566" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los tres criterios simplifican tradiciones filosóficas amplias. Los dilemas de la clase no sustituyen asesoría legal ni normas vigentes.</text>
</svg>
