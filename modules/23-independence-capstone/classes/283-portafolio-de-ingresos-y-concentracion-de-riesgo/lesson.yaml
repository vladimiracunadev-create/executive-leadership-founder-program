id: 283
part: 23
title: "Portafolio de ingresos y concentración de riesgo"
duration_minutes: 150
level: "Etapa 6 — Independencia"
outcome: "construir independencia mediante capacidades monetizables, sistemas comerciales y diversificación prudente"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Mapear las fuentes de ingreso con margen, esfuerzo y recurrencia."
  - "Medir concentración nominal y concentración por factores comunes."
  - "Calcular la contribución por hora de cada fuente."
  - "Priorizar dos o tres motores complementarios."
  - "Decidir qué retirar y cuándo, protegiendo la caja durante la transición."
deliverable: "strategy-memo.md"
references:
  - "Peter F. Drucker — *The Effective Executive*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
  - "Greg McKeown — *Essentialism*"
  - "Noam Wasserman — *The Founder's Dilemmas*"
  - "Michael E. Gerber — *The E-Myth Revisited*"
  - "Nassim Nicholas Taleb — *Antifragile*"
limits:
  - "La diversificación nominal puede no diversificar el riesgo si hay factores comunes; reducir un porcentaje abstracto sacrificando profundidad en una fuente rentable puede ser un error."
evidence_signals:
  - "participación de la mayor fuente"
  - "concentración por sector"
  - "contribución por hora"
