id: 100
part: 08
title: "KPI y métricas operativas"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "dirigir mediante outcomes, métricas, revisiones y asignación explícita de recursos"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir metric de KPI mediante evidencia observable."
  - "Aplicar la secuencia: empezar por decisión → definir métrica y fórmula → validar fuente y población → establecer baseline, target y frecuencia → documentar qué acción activa cada rango."
  - "Interpretar data quality, KPI ownership, frequency sin atribuir causalidad automática."
  - "Resolver el caso de kPI y métricas operativas con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "John Doerr — *Measure What Matters*"
  - "Robert S. Kaplan & David P. Norton — *The Balanced Scorecard*"
  - "Robert S. Kaplan & David P. Norton — *Strategy Maps*"
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
  - "John Doerr — *Speed & Scale*"
  - "Bernard Marr — *Key Performance Indicators*"
limits:
  - "Un KPI que se convierte en objetivo puede dejar de ser buen indicador por gaming. Mantén métricas de control y señales complementarias."
evidence_signals:
  - "data quality"
  - "KPI ownership"
  - "frequency"
  - "actionability"
  - "metric disputes"
