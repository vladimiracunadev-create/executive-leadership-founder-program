<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s198 d-s198" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s198">Clase 198 · Asignar capital y talento con el mismo rigor</title>
<desc id="d-s198">Cinco preguntas que se aplican por igual al capital y al talento: inventario, retorno, umbral, reasignación y revisión.</desc>
<defs><marker id="p-s198" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 198 · Asignar capital y talento con el mismo rigor</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Bower (1970) · Thorndike · Koller et al. · Mankins &amp; Garton</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Pregunta</text>
<text x="247.887" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Capital</text>
<text x="635.944" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Talento</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Inventario</text>
<text x="247.887" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿En qué se usa hoy cada peso?</text>
<text x="635.944" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿En qué trabaja hoy cada persona clave?</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Retorno</text>
<text x="247.887" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Retorno ajustado por riesgo y ajuste estratégico.</text>
<text x="635.944" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Efecto de la persona en las prioridades.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Umbral</text>
<text x="247.887" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Tasa mínima de retorno y alternativas.</text>
<text x="635.944" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Estándar mínimo para ocupar un rol crítico.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Reasignación</text>
<text x="247.887" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Retirar de lo de bajo valor y reinvertir.</text>
<text x="635.944" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Mover talento hacia las prioridades.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Revisión</text>
<text x="247.887" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Resultado real frente a lo prometido.</text>
<text x="635.944" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Desempeño y aprendizaje de los traslados.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El capital se asigna con cálculos y el talento con costumbre. Tratar a ambos con el mismo rigor suele mover más valor que optimizar un</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >modelo.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las opciones estratégicas y las capacidades no siempre caben en una fórmula; se hacen explícitas en lugar de esconderlas en el cálculo.</text>
</svg>
