<text x="880" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >calcular retorno y</text>
<text x="880" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >timing</text>
