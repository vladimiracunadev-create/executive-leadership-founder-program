<text x="692" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >complementos y</text>
<text x="692" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >cuellos</text>
