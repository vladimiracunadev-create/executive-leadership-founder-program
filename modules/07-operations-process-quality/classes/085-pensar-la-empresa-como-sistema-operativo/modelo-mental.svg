<rect x="133" y="442.12" width="95" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="146" cy="455.12" r="3.5" fill="#0969da"/>
<text x="157" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cycle time</text>
<rect x="238" y="442.12" width="74.3" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="251" cy="455.12" r="3.5" fill="#0969da"/>
<text x="262" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >backlog</text>
<rect x="322.3" y="442.12" width="74.3" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="335.3" cy="455.12" r="3.5" fill="#0969da"/>
<text x="346.3" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >quality</text>
<rect x="406.6" y="442.12" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="419.6" cy="455.12" r="3.5" fill="#0969da"/>
<text x="430.6" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >service reliability</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="488.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un operating model no debe petrificar una empresa. Mantén procesos estables donde la repetición crea valor y espacios adaptativos</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >donde todavía existe aprendizaje.</text>
</svg>
