<text x="324.1" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >preguntas repetidas</text>
<rect x="467.2" y="470.36" width="101.9" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="480.2" cy="483.36" r="3.5" fill="#1a7f37"/>
<text x="491.2" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >workarounds</text>
<rect x="579.1" y="470.36" width="233" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="592.1" cy="483.36" r="3.5" fill="#1a7f37"/>
<text x="603.1" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >rendimiento durante transición</text>
<rect x="28" y="516.36" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="516.36" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="536.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="554.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No toda resistencia debe ser vencida: puede revelar riesgos reales del diseño. Escuchar no implica aceptar veto, pero sí probar si el</text>
<text x="48" y="571.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cambio necesita corrección.</text>
