id: 202
part: 16
title: "Crisis y decisiones irreversibles"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir irreversible decision de pre-mortem mediante evidencia observable."
  - "Aplicar la secuencia: clasificar reversibilidad → buscar downside y alternativas → activar challenge independiente → fraccionar compromiso si es posible → definir stop rule y decision log."
  - "Interpretar downside exposure, option value, red-team findings sin atribuir causalidad automática."
  - "Resolver el caso de crisis y decisiones irreversibles con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Ben Horowitz — *The Hard Thing About Hard Things*"
  - "Matt Mochary — *The Great CEO Within*"
  - "Peter F. Drucker — *The Effective Executive*"
  - "Ram Charan, Stephen Drotter & James Noel — *The Leadership Pipeline*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Larry Bossidy & Ram Charan — *Execution*"
limits:
  - "En una crisis real no siempre hay tiempo para análisis completo. El objetivo es adaptar rigor a irreversibilidad y daño potencial, no exigir un proceso idéntico para todo."
evidence_signals:
  - "downside exposure"
  - "option value"
  - "red-team findings"
  - "stage-gate success"
  - "decision reversal cost"
