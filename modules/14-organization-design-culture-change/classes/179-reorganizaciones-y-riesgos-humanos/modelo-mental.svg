<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g179 d-g179" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g179">Ficha visual de la clase 179: Reorganizaciones y riesgos humanos</title>
<desc id="d-g179">Conceptos: reorganization; role mapping; transition risk; organizational justice; business continuity. Método: definir problema que requiere reorg → diseñar target operating model → mapear roles talento y decisiones → planificar transición y comunicación → medir continuidad claridad y beneficios.</desc>
