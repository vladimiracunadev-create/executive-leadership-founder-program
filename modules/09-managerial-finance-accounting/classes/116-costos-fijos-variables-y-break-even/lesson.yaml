id: 116
part: 09
title: "Costos fijos, variables y break-even"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "leer la economía del negocio y decidir con estados, caja, márgenes, retorno y valoración"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Clasificar costos como fijos, variables o semivariables y reconocer los escalonados."
  - "Calcular el punto de equilibrio en unidades y en ingresos."
  - "Calcular el margen de seguridad y el apalancamiento operativo."
  - "Comparar estructuras de costos alternativas y su riesgo."
  - "Decidir con análisis de sensibilidad ante cambios de precio, costo y volumen."
deliverable: "risk-governance-brief.md"
references:
  - "Charles Horngren et al. — *Cost Accounting: A Managerial Emphasis*"
  - "Robert S. Kaplan & Robin Cooper — *Cost & Effect*"
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Krishna G. Palepu, Paul M. Healy & Erik Peek — *Business Analysis and Valuation*"
  - "Stephen H. Penman — *Financial Statement Analysis and Security Valuation*"
limits:
  - "El modelo supone precios, costos unitarios y mezcla constantes y relaciones lineales dentro de un rango; fuera de él, los costos se comportan distinto."
evidence_signals:
  - "costos clasificados por comportamiento"
  - "punto de equilibrio y margen de seguridad"
  - "estructuras comparadas con sensibilidad"
  - "costos hundidos excluidos"
