id: 73
part: 06
title: "Proyecto, producto, operación y programa"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir proyecto de producto mediante evidencia observable."
  - "Aplicar la secuencia: clasificar naturaleza del trabajo → definir horizonte y outcome → seleccionar funding y governance → diseñar transición a operación o producto → revisar si la categoría sigue siendo válida."
  - "Interpretar proyectos sin cierre, productos financiados como proyectos, handoffs a operación sin atribuir causalidad automática."
  - "Resolver el caso de proyecto, producto, operación y programa con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "operating-improvement-brief.md"
references:
  - "Project Management Institute — *A Guide to the Project Management Body of Knowledge (PMBOK Guide)*"
  - "Harold Kerzner — *Project Management*"
  - "Nicole Forsgren, Jez Humble & Gene Kim — *Accelerate*"
  - "Gene Kim et al. — *The Phoenix Project*"
  - "Michael Hammer & James Champy — *Reengineering the Corporation*"
  - "Ken Schwaber & Jeff Sutherland — *The Scrum Guide*"
limits:
  - "Las categorías pueden coexistir: un producto puede contener proyectos y operar servicios. La clave es no confundir el mecanismo de entrega con el objeto de gestión."
evidence_signals:
  - "proyectos sin cierre"
  - "productos financiados como proyectos"
  - "handoffs a operación"
  - "beneficios realizados"
  - "WIP de portfolio"
