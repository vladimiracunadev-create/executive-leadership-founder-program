<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >objective</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >estado futuro cualitativo que orienta decisiones</text>
<circle cx="38" cy="170" r="5" fill="#8250df"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >target</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >valor cuantitativo esperado para una métrica</text>
<circle cx="38" cy="228" r="5" fill="#8250df"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >constraint</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >límite que debe respetarse al perseguir la meta</text>
