<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g125 d-g125" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g125">Ficha visual de la clase 125: Propuesta de valor y business case</title>
<desc id="d-g125">Conceptos: value proposition; business case; ROI; proof; cost of inaction. Método: recuperar problema cuantificado → traducir capacidades a outcomes → estimar beneficio y costo con supuestos → añadir prueba relevante → comparar contra no hacer y alternativas.</desc>
<defs><marker id="p-g125" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
