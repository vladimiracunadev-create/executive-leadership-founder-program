<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g197 d-g197" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g197">Ficha visual de la clase 197: Agenda y tiempo del CEO</title>
<desc id="d-g197">Conceptos: CEO agenda; high-leverage activity; calendar audit; attention residue; operating rhythm. Método: auditar calendario y decisiones → definir categorías de alto apalancamiento → eliminar o delegar status → bloquear pensamiento y stakeholders → revisar mensualmente agenda versus estrategia.</desc>
