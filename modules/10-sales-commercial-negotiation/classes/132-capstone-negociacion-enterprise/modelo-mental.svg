<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g132 d-g132" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g132">Ficha visual de la clase 132: Capstone: negociación enterprise</title>
<desc id="d-g132">Conceptos: negotiation plan; economic buyer; give-get; redline; walk-away. Método: mapear intereses y autoridad → cuantificar business case → definir BATNA, target y redlines → ordenar paquetes y give-gets → negociar, documentar y validar implementación.</desc>
<defs><marker id="p-g132" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
