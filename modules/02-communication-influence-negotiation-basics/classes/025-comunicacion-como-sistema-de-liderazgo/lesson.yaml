id: 25
part: 02
title: "Comunicación como sistema de liderazgo"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir incertidumbre y equivocidad, y decir qué tipo de canal pide cada una."
  - "Elegir un canal para un mensaje concreto y justificar la elección."
  - "Adaptar un mismo hecho a una audiencia interna y a una externa sin cambiar sus datos."
  - "Estructurar un mensaje con lo que se sabe, lo que no, lo que se hace y cuándo habrá novedades."
  - "Comprobar que un mensaje llegó, sin asumirlo."
deliverable: "leadership-decision-brief.md"
references:
  - "Richard L. Daft & Robert H. Lengel — *Organizational Information Requirements, Media Richness and Structural Design*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Barbara Minto — *The Pyramid Principle*"
limits:
  - "La teoría de la riqueza del canal ha sido discutida: la elección real de un canal también depende del hábito, de las normas del grupo, de la disponibilidad y de la distancia, y los medios nuevos se usan de maneras que la teoría original no previó."
evidence_signals:
  - "canal ajustado al tipo de mensaje"
  - "mensaje repetido con sus palabras por el receptor"
  - "coincidencia entre audiencias"
  - "tiempo de respuesta a preguntas"
