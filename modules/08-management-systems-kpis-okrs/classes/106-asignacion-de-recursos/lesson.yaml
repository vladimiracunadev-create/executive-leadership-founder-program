id: 106
part: 08
title: "Asignación de recursos"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "dirigir mediante outcomes, métricas, revisiones y asignación explícita de recursos"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Diagnosticar la inercia en la asignación de dinero, personas y tiempo."
  - "Asignar recursos desde las prioridades estratégicas y no desde la historia."
  - "Tratar el talento y el tiempo de dirección como recursos presupuestables."
  - "Diseñar un proceso de reasignación con criterios, datos y decisores claros."
  - "Gestionar el costo humano de las reasignaciones."
deliverable: "leadership-decision-brief.md"
references:
  - "Michael C. Mankins & Eric Garton — *Time, Talent, Energy*"
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
  - "Daniel Kahneman, Olivier Sibony & Cass R. Sunstein — *Noise*"
  - "Robert S. Kaplan & David P. Norton — *Strategy Maps*"
  - "Kathleen M. Eisenhardt — *Making Fast Strategic Decisions in High-Velocity Environments*"
limits:
  - "Las proyecciones de retorno por línea son inciertas, y reasignar con excesiva frecuencia desestabiliza."
evidence_signals:
  - "inercia diagnosticada con datos"
  - "mantener, crecer y explorar distinguidos"
  - "talento y tiempo presupuestados"
  - "costo humano gestionado"
