<text x="461.714" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >6,0 %</text>
<text x="630.4" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Reducir fricción del formulario.</text>
