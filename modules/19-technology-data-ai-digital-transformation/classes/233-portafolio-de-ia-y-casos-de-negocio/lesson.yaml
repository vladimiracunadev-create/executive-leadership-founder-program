id: 233
part: 19
title: "Portafolio de IA y casos de negocio"
duration_minutes: 150
level: "Etapa 5 — CEO → Transformador digital"
outcome: "gobernar tecnología, datos e IA como capacidades económicas y organizacionales"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir AI use case de AI portfolio mediante evidencia observable."
  - "Aplicar la secuencia: inventariar workflows y pain → estimar value y baseline → evaluar data y technical feasibility → evaluar impact y risk → pilotear con economics y guardrails antes de escalar."
  - "Interpretar time saved, quality-error rate, cost per task sin atribuir causalidad automática."
  - "Resolver el caso de portafolio de IA y casos de negocio con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "strategy-memo.md"
references:
  - "Marco Iansiti & Karim R. Lakhani — *Competing in the Age of AI*"
  - "Thomas H. Davenport & Nitin Mittal — *All-In on AI*"
  - "Nicole Forsgren, Jez Humble & Gene Kim — *Accelerate*"
  - "Foster Provost & Tom Fawcett — *Data Science for Business*"
  - "NIST — *AI Risk Management Framework (AI RMF 1.0)*"
  - "George Westerman, Didier Bonnet & Andrew McAfee — *Leading Digital*"
  - "NIST — *AI Risk Management Framework*. <https://www.nist.gov/itl/ai-risk-management-framework>."
limits:
  - "Horas ahorradas no equivalen a cash o value si no cambia capacidad o output. Define cómo el tiempo liberado se convierte en outcome empresarial."
evidence_signals:
  - "time saved"
  - "quality-error rate"
  - "cost per task"
  - "human override"
  - "adoption"
