<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >del founder</text>
<circle cx="38" cy="184.12" r="5" fill="#59636e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >operating autonomy</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad de equipos y líderes para decidir dentro de</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >límites</text>
<circle cx="38" cy="256.24" r="5" fill="#59636e"/>
