<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >analizar control data y lock-in</text>
<circle cx="485" cy="284" r="14" fill="#cf222e"/>
<text x="485" y="289.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="512" y="280" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >evaluar talent e integration</text>
