<title id="t-g172">Ficha visual de la clase 172: Operating model</title>
<desc id="d-g172">Conceptos: operating model; business unit; shared capability; governance forum; management cadence. Método: derivar capabilities de estrategia → diseñar unidades y servicios compartidos → mapear decisiones y flujos críticos → definir datos tecnología y talento habilitante → establecer governance y cadencias.</desc>
