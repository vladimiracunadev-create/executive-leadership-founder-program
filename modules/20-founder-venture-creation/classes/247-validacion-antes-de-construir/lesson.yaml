id: 247
part: 20
title: "Validación antes de construir"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir demand test de pre-sale mediante evidencia observable."
  - "Aplicar la secuencia: priorizar riesgo de demanda → diseñar test mínimo → definir commitment observable → ejecutar con segmento real → decidir build change o stop."
  - "Interpretar qualified leads, pre-orders, deposit rate sin atribuir causalidad automática."
  - "Resolver el caso de validación antes de construir con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Alexander Osterwalder & Yves Pigneur — *Business Model Generation*"
  - "Ben Horowitz — *The Hard Thing About Hard Things*"
  - "Noam Wasserman — *The Founder's Dilemmas*"
  - "David J. Bland & Alexander Osterwalder — *Testing Business Ideas*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
limits:
  - "No vendas algo que no puedes entregar ni engañes con fake doors sin transparencia adecuada. Diseña experimentos éticos y cumple compromisos."
evidence_signals:
  - "qualified leads"
  - "pre-orders"
  - "deposit rate"
  - "conversion"
  - "customer interviews after test"
