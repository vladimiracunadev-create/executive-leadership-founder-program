<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-029 d-029" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-029">Seis rasgos de una idea que se entiende, se recuerda y se actúa</title>
<desc id="d-029">Simple, inesperada, concreta, creíble, emocional y contada como historia, cada una con su pregunta de control.</desc>
<defs><marker id="p-029" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 029 · Qué hace que un mensaje se quede</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Heath &amp; Heath (2007)</text>
<rect x="28" y="90" width="320" height="190" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<circle cx="62" cy="128" r="22" fill="#0969da"/>
<text x="62" y="136" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >S</text>
<text x="96" y="134" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Simple</text>
<text x="46" y="176" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Pregunta de control</text>
<text x="46" y="194" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >¿Cuál es el núcleo, en una frase?</text>
<text x="46" y="218.63" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Una idea que prioriza: lo demás se</text>
<text x="46" y="235.88" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >omite.</text>
<rect x="376" y="90" width="320" height="190" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<circle cx="410" cy="128" r="22" fill="#bc4c00"/>
<text x="410" y="136" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >I</text>
<text x="444" y="134" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Inesperada</text>
<text x="394" y="176" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Pregunta de control</text>
<text x="394" y="194" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >¿Qué rompe lo que la audiencia da por</text>
<text x="394" y="212.63" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >hecho?</text>
<text x="394" y="237.26" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Genera curiosidad al abrir un hueco.</text>
<rect x="724" y="90" width="320" height="190" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<circle cx="758" cy="128" r="22" fill="#1a7f37"/>
<text x="758" y="136" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >C</text>
<text x="792" y="134" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Concreta</text>
<text x="742" y="176" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Pregunta de control</text>
<text x="742" y="194" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >¿Se puede ver, medir o tocar?</text>
<text x="742" y="218.63" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Cifras y ejemplos en lugar de</text>
<text x="742" y="235.88" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >abstracciones.</text>
<rect x="28" y="308" width="320" height="190" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<circle cx="62" cy="346" r="22" fill="#8250df"/>
<text x="62" y="354" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >C</text>
<text x="96" y="352" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Creíble</text>
<text x="46" y="394" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Pregunta de control</text>
<text x="46" y="412" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >¿Por qué debería creérmelo?</text>
<text x="46" y="436.63" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Detalle comprobable o un caso que la</text>
<text x="46" y="453.88" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >audiencia pueda verificar.</text>
<rect x="376" y="308" width="320" height="190" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<circle cx="410" cy="346" r="22" fill="#cf222e"/>
<text x="410" y="354" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >E</text>
<text x="444" y="352" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Emocional</text>
<text x="394" y="394" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Pregunta de control</text>
<text x="394" y="412" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >¿Por qué le importa a esta persona?</text>
<text x="394" y="436.63" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Conecta con algo que le importa, no solo</text>
<text x="394" y="453.88" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >con una cifra.</text>
<rect x="724" y="308" width="320" height="190" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="1.8" />
<circle cx="758" cy="346" r="22" fill="#59636e"/>
<text x="758" y="354" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >H</text>
<text x="792" y="352" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" >Historia</text>
<text x="742" y="394" font-size="11" font-weight="700" fill="#59636e" text-anchor="start" >Pregunta de control</text>
<text x="742" y="412" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >¿Qué relato lo muestra en acción?</text>
<text x="742" y="436.63" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Un caso con personas y decisiones.</text>
<text x="28" y="556" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Es una guía de diseño de mensajes, no una receta: un mensaje puede funcionar sin cumplir los seis rasgos.</text>
</svg>
