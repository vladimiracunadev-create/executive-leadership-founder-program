<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 425.3" width="1040" role="img" aria-labelledby="t-s234 d-s234" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s234">Clase 234 · Qué tareas se automatizan y cuáles se aumentan</title>
<desc id="d-s234">Clasificación de tareas por repetición, juicio y riesgo, y el tratamiento sugerido: automatizar, aumentar o reservar al juicio humano.</desc>
<defs><marker id="p-s234" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="425.3" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 234 · Qué tareas se automatizan y cuáles se aumentan</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Autor et al. (2003) · Autor (2015) · Acemoglu &amp; Restrepo</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Tipo de tarea</text>
<text x="253.398" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Rasgo</text>
<text x="526.072" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Tratamiento</text>
<text x="763.181" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Control</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Rutinaria y de bajo riesgo</text>
<text x="253.398" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Repetitiva con reglas claras.</text>
<text x="526.072" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Automatizar.</text>
<text x="763.181" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Muestreo y registro.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Rutinaria y de alto riesgo</text>
<text x="253.398" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Reglas claras, daño posible.</text>
<text x="526.072" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Automatizar con respaldo.</text>
<text x="763.181" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Revisión y plan alterno.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Con juicio</text>
<text x="253.398" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Contexto y excepciones.</text>
<text x="526.072" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Aumentar al profesional.</text>
<text x="763.181" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Decide la persona.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Con relación humana</text>
<text x="253.398" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Confianza y negociación.</text>
<text x="526.072" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Apoyar y no reemplazar.</text>
<text x="763.181" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Calidad y satisfacción.</text>
<rect x="28" y="298.24" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="320.24" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Se rediseña el trabajo de punta a punta y no solo las tareas sueltas. La automatización de alto riesgo necesita controles y respaldo;</text>
<text x="44" y="337.49" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >la capacidad técnica no justifica eliminar el juicio humano donde el daño es material.</text>
<text x="28" y="384.74" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los cambios en roles y funciones tienen condiciones laborales que se verifican con asesoría.</text>
</svg>
