<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >precio de referencia antes de descuentos</text>
<circle cx="38" cy="170" r="5" fill="#8250df"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >value-based pricing</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >precio anclado al valor económico percibido y</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >alternativas</text>
<circle cx="38" cy="242.12" r="5" fill="#8250df"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >discount</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >factor que reduce precio nominal</text>
<circle cx="38" cy="300.12" r="5" fill="#8250df"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >concession</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >condición cedida en negociación que debería</text>
<text x="54" y="339.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >intercambiarse</text>
