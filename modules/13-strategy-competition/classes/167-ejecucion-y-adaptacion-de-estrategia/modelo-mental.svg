<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g167 d-g167" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g167">Ficha visual de la clase 167: Ejecución y adaptación de estrategia</title>
<desc id="d-g167">Conceptos: strategic initiative; leading indicator; lagging indicator; strategy review; resource reallocation. Método: traducir choices a capacidades e iniciativas → asignar owners y recursos → definir leading y lagging indicators → revisar hipótesis en cadencia → reallocate o pivotar según evidencia.</desc>
