<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 392.06" width="1040" role="img" aria-labelledby="t-s79 d-s79" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s79">Clase 079 · El ciclo de Scrum y sus compromisos</title>
<desc id="d-s79">Eventos de Scrum dentro de un Sprint: planificación, Scrum diario, revisión y retrospectiva, con los compromisos de objetivo del producto, objetivo del Sprint y definición de hecho.</desc>
<defs><marker id="p-s79" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="392.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
