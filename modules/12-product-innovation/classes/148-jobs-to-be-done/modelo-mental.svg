<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g148 d-g148" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g148">Ficha visual de la clase 148: Jobs to Be Done</title>
<desc id="d-g148">Conceptos: job; circumstance; push; pull; anxiety-habit. Método: reconstruir evento de cambio → identificar circunstancia y progreso buscado → mapear push pull ansiedad y hábito → identificar soluciones competidoras → diseñar mensaje y producto alrededor del progreso.</desc>
<defs><marker id="p-g148" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#bc4c00"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 148 · Jobs to Be Done</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 12 · Dirección, estrategia y organización</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#bc4c00"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >job</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >progreso que una persona busca en una circunstancia</text>
<circle cx="38" cy="170" r="5" fill="#bc4c00"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >circumstance</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >contexto que activa o condiciona el job</text>
<circle cx="38" cy="228" r="5" fill="#bc4c00"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >push</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >insatisfacción que empuja fuera de la solución actual</text>
<circle cx="38" cy="286" r="5" fill="#bc4c00"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >pull</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >atractivo que acerca a una alternativa</text>
<circle cx="38" cy="344" r="5" fill="#bc4c00"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >anxiety-habit</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >fuerzas que frenan el cambio por riesgo o rutina</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#bc4c00" stroke-width="2.5" stroke-opacity="0.35"/>
