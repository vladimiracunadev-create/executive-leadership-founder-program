<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456.81" width="1040" role="img" aria-labelledby="t-s91 d-s91" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s91">Clase 091 · Dos clases de variación que se tratan de forma distinta</title>
<desc id="d-s91">Variación por causas comunes, propia del sistema, frente a variación por causas especiales, que viene de un hecho identificable.</desc>
<defs><marker id="p-s91" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
