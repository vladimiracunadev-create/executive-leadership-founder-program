<text x="398.667" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Contrastar, diagnosticar y decidir</text>
<text x="398.667" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >(104).</text>
<circle cx="384.6666666666667" cy="198.5" r="4" fill="#bc4c00"/>
<text x="398.667" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Priorizar y reasignar recursos</text>
<text x="398.667" y="219.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >(105–106).</text>
<circle cx="384.6666666666667" cy="243.0" r="4" fill="#bc4c00"/>
<text x="398.667" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Aplicar umbrales de excepción (107).</text>
