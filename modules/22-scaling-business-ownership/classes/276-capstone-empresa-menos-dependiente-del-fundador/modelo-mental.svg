<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 276 · Capstone: empresa menos dependiente del fundador</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Parte 22 · Fundador, propietario e inde…</text>
