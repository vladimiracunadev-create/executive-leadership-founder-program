<title id="t-g239">Ficha visual de la clase 239: Cambio laboral provocado por IA</title>
<desc id="d-g239">Conceptos: task exposure; skill shift; reskilling; work redesign; augmentation strategy. Método: mapear tareas y exposure → evaluar value y risk por tarea → diseñar target roles y controls → crear reskilling y transition plan → medir productivity quality y workforce outcomes.</desc>
