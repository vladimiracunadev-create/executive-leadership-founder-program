<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456.06" width="1040" role="img" aria-labelledby="t-s242 d-s242" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s242">Clase 242 · Elegir problemas por dolor y frecuencia</title>
<desc id="d-s242">Cuadrante de frecuencia y dolor de un problema para decidir cuáles merecen investigación.</desc>
<defs><marker id="p-s242" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
