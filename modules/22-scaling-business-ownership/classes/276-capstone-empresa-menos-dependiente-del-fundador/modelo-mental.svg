<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616.48" width="1040" role="img" aria-labelledby="t-g276 d-g276" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g276">Ficha visual de la clase 276: Capstone: empresa menos dependiente del fundador</title>
<desc id="d-g276">Conceptos: founder independence; operating autonomy; continuity test; exception protocol; institutional memory. Método: mapear dependencies → instalar leaders y process owners → definir guardrails y dashboard → ejecutar 2 a 4 week absence simulation → analizar failures y remediar.</desc>
<defs><marker id="p-g276" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
