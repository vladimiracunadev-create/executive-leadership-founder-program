<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g181 d-g181" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g181">Ficha visual de la clase 181: Enterprise Risk Management</title>
<desc id="d-g181">Conceptos: risk; risk universe; risk owner; risk response; residual risk. Método: definir objetivos y contexto → identificar escenarios de riesgo → estimar exposición inherente → diseñar respuesta y controles → monitorear residual y agregación.</desc>
