<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >rol accountable por definición y uso de un dominio</text>
<circle cx="38" cy="314.24" r="5" fill="#cf222e"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >lineage</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trazabilidad desde origen a transformación y consumo</text>
<circle cx="38" cy="372.24" r="5" fill="#cf222e"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >single source of truth</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >fuente autorizada para una definición específica</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
