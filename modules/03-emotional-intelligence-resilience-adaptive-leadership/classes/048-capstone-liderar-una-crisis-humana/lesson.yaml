id: 48
part: 03
title: "Capstone: liderar una crisis humana"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir crisis humana de estabilización mediante evidencia observable."
  - "Aplicar la secuencia: proteger seguridad inmediata → activar protocolo y responsables → separar hechos de rumores → comunicar lo necesario con empatía → hacer seguimiento y aprender sin revictimizar."
  - "Interpretar tiempo de respuesta, personas protegidas, rumores sin atribuir causalidad automática."
  - "Resolver el caso de capstone: liderar una crisis humana con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Daniel Goleman — *Emotional Intelligence*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Clayton Christensen et al. — *How Will You Measure Your Life?*"
  - "Ronald Heifetz & Marty Linsky — *Leadership on the Line*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "Daniel H. Pink — *Drive*"
limits:
  - "En crisis humanas, la investigación y comunicación deben respetar debido proceso, privacidad y normativa. El manager no debe improvisar como investigador clínico, policial o jurídico fuera de su competencia."
evidence_signals:
  - "tiempo de respuesta"
  - "personas protegidas"
  - "rumores"
  - "cumplimiento de protocolo"
  - "acciones de seguimiento"
