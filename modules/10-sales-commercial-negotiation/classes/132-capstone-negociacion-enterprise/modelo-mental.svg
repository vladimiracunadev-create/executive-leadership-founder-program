<title id="t-s132">Clase 132 · Negociación enterprise: de mapear al comité a activar la cuenta</title>
<desc id="d-s132">Cinco pasos del capstone: mapear al comité de compra, construir el caso, negociar intereses y precio, gestionar riesgo y aspectos legales, y cerrar y activar.</desc>
