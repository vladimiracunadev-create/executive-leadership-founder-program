<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474.06" width="1040" role="img" aria-labelledby="t-s145 d-s145" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s145">Clase 145 · Dos formas de organizar el trabajo: proyecto y producto</title>
<desc id="d-s145">Un proyecto se gestiona por entrega, alcance y fecha; un producto, por resultados y aprendizaje continuo.</desc>
<defs><marker id="p-s145" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="474.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 145 · Dos formas de organizar el trabajo: proyecto y producto</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Perri (2018) · Cagan (2017) · PMI</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">PROYECTO</text>
<rect x="28" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Tiene un fin</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se cierra al entregar el alcance acordado.</text>
<rect x="28" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="177.25" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se mide por entrega</text>
<text x="46" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Alcance, plazo y costo.</text>
<rect x="28" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="28.0" y="250.5" width="6" height="63.25" rx="3" fill="#cf222e"/>
<text x="46" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Riesgo</text>
<text x="46" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Entregar a tiempo algo que nadie usa.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">PRODUCTO</text>
<rect x="532" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Es continuo</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Vive mientras entregue valor.</text>
<rect x="532" y="177.25" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="532.0" y="177.25" width="6" height="80.5" rx="3" fill="#1a7f37"/>
<text x="550" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se mide por resultado</text>
<text x="550" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Cambio en el comportamiento del cliente y valor para el</text>
<text x="550" y="234.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >negocio.</text>
<rect x="532" y="267.75" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="532.0" y="267.75" width="6" height="63.25" rx="3" fill="#bc4c00"/>
<text x="550" y="289.75" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Riesgo</text>
<text x="550" y="307.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Aprender sin entregar, o iterar sin dirección.</text>
<rect x="28" y="347" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="369" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Perri llama «trampa de la construcción» a medir el éxito por lo que se entrega y no por lo que cambia para el cliente. Muchas</text>
<text x="44" y="386.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >iniciativas combinan ambos modos y conviene declarar cuál rige cada decisión.</text>
<text x="28" y="433.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La distinción es práctica: un proyecto puede ser parte de un producto, y un producto puede tener proyectos con fecha.</text>
</svg>
