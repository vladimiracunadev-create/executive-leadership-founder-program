<text x="733.333" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Dueño, calendario y revisión.</text>
<rect x="28" y="309.5" width="984" height="43.25" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="331.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El comité no premia la mejor idea sino la mejor evidencia: qué se sabe, qué se supone, qué se probó y cuánto cuesta equivocarse.</text>
<text x="28" y="378.75" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las cifras y casos del capstone son ilustrativos; en una decisión real se usan datos propios y asesoría especializada.</text>
