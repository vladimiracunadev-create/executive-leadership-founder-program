<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" role="img" aria-labelledby="t-030 d-030" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-030">A qué nivel apunta el feedback decide si ayuda</title>
<desc id="d-030">El feedback centrado en la tarea tiende a mejorar el desempeño; el que dirige la atención al yo tiende a debilitarlo. Al recibirlo, tres disparadores explican por qué cuesta: verdad, relación e identidad.</desc>
<defs><marker id="p-030" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="580" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 030 · Feedback: dónde se dirige la atención</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Kluger &amp; DeNisi (1996) · Stone &amp; Heen (2014)</text>
<text x="28" y="84" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">DAR: EL NIVEL AL QUE APUNTA</text>
<rect x="28" y="100" width="560" height="100" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="28" y="100" width="150" height="100" rx="12" fill="#1a7f37"/>
<text x="103" y="152" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">TAREA</text>
<text x="103" y="172" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle" >tiende a ayudar</text>
<text x="194" y="130" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >Qué se hizo y qué faltó en esa tarea</text>
<text x="194" y="164" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >«El informe omite el costo de mantenimiento.»</text>
<rect x="28" y="216" width="560" height="100" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="28" y="216" width="150" height="100" rx="12" fill="#0969da"/>
<text x="103" y="268" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">PROCESO</text>
<text x="103" y="288" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle" >puede ayudar</text>
<text x="194" y="246" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >Cómo se trabajó y qué se puede cambiar</text>
<text x="194" y="280" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >«Contrasta dos fuentes antes de la conclusión.»</text>
<rect x="28" y="332" width="560" height="100" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<rect x="28" y="332" width="150" height="100" rx="12" fill="#cf222e"/>
<text x="103" y="384" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">YO</text>
<text x="103" y="404" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle" >tiende a debilitar</text>
<text x="194" y="362" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >Qué dice el resultado de quién eres</text>
<text x="194" y="396" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >«Eres desordenado.»</text>
<path d="M604,100 L604,440" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-030)"/>
<text x="616" y="270" font-size="11" font-weight="600" fill="#59636e" text-anchor="start" >más cerca</text>
<text x="616" y="284" font-size="11" font-weight="600" fill="#59636e" text-anchor="start" >del yo</text>
<rect x="28" y="452" width="560" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="474" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >En la revisión de Kluger y DeNisi, más de un tercio de las intervenciones</text>
<text x="44" y="491.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >de feedback redujo el desempeño: dar feedback no garantiza que ayude.</text>
<text x="680" y="84" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">RECIBIR: TRES DISPARADORES</text>
<rect x="680" y="100" width="332" height="100" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<rect x="680" y="100" width="6" height="100" rx="3" fill="#0969da"/>
<text x="698" y="122" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Verdad</text>
<text x="698" y="140" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >«Esto no es cierto ni justo.» Se discute</text>
<text x="698" y="157.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >el contenido.</text>
<rect x="680" y="216" width="332" height="100" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="680" y="216" width="6" height="100" rx="3" fill="#bc4c00"/>
<text x="698" y="238" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Relación</text>
<text x="698" y="256" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >«¿Quién eres tú para decírmelo?» Se</text>
<text x="698" y="273.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >discute al emisor.</text>
<rect x="680" y="332" width="332" height="100" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<rect x="680" y="332" width="6" height="100" rx="3" fill="#cf222e"/>
<text x="698" y="354" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Identidad</text>
<text x="698" y="372" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >«Esto dice que no valgo.» Se vive como un</text>
<text x="698" y="389.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >ataque a quién soy.</text>
<rect x="680" y="452" width="332" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="696" y="474" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Identificar el disparador permite separar</text>
<text x="696" y="491.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >el contenido útil de la reacción.</text>
<text x="28" y="560" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los resultados de Kluger y DeNisi son promedios de muchos estudios: orientan, no predicen un caso concreto.</text>
</svg>
