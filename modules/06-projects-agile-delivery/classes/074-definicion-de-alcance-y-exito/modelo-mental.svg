<title id="t-g74">Ficha visual de la clase 074: Definición de alcance y éxito</title>
<desc id="d-g74">Conceptos: scope; deliverable; outcome; acceptance criteria; benefit. Método: definir problema y outcome → traducir a entregables mínimos → documentar inclusiones y exclusiones → acordar acceptance criteria → asignar owner de beneficios post-entrega.</desc>
