<text x="572" y="348" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >seleccionar mezcla y plan B</text>
<text x="28" y="416" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="428" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
