id: 79
part: 06
title: "Scrum con criterio"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Describir los tres roles, los cinco eventos y los tres artefactos de Scrum con su propósito."
  - "Explicar los compromisos: objetivo del producto, objetivo del Sprint y definición de hecho."
  - "Conducir una planificación de Sprint orientada a un objetivo."
  - "Decidir si Scrum conviene a un trabajo y qué adaptar."
  - "Detectar malos usos frecuentes: «Scrum de papel», mini cascada, comités disfrazados."
deliverable: "leadership-decision-brief.md"
references:
  - "Ken Schwaber & Jeff Sutherland — *The Scrum Guide*"
  - "Kent Beck et al. — *Manifesto for Agile Software Development*"
  - "Mike Cohn — *Agile Estimating and Planning*"
  - "Nicole Forsgren, Jez Humble & Gene Kim — *Accelerate*"
  - "Amy C. Edmondson — *The Fearless Organization*"
limits:
  - "Scrum es un marco para trabajo complejo; no resuelve por sí solo problemas de estrategia, de calidad técnica o de cultura."
evidence_signals:
  - "objetivo del ciclo claro"
  - "roles sin ceremonia vacía"
  - "incremento verificable"
  - "retrospectiva con acciones"
