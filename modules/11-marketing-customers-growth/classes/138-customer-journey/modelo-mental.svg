<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >punto de interacción con organización o ecosistema</text>
<circle cx="38" cy="242.12" r="5" fill="#8250df"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >moment of truth</text>
