<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g117 d-g117" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g117">Ficha visual de la clase 117: Unit economics: CAC, LTV, churn y payback</title>
<desc id="d-g117">Conceptos: CAC; LTV; churn; payback; cohort. Método: definir unidad y cohortes → calcular CAC completo y marginal → medir retention/churn por cohorte → estimar LTV con margen y cautela → calcular payback y sensibilidad.</desc>
<defs><marker id="p-g117" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="602.36" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#8250df"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 117 · Unit economics: CAC, LTV, churn y payback</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 09 · Gestión de negocio</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#8250df"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >CAC</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >gasto incremental o total de adquisición dividido por</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >nuevos clientes según definición explícita</text>
<circle cx="38" cy="184.12" r="5" fill="#8250df"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >LTV</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >valor económico esperado de contribución de un cliente</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >durante su vida</text>
<circle cx="38" cy="256.24" r="5" fill="#8250df"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >churn</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >proporción de clientes o revenue perdido en un periodo</text>
<circle cx="38" cy="314.24" r="5" fill="#8250df"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >payback</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tiempo para recuperar CAC con margen de contribución</text>
<circle cx="38" cy="372.24" r="5" fill="#8250df"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >cohort</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grupo de clientes adquirido en periodo o condición</text>
<text x="54" y="411.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >comparable</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#8250df"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >definir unidad y cohortes</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#8250df"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >calcular CAC completo y marginal</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#8250df"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >medir retention/churn por cohorte</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#8250df"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >estimar LTV con margen y cautela</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#8250df"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >calcular payback y sensibilidad</text>
<text x="28" y="458.36" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="470.36" width="46.7" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="41" cy="483.36" r="3.5" fill="#8250df"/>
<text x="52" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >CAC</text>
<rect x="84.7" y="470.36" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="97.7" cy="483.36" r="3.5" fill="#8250df"/>
<text x="108.7" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >gross-margin LTV</text>
<rect x="231.1" y="470.36" width="95" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="244.1" cy="483.36" r="3.5" fill="#8250df"/>
<text x="255.1" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >logo churn</text>
<rect x="336.1" y="470.36" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="349.1" cy="483.36" r="3.5" fill="#8250df"/>
<text x="360.1" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >net revenue retention</text>
<rect x="517" y="470.36" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="530" cy="483.36" r="3.5" fill="#8250df"/>
<text x="541" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >payback months</text>
<rect x="28" y="516.36" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="516.36" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="536.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="554.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >LTV/CAC no es verdad física. Pequeños cambios de churn cambian mucho LTV; usa cohortes observadas, horizontes limitados y escenarios</text>
<text x="48" y="571.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >antes de escalar gasto.</text>
</svg>
