<text x="64" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >repente.</text>
<circle cx="50.0" cy="198.5" r="4" fill="#cf222e"/>
<text x="64" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Poderes, firmas y comunicaciones</text>
<text x="64" y="219.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >definidos.</text>
