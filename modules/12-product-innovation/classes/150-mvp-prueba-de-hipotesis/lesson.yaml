id: 150
part: 12
title: "MVP: prueba de hipótesis"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "convertir problemas de clientes en productos validados y outcomes medibles"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Formular las hipótesis críticas de valor y de crecimiento de un negocio o producto."
  - "Elegir el tipo de MVP más barato que pruebe la hipótesis más arriesgada."
  - "Definir métricas y umbrales de éxito antes de lanzar."
  - "Interpretar resultados sin autoengaño y con límites de la muestra."
  - "Decidir entre perseverar, pivotar o detener, y registrar el aprendizaje."
deliverable: "product-evidence-brief.md"
references:
  - "Eric Ries — *The Lean Startup*"
  - "Dan Olsen — *The Lean Product Playbook*"
  - "David J. Bland & Alexander Osterwalder — *Testing Business Ideas*"
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Marty Cagan — *Inspired*"
limits:
  - "Un MVP puede dar resultados engañosos con muestras pequeñas o con clientes atípicos (early adopters), que no representan al mercado amplio."
evidence_signals:
  - "hipótesis crítica identificada"
  - "MVP más barato que la prueba"
  - "umbral fijado antes de lanzar"
  - "decisión de perseverar, pivotar o detener"
