<rect x="28" y="292.25" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="314.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El modelo operativo traduce la estrategia en una forma concreta de trabajar. Si la estrategia exige cambios que el modelo operativo no</text>
<text x="44" y="331.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >permite, se queda en un documento.</text>
<text x="28" y="378.75" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >El modelo operativo objetivo se prueba con un caso real antes de generalizarlo.</text>
