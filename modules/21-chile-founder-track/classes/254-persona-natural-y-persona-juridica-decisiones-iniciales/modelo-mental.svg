<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >persona natural</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >individuo que realiza actividad económica en nombre</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >propio</text>
<circle cx="38" cy="184.12" r="5" fill="#59636e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >persona jurídica</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >entidad distinta de sus miembros reconocida por ley</text>
<circle cx="38" cy="242.12" r="5" fill="#59636e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >limited liability</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >limitación de responsabilidad patrimonial cuando la</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >forma y conducta lo permiten</text>
<circle cx="38" cy="314.24" r="5" fill="#59636e"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >separate patrimony</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >separación entre bienes de la entidad y propietarios</text>
