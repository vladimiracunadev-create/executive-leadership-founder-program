<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474.06" width="1040" role="img" aria-labelledby="t-s76 d-s76" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s76">Clase 076 · Por qué se subestima y cómo corregirlo</title>
<desc id="d-s76">Dos paneles: por qué las personas subestiman la duración de las tareas y qué prácticas corrigen el sesgo.</desc>
<defs><marker id="p-s76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="474.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 076 · Por qué se subestima y cómo corregirlo</text>
<text x="1012" y="43" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="end" >Buehler, Griffin &amp; Ross (1994) · Flyvbjerg (2006) · Cohn (2005)</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">POR QUÉ SE SUBESTIMA</text>
<rect x="28" y="104" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="80.5" rx="3" fill="#cf222e"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Falacia de la planificación</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se estima con el mejor escenario, aunque se conozcan retrasos</text>
<text x="46" y="161.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >pasados.</text>
<rect x="28" y="194.5" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="28.0" y="194.5" width="6" height="80.5" rx="3" fill="#bc4c00"/>
<text x="46" y="216.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Visión desde adentro</text>
<text x="46" y="234.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se piensa en los pasos del caso y no en cómo les fue a otros</text>
<text x="46" y="251.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >proyectos parecidos.</text>
<rect x="28" y="285" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="28.0" y="285.0" width="6" height="63.25" rx="3" fill="#59636e"/>
<text x="46" y="307" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Presión por un número</text>
<text x="46" y="325" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Quien estima sabe lo que se espera oír.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE CORRIGE</text>
<rect x="532" y="104" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="80.5" rx="3" fill="#1a7f37"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Visión desde afuera</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Partir de la distribución de proyectos similares (clase de</text>
<text x="550" y="161.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >referencia).</text>
<rect x="532" y="194.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="532.0" y="194.5" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="550" y="216.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Estimar en rangos</text>
<text x="550" y="234.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Dar un mínimo, un probable y un máximo, con su razón.</text>
<rect x="532" y="267.75" width="480" height="80.5" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.7" />
<rect x="532.0" y="267.75" width="6" height="80.5" rx="3" fill="#8250df"/>
<text x="550" y="289.75" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Capacidad medida</text>
<text x="550" y="307.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Planificar con la velocidad o el rendimiento real, no con el</text>
<text x="550" y="325" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >deseado.</text>
<rect x="28" y="364.25" width="984" height="43.25" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="386.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Estimar no es prometer: es declarar lo que se sabe y lo que no. Cohn propone estimar de forma relativa y medir la velocidad del equipo.</text>
<text x="28" y="433.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las clases de referencia requieren datos comparables; sin ellos, se usan los propios proyectos anteriores.</text>
</svg>
