id: 48
part: 03
title: "Capstone: liderar una crisis humana"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Priorizar la seguridad y el cuidado de las personas en las primeras horas."
  - "Reconocer un reclamo sin aceptar ni rechazar su contenido y abrir un cauce de diálogo."
  - "Separar lo negociable de lo que es una obligación legal, con asesoría."
  - "Evitar represalias y cuidar la justicia del proceso, del trato y de la explicación."
  - "Integrar autorregulación, escucha, estándar, incertidumbre, ética y lectura adaptativa en un plan."
  - "Cerrar con acuerdos, seguimiento y revisión sin culpas."
deliverable: "leadership-decision-brief.md"
references:
  - "W. Timothy Coombs — *Protecting Organization Reputations During a Crisis: The Development and Application of Situational Crisis Communication Theory*"
  - "Jason A. Colquitt, Donald E. Conlon, Michael J. Wesson, Christopher O. L. H. Porter & K. Yee Ng — *Justice at the Millennium: A Meta-Analytic Review of 25 Years of Organizational Justice Research*"
  - "Ronald A. Heifetz, Alexander Grashow & Marty Linsky — *The Practice of Adaptive Leadership*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "James J. Gross — *The Emerging Field of Emotion Regulation: An Integrative Review*"
limits:
  - "Las primeras 72 horas son una guía docente, no una norma; cada situación tiene plazos y obligaciones propias."
evidence_signals:
  - "primera respuesta en las primeras horas"
  - "cuatro justicias cubiertas"
  - "sin represalias documentado"
  - "acuerdos y seguimiento cumplidos"
