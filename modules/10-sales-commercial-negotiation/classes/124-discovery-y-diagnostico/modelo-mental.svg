<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g124 d-g124" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g124">Ficha visual de la clase 124: Discovery y diagnóstico</title>
<desc id="d-g124">Conceptos: situation; problem; implication; need-payoff; decision process. Método: preparar hipótesis sin asumir → preguntar situación mínima necesaria → profundizar problema e impacto → cuantificar costo de inacción → mapear decisión y acordar siguiente paso.</desc>
<defs><marker id="p-g124" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
