<title id="t-g108">Ficha visual de la clase 108: Capstone: operating review gerencial</title>
<desc id="d-g108">Conceptos: operating review; scorecard; forecast; decision log; management narrative. Método: preparar scorecard y variances → actualizar forecast → identificar top risks y asks → decidir recursos y acciones → registrar y revisar en próxima cadencia.</desc>
