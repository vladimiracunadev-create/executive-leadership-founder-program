id: 204
part: 16
title: "Capstone: primeros 100 días como CEO"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Clarificar el mandato, las expectativas y las restricciones con el directorio."
  - "Diseñar una agenda de aprendizaje de 30 días y medir su cobertura."
  - "Evaluar al equipo y los riesgos críticos y decidir qué se cierra primero."
  - "Definir tres a cinco prioridades con victorias tempranas y capital, dueños y revisión."
  - "Establecer una cadencia operativa, una comunicación y un plan de ajuste."
deliverable: "integrated-executive-decision-brief.md"
references:
  - "Michael D. Watkins — *The First 90 Days*"
  - "John J. Gabarro — *The Dynamics of Taking Charge*"
  - "Ram Charan — *What the CEO Wants You to Know*"
  - "Elena L. Botelho, Kim R. Powell & Tahl Raz — *The CEO Next Door*"
  - "Ben Horowitz — *The Hard Thing About Hard Things*"
limits:
  - "Los 100 días son una convención; el plan debe seguir a la evidencia."
evidence_signals:
  - "mandato y cobertura de aprendizaje"
  - "riesgos críticos cerrados o mitigados"
  - "prioridades con impacto calculado"
  - "cadencia y comunicación definidas"
