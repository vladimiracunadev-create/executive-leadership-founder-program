id: 113
part: 09
title: "Margen bruto, operacional y contribución"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "leer la economía del negocio y decidir con estados, caja, márgenes, retorno y valoración"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Calcular margen bruto, de contribución, operacional y neto."
  - "Elegir el margen apropiado para cada tipo de decisión."
  - "Analizar rentabilidad por producto, cliente o canal."
  - "Reconocer los efectos de asignar costos indirectos de forma arbitraria."
  - "Evaluar el efecto de precio, volumen y mezcla sobre el margen."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Charles Horngren et al. — *Cost Accounting: A Managerial Emphasis*"
  - "Robert S. Kaplan & Robin Cooper — *Cost & Effect*"
  - "Krishna G. Palepu, Paul M. Healy & Erik Peek — *Business Analysis and Valuation*"
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Stephen H. Penman — *Financial Statement Analysis and Security Valuation*"
limits:
  - "La asignación de costos indirectos es en parte arbitraria y cambia el resultado por producto o cliente; se declara el criterio."
evidence_signals:
  - "margen elegido según la decisión"
  - "contribución en decisiones marginales"
  - "costos indirectos con generadores"
  - "mezcla descompuesta"
