<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g171 d-g171" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g171">Ficha visual de la clase 171: Spans, layers y managerial load</title>
<desc id="d-g171">Conceptos: span of control; layer; managerial load; delayering; manager ratio. Método: medir capas y spans reales → segmentar por complejidad del trabajo → cuantificar carga de management → identificar capas sin valor decisional → rediseñar y monitorear calidad de liderazgo.</desc>
<defs><marker id="p-g171" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
