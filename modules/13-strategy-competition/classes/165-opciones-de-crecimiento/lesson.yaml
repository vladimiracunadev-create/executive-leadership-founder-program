id: 165
part: 13
title: "Opciones de crecimiento"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "formular y ejecutar elecciones coherentes sobre dónde jugar y cómo ganar"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir market penetration de market development mediante evidencia observable."
  - "Aplicar la secuencia: definir objetivo de crecimiento → mapear opciones y sinergias → estimar TAM economics y capacidades → comparar riesgo y reversibilidad → secuenciar prueba antes de escalar."
  - "Interpretar incremental revenue, payback, cross-sell sin atribuir causalidad automática."
  - "Resolver el caso de opciones de crecimiento con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "strategy-memo.md"
references:
  - "Michael E. Porter — *Competitive Strategy*"
  - "Michael E. Porter — *Competitive Advantage*"
  - "Avinash K. Dixit & Barry J. Nalebuff — *The Art of Strategy*"
  - "W. Chan Kim & Renée Mauborgne — *Blue Ocean Strategy*"
  - "A.G. Lafley & Roger L. Martin — *Playing to Win*"
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
limits:
  - "Crecimiento no equivale a creación de valor. Una expansión que destruye margen, foco o retorno sobre capital puede hacer la empresa mayor y peor."
evidence_signals:
  - "incremental revenue"
  - "payback"
  - "cross-sell"
  - "new-market retention"
  - "capability reuse"
