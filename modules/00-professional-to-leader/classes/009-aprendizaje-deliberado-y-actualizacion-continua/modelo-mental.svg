<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >diagnosticar una brecha concreta</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
