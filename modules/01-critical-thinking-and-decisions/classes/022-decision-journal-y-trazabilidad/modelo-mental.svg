<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 606.12" width="1040" role="img" aria-labelledby="t-g22 d-g22" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g22">Ficha visual de la clase 022: Decision journal y trazabilidad</title>
<desc id="d-g22">Conceptos: decision journal; supuesto crítico; forecast; resultado; outcome bias. Método: registrar decisión antes del resultado → anotar opciones y supuestos críticos → expresar predicciones y rangos → definir fecha de revisión → comparar proceso y resultado sin hindsight.</desc>
<defs><marker id="p-g22" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="606.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 022 · Decision journal y trazabilidad</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 01 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >decision journal</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >registro contemporáneo del razonamiento antes de</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >conocer el resultado</text>
<circle cx="38" cy="184.12" r="5" fill="#1a7f37"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >supuesto crítico</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >creencia cuya falsedad cambia la elección</text>
<circle cx="38" cy="242.12" r="5" fill="#1a7f37"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >forecast</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >predicción explícita con horizonte y rango</text>
<circle cx="38" cy="300.12" r="5" fill="#1a7f37"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >resultado</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >lo que efectivamente ocurrió</text>
<circle cx="38" cy="358.12" r="5" fill="#1a7f37"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >outcome bias</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tendencia a juzgar una decisión solo por su desenlace</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
