<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g112 d-g112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g112">Ficha visual de la clase 112: Flujo de caja</title>
<desc id="d-g112">Conceptos: operating cash flow; investing cash flow; financing cash flow; free cash flow; cash conversion. Método: partir de resultado o cobros-pagos → ajustar partidas no caja → incorporar capital de trabajo → separar CAPEX → conciliar financiamiento y saldo final.</desc>
<defs><marker id="p-g112" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#8250df"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 112 · Flujo de caja</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 09 · Gestión de negocio</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#8250df"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >operating cash flow</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >efectivo generado o consumido por operación</text>
<circle cx="38" cy="170" r="5" fill="#8250df"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >investing cash flow</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >flujos por adquisición o venta de activos e inversiones</text>
<circle cx="38" cy="228" r="5" fill="#8250df"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >financing cash flow</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >flujos con acreedores y propietarios</text>
<circle cx="38" cy="286" r="5" fill="#8250df"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >free cash flow</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >efectivo disponible después de inversiones necesarias,</text>
<text x="54" y="325.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >según definición utilizada</text>
<circle cx="38" cy="358.12" r="5" fill="#8250df"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >cash conversion</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >diferencia temporal entre resultado contable y</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cobro/pago real</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#8250df" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#8250df"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >partir de resultado o cobros-pagos</text>
<circle cx="485" cy="176" r="14" fill="#8250df"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >ajustar partidas no caja</text>
<circle cx="485" cy="230" r="14" fill="#8250df"/>
