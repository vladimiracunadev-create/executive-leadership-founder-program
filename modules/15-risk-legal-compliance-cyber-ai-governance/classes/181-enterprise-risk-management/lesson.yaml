id: 181
part: 15
title: "Enterprise Risk Management"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "gobernar riesgo, legal, cumplimiento, ciberseguridad, datos e IA de forma integrada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir risk de risk universe mediante evidencia observable."
  - "Aplicar la secuencia: definir objetivos y contexto → identificar escenarios de riesgo → estimar exposición inherente → diseñar respuesta y controles → monitorear residual y agregación."
  - "Interpretar loss events, key risk indicators, residual exposure sin atribuir causalidad automática."
  - "Resolver el caso de enterprise Risk Management con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "COSO — *Enterprise Risk Management—Integrating with Strategy and Performance*"
  - "John C. Hull — *Risk Management and Financial Institutions*"
  - "NIST — *Cybersecurity Framework (CSF) 2.0*"
  - "ISO — *ISO 31000 Risk management*"
  - "Richard A. Clarke & Robert K. Knake — *The Fifth Domain*"
  - "Bob Tricker — *Corporate Governance*"
limits:
  - "Las matrices de colores simplifican y pueden esconder colas extremas o correlaciones. Para riesgos materiales, complementa scoring con escenarios y magnitudes económicas."
evidence_signals:
  - "loss events"
  - "key risk indicators"
  - "residual exposure"
  - "control effectiveness"
  - "risk concentration"
