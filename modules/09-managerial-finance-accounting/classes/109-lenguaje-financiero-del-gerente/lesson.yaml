id: 109
part: 09
title: "Lenguaje financiero del gerente"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "leer la economía del negocio y decidir con estados, caja, márgenes, retorno y valoración"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Explicar qué responde cada estado financiero y qué no muestra."
  - "Distinguir devengado de caja, costo de gasto y utilidad de efectivo."
  - "Relacionar los tres estados entre sí con un ejemplo numérico."
  - "Formular preguntas gerenciales a partir de las cifras."
  - "Reconocer señales de que una cifra requiere una explicación más cuidadosa."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Krishna G. Palepu, Paul M. Healy & Erik Peek — *Business Analysis and Valuation*"
  - "Stephen H. Penman — *Financial Statement Analysis and Security Valuation*"
  - "Donald E. Kieso, Jerry J. Weygandt & Terry D. Warfield — *Intermediate Accounting*"
  - "Howard Schilit, Jeremy Perler & Yoni Engelhart — *Financial Shenanigans*"
  - "IFRS Foundation — *IFRS Accounting Standards*"
limits:
  - "Los estados financieros siguen reglas que pueden no reflejar el valor económico: el costo histórico de un activo puede ser muy distinto de su valor actual, y los intangibles (marca, relaciones, conocimiento) suelen no aparecer."
evidence_signals:
  - "tres estados leídos juntos"
  - "devengado distinguido de caja"
  - "definición de cada cifra conocida"
  - "preguntas gerenciales formuladas"
