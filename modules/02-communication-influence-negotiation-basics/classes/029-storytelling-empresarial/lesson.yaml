id: 29
part: 02
title: "Storytelling empresarial"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir protagonista de conflicto mediante evidencia observable."
  - "Aplicar la secuencia: elegir stakeholder y resultado → describir estado actual con evidencia → hacer visible la tensión y el costo de no actuar → presentar opciones y decisión → cerrar mostrando resultado esperado y cómo se medirá."
  - "Interpretar recuerdo del mensaje, claridad del problema, datos integrados en narrativa sin atribuir causalidad automática."
  - "Resolver el caso de storytelling empresarial con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Robert B. Cialdini — *Influence*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Barbara Minto — *The Pyramid Principle*"
  - "Edgar H. Schein — *Humble Inquiry*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
limits:
  - "Una historia convincente puede manipular. Evita seleccionar un caso extremo como representativo, exagerar causalidad o borrar incertidumbre para aumentar impacto emocional."
evidence_signals:
  - "recuerdo del mensaje"
  - "claridad del problema"
  - "datos integrados en narrativa"
  - "acciones posteriores"
  - "distorsiones detectadas entre historia y evidencia"
