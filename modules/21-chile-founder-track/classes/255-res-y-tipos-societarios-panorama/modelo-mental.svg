<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s255 d-s255" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s255">Clase 255 · Tipos societarios: preguntas antes de elegir</title>
<desc id="d-s255">Criterios para comparar tipos societarios y qué se verifica en fuente oficial: dueños, control y transferencia, administración, capital y objeto, y registro.</desc>
<defs><marker id="p-s255" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 255 · Tipos societarios: preguntas antes de elegir</text>
<text x="1012" y="43" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="end" >Registro de Empresas y Sociedades · LeyChile (Ley 20.659)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Criterio</text>
<text x="279.692" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Pregunta del fundador</text>
<text x="670.769" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué se verifica en fuente oficial</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Dueños</text>
<text x="279.692" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Cuántos serán y cómo evolucionará la propiedad?</text>
<text x="670.769" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Tipos disponibles y número de socios.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Control y transferencia</text>
<text x="279.692" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Cómo se ceden o venden participaciones?</text>
<text x="670.769" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Reglas del tipo y del pacto.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Administración</text>
<text x="279.692" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Quién representa y decide, y con qué límites?</text>
<text x="670.769" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Estatutos y reglas de administración.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Capital y objeto</text>
<text x="279.692" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué se aporta y qué actividad se declara?</text>
<text x="670.769" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Contenido exigido del acto constitutivo.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Registro</text>
<text x="279.692" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué se inscribe, cuándo y con qué efecto?</text>
<text x="670.769" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Portal del Registro de Empresas y Sociedades.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >No existe una sociedad universalmente mejor. Los estatutos, los pactos y la operación real importan más que la sigla: se confirman en</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >RES y LeyChile.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Con capital o socios externos, la decisión se revisa con asesoría profesional.</text>
</svg>
