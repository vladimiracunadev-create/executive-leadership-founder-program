id: 90
part: 07
title: "Lean y eliminación de desperdicio"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "operar procesos end-to-end con capacidad, calidad, continuidad y mejora"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir valor, trabajo necesario sin valor y desperdicio según el cliente."
  - "Reconocer las formas de desperdicio con señales observables."
  - "Aplicar la secuencia: valor, flujo de valor, flujo, tracción y mejora continua."
  - "Interpretar tiempo de entrega, rendimiento a la primera y trabajo en curso sin atribuir causalidad automática."
  - "Diferenciar lean de recorte de costos y evitar eliminar capacidad protectora."
deliverable: "leadership-decision-brief.md"
references:
  - "James P. Womack & Daniel T. Jones — *Lean Thinking*"
  - "James P. Womack, Daniel T. Jones & Daniel Roos — *The Machine That Changed the World*"
  - "Taiichi Ohno — *Toyota Production System*"
  - "Mike Rother & John Shook — *Learning to See*"
  - "Jeffrey K. Liker — *The Toyota Way*"
limits:
  - "Lean nació en manufactura repetitiva; en trabajo creativo o de alta variabilidad se adapta, no se copia."
evidence_signals:
  - "valor definido desde el cliente"
  - "tiempo de espera frente a trabajo"
  - "riesgo de cada mejora revisado"
  - "protección distinguida de desperdicio"
