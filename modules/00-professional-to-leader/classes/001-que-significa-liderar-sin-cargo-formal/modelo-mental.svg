<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 438" width="1040" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Modelo mental de la clase 001: Qué significa liderar sin cargo formal</title>
<desc id="d">1. detectar una brecha relevante → 2. formular un resultado y no solo una actividad → 3. construir apoyo con evidencia y contexto → 4. proponer una acción proporcional a la autoridad disponible → 5. cerrar el ciclo informando resultado y aprendizaje</desc>
