id: 199
part: 16
title: "Balance entre clientes, personas, accionistas y sociedad"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Mapear las partes interesadas materiales de una decisión."
  - "Distinguir obligaciones legales, compromisos y preferencias."
  - "Cuantificar trade-offs entre partes cuando sea posible y señalar lo que no se puede cuantificar."
  - "Definir principios, límites y reglas de decisión explícitas."
  - "Comunicar la decisión con sus costos y rendir cuentas."
deliverable: "commercial-decision-brief.md"
references:
  - "R. Edward Freeman — *Strategic Management: A Stakeholder Approach*"
  - "Michael C. Jensen — *Value Maximization, Stakeholder Theory, and the Corporate Objective Function*"
  - "Michael E. Porter & Mark R. Kramer — *Creating Shared Value*"
  - "Paul Polman & Andrew Winston — *Net Positive*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
limits:
  - "La retórica de las partes interesadas puede encubrir la falta de rendición de cuentas; se mantienen objetivos, responsables y cifras claros."
evidence_signals:
  - "partes materiales mapeadas"
  - "obligaciones separadas de preferencias"
  - "trade-offs cuantificados y nombrados"
  - "principios y rendición de cuentas"
