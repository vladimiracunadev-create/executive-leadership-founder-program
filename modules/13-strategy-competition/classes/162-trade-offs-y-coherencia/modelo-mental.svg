<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Trade-offs excesivos pueden impedir experimentación o atender cambios del mercado. La coherencia debe revisarse cuando la hipótesis</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >estratégica cambia, no protegerse por identidad.</text>
