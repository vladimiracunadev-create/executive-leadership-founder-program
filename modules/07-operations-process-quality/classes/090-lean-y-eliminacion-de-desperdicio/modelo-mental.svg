<text x="353.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >rework</text>
<rect x="406.6" y="456.24" width="219.2" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
