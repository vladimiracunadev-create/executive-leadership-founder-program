<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 522.06" width="1040" role="img" aria-labelledby="t-s182 d-s182" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s182">Clase 182 · De la capacidad de riesgo al indicador</title>
<desc id="d-s182">Cuatro niveles: capacidad de riesgo, apetito, tolerancia y límites con indicadores de riesgo.</desc>
<defs><marker id="p-s182" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="522.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 182 · De la capacidad de riesgo al indicador</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >COSO ERM · ISO 31000 · Hull</text>
<rect x="130" y="96" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="130" y="96" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<circle cx="162" cy="127.625" r="15" fill="#1a7f37"/>
<text x="162" y="132.625" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="190" y="120" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Límites e indicadores</text>
<text x="190" y="138" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Umbrales medibles, dueños y acciones al superarlos.</text>
<rect x="96" y="169.25" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="96" y="169.25" width="6" height="63.25" rx="3" fill="#0969da"/>
<circle cx="128" cy="200.875" r="15" fill="#0969da"/>
<text x="128" y="205.875" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="156" y="193.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Tolerancia</text>
<text x="156" y="211.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Desviación aceptable respecto de cada objetivo.</text>
<rect x="62" y="242.5" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<rect x="62" y="242.5" width="6" height="63.25" rx="3" fill="#bc4c00"/>
<circle cx="94" cy="274.125" r="15" fill="#bc4c00"/>
<text x="94" y="279.125" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="122" y="266.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Apetito de riesgo</text>
<text x="122" y="284.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Cuánto riesgo busca asumir para lograr sus objetivos.</text>
<rect x="28" y="315.75" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<rect x="28" y="315.75" width="6" height="63.25" rx="3" fill="#cf222e"/>
<circle cx="60" cy="347.375" r="15" fill="#cf222e"/>
<text x="60" y="352.375" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="88" y="339.75" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Capacidad de riesgo</text>
<text x="88" y="357.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Lo máximo que la organización puede soportar sin ponerse en peligro.</text>
<rect x="28" y="395" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="417" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El apetito se fija por debajo de la capacidad y se traduce en límites que alguien puede medir y hacer cumplir. Sin umbral y sin dueño,</text>
<text x="44" y="434.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >el apetito es una declaración.</text>
<text x="28" y="481.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las cifras de límites son decisiones del gobierno de la empresa; los reguladores sectoriales pueden fijar mínimos que se verifican en su fuente.</text>
</svg>
