id: 40
part: 03
title: "Motivación y propósito"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Describir las tres necesidades de la teoría de la autodeterminación y el continuo de motivación."
  - "Diagnosticar qué necesidad no se satisface en un caso concreto de baja motivación."
  - "Diseñar condiciones de autonomía, competencia y vínculo en un equipo."
  - "Usar incentivos externos sin desplazar la motivación propia."
  - "Aplicar el principio de progreso para sostener la motivación diaria."
deliverable: "leadership-decision-brief.md"
references:
  - "Richard M. Ryan & Edward L. Deci — *Self-Determination Theory and the Facilitation of Intrinsic Motivation, Social Development, and Well-Being*"
  - "Daniel H. Pink — *Drive*"
  - "Teresa M. Amabile & Steven J. Kramer — *The Progress Principle*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "Clayton Christensen et al. — *How Will You Measure Your Life?*"
limits:
  - "La teoría de la autodeterminación tiene amplio respaldo, pero se ha estudiado sobre todo en educación, salud y trabajo en entornos específicos; los resultados varían por cultura."
evidence_signals:
  - "necesidad frustrada identificada"
