<text x="571" y="251" font-size="11" font-weight="600" fill="#59636e" text-anchor="start" >revisar y volver a empezar</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="191.6" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="52" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >presupuesto comprometido</text>
<rect x="229.6" y="456.24" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="242.6" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="253.6" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >capacidad asignada</text>
<rect x="389.8" y="456.24" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="402.8" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="413.8" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >iniciativas detenidas</text>
<rect x="570.7" y="456.24" width="191.6" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="583.7" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="594.7" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >valor perdido por demora</text>
<rect x="28" y="488.24" width="302" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="501.24" r="3.5" fill="#1a7f37"/>
<text x="52" y="505.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >porcentaje de recursos en top priorities</text>
<rect x="28" y="534.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="534.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="554.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="572.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No todo dilema es un trade-off permanente. A veces una innovación cambia la frontera; antes de aceptar la renuncia como inevitable,</text>
<text x="48" y="589.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >pregunta si diseño, secuencia o tecnología pueden aliviarla.</text>
