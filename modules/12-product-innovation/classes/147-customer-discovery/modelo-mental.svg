<text x="48" y="554.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="572.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Discovery no produce verdad estadística por sí solo. Entrevistas pequeñas sirven para descubrir mecanismos e hipótesis; la prevalencia</text>
<text x="48" y="589.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >y tamaño de mercado requieren triangulación cuantitativa.</text>
