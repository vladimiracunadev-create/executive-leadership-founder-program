<title id="t-g272">Ficha visual de la clase 272: Holdings y estructuras de propiedad: conceptos</title>
<desc id="d-g272">Conceptos: holding company; subsidiary; ring-fencing; intercompany transaction; beneficial ownership. Método: definir objetivos de propiedad → mapear entidades y riesgos → analizar cash y contract flows → identificar intercompany y governance → validar legal y tributario antes de implementar.</desc>
