<text x="572" y="348" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >registrar decisión y revisar calidad de</text>
<text x="572" y="365.25" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >contratación</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
