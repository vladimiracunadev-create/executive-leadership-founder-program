<text x="52" y="274.75" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="72" y="267.75" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Cerrar y activar</text>
<text x="44" y="299.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Plan de cierre mutuo y</text>
<text x="44" y="317" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >arranque con valor temprano</text>
<text x="44" y="334.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >(130, 131).</text>
