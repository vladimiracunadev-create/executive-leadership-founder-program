<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 522.06" width="1040" role="img" aria-labelledby="t-s124 d-s124" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s124">Clase 124 · Preguntas de diagnóstico que construyen necesidad</title>
<desc id="d-s124">Cuatro tipos de pregunta del modelo SPIN en orden: situación, problema, implicación y necesidad de solución.</desc>
<defs><marker id="p-s124" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="522.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 124 · Preguntas de diagnóstico que construyen necesidad</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Rackham (1988) · Dixon &amp; Adamson (2011)</text>
<rect x="130" y="96" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="130" y="96" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<circle cx="162" cy="127.625" r="15" fill="#1a7f37"/>
<text x="162" y="132.625" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="190" y="120" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Necesidad de solución</text>
<text x="190" y="138" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >El cliente describe el valor de resolverlo. La solución surge de él.</text>
<rect x="96" y="169.25" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<rect x="96" y="169.25" width="6" height="63.25" rx="3" fill="#bc4c00"/>
<circle cx="128" cy="200.875" r="15" fill="#bc4c00"/>
<text x="128" y="205.875" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="156" y="193.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Implicación</text>
<text x="156" y="211.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Efectos del problema en costos, plazos, riesgos y personas. Es lo que le da tamaño.</text>
<rect x="62" y="242.5" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="62" y="242.5" width="6" height="63.25" rx="3" fill="#0969da"/>
<circle cx="94" cy="274.125" r="15" fill="#0969da"/>
<text x="94" y="279.125" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="122" y="266.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Problema</text>
<text x="122" y="284.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Dificultades o insatisfacciones que el cliente reconoce.</text>
<rect x="28" y="315.75" width="882" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.8" />
<rect x="28" y="315.75" width="6" height="63.25" rx="3" fill="#59636e"/>
<circle cx="60" cy="347.375" r="15" fill="#59636e"/>
<text x="60" y="352.375" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="88" y="339.75" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Situación</text>
<text x="88" y="357.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Hechos del contexto. Pocas y preparadas: no hacer que el cliente enseñe lo que ya podría saberse.</text>
<rect x="28" y="395" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="417" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La evidencia de Rackham indica que, en ventas grandes, las preguntas de implicación y de necesidad de solución se asocian más con el</text>
<text x="44" y="434.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >éxito que las de situación; el vendedor que habla de productos antes de acordar el problema pierde terreno.</text>
<text x="28" y="481.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La investigación original se centró en ventas complejas; en ventas simples y de bajo valor, un diagnóstico largo puede ser excesivo.</text>
</svg>
