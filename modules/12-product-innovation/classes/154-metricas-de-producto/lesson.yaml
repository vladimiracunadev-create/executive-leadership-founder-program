id: 154
part: 12
title: "Métricas de producto"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "convertir problemas de clientes en productos validados y outcomes medibles"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir una métrica guía que capture el valor que recibe el usuario."
  - "Descomponer esa métrica en indicadores de entrada accionables."
  - "Medir activación, retención y uso por cohortes."
  - "Distinguir métricas accionables de métricas de vanidad."
  - "Proteger el producto de los efectos de convertir métricas en metas."
deliverable: "product-evidence-brief.md"
references:
  - "Sean Ellis & Morgan Brown — *Hacking Growth*"
  - "Eric Ries — *The Lean Startup*"
  - "Dan Olsen — *The Lean Product Playbook*"
  - "Ron Kohavi, Diane Tang & Ya Xu — *Trustworthy Online Controlled Experiments*"
  - "Bernard Marr — *Key Performance Indicators*"
limits:
  - "Ninguna métrica captura todo el valor: el aprendizaje, la confianza o la satisfacción profunda son difíciles de medir."
evidence_signals:
  - "métrica guía ligada al valor"
  - "retención medida por cohortes"
  - "vanidad distinguida de accionable"
  - "métricas de protección definidas"
