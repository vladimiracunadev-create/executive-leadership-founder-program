<text x="665.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >time to decision</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un business case no debe inventar ahorros ni atribuir todo el beneficio al proveedor. Usa rangos acordados con el comprador y deja</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >visibles supuestos.</text>
