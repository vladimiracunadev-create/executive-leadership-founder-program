<text x="48" y="494" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="512" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Crecimiento no equivale a creación de valor. Una expansión que destruye margen, foco o retorno sobre capital puede hacer la empresa</text>
