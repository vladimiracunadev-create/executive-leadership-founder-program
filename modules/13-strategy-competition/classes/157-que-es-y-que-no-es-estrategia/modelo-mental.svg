<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g157 d-g157" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g157">Ficha visual de la clase 157: Qué es y qué no es estrategia</title>
<desc id="d-g157">Conceptos: strategy; goal; diagnosis; guiding policy; coherent actions. Método: definir desafío y evidencia → formular diagnóstico causal → generar políticas alternativas → hacer trade-offs explícitos → alinear acciones y métricas.</desc>
<defs><marker id="p-g157" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
