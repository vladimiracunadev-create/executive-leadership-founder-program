<text x="734.588" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Documento firmado.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El cierre es la suma de próximos pasos acordados; si el comprador no se compromete a fechas ni a evidencias, la oportunidad</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >probablemente no está en la etapa que se cree.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las fechas se acuerdan con quien tiene autoridad real; un plan sin patrocinador no avanza.</text>
