id: 208
part: 17
title: "Comités de auditoría, riesgo y compensación"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "separar propiedad, administración y supervisión para gobernar estrategia, riesgo y sucesión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Decidir qué comités necesita un directorio según su escala, regulación y complejidad."
  - "Redactar el estatuto de un comité con mandato, composición, facultades y calendario."
  - "Seleccionar miembros considerando independencia y experiencia."
  - "Definir la información que recibe el comité y lo que reporta al directorio."
  - "Evitar la fragmentación y la duplicación entre comités y con el directorio."
deliverable: "risk-governance-brief.md"
references:
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "COSO — *Internal Control - Integrated Framework*"
  - "COSO — *Enterprise Risk Management—Integrating with Strategy and Performance*"
  - "Bob Tricker — *Corporate Governance*"
  - "Ram Charan — *Boards That Deliver*"
limits:
  - "Más comités pueden fragmentar la responsabilidad y duplicar trabajo; se crean solo donde la escala, la regulación o la complejidad lo justifican."
evidence_signals:
  - "comités justificados por escala y complejidad"
  - "estatutos con independencia y experticia"
  - "carga de trabajo medida"
  - "seguimiento de hallazgos"
