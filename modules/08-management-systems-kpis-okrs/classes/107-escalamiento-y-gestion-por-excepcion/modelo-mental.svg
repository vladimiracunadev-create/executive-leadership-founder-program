<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Tolerancias demasiado amplias pueden esconder deterioro; demasiado estrechas destruyen autonomía. Ajusta al riesgo, madurez y</text>
