id: 38
part: 03
title: "Autorregulación y respuesta bajo presión"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Describir los cinco puntos del proceso de regulación emocional de Gross."
  - "Distinguir estrategias previas a la emoción de estrategias sobre la respuesta."
  - "Explicar por qué suprimir la expresión no equivale a regular la emoción y qué costos tiene."
  - "Preparar un plan para una situación de presión: situación, atención, interpretación y respuesta."
  - "Diseñar una práctica de recuperación inmediata para usar en el momento."
deliverable: "leadership-decision-brief.md"
references:
  - "James J. Gross — *The Emerging Field of Emotion Regulation: An Integrative Review*"
  - "Daniel Goleman — *Emotional Intelligence*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Daniel Kahneman — *Thinking, Fast and Slow*"
  - "Gary Klein — *Sources of Power*"
limits:
  - "La revisión de Gross es un marco teórico y gran parte de la evidencia proviene de experimentos con estudiantes y tareas de laboratorio; los efectos varían según la persona, la cultura y la situación."
evidence_signals:
  - "punto del proceso donde se intervino"
  - "pausa antes de responder"
  - "situación preparada con antelación"
  - "respuesta alineada al objetivo"
