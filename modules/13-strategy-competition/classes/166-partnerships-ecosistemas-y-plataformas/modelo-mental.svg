<text x="880" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >definir incentivos</text>
<text x="880" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >y reglas</text>
<rect x="846" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<circle cx="862.0" cy="240" r="11" fill="#bc4c00"/>
