id: 184
part: 15
title: "Alfabetización legal del gerente"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "gobernar riesgo, legal, cumplimiento, ciberseguridad, datos e IA de forma integrada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir legal issue spotting de legal privilege mediante evidencia observable."
  - "Aplicar la secuencia: identificar decisión y jurisdicción → mapear partes derechos y obligaciones → separar hechos de interpretación → documentar y preservar evidencia → escalar antes de comprometer o incumplir."
  - "Interpretar legal incidents, late escalations, contract exceptions sin atribuir causalidad automática."
  - "Resolver el caso de alfabetización legal del gerente con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "COSO — *Enterprise Risk Management—Integrating with Strategy and Performance*"
  - "John C. Hull — *Risk Management and Financial Institutions*"
  - "ISO — *ISO 31000 Risk management*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "NIST — *Cybersecurity Framework (CSF) 2.0*"
  - "NIST — *AI Risk Management Framework (AI RMF 1.0)*"
limits:
  - "Issue spotting no autoriza interpretar casos complejos ni dar asesoría. La ley depende de hechos, jurisdicción y fecha; escala asuntos materiales a profesionales habilitados."
evidence_signals:
  - "legal incidents"
  - "late escalations"
  - "contract exceptions"
  - "regulatory deadlines"
  - "dispute cost"
