id: 95
part: 07
title: "Automatización de procesos"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "operar procesos end-to-end con capacidad, calidad, continuidad y mejora"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Decidir si un proceso conviene simplificarlo, estandarizarlo, automatizarlo o dejarlo manual."
  - "Evaluar el beneficio con costo total, calidad y riesgo."
  - "Diseñar la interacción entre persona y sistema, incluidas las excepciones."
  - "Reconocer los efectos de la automatización en habilidades, vigilancia y confianza."
  - "Planificar la implantación con pruebas, plan manual y revisión posterior."
deliverable: "operating-improvement-brief.md"
references:
  - "Lisanne Bainbridge — *Ironies of automation*"
  - "Raja Parasuraman & Victor Riley — *Humans and Automation: Use, Misuse, Disuse, Abuse*"
  - "Michael Hammer & James Champy — *Reengineering the Corporation*"
  - "James P. Womack & Daniel T. Jones — *Lean Thinking*"
  - "Nigel Slack & Alistair Brandon-Jones — *Operations Management*"
limits:
  - "Los hallazgos de factores humanos provienen sobre todo de aviación y plantas de control; su traslado a procesos administrativos es razonable pero no automático."
evidence_signals:
  - "simplificar antes de automatizar"
  - "beneficio real frente a nominal"
  - "excepciones con dueño"
  - "control independiente y plan manual"
