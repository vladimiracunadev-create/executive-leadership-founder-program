<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >boundary</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >límite que protege responsabilidades y evita rescate</text>
<text x="54" y="383.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >impropio</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
