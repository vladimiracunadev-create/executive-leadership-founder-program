<text x="880" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >identificar</text>
<text x="880" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >espera, defectos y</text>
<text x="880" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >exceso</text>
<rect x="846" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<circle cx="862.0" cy="240" r="11" fill="#0969da"/>
<text x="862" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="880" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >reducir lotes y</text>
<text x="880" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >crear pull</text>
<rect x="658" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<circle cx="674.0" cy="240" r="11" fill="#0969da"/>
<text x="674" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="692" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >estandarizar</text>
<text x="692" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >mejora y repetir</text>
