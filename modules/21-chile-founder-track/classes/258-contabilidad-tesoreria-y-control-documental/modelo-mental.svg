<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g258 d-g258" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g258">Ficha visual de la clase 258: Contabilidad, tesorería y control documental</title>
<desc id="d-g258">Conceptos: bookkeeping; treasury; reconciliation; supporting document; month-end close. Método: separar cuentas personales y empresa → capturar soporte de cada transacción → reconciliar banco y documentos → aprobar pagos con controles → cerrar mes con estados e issues.</desc>
<defs><marker id="p-g258" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
