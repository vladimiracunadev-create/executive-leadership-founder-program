<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616.48" width="1040" role="img" aria-labelledby="t-g188 d-g188" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g188">Ficha visual de la clase 188: Gobierno responsable de IA</title>
<desc id="d-g188">Conceptos: AI governance; AI risk; human oversight; model evaluation; AI inventory. Método: inventariar casos de IA → clasificar impacto y contexto → definir evaluación y guardrails → asignar accountability y human oversight → monitorizar drift incidentes y cambios.</desc>
