id: 27
part: 02
title: "Escritura ejecutiva: claridad y síntesis"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Construir una pirámide de ideas con respuesta, líneas clave y datos de apoyo."
  - "Redactar una introducción con situación, complicación y pregunta."
  - "Agrupar ideas de modo que sean excluyentes entre sí y completas en conjunto."
  - "Comprobar la lógica con las preguntas «¿por qué?» hacia abajo y «¿y entonces?» hacia arriba."
  - "Reducir un documento a lo necesario para decidir sin perder los datos de respaldo."
deliverable: "leadership-decision-brief.md"
references:
  - "Barbara Minto — *The Pyramid Principle*"
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Nancy Duarte — *Resonate*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
limits:
  - "La pirámide supone un lector que debe decidir y que confía en que el autor ya hizo el análisis."
evidence_signals:
  - "conclusión en las dos primeras frases"
  - "grupos de ideas sin solaparse"
  - "títulos como afirmaciones"
  - "contenido movido al anexo"
