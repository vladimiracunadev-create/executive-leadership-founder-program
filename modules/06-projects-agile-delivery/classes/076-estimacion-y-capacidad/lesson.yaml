id: 76
part: 06
title: "Estimación y capacidad"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Explicar la falacia de la planificación y por qué afecta a quienes estiman."
  - "Aplicar la visión desde afuera con una clase de referencia."
  - "Estimar en rangos con una razón explícita."
  - "Medir la capacidad de un equipo y usarla para planificar."
  - "Comunicar una estimación con su incertidumbre y sus supuestos."
deliverable: "operating-improvement-brief.md"
references:
  - "Roger Buehler, Dale Griffin & Michael Ross — *Exploring the "planning fallacy": Why people underestimate their task completion times*"
  - "Bent Flyvbjerg — *From Nobel Prize to Project Management: Getting Risks Right*"
  - "Mike Cohn — *Agile Estimating and Planning*"
  - "Bent Flyvbjerg & Dan Gardner — *How Big Things Get Done*"
  - "Daniel Kahneman, Olivier Sibony & Cass R. Sunstein — *Noise*"
limits:
  - "Las clases de referencia requieren proyectos comparables y datos fiables; si no existen, la visión desde afuera es débil."
evidence_signals:
  - "rangos en vez de fechas únicas"
  - "visión desde afuera"
  - "capacidad medida"
  - "supuestos registrados"
