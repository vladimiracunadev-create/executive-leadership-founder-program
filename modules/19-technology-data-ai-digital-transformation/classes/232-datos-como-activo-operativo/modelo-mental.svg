<text x="52" y="257.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="72" y="250.5" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Valor medido</text>
<text x="44" y="282.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Uso real y efecto en</text>
<text x="44" y="299.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >resultados.</text>
<path d="M142.75,325.0 V345.0 H142.75 V196.5" stroke="#59636e" stroke-width="2" fill="none" stroke-dasharray="7 6" marker-end="url(#p-s232)"/>
<text x="142.75" y="339" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >el uso ajusta los productos de datos</text>
<rect x="28" y="361" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="383" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Una única fuente física no siempre es necesaria: lo crítico es el significado compartido y el gobierno. Centralizarlo todo puede restar</text>
<text x="44" y="400.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >velocidad sin mejorar la consistencia.</text>
<text x="28" y="447.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los datos personales tienen reglas legales que se verifican en la fuente oficial.</text>
</svg>
