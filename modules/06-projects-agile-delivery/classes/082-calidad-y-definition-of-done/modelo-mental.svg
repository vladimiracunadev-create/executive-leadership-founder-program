<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s82 d-s82" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s82">Clase 082 · Una definición de hecho que se puede comprobar</title>
<desc id="d-s82">Ejemplo de definición de hecho con criterio y forma de verificación.</desc>
<defs><marker id="p-s82" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 082 · Una definición de hecho que se puede comprobar</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Schwaber &amp; Sutherland (2020) · Forsgren et al. (2018)…</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Criterio</text>
<text x="391.429" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cómo se verifica</text>
<text x="813.143" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Quién</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >El código se revisó por otra persona.</text>
<text x="391.429" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Registro de la revisión en la herramienta.</text>
<text x="813.143" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Desarrollo</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Las pruebas automáticas pasan.</text>
<text x="391.429" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Resultado del sistema de integración continua.</text>
<text x="813.143" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Sistema</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Cumple los criterios de aceptación del elemento.</text>
<text x="391.429" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Demostración al dueño del producto.</text>
<text x="813.143" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dueño del producto</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >La documentación mínima está actualizada.</text>
<text x="391.429" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Lista de verificación acordada.</text>
<text x="813.143" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Desarrollo</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Se puede desplegar sin intervención manual.</text>
<text x="391.429" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Despliegue en un entorno de prueba.</text>
<text x="813.143" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Operación</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Sin una definición compartida, «terminado» significa cosas distintas y la deuda de calidad se acumula. Las listas de verificación</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >ayudan a no omitir pasos que se conocen.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La definición se ajusta a la madurez del equipo y se endurece con el tiempo; no es un trámite sino una promesa de calidad.</text>
</svg>
