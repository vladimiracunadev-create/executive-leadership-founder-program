<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ajuste consciente de estilo al contexto sin perder</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >autenticidad</text>
