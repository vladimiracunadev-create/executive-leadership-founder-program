id: 245
part: 20
title: "Propuesta de valor"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Priorizar el trabajo o dolor del cliente que justifica una propuesta."
  - "Mapear las alternativas actuales y lo que las hace insatisfactorias."
  - "Diseñar el beneficio, el mecanismo y la prueba que lo respalda."
  - "Probar el mensaje con un diseño que distinga diferencias reales."
  - "Cuantificar el valor con supuestos explícitos y condiciones de aplicación."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Alexander Osterwalder et al. — *Value Proposition Design*"
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
  - "Neil Rackham — *SPIN Selling*"
  - "Geoffrey A. Moore — *Crossing the Chasm*"
  - "Dan Olsen — *The Lean Product Playbook*"
limits:
  - "Una promesa demasiado agresiva puede crear riesgo reputacional o legal: no se cuantifican beneficios sin evidencia y se explicitan las condiciones."
evidence_signals:
  - "valor cuantificado por cliente"
  - "trabajo contratado identificado"
  - "mensaje probado"
  - "diferencia demostrable"
