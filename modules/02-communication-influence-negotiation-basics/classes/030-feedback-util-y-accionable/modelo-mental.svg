<text x="692" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >acordar conducta</text>
<text x="692" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >futura y</text>
<text x="692" y="276.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >seguimiento</text>
