<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616.48" width="1040" role="img" aria-labelledby="t-g261 d-g261" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g261">Ficha visual de la clase 261: Propiedad intelectual e INAPI</title>
<desc id="d-g261">Conceptos: trademark; patent; copyright; trade secret; IP assignment. Método: inventariar activos IP → clasificar mecanismo de protección → verificar ownership y assignments → buscar y registrar cuando aporta → crear controles de confidencialidad y renovación.</desc>
<defs><marker id="p-g261" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="616.48" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#59636e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 261 · Propiedad intelectual e INAPI</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 21 · Fundador, propietario e independencia</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#59636e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >trademark</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >signo que distingue productos o servicios y puede</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >registrarse</text>
<circle cx="38" cy="184.12" r="5" fill="#59636e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >patent</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >derecho sobre invención que cumple requisitos legales</text>
<circle cx="38" cy="242.12" r="5" fill="#59636e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >copyright</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >derechos sobre obras originales conforme a ley</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >aplicable</text>
<circle cx="38" cy="314.24" r="5" fill="#59636e"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >trade secret</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >información valiosa mantenida confidencial bajo medidas</text>
<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >razonables</text>
<circle cx="38" cy="386.36" r="5" fill="#59636e"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >IP assignment</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >acuerdo que transfiere derechos de propiedad</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >intelectual</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#59636e"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >inventariar activos IP</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#59636e"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >clasificar mecanismo de protección</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#59636e"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >verificar ownership y assignments</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#59636e"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >buscar y registrar cuando aporta</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#59636e"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >crear controles de confidencialidad</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >y renovación</text>
<text x="28" y="472.48" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="484.48" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="41" cy="497.48" r="3.5" fill="#59636e"/>
<text x="52" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >registered marks</text>
<rect x="174.4" y="484.48" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="187.4" cy="497.48" r="3.5" fill="#59636e"/>
<text x="198.4" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >IP assignment coverage</text>
<rect x="362.2" y="484.48" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="375.2" cy="497.48" r="3.5" fill="#59636e"/>
<text x="386.2" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >renewal deadlines</text>
<rect x="515.5" y="484.48" width="191.6" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="528.5" cy="497.48" r="3.5" fill="#59636e"/>
<text x="539.5" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >confidentiality controls</text>
<rect x="717.1" y="484.48" width="101.9" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="730.1" cy="497.48" r="3.5" fill="#59636e"/>
<text x="741.1" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >IP disputes</text>
<rect x="28" y="530.48" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="530.48" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="550.48" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="568.48" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Registrar una marca no protege todas las categorías ni garantiza libertad de operar. Patentes y conflictos complejos requieren</text>
<text x="48" y="585.73" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >búsqueda y asesoría especializada.</text>
</svg>
