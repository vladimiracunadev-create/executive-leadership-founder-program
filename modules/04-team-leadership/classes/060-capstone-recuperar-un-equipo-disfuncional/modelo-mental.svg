<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >observar síntomas y segmentar causas</text>
<circle cx="485" cy="176" r="14" fill="#0969da"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >proteger seguridad y continuidad</text>
<circle cx="485" cy="230" r="14" fill="#0969da"/>
<text x="485" y="235.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >resetear propósito, roles y normas</text>
