id: 242
part: 20
title: "Encontrar problemas valiosos"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir un problema valioso de una molestia o de una idea."
  - "Generar una lista de problemas desde la experiencia y la observación."
  - "Puntuar problemas por dolor, frecuencia, presupuesto, accesibilidad y tamaño."
  - "Detectar el sesgo de accesibilidad y estimar el tamaño del mercado de abajo hacia arriba."
  - "Elegir un problema y definir cómo se validará."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
  - "Teresa Torres — *Continuous Discovery Habits*"
  - "Dan Olsen — *The Lean Product Playbook*"
limits:
  - "Elegir por accesibilidad puede sesgar hacia oportunidades pequeñas: se usa como ventaja de aprendizaje inicial y luego se valida el tamaño y la competencia."
evidence_signals:
  - "problema frecuente y costoso"
  - "segmento con presupuesto"
  - "alternativas actuales mapeadas"
  - "prueba barata definida"
