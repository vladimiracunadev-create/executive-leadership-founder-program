<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s193 d-s193" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s193">Clase 193 · De gerente a ejecutivo: qué cambia</title>
<desc id="d-s193">Cinco dimensiones que cambian al pasar de gerente de una función a ejecutivo de la empresa.</desc>
<defs><marker id="p-s193" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 193 · De gerente a ejecutivo: qué cambia</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Watkins · Gabarro · Hambrick &amp; Mason (1984)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Dimensión</text>
<text x="236.8" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Como gerente</text>
<text x="602.286" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Como ejecutivo</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Alcance</text>
<text x="236.8" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Optimiza los resultados de su función.</text>
<text x="602.286" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Responde por la empresa y sus compromisos.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Decisiones</text>
<text x="236.8" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Elige dentro de límites y prioridades dadas.</text>
<text x="602.286" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Decide entre trade-offs entre funciones.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Fuente de valor</text>
<text x="236.8" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Hace y supervisa el trabajo con pericia.</text>
<text x="602.286" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Elige, habilita y sostiene a otros.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Relaciones</text>
<text x="236.8" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Su equipo y sus clientes internos.</text>
<text x="602.286" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Pares, directorio, clientes y otras partes.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Tiempo</text>
<text x="236.8" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Operación y resultados del período.</text>
<text x="602.286" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Capacidades y rumbo a varios años.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El cambio es de criterio, no de cargo: el ejecutivo conserva su pericia para hacer mejores preguntas, pero ya no la usa para quedarse</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >con el trabajo de otros.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las transiciones fracasan con frecuencia por diagnosticar mal el mandato y el contexto en los primeros meses.</text>
</svg>
