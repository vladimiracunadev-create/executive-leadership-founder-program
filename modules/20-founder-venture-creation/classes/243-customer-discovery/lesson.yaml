id: 243
part: 20
title: "Customer discovery"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir buyer de user mediante evidencia observable."
  - "Aplicar la secuencia: formular hipótesis de cliente y problema → entrevistar episodios recientes → mapear buyer user y process → testear severity y spend → actualizar hipótesis y segmentación."
  - "Interpretar interviews, buyer clarity, current spend sin atribuir causalidad automática."
  - "Resolver el caso de customer discovery con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "product-evidence-brief.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Alexander Osterwalder & Yves Pigneur — *Business Model Generation*"
  - "Eric Ries — *The Lean Startup*"
  - "Alexander Osterwalder et al. — *Value Proposition Design*"
  - "Peter F. Drucker — *The Effective Executive*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
limits:
  - "Entrevistar hasta oír repetición no prueba mercado. Discovery cualitativo debe complementarse con datos de demanda, tamaño y experimentos de compromiso."
evidence_signals:
  - "interviews"
  - "buyer clarity"
  - "current spend"
  - "trigger recurrence"
  - "commitment signals"
