<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >nombrar outcome y stakeholder</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#8250df"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >mapear outputs que plausiblemente</text>
<text x="566" y="315.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >lo habilitan</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#8250df"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >explicitar mecanismo causal</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#8250df"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >seleccionar métricas de outcome y</text>
<text x="690" y="199.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >driver</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#8250df"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >revisar si los outputs realmente</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >mueven la señal</text>
<text x="28" y="430.12" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="442.12" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
