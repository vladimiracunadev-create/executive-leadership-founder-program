id: 33
part: 02
title: "Persuasión ética e influencia"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Nombrar los seis principios de influencia de Cialdini y dar un uso legítimo y un abuso de cada uno."
  - "Aplicar las dos pruebas —transparencia del interés y libertad de rechazar— para clasificar una conducta."
  - "Reconocer las tácticas de influencia hacia pares y superiores y elegir la más adecuada."
  - "Detectar cuándo alguien aplica una de estas palancas sobre ti."
  - "Decidir cuándo no influir, y qué hacer en lugar de ello."
deliverable: "risk-governance-brief.md"
references:
  - "Robert B. Cialdini — *Influence*"
  - "Gary Yukl — *Leadership in Organizations*"
  - "Dale Carnegie — *How to Win Friends and Influence People*"
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
limits:
  - "Los principios de Cialdini se han desarrollado a partir de estudios y de observación de prácticas de venta y marketing; su peso relativo varía con la cultura y el contexto."
evidence_signals:
  - "transparencia del interés"
  - "libertad de rechazar"
  - "palanca usada y su justificación"
  - "regla personal ante la urgencia"
