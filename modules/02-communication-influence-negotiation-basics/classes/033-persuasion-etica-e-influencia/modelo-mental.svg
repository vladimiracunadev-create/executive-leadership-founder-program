<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" role="img" aria-labelledby="t-033 d-033" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-033">Persuasión, manipulación y coerción: dos pruebas</title>
<desc id="d-033">Un espectro de influencia con dos preguntas, si el interés es transparente y si la otra persona es libre de rechazar; y seis palancas de influencia con su uso legítimo y su abuso.</desc>
<defs><marker id="p-033" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="620" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 033 · Influir sin engañar ni forzar</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Cialdini (2016) · Yukl (2010)</text>
<rect x="28" y="90" width="316" height="84" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="2" />
<text x="44" y="118" font-size="14" font-weight="800" fill="#1a7f37" text-anchor="start" letter-spacing="1.2">PERSUASIÓN</text>
<text x="44" y="140" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Expone su propósito y deja decidir.</text>
<path d="M346,132 L364,132" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-033)"/>
<rect x="368" y="90" width="316" height="84" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="2" />
<text x="384" y="118" font-size="14" font-weight="800" fill="#bc4c00" text-anchor="start" letter-spacing="1.2">MANIPULACIÓN</text>
<text x="384" y="140" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Oculta el propósito o explota una</text>
<text x="384" y="157.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >debilidad.</text>
<path d="M686,132 L704,132" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-033)"/>
<rect x="708" y="90" width="316" height="84" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="2" />
<text x="724" y="118" font-size="14" font-weight="800" fill="#cf222e" text-anchor="start" letter-spacing="1.2">COERCIÓN</text>
<text x="724" y="140" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Condiciona la decisión con una amenaza.</text>
<rect x="28" y="188" width="490" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="210" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >PRUEBA 1  ·  ¿mi interés es transparente?</text>
<text x="44" y="229" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Si lo ocultaría, algo falla.</text>
<rect x="530" y="188" width="482" height="52" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="546" y="210" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >PRUEBA 2  ·  ¿puede decir que no sin castigo?</text>
<text x="546" y="229" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Si no, ya no es persuasión.</text>
<text x="28" y="268" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">SEIS PALANCAS DE INFLUENCIA</text>
<rect x="28" y="284" width="320" height="100" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
<text x="42" y="306" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Reciprocidad</text>
<circle cx="48" cy="328" r="5" fill="#1a7f37"/>
<text x="62" y="333" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Reconocer un favor real.</text>
<circle cx="48" cy="358" r="5" fill="#cf222e"/>
<text x="62" y="363" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Crear una deuda para cobrarla.</text>
<rect x="366" y="284" width="320" height="100" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
<text x="380" y="306" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Coherencia</text>
<circle cx="386" cy="328" r="5" fill="#1a7f37"/>
<text x="400" y="333" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Recordar un compromiso propio.</text>
<circle cx="386" cy="358" r="5" fill="#cf222e"/>
<text x="400" y="363" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Escalar un compromiso pequeño hasta</text>
<text x="400" y="379.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >atrapar.</text>
<rect x="704" y="284" width="320" height="100" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
<text x="718" y="306" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Prueba social</text>
<circle cx="724" cy="328" r="5" fill="#1a7f37"/>
<text x="738" y="333" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Mostrar lo que otros hacen de verdad.</text>
<circle cx="724" cy="358" r="5" fill="#cf222e"/>
<text x="738" y="363" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Inventar un consenso.</text>
<rect x="28" y="398" width="320" height="100" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
<text x="42" y="420" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Autoridad</text>
<circle cx="48" cy="442" r="5" fill="#1a7f37"/>
<text x="62" y="447" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Citar experiencia relevante.</text>
<circle cx="48" cy="472" r="5" fill="#cf222e"/>
<text x="62" y="477" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Apelar al cargo para callar preguntas.</text>
<rect x="366" y="398" width="320" height="100" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
<text x="380" y="420" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Simpatía</text>
<circle cx="386" cy="442" r="5" fill="#1a7f37"/>
<text x="400" y="447" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Encontrar afinidades reales.</text>
<circle cx="386" cy="472" r="5" fill="#cf222e"/>
<text x="400" y="477" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Halagar para bajar la guardia.</text>
<rect x="704" y="398" width="320" height="100" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
<text x="718" y="420" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Escasez</text>
<circle cx="724" cy="442" r="5" fill="#1a7f37"/>
<text x="738" y="447" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Informar un plazo real.</text>
<circle cx="724" cy="472" r="5" fill="#cf222e"/>
<text x="738" y="477" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Fabricar urgencia.</text>
<text x="28" y="600" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Verde: uso legítimo. Rojo: abuso. Cialdini describe estos mecanismos; la frontera ética es criterio de la clase, no de su autor.</text>
</svg>
