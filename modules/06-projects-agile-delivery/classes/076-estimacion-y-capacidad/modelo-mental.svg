<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g76 d-g76" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g76">Ficha visual de la clase 076: Estimación y capacidad</title>
<desc id="d-g76">Conceptos: effort; duration; capacity; throughput; forecast. Método: definir unidad de trabajo → usar datos históricos comparables → estimar rango y confianza → modelar capacidad, dependencias y buffers → actualizar forecast con throughput real.</desc>
<defs><marker id="p-g76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#0969da"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 076 · Estimación y capacidad</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 06 · Liderazgo de equipos y ejecución</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#0969da"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >effort</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trabajo necesario medido en unidades de esfuerzo</text>
<circle cx="38" cy="170" r="5" fill="#0969da"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >duration</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tiempo calendario desde inicio a fin</text>
<circle cx="38" cy="228" r="5" fill="#0969da"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >capacity</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trabajo disponible de personas o sistemas por periodo</text>
<circle cx="38" cy="286" r="5" fill="#0969da"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >throughput</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >unidades terminadas por periodo</text>
<circle cx="38" cy="344" r="5" fill="#0969da"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >forecast</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >proyección actualizada basada en datos y supuestos</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#0969da" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#0969da"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >definir unidad de trabajo</text>
<circle cx="485" cy="176" r="14" fill="#0969da"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >usar datos históricos comparables</text>
<circle cx="485" cy="230" r="14" fill="#0969da"/>
<text x="485" y="235.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >estimar rango y confianza</text>
<circle cx="485" cy="284" r="14" fill="#0969da"/>
<text x="485" y="289.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="512" y="280" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >modelar capacidad, dependencias y buffers</text>
<circle cx="485" cy="338" r="14" fill="#0969da"/>
<text x="485" y="343.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >actualizar forecast con throughput real</text>
<text x="28" y="416" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="428" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="41" cy="441" r="3.5" fill="#0969da"/>
<text x="52" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >error de forecast</text>
<rect x="181.3" y="428" width="95" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="194.3" cy="441" r="3.5" fill="#0969da"/>
<text x="205.3" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >throughput</text>
<rect x="286.3" y="428" width="95" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="299.3" cy="441" r="3.5" fill="#0969da"/>
<text x="310.3" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cycle time</text>
<rect x="391.3" y="428" width="164" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="404.3" cy="441" r="3.5" fill="#0969da"/>
<text x="415.3" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >capacity utilization</text>
<rect x="565.3" y="428" width="81.2" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="578.3" cy="441" r="3.5" fill="#0969da"/>
<text x="589.3" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >variance</text>
<rect x="28" y="474" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="474" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="494" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="512" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No persigas precisión costosa para trabajo exploratorio. El objetivo de estimar es mejorar decisiones de alcance y fecha, no producir</text>
<text x="48" y="529.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >un número aparentemente exacto.</text>
</svg>
