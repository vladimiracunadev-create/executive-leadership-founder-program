id: 91
part: 07
title: "Calidad y variabilidad"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "operar procesos end-to-end con capacidad, calidad, continuidad y mejora"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir calidad como cumplimiento de lo que el cliente necesita, medido en el proceso."
  - "Distinguir variación por causas comunes y por causas especiales."
  - "Leer un gráfico de control e identificar señales."
  - "Comparar la variación del proceso con la tolerancia que exige el cliente."
  - "Decidir si la respuesta es cambiar el sistema o investigar un hecho concreto."
deliverable: "operating-improvement-brief.md"
references:
  - "W. Edwards Deming — *Out of the Crisis*"
  - "Donald J. Wheeler & David S. Chambers — *Understanding Statistical Process Control*"
  - "ISO — *ISO 9001 Quality management systems*"
  - "Nigel Slack & Alistair Brandon-Jones — *Operations Management*"
  - "James P. Womack & Daniel T. Jones — *Lean Thinking*"
limits:
  - "Los gráficos de control requieren datos en orden de tiempo y un proceso razonablemente repetitivo; en trabajo único o con muy pocos datos, su uso es limitado."
evidence_signals:
  - "causa común separada de especial"
  - "límites frente a tolerancia"
  - "sin reacción a puntos aislados"
  - "datos suficientes declarados"
