<rect x="181.3" y="456.24" width="81.2" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="194.3" cy="469.24" r="3.5" fill="#0969da"/>
<text x="205.3" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >rotación</text>
<rect x="272.5" y="456.24" width="95" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
