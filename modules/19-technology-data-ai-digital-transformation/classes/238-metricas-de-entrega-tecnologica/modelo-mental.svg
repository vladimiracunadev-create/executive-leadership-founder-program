<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g238 d-g238" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g238">Ficha visual de la clase 238: Métricas de entrega tecnológica</title>
<desc id="d-g238">Conceptos: deployment frequency; lead time for changes; change failure rate; time to restore; developer experience. Método: definir flujo de valor de software → instrumentar velocidad y estabilidad → segmentar por producto y contexto → identificar constraint → experimentar mejora y medir outcome.</desc>
