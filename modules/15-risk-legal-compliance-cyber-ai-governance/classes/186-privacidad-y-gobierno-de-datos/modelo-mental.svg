<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >datos</text>
<circle cx="38" cy="184.12" r="5" fill="#bc4c00"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >data minimization</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >recopilar solo datos necesarios para propósito legítimo</text>
<circle cx="38" cy="242.12" r="5" fill="#bc4c00"/>
