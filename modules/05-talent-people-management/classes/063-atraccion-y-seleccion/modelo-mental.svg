<rect x="620.5" y="456.24" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="633.5" cy="469.24" r="3.5" fill="#0969da"/>
<text x="644.5" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >adverse impact</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Ningún instrumento debe preguntar o discriminar por información protegida o irrelevante. Los métodos deben relacionarse con el trabajo</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >y cumplir normativa local de igualdad y datos personales.</text>
</svg>
