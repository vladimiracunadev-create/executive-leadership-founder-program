id: 41
part: 03
title: "Resiliencia, flexibilidad y agilidad"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir resiliencia y distinguirla de recuperación, dureza y simple resistencia."
  - "Describir las trayectorias tras un evento adverso y lo que implican para el liderazgo."
  - "Identificar procesos que sostienen la capacidad de adaptación: relaciones, resolución de problemas, sentido y recursos."
  - "Diferenciar resiliencia individual de resiliencia organizacional."
  - "Diseñar prácticas de equipo que apoyen la adaptación tras un revés."
deliverable: "risk-governance-brief.md"
references:
  - "Ann S. Masten — *Ordinary Magic: Resilience Processes in Development*"
  - "George A. Bonanno — *Loss, Trauma, and Human Resilience: Have We Underestimated the Human Capacity to Thrive After Extremely Aversive Events?*"
  - "Karl E. Weick & Kathleen M. Sutcliffe — *Managing the Unexpected*"
  - "Angela Duckworth — *Grit*"
  - "Amy C. Edmondson — *The Fearless Organization*"
limits:
  - "Las trayectorias de Bonanno se describen en poblaciones, no predicen a una persona."
evidence_signals:
  - "trayectoria observada sin etiquetar"
  - "procesos protegidos"
  - "condiciones de trabajo cambiadas"
  - "aprendizaje del fallo pequeño"
