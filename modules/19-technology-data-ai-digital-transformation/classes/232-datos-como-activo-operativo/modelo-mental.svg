<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 488.06" width="1040" role="img" aria-labelledby="t-s232 d-s232" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s232">Clase 232 · Del dato al producto de datos con dueño</title>
<desc id="d-s232">Cinco pasos para tratar los datos como activo operativo: decisiones y productos, dominios y dueños, calidad y contratos, acceso con gobierno y valor medido.</desc>
<defs><marker id="p-s232" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
