<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g8 d-g8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g8">Ficha visual de la clase 008: Gestión de energía y sostenibilidad personal</title>
<desc id="d-g8">Conceptos: carga; recuperación; fatiga decisional; ritmo sostenible; señal de saturación. Método: observar patrones de energía y errores → separar picos excepcionales de carga estructural → proteger sueño, pausas y recuperación → rediseñar trabajo que depende de heroísmo → escalar capacidad cuando la sobrecarga deja de ser transitoria.</desc>
<defs><marker id="p-g8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 008 · Gestión de energía y sostenibilidad personal</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 00 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >carga</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >demanda física, cognitiva y emocional acumulada</text>
<circle cx="38" cy="170" r="5" fill="#1a7f37"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >recuperación</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >periodo y práctica que restaura capacidad funcional</text>
<circle cx="38" cy="228" r="5" fill="#1a7f37"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >fatiga decisional</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >deterioro del juicio tras decisiones repetidas o</text>
<text x="54" y="267.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >prolongadas</text>
<circle cx="38" cy="300.12" r="5" fill="#1a7f37"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >ritmo sostenible</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >velocidad que puede mantenerse sin degradación crónica</text>
<circle cx="38" cy="358.12" r="5" fill="#1a7f37"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >señal de saturación</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >indicador temprano de que demanda supera capacidad de</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >recuperación</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#1a7f37" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#1a7f37"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >observar patrones de energía y errores</text>
<circle cx="485" cy="176" r="14" fill="#1a7f37"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >separar picos excepcionales de carga estructural</text>
<circle cx="485" cy="230" r="14" fill="#1a7f37"/>
<text x="485" y="235.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >proteger sueño, pausas y recuperación</text>
<circle cx="485" cy="284" r="14" fill="#1a7f37"/>
<text x="485" y="289.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="512" y="280" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >rediseñar trabajo que depende de heroísmo</text>
<circle cx="485" cy="338" r="14" fill="#1a7f37"/>
<text x="485" y="343.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >escalar capacidad cuando la sobrecarga deja de ser transitoria</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="52" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >horas extraordinarias</text>
<rect x="208.9" y="456.24" width="212.3" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="221.9" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="232.9" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >errores al final de jornada</text>
<rect x="431.2" y="456.24" width="95" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="444.2" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="455.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >ausentismo</text>
<rect x="536.2" y="456.24" width="239.9" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="549.2" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="560.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >interrupciones fuera de horario</text>
<rect x="786.1" y="456.24" width="212.3" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="799.1" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="810.1" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >variabilidad de rendimiento</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >La sostenibilidad no exige eliminar periodos intensos. Lanzamientos, incidentes y crisis pueden requerir picos; el criterio es que</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >sean explícitos, acotados, compensados y no el modo operativo permanente.</text>
</svg>
