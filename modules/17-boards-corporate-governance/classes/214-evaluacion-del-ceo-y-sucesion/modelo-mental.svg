<title id="t-g214">Ficha visual de la clase 214: Evaluación del CEO y sucesión</title>
<desc id="d-g214">Conceptos: CEO evaluation; scorecard; relative performance; behavioral objective; succession readiness. Método: definir expectativas ex ante → equilibrar outcomes y behaviors → reunir evidencia y contexto → discutir en sesión independiente → dar feedback compensation y development actions.</desc>
