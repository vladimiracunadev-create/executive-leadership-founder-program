<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" role="img" aria-labelledby="t-048 d-048" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-048">Las primeras 72 horas de una crisis humana</title>
<desc id="d-048">Tres tramos con las decisiones y el criterio que gobierna cada uno: proteger y reconocer, abrir diálogo con hechos y cuidar las cuatro formas de justicia, y cerrar con acuerdos y seguimiento.</desc>
<defs><marker id="p-048" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="600" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 048 · Liderar cuando el problema son las personas</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Coombs (2007) · Colquitt et al. (2001) · Heifetz et al. (2009)</text>
<rect x="28" y="92" width="320" height="396" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<path d="M28,138 V104 a12,12 0 0 1 12,-12 H336 a12,12 0 0 1 12,12 V138 Z" fill="#cf222e"/>
<text x="44" y="112" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="1.2">0–6 HORAS</text>
<text x="44" y="130" font-size="15" font-weight="800" fill="#ffffff" text-anchor="start" >Proteger y reconocer</text>
<circle cx="50" cy="168" r="4" fill="#cf222e"/>
<text x="64" y="173" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Seguridad de las personas primero.</text>
<circle cx="50" cy="204.94" r="4" fill="#cf222e"/>
<text x="64" y="209.94" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Reconocer el reclamo sin aceptar ni</text>
<text x="64" y="227.88" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >rechazar su contenido.</text>
<circle cx="50" cy="259.82" r="4" fill="#cf222e"/>
<text x="64" y="264.82" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Un solo responsable y un registro de</text>
<text x="64" y="282.76" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >hechos.</text>
<rect x="42" y="404" width="292" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="54" y="424" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start" >Coombs: informar e instruir antes de</text>
<text x="54" y="440.56" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start" >cuidar la imagen.</text>
<path d="M350,290 L366,290" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-048)"/>
<rect x="368" y="92" width="320" height="396" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M368,138 V104 a12,12 0 0 1 12,-12 H676 a12,12 0 0 1 12,12 V138 Z" fill="#bc4c00"/>
<text x="384" y="112" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="1.2">6–48 HORAS</text>
<text x="384" y="130" font-size="15" font-weight="800" fill="#ffffff" text-anchor="start" >Dialogar con hechos</text>
<circle cx="390" cy="168" r="4" fill="#bc4c00"/>
<text x="404" y="173" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Interlocutores definidos y mesa de</text>
<text x="404" y="190.94" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >diálogo.</text>
<circle cx="390" cy="222.88" r="4" fill="#bc4c00"/>
<text x="404" y="227.88" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Separar lo negociable de la</text>
<text x="404" y="245.82" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >obligación legal.</text>
<circle cx="390" cy="277.76" r="4" fill="#bc4c00"/>
<text x="404" y="282.76" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Un mismo mensaje hacia dentro y</text>
<text x="404" y="300.7" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >hacia fuera.</text>
<rect x="382" y="404" width="292" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="394" y="424" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start" >Colquitt: resultado, proceso, trato y</text>
<text x="394" y="440.56" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start" >explicación.</text>
<path d="M690,290 L706,290" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-048)"/>
<rect x="708" y="92" width="320" height="396" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M708,138 V104 a12,12 0 0 1 12,-12 H1016 a12,12 0 0 1 12,12 V138 Z" fill="#1a7f37"/>
<text x="724" y="112" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="1.2">48–72 HORAS</text>
<text x="724" y="130" font-size="15" font-weight="800" fill="#ffffff" text-anchor="start" >Acordar y seguir</text>
<circle cx="730" cy="168" r="4" fill="#1a7f37"/>
<text x="744" y="173" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Compromisos con responsable y fecha.</text>
<circle cx="730" cy="204.94" r="4" fill="#1a7f37"/>
<text x="744" y="209.94" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Sin represalias contra quienes</text>
<text x="744" y="227.88" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >reclamaron.</text>
<circle cx="730" cy="259.82" r="4" fill="#1a7f37"/>
<text x="744" y="264.82" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >Revisión sin culpas y fecha de</text>
<text x="744" y="282.76" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >seguimiento.</text>
<rect x="722" y="404" width="292" height="68" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="734" y="424" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start" >Heifetz: ver desde el balcón qué cambio</text>
<text x="734" y="440.56" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start" >de fondo se pide.</text>
<rect x="28" y="500" width="984" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="525" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start" >Un conflicto público con trabajadores se mide por cómo se trata a las personas, no solo por cómo se cierra.</text>
<text x="28" y="574" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los tramos son una guía docente; la norma laboral aplicable se verifica con asesoría y no la reemplaza esta clase.</text>
</svg>
