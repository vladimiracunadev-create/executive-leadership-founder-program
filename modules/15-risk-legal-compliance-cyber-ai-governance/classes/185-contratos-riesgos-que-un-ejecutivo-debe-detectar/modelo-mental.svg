<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 444.61" width="1040" role="img" aria-labelledby="t-s185 d-s185" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s185">Clase 185 · Cinco riesgos de un contrato</title>
<desc id="d-s185">Cinco áreas de riesgo contractual con la pregunta que el ejecutivo debe hacerse y el control asociado.</desc>
<defs><marker id="p-s185" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="444.61" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 185 · Cinco riesgos de un contrato</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Williamson (1979) · Macaulay (1963) · Bazerman &amp; Moore</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Riesgo</text>
<text x="252.757" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Pregunta del ejecutivo</text>
<text x="651.676" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Control o cláusula a revisar</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Precio y pagos</text>
<text x="252.757" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué pasa si el costo sube o el cliente paga tarde?</text>
<text x="651.676" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Reajustes, plazos de pago, intereses y garantías.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Plazos y entregables</text>
<text x="252.757" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué se entrega, cuándo y quién lo acepta?</text>
<text x="651.676" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Criterios de aceptación y calendario con hitos.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Responsabilidad</text>
<text x="252.757" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Hasta cuánto respondo si algo sale mal?</text>
<text x="651.676" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Límites, exclusiones y seguros.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Salida y dependencia</text>
<text x="252.757" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Puedo terminar sin quedar atrapado?</text>
<text x="651.676" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Terminación, cesión, traspaso de datos y transición.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Datos y confidencialidad</text>
<text x="252.757" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué información se comparte y cómo se protege?</text>
<text x="651.676" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Uso permitido, seguridad y devolución.</text>
<rect x="28" y="334.8" width="984" height="43.25" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Un contrato distribuye riesgos entre partes con distinto poder; el ejecutivo busca entender qué riesgos asume, no redactar cláusulas.</text>
<text x="28" y="404.05" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La redacción y la interpretación de cláusulas son tarea de asesoría legal; esta tabla ordena las preguntas previas.</text>
</svg>
