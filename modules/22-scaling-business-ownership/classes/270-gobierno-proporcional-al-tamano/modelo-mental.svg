<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g270 d-g270" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g270">Ficha visual de la clase 270: Gobierno proporcional al tamaño</title>
<desc id="d-g270">Conceptos: governance maturity; advisory board; reserved matters; board cadence; governance threshold. Método: mapear owners y riesgos → definir reserved matters → crear reporting y cadence mínima → añadir independientes y committees al umbral → revisar governance anualmente.</desc>
