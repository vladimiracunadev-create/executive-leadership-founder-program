<title id="t-g257">Ficha visual de la clase 257: Documentos tributarios, IVA y registros: panorama ejecutivo</title>
<desc id="d-g257">Conceptos: DTE; IVA; debit tax; credit tax; tax register. Método: mapear transacciones y documentos → configurar emisión y recepción → reconciliar ventas compras y caja → revisar tratamiento IVA con contador → cerrar periodo y conservar soporte.</desc>
