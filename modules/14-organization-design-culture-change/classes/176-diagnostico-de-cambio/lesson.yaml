id: 176
part: 14
title: "Diagnóstico de cambio"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "diseñar estructura, derechos de decisión, cultura y cambio como un sistema"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir change diagnosis de stakeholder mediante evidencia observable."
  - "Aplicar la secuencia: definir conducta futura observable → mapear stakeholders y pérdidas → diagnosticar conocimiento motivación y capacidad → identificar barreras de sistema → diseñar intervención segmentada y feedback."
  - "Interpretar adoption by segment, proficiency, resistance themes sin atribuir causalidad automática."
  - "Resolver el caso de diagnóstico de cambio con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Jay R. Galbraith — *Designing Organizations*"
  - "Edgar H. Schein & Peter A. Schein — *Organizational Culture and Leadership*"
  - "Stanley McChrystal et al. — *Team of Teams*"
  - "John P. Kotter — *Leading Change*"
  - "Patrick Lencioni — *The Advantage*"
  - "Chip Heath & Dan Heath — *Switch*"
limits:
  - "Etiquetar toda resistencia como problema humano es peligroso; a veces revela mal diseño. Distingue oposición a perder privilegios de feedback legítimo sobre el sistema."
evidence_signals:
  - "adoption by segment"
  - "proficiency"
  - "resistance themes"
  - "process compliance"
  - "benefit realization"
