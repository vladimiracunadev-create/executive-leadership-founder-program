<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 425.3" width="1040" role="img" aria-labelledby="t-s223 d-s223" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s223">Clase 223 · Conceptos de una tabla de capitalización</title>
<desc id="d-s223">Conceptos básicos de la tabla de capitalización, cómo se calculan y el error más frecuente.</desc>
<defs><marker id="p-s223" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="425.3" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 223 · Conceptos de una tabla de capitalización</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Feld &amp; Mendelson · Brealey et al.</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Concepto</text>
<text x="263.04" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cómo se calcula</text>
<text x="656.64" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Error frecuente</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Pre-money y post-money</text>
<text x="263.04" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Post-money = pre-money + monto levantado.</text>
<text x="656.64" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Confundir cuál valor usa el inversionista.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Participación nueva</text>
<text x="263.04" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Monto ÷ post-money.</text>
<text x="656.64" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Olvidar el pool de opciones al calcular.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Totalmente diluida</text>
<text x="263.04" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Incluye opciones, convertibles y pool reservado.</text>
<text x="656.64" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Mirar solo las acciones emitidas.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Pool de opciones</text>
<text x="263.04" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se define antes de la ronda y diluye a los actuales.</text>
<text x="656.64" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Crearlo después y perder control del reparto.</text>
<rect x="28" y="298.24" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="320.24" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La tabla de capitalización muestra quién es dueño de qué hoy y después de cada ronda. Sin una versión limpia y totalmente diluida, las</text>
<text x="44" y="337.49" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >negociaciones se hacen con números equivocados.</text>
<text x="28" y="384.74" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los instrumentos y su efecto legal se verifican con asesoría y en los documentos firmados.</text>
</svg>
