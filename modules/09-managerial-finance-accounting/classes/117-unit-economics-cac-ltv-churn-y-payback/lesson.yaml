id: 117
part: 09
title: "Unit economics: CAC, LTV, churn y payback"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "leer la economía del negocio y decidir con estados, caja, márgenes, retorno y valoración"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir CAC de LTV mediante evidencia observable."
  - "Aplicar la secuencia: definir unidad y cohortes → calcular CAC completo y marginal → medir retention/churn por cohorte → estimar LTV con margen y cautela → calcular payback y sensibilidad."
  - "Interpretar CAC, gross-margin LTV, logo churn sin atribuir causalidad automática."
  - "Resolver el caso de unit economics: CAC, LTV, churn y payback con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Charles Horngren et al. — *Cost Accounting: A Managerial Emphasis*"
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Stephen Ross, Randolph Westerfield et al. — *Corporate Finance*"
  - "Donald E. Kieso, Jerry J. Weygandt & Terry D. Warfield — *Intermediate Accounting*"
  - "Stephen H. Penman — *Financial Statement Analysis and Security Valuation*"
  - "Howard Schilit, Jeremy Perler & Yoni Engelhart — *Financial Shenanigans*"
limits:
  - "LTV/CAC no es verdad física. Pequeños cambios de churn cambian mucho LTV; usa cohortes observadas, horizontes limitados y escenarios antes de escalar gasto."
evidence_signals:
  - "CAC"
  - "gross-margin LTV"
  - "logo churn"
  - "net revenue retention"
  - "payback months"
