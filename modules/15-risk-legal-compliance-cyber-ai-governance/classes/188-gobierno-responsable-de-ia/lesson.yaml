id: 188
part: 15
title: "Gobierno responsable de IA"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "gobernar riesgo, legal, cumplimiento, ciberseguridad, datos e IA de forma integrada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir AI governance de AI risk mediante evidencia observable."
  - "Aplicar la secuencia: inventariar casos de IA → clasificar impacto y contexto → definir evaluación y guardrails → asignar accountability y human oversight → monitorizar drift incidentes y cambios."
  - "Interpretar AI inventory coverage, evaluation pass rate, human override sin atribuir causalidad automática."
  - "Resolver el caso de gobierno responsable de IA con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "COSO — *Enterprise Risk Management—Integrating with Strategy and Performance*"
  - "John C. Hull — *Risk Management and Financial Institutions*"
  - "Bob Tricker — *Corporate Governance*"
  - "NIST — *Cybersecurity Framework (CSF) 2.0*"
  - "OECD — *OECD AI Principles*"
  - "Ross Anderson — *Security Engineering*"
  - "NIST — *AI Risk Management Framework*. Fuente primaria: <https://www.nist.gov/itl/ai-risk-management-framework>."
limits:
  - "No todo uso de IA requiere el mismo control. Ajusta rigor a impacto y reversibilidad, pero no trates una herramienta de bajo costo como excusa para ignorar privacidad, discriminación o seguridad."
evidence_signals:
  - "AI inventory coverage"
  - "evaluation pass rate"
  - "human override"
  - "incident rate"
  - "model drift"
