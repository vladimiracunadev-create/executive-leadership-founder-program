<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" role="img" aria-labelledby="t-040 d-040" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-040">Tres necesidades y un continuo de motivación</title>
<desc id="d-040">Autonomía, competencia y vínculo sostienen la motivación según la teoría de la autodeterminación; el continuo va de la motivación controlada a la intrínseca.</desc>
<defs><marker id="p-040" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="580" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 040 · Qué mueve a las personas a hacer bien su trabajo</text>
<text x="1012" y="43" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="end" >Ryan &amp; Deci (2000) · Amabile &amp; Kramer (2011)</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">TRES NECESIDADES PSICOLÓGICAS BÁSICAS</text>
<rect x="28" y="104" width="380" height="96" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28" y="104" width="6" height="96" rx="3" fill="#0969da"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Autonomía</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Sentir que la propia acción es elegida, no</text>
<text x="46" y="161.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >impuesta.</text>
<rect x="28" y="212" width="380" height="96" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="28" y="212" width="6" height="96" rx="3" fill="#1a7f37"/>
<text x="46" y="234" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Competencia</text>
<text x="46" y="252" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Sentirse eficaz: avanzar y dominar lo que se</text>
<text x="46" y="269.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >hace.</text>
<rect x="28" y="320" width="380" height="96" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="28" y="320" width="6" height="96" rx="3" fill="#bc4c00"/>
<text x="46" y="342" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Vínculo</text>
<text x="46" y="360" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Sentirse conectado y valorado por las personas</text>
<text x="46" y="377.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >con quienes se trabaja.</text>
<text x="440" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">EL CONTINUO DE LA MOTIVACIÓN</text>
<rect x="440" y="104" width="570" height="56" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="440" y="104" width="120" height="56" rx="10" fill="#59636e" fill-opacity="0.2"/>
<text x="456" y="137" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Sin motivación</text>
<rect x="440" y="170" width="570" height="56" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<rect x="440" y="170" width="232" height="56" rx="10" fill="#cf222e" fill-opacity="0.2"/>
<text x="456" y="203" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Externa</text>
<rect x="440" y="236" width="570" height="56" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="440" y="236" width="344" height="56" rx="10" fill="#bc4c00" fill-opacity="0.2"/>
<text x="456" y="269" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Introyectada</text>
<rect x="440" y="302" width="570" height="56" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<rect x="440" y="302" width="456" height="56" rx="10" fill="#0969da" fill-opacity="0.2"/>
<text x="456" y="335" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Identificada</text>
<rect x="440" y="368" width="570" height="56" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="440" y="368" width="568" height="56" rx="10" fill="#1a7f37" fill-opacity="0.2"/>
<text x="456" y="401" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Intrínseca</text>
<path d="M1000,98 L1000,440" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-040)"/>
<text x="1004" y="270" font-size="10.5" font-weight="600" fill="#59636e" text-anchor="start" >más</text>
<text x="1004" y="283" font-size="10.5" font-weight="600" fill="#59636e" text-anchor="start" >autónoma</text>
<rect x="28" y="440" width="380" height="98" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="462" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Progreso en un trabajo con sentido: Amabile y</text>
<text x="44" y="479.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Kramer hallaron que los pequeños avances</text>
<text x="44" y="496.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >percibidos sostienen la motivación diaria.</text>
<rect x="440" y="440" width="572" height="98" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="456" y="462" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Más a la derecha, la persona hace lo que hace porque lo valora; a la</text>
<text x="456" y="479.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >izquierda, por presión, recompensa o evitación de culpa.</text>
<text x="28" y="566" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Es una teoría de la motivación con amplio respaldo experimental; los incentivos externos no son «malos», pero pueden desplazar la motivación</text>
<text x="28" y="582.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >propia.</text>
</svg>
