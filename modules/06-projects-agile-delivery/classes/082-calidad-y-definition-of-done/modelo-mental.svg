<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g82 d-g82" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g82">Ficha visual de la clase 082: Calidad y Definition of Done</title>
<desc id="d-g82">Conceptos: quality; Definition of Done; acceptance criteria; defect; quality debt. Método: definir calidad relevante al usuario y riesgo → crear DoD común → automatizar controles repetibles → detectar defectos cerca de origen → medir defect escape y rework.</desc>
<defs><marker id="p-g82" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#0969da"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 082 · Calidad y Definition of Done</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 06 · Liderazgo de equipos y ejecución</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#0969da"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >quality</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grado en que un resultado cumple requisitos y es apto</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >para uso</text>
<circle cx="38" cy="184.12" r="5" fill="#0969da"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Definition of Done</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >criterios comunes que un incremento debe cumplir para</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >considerarse terminado</text>
<circle cx="38" cy="256.24" r="5" fill="#0969da"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >acceptance criteria</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >condiciones específicas de una historia o deliverable</text>
<circle cx="38" cy="314.24" r="5" fill="#0969da"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >defect</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >desviación de requisito o expectativa verificable</text>
<circle cx="38" cy="372.24" r="5" fill="#0969da"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >quality debt</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trabajo futuro creado al aceptar calidad insuficiente</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
