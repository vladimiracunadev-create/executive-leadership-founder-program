id: 30
part: 02
title: "Feedback útil y accionable"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir feedback de tarea, de proceso y de yo, y predecir su efecto."
  - "Formular un feedback con hecho observable, efecto y una acción posible."
  - "Reconocer los tres disparadores que dificultan recibirlo: verdad, relación e identidad."
  - "Pedir feedback específico y usarlo sin defenderte."
  - "Decidir cuándo el feedback no es la herramienta adecuada."
deliverable: "people-decision-brief.md"
references:
  - "Avraham N. Kluger & Angelo DeNisi — *The Effects of Feedback Interventions on Performance: A Historical Review, a Meta-Analysis, and a Preliminary Feedback Intervention Theory*"
  - "Douglas Stone & Sheila Heen — *Thanks for the Feedback*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
limits:
  - "Los resultados de Kluger y DeNisi son promedios de muchos estudios, la mayoría en entornos de laboratorio o de tareas acotadas; su aplicación a una conversación concreta debe hacerse con criterio."
evidence_signals:
  - "nivel del feedback (tarea, proceso, yo)"
  - "hecho, efecto y acción"
  - "cambio observado"
  - "disparador identificado"
