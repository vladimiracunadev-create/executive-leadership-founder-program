id: 43
part: 03
title: "Problemas técnicos versus adaptativos"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir un problema técnico de uno adaptativo con criterios observables."
  - "Explicar por qué un problema adaptativo no se resuelve con autoridad y experticia."
  - "Reconocer la resistencia al cambio como pérdida, no como terquedad."
  - "Aplicar la alternancia entre la pista de baile y el balcón."
  - "Diseñar una intervención que devuelva el trabajo a quienes deben hacerlo, a un ritmo que puedan soportar."
deliverable: "leadership-decision-brief.md"
references:
  - "Ronald A. Heifetz, Alexander Grashow & Marty Linsky — *The Practice of Adaptive Leadership*"
  - "Ronald A. Heifetz — *Leadership Without Easy Answers*"
  - "Ronald Heifetz & Marty Linsky — *Leadership on the Line*"
  - "Donella H. Meadows — *Thinking in Systems*"
  - "Amy C. Edmondson — *The Fearless Organization*"
limits:
  - "La distinción es una herramienta de diagnóstico, no una clasificación estricta: casi todo problema contiene ambos componentes, y calificar algo de «adaptativo» puede usarse para justificar no actuar o para culpar a las personas."
evidence_signals:
  - "componente técnico y adaptativo separados"
  - "pérdida identificada"
  - "trabajo devuelto al equipo"
  - "ritmo del cambio regulado"
