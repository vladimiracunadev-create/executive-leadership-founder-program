<text x="44" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Los que afectan al cliente,</text>
<text x="44" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >la caja o el riesgo.</text>
