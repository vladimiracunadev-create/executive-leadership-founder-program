id: 28
part: 02
title: "Presentaciones para decisiones"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir la decisión que se pide y quién la toma antes de diseñar una sola lámina."
  - "Escribir títulos que sean afirmaciones comprobables, no temas."
  - "Elegir la evidencia mínima que sostiene cada afirmación y descartar el resto."
  - "Construir el contraste entre la situación actual y la posible como puente hacia la decisión."
  - "Anticipar las tres objeciones más fuertes y preparar la respuesta."
deliverable: "leadership-decision-brief.md"
references:
  - "Nancy Duarte — *Resonate*"
  - "Barbara Minto — *The Pyramid Principle*"
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Robert B. Cialdini — *Influence*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
limits:
  - "Estas estructuras son una guía derivada de la práctica de comunicación y de consultoría; su eficacia depende de la audiencia y de la cultura de la organización."
evidence_signals:
  - "decisión pedida en la primera lámina"
  - "títulos afirmación"
  - "objeciones respondidas"
  - "decisión obtenida o aplazada con motivo"
