<text x="48" y="582.48" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="600.48" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Feedback informal no reemplaza procesos formales cuando existen riesgos de desempeño, acoso, discriminación o consecuencias laborales.</text>
<text x="48" y="617.73" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >La documentación y asesoría apropiada importan.</text>
