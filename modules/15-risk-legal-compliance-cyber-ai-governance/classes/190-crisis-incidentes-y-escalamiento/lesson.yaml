id: 190
part: 15
title: "Crisis, incidentes y escalamiento"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "gobernar riesgo, legal, cumplimiento, ciberseguridad, datos e IA de forma integrada"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir incidente, crisis y escalamiento, y decidir cuándo corresponde declarar un incidente."
  - "Asignar el mando único y los roles separados de un incidente y explicar por qué quien repara no habla por la empresa."
  - "Ordenar las prioridades de las primeras horas y justificar ese orden."
  - "Diseñar niveles de escalamiento con criterios de paso y un comité de crisis con matriz de responsabilidades."
  - "Separar hechos, alegaciones y juicios cuando el incidente involucra a una persona clave y comunicar sin adelantar conclusiones."
  - "Convocar una revisión posterior sin búsqueda de culpables que produzca cambios verificables."
deliverable: "crisis-committee-charter.md"
references:
  - "Betsy Beyer, Chris Jones, Jennifer Petoff & Niall Richard Murphy — *Site Reliability Engineering*"
  - "W. Timothy Coombs — *Protecting Organization Reputations During a Crisis: The Development and Application of Situational Crisis Communication Theory*"
  - "Karl E. Weick & Kathleen M. Sutcliffe — *Managing the Unexpected*"
  - "Gary Klein — *Sources of Power*"
  - "Amy C. Edmondson — *The Fearless Organization*"
limits:
  - "El marco de mando y roles viene de la ingeniería de confiabilidad y requiere adaptación fuera de ella. Las obligaciones legales de notificación dependen de la jurisdicción y se verifican con asesoría."
evidence_signals:
  - "criterio de declaración escrito"
  - "un solo responsable por decisión"
  - "evidencia preservada antes de restablecer"
  - "acciones de la revisión con dueño y fecha"
