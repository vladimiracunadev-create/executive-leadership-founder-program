<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 648.48" width="1040" role="img" aria-labelledby="t-g209 d-g209" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g209">Ficha visual de la clase 209: Deberes, conflictos e independencia: fundamentos</title>
<desc id="d-g209">Conceptos: fiduciary duty; conflict of interest; disclosure; recusal; independence. Método: identificar interés y deber → verificar ley o política aplicable → revelar conflicto oportunamente → definir recusal y proceso independiente → documentar fundamento y aprobación.</desc>
<defs><marker id="p-g209" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="648.48" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#cf222e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 209 · Deberes, conflictos e independencia: fundamentos</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 17 · Alta dirección y gobierno</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#cf222e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >fiduciary duty</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >deber jurídico de actuar conforme al estándar aplicable</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >en interés de la entidad o beneficiarios</text>
<circle cx="38" cy="184.12" r="5" fill="#cf222e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >conflict of interest</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >situación donde interés personal puede interferir con</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >deber</text>
<circle cx="38" cy="256.24" r="5" fill="#cf222e"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >disclosure</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >revelación suficiente del conflicto relevante</text>
<circle cx="38" cy="314.24" r="5" fill="#cf222e"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >recusal</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >abstención de participar en una decisión cuando</text>
<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >corresponde</text>
<circle cx="38" cy="386.36" r="5" fill="#cf222e"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >independence</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad de juicio no comprometida por vínculos</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >materiales</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#cf222e"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#cf222e" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >identificar interés y deber</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#cf222e"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#cf222e" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >verificar ley o política aplicable</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#cf222e"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#cf222e" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >revelar conflicto oportunamente</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#cf222e"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#cf222e" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >definir recusal y proceso</text>
<text x="690" y="199.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >independiente</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#cf222e"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#cf222e" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >documentar fundamento y aprobación</text>
<text x="28" y="472.48" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="484.48" width="164" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="41" cy="497.48" r="3.5" fill="#cf222e"/>
<text x="52" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >conflict disclosures</text>
<rect x="202" y="484.48" width="205.4" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="215" cy="497.48" r="3.5" fill="#cf222e"/>
<text x="226" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >related-party transactions</text>
<rect x="417.4" y="484.48" width="81.2" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="430.4" cy="497.48" r="3.5" fill="#cf222e"/>
<text x="441.4" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >recusals</text>
<rect x="508.6" y="484.48" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="521.6" cy="497.48" r="3.5" fill="#cf222e"/>
<text x="532.6" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >independent approvals</text>
<rect x="689.5" y="484.48" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="702.5" cy="497.48" r="3.5" fill="#cf222e"/>
<text x="713.5" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >governance breaches</text>
<rect x="28" y="516.48" width="184.7" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="41" cy="529.48" r="3.5" fill="#cf222e"/>
<text x="52" y="533.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >conflict classification</text>
<rect x="222.7" y="516.48" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="235.7" cy="529.48" r="3.5" fill="#cf222e"/>
<text x="246.7" y="533.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >abstention record</text>
<rect x="28" y="562.48" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="562.48" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="582.48" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="600.48" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No memorices reglas universales: deberes, umbrales e independencia tienen definición legal específica. Usa esta clase para issue</text>
<text x="48" y="617.73" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >spotting y verifica legislación o estatutos con asesoría.</text>
</svg>
