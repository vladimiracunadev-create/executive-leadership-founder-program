id: 220
part: 18
title: "Valoración por flujos"
duration_minutes: 150
level: "Etapa 5 — CEO → Capital allocator"
outcome: "decidir estructura de capital, valoración, fundraising y transacciones"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Proyectar crecimiento, márgenes y reinversión como motores del valor."
  - "Convertir la utilidad operativa en flujo de caja libre."
  - "Elegir una tasa de descuento coherente con el riesgo del flujo."
  - "Calcular el valor terminal con supuestos consistentes y medir su peso."
  - "Hacer sensibilidad y controles de realidad antes de concluir."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Aswath Damodaran — *Investment Valuation*"
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Stephen H. Penman — *Financial Statement Analysis and Security Valuation*"
  - "Krishna G. Palepu, Paul M. Healy & Erik Peek — *Business Analysis and Valuation*"
limits:
  - "Un DCF es tan bueno como sus supuestos; pequeñas variaciones de tasa o de crecimiento terminal cambian mucho el resultado."
evidence_signals:
  - "drivers operativos proyectados"
  - "flujo libre y tasa explícitos"
  - "valor terminal y su peso"
  - "sensibilidad y control de realidad"
