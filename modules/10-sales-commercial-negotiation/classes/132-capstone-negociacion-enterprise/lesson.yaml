id: 132
part: 10
title: "Capstone: negociación enterprise"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "construir ingresos mediante un proceso comercial medible y negociación disciplinada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir negotiation plan de economic buyer mediante evidencia observable."
  - "Aplicar la secuencia: mapear intereses y autoridad → cuantificar business case → definir BATNA, target y redlines → ordenar paquetes y give-gets → negociar, documentar y validar implementación."
  - "Interpretar discount, contract term, payment terms sin atribuir causalidad automática."
  - "Resolver el caso de capstone: negociación enterprise con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "commercial-decision-brief.md"
references:
  - "Neil Rackham — *SPIN Selling*"
  - "Matthew Dixon & Brent Adamson — *The Challenger Sale*"
  - "Chris Voss & Tahl Raz — *Never Split the Difference*"
  - "Mark Roberge — *The Sales Acceleration Formula*"
  - "Thomas T. Nagle, John E. Hogan & Joseph Zale — *The Strategy and Tactics of Pricing*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
limits:
  - "Ganar una negociación que crea un contrato inviable destruye valor. Comercial, finanzas, legal y delivery deben compartir límites antes de la mesa."
evidence_signals:
  - "discount"
  - "contract term"
  - "payment terms"
  - "risk clauses"
  - "implementation commitments"
