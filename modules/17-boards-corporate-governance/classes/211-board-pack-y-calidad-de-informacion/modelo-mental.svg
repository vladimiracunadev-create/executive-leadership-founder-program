<title id="t-g211">Ficha visual de la clase 211: Board pack y calidad de información</title>
<desc id="d-g211">Conceptos: board pack; pre-read; variance; decision paper; board action log. Método: partir de preguntas del board → seleccionar información material → explicar variancias y drivers → separar decisiones de updates → distribuir temprano y cerrar action log.</desc>
