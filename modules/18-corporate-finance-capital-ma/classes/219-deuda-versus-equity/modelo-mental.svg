<circle cx="390.5" cy="441" r="3.5" fill="#cf222e"/>
<text x="401.5" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cash volatility</text>
<rect x="517" y="428" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="530" cy="441" r="3.5" fill="#cf222e"/>
<text x="541" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >control rights</text>
<rect x="28" y="474" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="474" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="494" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="512" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Comparar solo tasa versus porcentaje de equity es incompleto. Equity puede ser caro si el negocio escala; deuda puede ser fatal si</text>
<text x="48" y="529.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cash es incierto. Modela escenarios.</text>
