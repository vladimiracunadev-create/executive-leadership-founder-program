id: 39
part: 03
title: "Empatía sin perder exigencia"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir empatía como percibir y comprender las emociones de otro, y distinguirla de complacencia."
  - "Ubicar una conducta en el cuadrante de interés personal y desafío directo."
  - "Reconocer la empatía ruinosa y la agresión odiosa como fallas opuestas."
  - "Formular un mensaje exigente con interés genuino, hechos y petición clara."
  - "Sostener un estándar ante la reacción emocional del otro sin ceder ni endurecerte."
deliverable: "risk-governance-brief.md"
references:
  - "Kim Scott — *Radical Candor*"
  - "Daniel Goleman — *Emotional Intelligence*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "Brené Brown — *Dare to Lead*"
limits:
  - "El cuadrante es un esquema práctico sin evidencia experimental propia, y puede usarse como etiqueta para juzgar a otros."
evidence_signals:
  - "cuadrante de la conversación"
  - "hecho, petición y escucha en el mensaje"
  - "estándar sostenido ante la emoción"
  - "apoyo concreto ofrecido"
