<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >delegation boundary</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >límite explícito de autoridad transferida</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
