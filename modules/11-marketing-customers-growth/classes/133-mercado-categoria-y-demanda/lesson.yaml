id: 133
part: 11
title: "Mercado, categoría y demanda"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "entender mercado, posicionamiento, canales, conversión, retención y crecimiento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir un mercado desde el problema del cliente y no desde el producto."
  - "Estimar mercado total, alcanzable y obtenible con método ascendente."
  - "Diagnosticar el estado de la demanda y sus determinantes."
  - "Evaluar la atractividad de una categoría con las fuerzas competitivas."
  - "Decidir entre competir en una categoría existente o redefinirla."
deliverable: "leadership-decision-brief.md"
references:
  - "Philip Kotler & Kevin Lane Keller — *Marketing Management*"
  - "Michael E. Porter — *Competitive Strategy*"
  - "W. Chan Kim & Renée Mauborgne — *Blue Ocean Strategy*"
  - "Geoffrey A. Moore — *Crossing the Chasm*"
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
limits:
  - "Las estimaciones de mercado son inciertas y sensibles a la definición; los datos de industria usan categorías distintas."
evidence_signals:
  - "mercado definido desde el problema del cliente"
  - "estimación ascendente con clientes concretos"
  - "fuerzas competitivas evaluadas"
  - "decisión entre competir o redefinir"
