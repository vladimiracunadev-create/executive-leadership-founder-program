<text x="501" y="180" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >2</text>
<text x="521" y="180" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >escribir conclusión provisional</text>
