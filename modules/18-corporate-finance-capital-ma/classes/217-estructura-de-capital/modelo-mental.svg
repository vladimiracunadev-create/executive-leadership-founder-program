<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g217 d-g217" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g217">Ficha visual de la clase 217: Estructura de capital</title>
<desc id="d-g217">Conceptos: capital structure; financial leverage; debt capacity; covenant; financial flexibility. Método: modelar cash flows y downside → estimar debt capacity → comparar costo y control → stress-test covenants y liquidez → definir rango objetivo y contingencias.</desc>
<defs><marker id="p-g217" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="602.36" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#cf222e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 217 · Estructura de capital</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 18 · Alta dirección y gobierno</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#cf222e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >capital structure</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >mezcla de deuda equity y otros instrumentos</text>
<circle cx="38" cy="170" r="5" fill="#cf222e"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >financial leverage</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >uso de deuda que amplifica retorno y pérdida para</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >equity</text>
<circle cx="38" cy="242.12" r="5" fill="#cf222e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >debt capacity</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad de soportar deuda sin riesgo excesivo de</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >distress</text>
<circle cx="38" cy="314.24" r="5" fill="#cf222e"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >covenant</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >compromiso contractual que limita o exige ciertas</text>
<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >condiciones</text>
<circle cx="38" cy="386.36" r="5" fill="#cf222e"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >financial flexibility</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad de obtener recursos o adaptarse bajo estrés</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
