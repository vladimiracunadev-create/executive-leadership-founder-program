<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grupo sin las mismas facultades legales de un</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >directorio formal que aporta consejo</text>
