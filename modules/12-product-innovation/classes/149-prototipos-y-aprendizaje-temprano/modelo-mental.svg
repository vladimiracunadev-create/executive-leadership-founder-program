<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >incertidumbre sobre si puede comprenderla y usarla</text>
<circle cx="38" cy="358.12" r="5" fill="#bc4c00"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >technical spike</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >experimento corto para reducir incertidumbre técnica</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
