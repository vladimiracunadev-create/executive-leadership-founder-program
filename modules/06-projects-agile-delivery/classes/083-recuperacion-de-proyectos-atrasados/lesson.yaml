id: 83
part: 06
title: "Recuperación de proyectos atrasados"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Diagnosticar el estado real de un proyecto: avance, capacidad, causas del atraso."
  - "Detener el deterioro: congelar alcance y frenar lo no esencial."
  - "Replanificar con estimaciones en rango y capacidad medida."
  - "Decidir entre recortar alcance, mover fecha o agregar recursos, con sus efectos."
  - "Decidir cuándo conviene detener el proyecto y cerrarlo de forma ordenada."
deliverable: "leadership-decision-brief.md"
references:
  - "Bent Flyvbjerg & Dan Gardner — *How Big Things Get Done*"
  - "Harold Kerzner — *Project Management*"
  - "Roger Buehler, Dale Griffin & Michael Ross — *Exploring the "planning fallacy": Why people underestimate their task completion times*"
  - "Amy C. Edmondson — *Psychological Safety and Learning Behavior in Work Teams*"
  - "Eliyahu M. Goldratt — *Critical Chain*"
limits:
  - "Los datos de Flyvbjerg y Gardner son de grandes proyectos y su traducción a iniciativas pequeñas es parcial."
evidence_signals:
  - "diagnóstico con hechos"
  - "replanificación con rangos"
  - "opciones con costo y efecto"
  - "criterio de cierre"
