<text x="52" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >WIP</text>
<rect x="84.7" y="442.12" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="97.7" cy="455.12" r="3.5" fill="#0969da"/>
<text x="108.7" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cycle time percentiles</text>
<rect x="272.5" y="442.12" width="95" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="285.5" cy="455.12" r="3.5" fill="#0969da"/>
<text x="296.5" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >throughput</text>
<rect x="377.5" y="442.12" width="108.8" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="390.5" cy="455.12" r="3.5" fill="#0969da"/>
<text x="401.5" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >blocked time</text>
<rect x="496.3" y="442.12" width="88.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="509.3" cy="455.12" r="3.5" fill="#0969da"/>
<text x="520.3" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >aging WIP</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="488.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Límites WIP no deben impedir respuesta a incidentes críticos. Define clases de servicio y políticas de expedite con costo visible para</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >evitar que la excepción destruya el sistema.</text>
