<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g141 d-g141" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g141">Ficha visual de la clase 141: Funnel y conversión</title>
<desc id="d-g141">Conceptos: funnel; conversion rate; drop-off; cohort; bottleneck. Método: definir etapas por comportamiento → medir base y conversiones → segmentar por cohortes/canales → priorizar cuello por impacto → experimentar y medir incremento.</desc>
<defs><marker id="p-g141" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#8250df"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 141 · Funnel y conversión</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 11 · Gestión de negocio</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#8250df"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >funnel</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >secuencia de etapas medibles hacia una acción</text>
<circle cx="38" cy="170" r="5" fill="#8250df"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >conversion rate</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >porcentaje que avanza entre etapas</text>
<circle cx="38" cy="228" r="5" fill="#8250df"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >drop-off</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >pérdida entre dos etapas</text>
<circle cx="38" cy="286" r="5" fill="#8250df"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >cohort</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grupo comparable por fecha o característica</text>
<circle cx="38" cy="344" r="5" fill="#8250df"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >bottleneck</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >etapa cuya mejora tiene mayor efecto sobre outcome</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#8250df"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >definir etapas por comportamiento</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#8250df"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >medir base y conversiones</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#8250df"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >segmentar por cohortes/canales</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#8250df"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >priorizar cuello por impacto</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#8250df"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >experimentar y medir incremento</text>
<text x="28" y="416" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="428" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="41" cy="441" r="3.5" fill="#8250df"/>
<text x="52" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >stage conversion</text>
<rect x="174.4" y="428" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="187.4" cy="441" r="3.5" fill="#8250df"/>
<text x="198.4" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >overall conversion</text>
<rect x="334.6" y="428" width="81.2" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="347.6" cy="441" r="3.5" fill="#8250df"/>
<text x="358.6" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >drop-off</text>
<rect x="425.8" y="428" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="438.8" cy="441" r="3.5" fill="#8250df"/>
<text x="449.8" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cohort retention</text>
<rect x="572.2" y="428" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="585.2" cy="441" r="3.5" fill="#8250df"/>
<text x="596.2" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >incremental lift</text>
<rect x="28" y="474" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="474" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="494" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="512" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un funnel supone progresión; productos con loops, referrals o múltiples jobs no siempre encajan linealmente. Usa el modelo donde</text>
<text x="48" y="529.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >simplifica una decisión.</text>
</svg>
