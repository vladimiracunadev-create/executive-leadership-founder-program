<title id="t-g170">Ficha visual de la clase 170: Estructuras funcionales, divisionales y matriciales</title>
<desc id="d-g170">Conceptos: functional structure; divisional structure; matrix; P&amp;L ownership; shared service. Método: mapear variedad e interdependencia → identificar unidad primaria de accountability → evaluar economías de escala → diseñar interfaces entre ejes → probar decisiones críticas en el modelo.</desc>
