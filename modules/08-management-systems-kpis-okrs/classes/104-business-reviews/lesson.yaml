id: 104
part: 08
title: "Business reviews"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "dirigir mediante outcomes, métricas, revisiones y asignación explícita de recursos"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Estructurar una revisión en cinco pasos: preparar, contrastar, diagnosticar, decidir y registrar."
  - "Formular preguntas que lleven de la cifra a la causa."
  - "Reducir los sesgos de grupo con técnicas simples de juicio independiente."
  - "Diferenciar el diagnóstico de los hechos de la atribución de culpas."
  - "Cerrar con acuerdos con dueño, fecha y criterio de verificación."
deliverable: "monthly-business-review.md"
references:
  - "Larry Bossidy & Ram Charan — *Execution*"
  - "Andrew S. Grove — *High Output Management*"
  - "Daniel Kahneman, Olivier Sibony & Cass R. Sunstein — *Noise*"
  - "Amy C. Edmondson — *Psychological Safety and Learning Behavior in Work Teams*"
  - "Robert S. Kaplan & David P. Norton — *Strategy Maps*"
limits:
  - "Una revisión no reemplaza la conversación continua con clientes y equipos."
evidence_signals:
  - "datos enviados antes"
  - "causas con hechos y no culpables"
  - "juicios previos independientes"
  - "compromisos con dueño, fecha y verificación"
