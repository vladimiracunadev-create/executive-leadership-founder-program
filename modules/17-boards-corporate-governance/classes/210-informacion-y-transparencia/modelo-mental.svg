<text x="571" y="251" font-size="11" font-weight="600" fill="#59636e" text-anchor="start" >revisar y volver a empezar</text>
<text x="28" y="472.48" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="484.48" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="41" cy="497.48" r="3.5" fill="#cf222e"/>
<text x="52" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >report timeliness</text>
<rect x="181.3" y="484.48" width="108.8" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="194.3" cy="497.48" r="3.5" fill="#cf222e"/>
<text x="205.3" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >restatements</text>
<rect x="300.1" y="484.48" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="313.1" cy="497.48" r="3.5" fill="#cf222e"/>
<text x="324.1" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >material surprises</text>
<rect x="460.3" y="484.48" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="473.3" cy="497.48" r="3.5" fill="#cf222e"/>
<text x="484.3" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >forecast accuracy</text>
<rect x="613.6" y="484.48" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="626.6" cy="497.48" r="3.5" fill="#cf222e"/>
<text x="637.6" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >disclosure exceptions</text>
<rect x="28" y="530.48" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="530.48" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="550.48" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="568.48" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >La transparencia tiene límites legítimos de confidencialidad, privilegio y competitividad. El objetivo es no ocultar lo material a</text>
<text x="48" y="585.73" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >quien debe decidir, no publicar todo.</text>
