<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 478.42" width="1040" role="img" aria-labelledby="t-s100 d-s100" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s100">Clase 100 · La ficha de un KPI: lo que lo vuelve confiable</title>
<desc id="d-s100">Campos de la ficha de un indicador clave, qué pregunta responde cada campo y un ejemplo.</desc>
<defs><marker id="p-s100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="478.42" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 100 · La ficha de un KPI: lo que lo vuelve confiable</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Marr (2012) · Muller (2018) · Kaplan &amp; Norton</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Campo</text>
<text x="274.286" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué responde</text>
<text x="617.905" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Ejemplo</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Decisión que informa</text>
<text x="274.286" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué se decidirá distinto según el valor?</text>
<text x="617.905" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Si baja de 85 %, se refuerza el turno de tarde.</text>
<rect x="28" y="172.56" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Definición y fórmula</text>
<text x="274.286" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué cuenta y qué no?</text>
<text x="617.905" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Pedidos entregados en plazo / pedidos despachados, sin</text>
<text x="617.905" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >devoluciones.</text>
<rect x="28" y="225.68" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="245.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Fuente y frecuencia</text>
<text x="274.286" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿De dónde sale y cada cuánto?</text>
<text x="617.905" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Sistema de despachos, cada día.</text>
<rect x="28" y="262.24" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="282.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Dueño</text>
<text x="274.286" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Quién responde y puede actuar?</text>
<text x="617.905" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Jefa de logística.</text>
<rect x="28" y="298.8" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="318.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Umbral y señal</text>
<text x="274.286" y="318.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué valor dispara una acción?</text>
<text x="617.905" y="318.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Menos de 88 % por tres días seguidos.</text>
<rect x="28" y="351.36" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="373.36" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Un indicador sin decisión asociada es decoración. La ficha evita que dos áreas calculen el mismo KPI de formas distintas y discutan los</text>
<text x="44" y="390.61" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >números en vez de las decisiones.</text>
<text x="28" y="437.86" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Cuando un indicador se vuelve meta, las personas tienden a optimizar el indicador y no lo que representa: se vigila con medidas de contrapeso.</text>
</svg>
