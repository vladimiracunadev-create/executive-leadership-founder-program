<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456.81" width="1040" role="img" aria-labelledby="t-s166 d-s166" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s166">Clase 166 · Alianza lineal frente a ecosistema o plataforma</title>
<desc id="d-s166">Una alianza lineal combina capacidades de dos partes; una plataforma o un ecosistema coordina a muchos participantes con efectos de red.</desc>
<defs><marker id="p-s166" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="456.81" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 166 · Alianza lineal frente a ecosistema o plataforma</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Parker, Van Alstyne &amp; Choudary (2016) · Rochet &amp; Tiro…</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">ALIANZA LINEAL</text>
<rect x="28" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Dos o pocas partes</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Combinan capacidades complementarias.</text>
<rect x="28" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="177.25" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Valor por contrato</text>
<text x="46" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se pacta el reparto y las obligaciones.</text>
<rect x="28" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="28.0" y="250.5" width="6" height="63.25" rx="3" fill="#bc4c00"/>
<text x="46" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Riesgo</text>
<text x="46" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Dependencia y conflicto sobre el reparto del valor.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">PLATAFORMA O ECOSISTEMA</text>
<rect x="532" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Muchos participantes</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Productores y consumidores que se atraen entre sí.</text>
<rect x="532" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="532.0" y="177.25" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<text x="550" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Valor por efectos de red</text>
<text x="550" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Cada participante nuevo aumenta el valor para los demás.</text>
<rect x="532" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="532.0" y="250.5" width="6" height="63.25" rx="3" fill="#cf222e"/>
<text x="550" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Riesgo</text>
<text x="550" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Arranque difícil, dependencia de participantes y regulación.</text>
<rect x="28" y="329.75" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="351.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Una plataforma crea valor facilitando interacciones; el problema de arranque (el huevo y la gallina) y la gobernanza de las reglas son</text>
<text x="44" y="369" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >sus desafíos centrales.</text>
<text x="28" y="416.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >No toda empresa debería ser plataforma: sin efectos de red reales, una plataforma solo agrega complejidad.</text>
</svg>
