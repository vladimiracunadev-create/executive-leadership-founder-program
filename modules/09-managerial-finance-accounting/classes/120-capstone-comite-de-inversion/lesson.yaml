id: 120
part: 09
title: "Capstone: comité de inversión"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "leer la economía del negocio y decidir con estados, caja, márgenes, retorno y valoración"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Estructurar un memo de inversión con tesis, números, riesgos y decisión solicitada."
  - "Construir el modelo financiero a partir de supuestos explícitos con escenarios."
  - "Someter una propuesta a preguntas críticas y ajustar el análisis."
  - "Comparar alternativas, incluida la de no hacer nada."
  - "Registrar una decisión con condiciones, hitos y revisión posterior."
deliverable: "leadership-decision-brief.md"
references:
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Aswath Damodaran — *Investment Valuation*"
  - "John R. Graham & Campbell R. Harvey — *The theory and practice of corporate finance: evidence from the field*"
  - "Michael C. Jensen — *Paying People to Lie: the Truth about the Budgeting Process*"
limits:
  - "Los números del ejemplo son ilustrativos."
evidence_signals:
  - "tesis y alternativa cero"
  - "modelo conectado con los tres estados"
  - "premortem y juicios previos"
  - "decisión con condiciones y revisión posterior"
