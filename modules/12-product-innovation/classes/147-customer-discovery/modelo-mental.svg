<circle cx="41" cy="501.24" r="3.5" fill="#bc4c00"/>
<text x="52" y="505.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >repeat customers</text>
<rect x="28" y="534.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
