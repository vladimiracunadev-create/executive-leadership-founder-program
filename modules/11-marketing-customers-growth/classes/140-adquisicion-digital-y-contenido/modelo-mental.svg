<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >demanda obtenida sin pago directo por cada click o</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >impresión</text>
