<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616.48" width="1040" role="img" aria-labelledby="t-g250 d-g250" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g250">Ficha visual de la clase 250: Primeros diez clientes</title>
<desc id="d-g250">Conceptos: founder-led sales; ideal customer profile; design partner; referenceability; repeatable motion. Método: definir ICP provisional → crear lista de cuentas → hacer outreach y discovery → cerrar con scope y success criteria → documentar patrón antes de delegar.</desc>
