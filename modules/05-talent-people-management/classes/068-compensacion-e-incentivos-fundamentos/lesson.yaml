id: 68
part: 05
title: "Compensación e incentivos: fundamentos"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "diseñar un sistema de talento desde el cargo hasta la salida responsable"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Explicar la teoría de la equidad y cómo se juzga una compensación."
  - "Describir qué hallaron Deci y colegas sobre recompensas y motivación intrínseca."
  - "Anticipar efectos no deseados de un incentivo, como el caso de la multa."
  - "Distinguir remuneración fija, variable y reconocimiento no monetario, y su función."
  - "Diseñar un esquema de compensación simple, coherente y comunicable."
deliverable: "leadership-decision-brief.md"
references:
  - "J. Stacy Adams — *Towards an understanding of inequity*"
  - "Edward L. Deci, Richard Koestner & Richard M. Ryan — *A meta-analytic review of experiments examining the effects of extrinsic rewards on intrinsic motivation*"
  - "Uri Gneezy & Aldo Rustichini — *A Fine is a Price*"
  - "Richard M. Ryan & Edward L. Deci — *Self-Determination Theory and the Facilitation of Intrinsic Motivation, Social Development, and Well-Being*"
  - "Daniel H. Pink — *Drive*"
limits:
  - "Los experimentos sobre recompensas se hicieron sobre todo en entornos de laboratorio y educativos; su aplicación a la remuneración laboral debe hacerse con prudencia, y hay debate sobre la generalidad del efecto."
evidence_signals:
  - "efecto del incentivo anticipado"
  - "equidad interna y externa revisada"
  - "indicadores de cantidad y calidad"
  - "criterios de cálculo comunicados"
