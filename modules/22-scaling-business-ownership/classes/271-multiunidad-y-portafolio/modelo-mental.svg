<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s271 d-s271" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s271">Clase 271 · Gestionar varias unidades como portafolio</title>
<desc id="d-s271">Preguntas para gestionar un portafolio de unidades: unidad económica, estado de resultados y caja, capacidades compartidas, ventaja de la matriz y asignación.</desc>
<defs><marker id="p-s271" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 271 · Gestionar varias unidades como portafolio</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Goold et al. · Koller et al. · Galbraith · Horowitz</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Pregunta</text>
<text x="317.538" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cómo se mide</text>
<text x="708.615" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Decisión asociada</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Qué es una unidad?</text>
<text x="317.538" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Clientes, costos y decisiones propias.</text>
<text x="708.615" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Separar su estado de resultados.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Cuánta caja genera o consume?</text>
<text x="317.538" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Flujo de caja por unidad.</text>
<text x="708.615" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Financiar, cosechar o frenar.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Qué se comparte?</text>
<text x="317.538" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Costo y servicio de las áreas comunes.</text>
<text x="708.615" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cobrar, centralizar o separar.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Aporta valor la matriz?</text>
<text x="317.538" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué hace mejor que un dueño independiente.</text>
<text x="708.615" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Mantener, vender o fusionar.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Crecer, cosechar o salir?</text>
<text x="317.538" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Retorno sobre el capital por unidad.</text>
<text x="708.615" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Asignar recursos con criterio.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Una unidad rentable en el papel puede consumir la atención y la caja de las demás. Se miden retorno y caja por unidad, y se discute la</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >ventaja de tenerlas juntas.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Cada unidad tiene un responsable y una regla de asignación de capital.</text>
</svg>
