<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g66 d-g66" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g66">Ficha visual de la clase 066: Gestión de desempeño</title>
<desc id="d-g66">Conceptos: performance management; goal; behavior; evidence; calibration. Método: definir outcomes y conductas al inicio → observar y guardar ejemplos durante el periodo → dar feedback cercano → hacer check-ins y ajustar metas → calibrar y cerrar evaluación con próximos pasos.</desc>
