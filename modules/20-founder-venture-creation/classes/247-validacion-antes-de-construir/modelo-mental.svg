<title id="t-g247">Ficha visual de la clase 247: Validación antes de construir</title>
<desc id="d-g247">Conceptos: demand test; pre-sale; smoke test; concierge; commitment. Método: priorizar riesgo de demanda → diseñar test mínimo → definir commitment observable → ejecutar con segmento real → decidir build change o stop.</desc>
