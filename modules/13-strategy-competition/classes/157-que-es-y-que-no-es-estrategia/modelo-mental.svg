<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >strategy</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >conjunto coherente de elecciones para superar un</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >desafío y crear valor diferencial</text>
<circle cx="38" cy="184.12" r="5" fill="#bc4c00"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >goal</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >resultado deseado que no especifica cómo ganar</text>
<circle cx="38" cy="242.12" r="5" fill="#bc4c00"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >diagnosis</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >explicación simplificada de qué desafío importa</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >realmente</text>
<circle cx="38" cy="314.24" r="5" fill="#bc4c00"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >guiding policy</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >enfoque elegido para enfrentar el diagnóstico</text>
