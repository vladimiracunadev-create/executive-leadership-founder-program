id: 137
part: 11
title: "Marca y señales de confianza"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "entender mercado, posicionamiento, canales, conversión, retención y crecimiento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir confianza como disposición a ser vulnerable y distinguirla de satisfacción, simpatía y lealtad."
  - "Explicar cómo capacidad, benevolencia e integridad forman la confiabilidad percibida de una empresa."
  - "Evaluar si una señal de confianza es creíble con tres pruebas: verificable, costosa de fingir y sostenida."
  - "Diagnosticar si una falla fue de competencia o de integridad y por qué cambia la respuesta."
  - "Diseñar un plan de reparación de cinco pasos con evidencia comprobable por un tercero."
deliverable: "trust-repair-plan.md"
references:
  - "Roger C. Mayer, James H. Davis & F. David Schoorman — *An Integrative Model of Organizational Trust*"
  - "Denise M. Rousseau, Sim B. Sitkin, Ronald S. Burt & Colin Camerer — *Not So Different After All: A Cross-Discipline View of Trust*"
  - "Peter H. Kim, Donald L. Ferrin, Cecily D. Cooper & Kurt T. Dirks — *Removing the Shadow of Suspicion: The Effects of Apology Versus Denial for Repairing Competence- Versus Integrity-Based Trust Violations*"
  - "W. Timothy Coombs — *Protecting Organization Reputations During a Crisis: The Development and Application of Situational Crisis Communication Theory*"
  - "Amy C. Edmondson — *The Fearless Organization*"
limits:
  - "La evidencia sobre disculpa y negación proviene de experimentos con escenarios y orienta el diagnóstico; no sustituye el juicio ante hechos reales. Nunca se niega lo que se sabe cierto."
evidence_signals:
  - "compromisos cumplidos en fecha"
  - "tiempo de respuesta a los afectados"
  - "hallazgos corregidos y verificados por un tercero"
  - "quejas repetidas"
