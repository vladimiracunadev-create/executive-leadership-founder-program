<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474.98" width="1040" role="img" aria-labelledby="t-s208 d-s208" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s208">Clase 208 · Comités del directorio: foco, independencia y reporte</title>
<desc id="d-s208">Tres comités habituales del directorio con su foco, el criterio de independencia y la forma de reportar.</desc>
<defs><marker id="p-s208" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="474.98" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 208 · Comités del directorio: foco, independencia y reporte</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >OCDE (2023) · COSO · Tricker</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Comité</text>
<text x="222.222" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Foco</text>
<text x="513.778" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Composición</text>
<text x="756.741" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Reporta al directorio</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Auditoría</text>
<text x="222.222" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Información financiera, controles</text>
<text x="222.222" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >internos y auditoría.</text>
<text x="513.778" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Independientes con experticia</text>
<text x="513.778" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >financiera.</text>
<text x="756.741" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Recomendaciones y excepciones.</text>
<rect x="28" y="189.12" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Riesgos</text>
<text x="222.222" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Apetito, riesgos principales y controles</text>
<text x="222.222" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >críticos.</text>
<text x="513.778" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Miembros con visión de riesgo y</text>
<text x="513.778" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >del negocio.</text>
<text x="756.741" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Tablero de riesgos y brechas.</text>
<rect x="28" y="242.24" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="262.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Compensación y talento</text>
<text x="222.222" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Remuneración, desempeño y sucesión.</text>
<text x="513.778" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Independientes del equipo</text>
<text x="513.778" y="278.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >evaluado.</text>
<text x="756.741" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Propuestas y justificación.</text>
<rect x="28" y="295.36" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="315.36" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Otros (según necesidad)</text>
<text x="222.222" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Ética, ciberseguridad, sostenibilidad.</text>
<text x="513.778" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Según escala y complejidad.</text>
<text x="756.741" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Informes breves y acciones.</text>
<rect x="28" y="347.92" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="369.92" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Más comités no significa más gobierno: se crean donde la escala, la regulación o la complejidad lo justifican, y cada uno tiene un</text>
<text x="44" y="387.17" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >estatuto, un calendario y un informe.</text>
<text x="28" y="434.42" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los comités obligatorios y sus requisitos dependen de la normativa aplicable a cada empresa.</text>
</svg>
