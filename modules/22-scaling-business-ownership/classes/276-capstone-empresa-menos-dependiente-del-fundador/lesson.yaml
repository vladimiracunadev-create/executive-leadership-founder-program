id: 276
part: 22
title: "Capstone: empresa menos dependiente del fundador"
duration_minutes: 150
level: "Etapa 6 — Business Owner"
outcome: "reducir dependencia del fundador mediante sistemas, líderes, controles y gobierno proporcional"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Mapear las dependencias del fundador con evidencia y priorizarlas."
  - "Verificar que existan responsables, límites, tablero y reglas de contacto antes de la prueba."
  - "Diseñar una simulación de ausencia con protecciones para clientes, caja y personas."
  - "Medir contactos al fundador, continuidad del servicio y decisiones pendientes."
  - "Analizar las fallas, remediarlas y decidir si repetir, ampliar o extender la prueba."
deliverable: "founder-owner-decision-brief.md"
references:
