id: 106
part: 08
title: "Asignación de recursos"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "dirigir mediante outcomes, métricas, revisiones y asignación explícita de recursos"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir resource allocation de fixed commitment mediante evidencia observable."
  - "Aplicar la secuencia: mapear recursos actuales → comparar con prioridades → clasificar compromiso fijo y movible → estimar costo de reasignación → decidir y seguir transición."
  - "Interpretar spend by priority, headcount by priority, reallocation lead time sin atribuir causalidad automática."
  - "Resolver el caso de asignación de recursos con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "John Doerr — *Measure What Matters*"
  - "Robert S. Kaplan & David P. Norton — *The Balanced Scorecard*"
  - "Michael C. Mankins & Eric Garton — *Time, Talent, Energy*"
  - "Bernard Marr — *Key Performance Indicators*"
  - "Robert S. Kaplan & David P. Norton — *Strategy Maps*"
  - "Andrew S. Grove — *High Output Management*"
limits:
  - "Reasignar personas como fichas puede destruir conocimiento, compromiso y productividad. Incluye skill, equipos estables y costos humanos, no solo headcount."
evidence_signals:
  - "spend by priority"
  - "headcount by priority"
  - "reallocation lead time"
  - "sunk initiatives"
  - "executive attention"
