id: 248
part: 20
title: "MVP y concierge tests"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir concierge MVP de Wizard of Oz mediante evidencia observable."
  - "Aplicar la secuencia: definir outcome a entregar → operar manualmente para pocos clientes → registrar steps y exceptions → medir value y willingness → automatizar solo patrón estable."
  - "Interpretar time-to-value, manual hours per customer, exception rate sin atribuir causalidad automática."
  - "Resolver el caso de mVP y concierge tests con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "product-evidence-brief.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Alexander Osterwalder & Yves Pigneur — *Business Model Generation*"
  - "Peter F. Drucker — *The Effective Executive*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
  - "Eric Ries — *The Lean Startup*"
  - "Rob Fitzpatrick — *The Mom Test*"
limits:
  - "Concierge no prueba escalabilidad. Sirve para aprender demanda y workflow; antes de escalar, modela costos y automatización necesaria."
evidence_signals:
  - "time-to-value"
  - "manual hours per customer"
  - "exception rate"
  - "paid retention"
  - "automation potential"
