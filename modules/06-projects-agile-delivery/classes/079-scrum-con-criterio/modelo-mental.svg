<text x="665.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >review feedback</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
