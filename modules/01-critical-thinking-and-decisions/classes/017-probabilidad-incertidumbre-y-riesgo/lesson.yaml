id: 17
part: 01
title: "Probabilidad, incertidumbre y riesgo"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "decidir con evidencia, incertidumbre, causalidad y pensamiento sistémico"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir incertidumbre de probabilidad mediante evidencia observable."
  - "Aplicar la secuencia: enumerar estados futuros materialmente distintos → asignar rangos o probabilidades justificadas → estimar impacto y reversibilidad → comparar opciones por valor y downside → definir triggers para actualizar la decisión."
  - "Interpretar rango de forecast, probabilidad calibrada, downside máximo sin atribuir causalidad automática."
  - "Resolver el caso de probabilidad, incertidumbre y riesgo con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Daniel Kahneman — *Thinking, Fast and Slow*"
  - "Gary Klein — *Sources of Power*"
  - "Donella H. Meadows — *Thinking in Systems*"
  - "Annie Duke — *How to Decide*"
  - "Max H. Bazerman & Don A. Moore — *Judgment in Managerial Decision Making*"
  - "Annie Duke — *Thinking in Bets*"
limits:
  - "Probabilidades numéricas débiles pueden crear ilusión de precisión. Cuando no existe base suficiente, rangos, escenarios y decisiones robustas son preferibles a porcentajes arbitrarios."
evidence_signals:
  - "rango de forecast"
  - "probabilidad calibrada"
  - "downside máximo"
  - "valor esperado"
  - "frecuencia de actualización de supuestos"
