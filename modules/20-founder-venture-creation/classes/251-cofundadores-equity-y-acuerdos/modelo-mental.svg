<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No existe fórmula universal de equity. Considera aportes, riesgo futuro y compromiso, y formaliza con asesoría jurídica según</text>
