<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g6 d-g6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g6">Ficha visual de la clase 006: Prioridades y gestión de atención</title>
<desc id="d-g6">Conceptos: prioridad; urgencia; importancia; switching cost; WIP. Método: capturar todas las demandas relevantes → clasificar impacto, urgencia y dependencia → limitar WIP y reservar bloques de atención → negociar explícitamente lo que se posterga → revisar prioridades cuando cambian supuestos.</desc>
<defs><marker id="p-g6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="602.36" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 006 · Prioridades y gestión de atención</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 00 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >prioridad</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >elección que desplaza otras demandas y recibe recursos</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >preferentes</text>
<circle cx="38" cy="184.12" r="5" fill="#1a7f37"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >urgencia</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ventana temporal cuyo cierre aumenta el costo de</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >esperar</text>
<circle cx="38" cy="256.24" r="5" fill="#1a7f37"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >importancia</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >impacto potencial sobre objetivos, riesgo o valor</text>
<circle cx="38" cy="314.24" r="5" fill="#1a7f37"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >switching cost</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >pérdida de eficiencia al alternar contextos</text>
<circle cx="38" cy="372.24" r="5" fill="#1a7f37"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >WIP</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trabajo en progreso simultáneo que consume capacidad</text>
<text x="54" y="411.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >antes de producir resultados</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="486.0" cy="120" r="11" fill="#1a7f37"/>
<text x="486" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="504" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >capturar todas las</text>
<text x="504" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >demandas</text>
<text x="504" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >relevantes</text>
<rect x="658" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="674.0" cy="120" r="11" fill="#1a7f37"/>
<text x="674" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="692" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >clasificar</text>
<text x="692" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >impacto, urgencia</text>
<text x="692" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >y dependencia</text>
<rect x="846" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="862.0" cy="120" r="11" fill="#1a7f37"/>
<text x="862" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="880" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >limitar WIP y</text>
<text x="880" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >reservar bloques</text>
<text x="880" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >de atención</text>
<rect x="846" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="862.0" cy="240" r="11" fill="#1a7f37"/>
<text x="862" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="880" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >negociar</text>
<text x="880" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >explícitamente lo</text>
<text x="880" y="276.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >que se posterga</text>
<rect x="658" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="674.0" cy="240" r="11" fill="#1a7f37"/>
<text x="674" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="692" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >revisar</text>
<text x="692" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >prioridades cuando</text>
<text x="692" y="276.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >cambian supuestos</text>
<path d="M638,139 L656,139" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g6)"/>
<path d="M826,139 L844,139" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g6)"/>
<path d="M929,176 L929,222" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g6)"/>
<path d="M844,259 L826,259" stroke="#1a7f37" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g6)"/>
<path d="M656.0,259.0 H563.0 a10,10 0 0 0 -10,-10 V178" stroke="#1a7f37" stroke-width="2" fill="none" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#p-g6)"/>
<text x="571" y="251" font-size="11" font-weight="600" fill="#59636e" text-anchor="start" >revisar y volver a empezar</text>
<text x="28" y="458.36" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="470.36" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="483.36" r="3.5" fill="#1a7f37"/>
<text x="52" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >WIP simultáneo</text>
<rect x="160.6" y="470.36" width="88.1" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="173.6" cy="483.36" r="3.5" fill="#1a7f37"/>
<text x="184.6" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >lead time</text>
<rect x="258.7" y="470.36" width="260.6" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="271.7" cy="483.36" r="3.5" fill="#1a7f37"/>
<text x="282.7" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >porcentaje de trabajo interrumpido</text>
<rect x="529.3" y="470.36" width="184.7" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="542.3" cy="483.36" r="3.5" fill="#1a7f37"/>
<text x="553.3" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >compromisos incumplidos</text>
<rect x="724" y="470.36" width="191.6" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="737" cy="483.36" r="3.5" fill="#1a7f37"/>
<text x="748" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >tiempo protegido de foco</text>
<rect x="28" y="516.36" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="516.36" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="536.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="554.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Priorizar no significa ignorar incidentes ni rigidez absoluta. Debe existir capacidad reservada para variabilidad; el sistema falla</text>
<text x="48" y="571.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >tanto por sobreplanificación como por ausencia de límites.</text>
</svg>
