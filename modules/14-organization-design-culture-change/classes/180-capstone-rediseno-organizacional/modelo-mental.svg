<title id="t-g180">Ficha visual de la clase 180: Capstone: rediseño organizacional</title>
<desc id="d-g180">Conceptos: target operating model; design principle; transition architecture; organizational debt; design test. Método: formular design principles → diseñar estructura e interfaces → probar decisiones críticas → alinear incentives y people systems → crear transición con riesgos y métricas.</desc>
