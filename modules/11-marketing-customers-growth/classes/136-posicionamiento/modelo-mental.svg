<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g136 d-g136" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g136">Ficha visual de la clase 136: Posicionamiento</title>
<desc id="d-g136">Conceptos: competitive alternative; unique attribute; value; target segment; market frame. Método: listar alternativas reales → identificar atributos únicos → traducirlos a valor → seleccionar segmento donde importan → probar market frame y mensaje.</desc>
<defs><marker id="p-g136" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#8250df"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 136 · Posicionamiento</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 11 · Gestión de negocio</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#8250df"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >competitive alternative</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >qué usaría el cliente si tu solución no existiera</text>
<circle cx="38" cy="170" r="5" fill="#8250df"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >unique attribute</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad difícil de encontrar en alternativas</text>
<circle cx="38" cy="228" r="5" fill="#8250df"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >value</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >beneficio que el atributo habilita para el cliente</text>
<circle cx="38" cy="286" r="5" fill="#8250df"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >target segment</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grupo para el que ese valor es especialmente importante</text>
<circle cx="38" cy="344" r="5" fill="#8250df"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >market frame</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >categoría o contexto que hace comprensible la</text>
<text x="54" y="383.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >comparación</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
