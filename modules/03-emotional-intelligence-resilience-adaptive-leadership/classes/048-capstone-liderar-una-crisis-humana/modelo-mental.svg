<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 606.12" width="1040" role="img" aria-labelledby="t-g48 d-g48" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g48">Ficha visual de la clase 048: Capstone: liderar una crisis humana</title>
<desc id="d-g48">Conceptos: crisis humana; estabilización; triage; confidencialidad; aftercare. Método: proteger seguridad inmediata → activar protocolo y responsables → separar hechos de rumores → comunicar lo necesario con empatía → hacer seguimiento y aprender sin revictimizar.</desc>
<defs><marker id="p-g48" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="606.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 048 · Capstone: liderar una crisis humana</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 03 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >crisis humana</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >evento que amenaza seguridad, dignidad, confianza o</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >continuidad de personas</text>
<circle cx="38" cy="184.12" r="5" fill="#1a7f37"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >estabilización</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >acciones inmediatas para detener o reducir daño</text>
<circle cx="38" cy="242.12" r="5" fill="#1a7f37"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >triage</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >priorización por severidad y urgencia</text>
<circle cx="38" cy="300.12" r="5" fill="#1a7f37"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >confidencialidad</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >restricción legítima de información sensible</text>
<circle cx="38" cy="358.12" r="5" fill="#1a7f37"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >aftercare</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >apoyo y seguimiento después de la respuesta inicial</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#1a7f37" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#1a7f37"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >proteger seguridad inmediata</text>
<circle cx="485" cy="176" r="14" fill="#1a7f37"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >activar protocolo y responsables</text>
<circle cx="485" cy="230" r="14" fill="#1a7f37"/>
<text x="485" y="235.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >separar hechos de rumores</text>
<circle cx="485" cy="284" r="14" fill="#1a7f37"/>
<text x="485" y="289.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="512" y="280" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >comunicar lo necesario con empatía</text>
<circle cx="485" cy="338" r="14" fill="#1a7f37"/>
<text x="485" y="343.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >hacer seguimiento y aprender sin revictimizar</text>
<text x="28" y="430.12" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="442.12" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="455.12" r="3.5" fill="#1a7f37"/>
<text x="52" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >tiempo de respuesta</text>
<rect x="195.1" y="442.12" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="208.1" cy="455.12" r="3.5" fill="#1a7f37"/>
<text x="219.1" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >personas protegidas</text>
<rect x="362.2" y="442.12" width="74.3" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="375.2" cy="455.12" r="3.5" fill="#1a7f37"/>
<text x="386.2" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >rumores</text>
<rect x="446.5" y="442.12" width="198.5" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="459.5" cy="455.12" r="3.5" fill="#1a7f37"/>
<text x="470.5" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cumplimiento de protocolo</text>
<rect x="655" y="442.12" width="184.7" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="668" cy="455.12" r="3.5" fill="#1a7f37"/>
<text x="679" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >acciones de seguimiento</text>
<rect x="28" y="474.12" width="184.7" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="487.12" r="3.5" fill="#1a7f37"/>
<text x="52" y="491.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >grievance response time</text>
<rect x="222.7" y="474.12" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="235.7" cy="487.12" r="3.5" fill="#1a7f37"/>
<text x="246.7" y="491.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >non-retaliation record</text>
<rect x="28" y="520.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="520.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="540.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="558.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >En crisis humanas, la investigación y comunicación deben respetar debido proceso, privacidad y normativa. El manager no debe</text>
<text x="48" y="575.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >improvisar como investigador clínico, policial o jurídico fuera de su competencia.</text>
</svg>
