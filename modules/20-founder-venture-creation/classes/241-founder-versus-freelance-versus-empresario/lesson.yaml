id: 241
part: 20
title: "Founder versus freelance versus empresario"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir freelancer de founder mediante evidencia observable."
  - "Aplicar la secuencia: definir objetivo personal y económico → mapear dependencia de tiempo → identificar activos acumulables → comparar riesgo y capital → seleccionar modelo y transición."
  - "Interpretar revenue per owner hour, recurring revenue, owner dependency sin atribuir causalidad automática."
  - "Resolver el caso de founder versus freelance versus empresario con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Alexander Osterwalder & Yves Pigneur — *Business Model Generation*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
  - "David J. Bland & Alexander Osterwalder — *Testing Business Ideas*"
  - "Alexander Osterwalder et al. — *Value Proposition Design*"
  - "Peter F. Drucker — *The Effective Executive*"
limits:
  - "No existe jerarquía moral: un freelance rentable puede ser mejor que una startup de alto burn. El modelo debe alinearse con metas, riesgo y estilo de vida."
evidence_signals:
  - "revenue per owner hour"
  - "recurring revenue"
  - "owner dependency"
  - "gross margin"
  - "customer concentration"
