<title id="t-g169">Ficha visual de la clase 169: La organización como diseño</title>
<desc id="d-g169">Conceptos: organization design; structure; process; reward; people practices. Método: partir de estrategia y capacidades → diagnosticar fricciones del sistema → diseñar estructura y procesos juntos → alinear rewards y people practices → pilotear y medir efectos.</desc>
