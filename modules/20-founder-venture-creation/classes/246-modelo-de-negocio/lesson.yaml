objectives:
  - "Distinguir modelo de negocio, canal y producto."
  - "Dibujar un modelo inicial como un conjunto de hipótesis."
  - "Identificar los eslabones más riesgosos y diseñar pruebas."
  - "Estimar ingresos, costos y economía por cliente con supuestos explícitos."
  - "Actualizar el modelo con evidencia sin convertirlo en un plan fijo."
deliverable: "strategy-memo.md"
references:
  - "Alexander Osterwalder & Yves Pigneur — *Business Model Generation*"
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
  - "Ash Maurya — *Running Lean*"
  - "Eric Ries — *The Lean Startup*"
limits:
  - "Un modelo temprano cambia rápido: no lo conviertas en un plan fijo; mantén hipótesis y fechas de verificación, especialmente sobre canal y costos ocultos."
evidence_signals:
  - "hipótesis del modelo marcadas"
  - "eslabón más riesgoso identificado"
  - "economía por cliente calculada"
  - "sensibilidad y actualización"
