id: 212
part: 17
title: "Supervisión de estrategia"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "separar propiedad, administración y supervisión para gobernar estrategia, riesgo y sucesión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir la supervisión de la estrategia de su diseño operativo."
  - "Revisar diagnóstico, elecciones y renuncias de una estrategia."
  - "Desafiar los supuestos con escenarios y pruebas de estrés."
  - "Verificar que el capital y las capacidades alcancen para ejecutarla."
  - "Acordar hitos, señales de alerta y puntos de revisión y reasignación."
deliverable: "strategy-memo.md"
references:
  - "Ram Charan — *Boards That Deliver*"
  - "Daniel P. Forbes & Frances J. Milliken — *Cognition and Corporate Governance: Understanding Boards of Directors as Strategic Decision-Making Groups*"
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
  - "Peter Schwartz — *The Art of the Long View*"
  - "Rita Gunther McGrath — *The End of Competitive Advantage*"
limits:
  - "El directorio puede sobrepasar su rol si convierte el desafío en diseño operativo; formula preguntas y límites y deja al CEO responsable de la ejecución y de las opciones detalladas."
evidence_signals:
  - "diagnóstico y renuncias revisados"
  - "supuestos y escenarios estresados"
  - "capital y capacidades verificados"
  - "hitos y señales acordados"
