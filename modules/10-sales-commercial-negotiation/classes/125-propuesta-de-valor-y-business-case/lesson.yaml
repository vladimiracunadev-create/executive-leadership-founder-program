id: 125
part: 10
title: "Propuesta de valor y business case"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "construir ingresos mediante un proceso comercial medible y negociación disciplinada"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Formular una propuesta de valor específica para un segmento y un problema."
  - "Calcular el valor económico para el cliente con sus datos."
  - "Presentar inversión total, riesgos, supuestos y retorno con rangos."
  - "Adaptar el mensaje a cada rol del comité de compra."
  - "Redactar una propuesta que el comprador pueda defender sin el vendedor."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Thomas T. Nagle, John E. Hogan & Joseph Zale — *The Strategy and Tactics of Pricing*"
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Neil Rackham — *Major Account Sales Strategy*"
  - "Matthew Dixon & Brent Adamson — *The Challenger Sale*"
  - "Alexander Osterwalder et al. — *Value Proposition Design*"
limits:
  - "El valor económico depende de estimaciones del cliente y del vendedor, con sesgo de optimismo; se contrasta con la visión desde afuera."
evidence_signals:
  - "propuesta de valor específica"
  - "costo del problema con números del cliente"
  - "inversión total y riesgos explícitos"
  - "versión ejecutiva para el comité"
