<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 662.6" width="1040" role="img" aria-labelledby="t-g4 d-g4" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g4">Ficha visual de la clase 004: Ética, integridad y límites del poder</title>
<desc id="d-g4">Conceptos: integridad; conflicto de interés; asimetría de poder; deber de cuidado; línea roja. Método: identificar stakeholders afectados y poder relativo → separar obligación, incentivo personal y presión del entorno → formular opciones que respeten líneas rojas → consultar cuando exista conflicto o duda jurídica → documentar la decisión y sus salvaguardas.</desc>
<defs><marker id="p-g4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="662.6" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 004 · Ética, integridad y límites del poder</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 00 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >integridad</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >coherencia sostenida entre principios declarados y</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >conducta observable</text>
<circle cx="38" cy="184.12" r="5" fill="#1a7f37"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >conflicto de interés</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >situación donde un interés secundario puede sesgar una</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >obligación principal</text>
<circle cx="38" cy="256.24" r="5" fill="#1a7f37"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >asimetría de poder</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >diferencia de capacidad para premiar, castigar o</text>
<text x="54" y="295.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >bloquear opciones</text>
<circle cx="38" cy="328.36" r="5" fill="#1a7f37"/>
<text x="54" y="333.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >deber de cuidado</text>
<text x="54" y="351.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >obligación de considerar daños previsibles a personas y</text>
<text x="54" y="367.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >organización</text>
<circle cx="38" cy="400.48" r="5" fill="#1a7f37"/>
<text x="54" y="405.48" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >línea roja</text>
<text x="54" y="423.48" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >condición que no se cruza aunque exista presión por</text>
<text x="54" y="440.04" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >resultado</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#1a7f37" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#1a7f37"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >identificar stakeholders afectados y poder relativo</text>
<circle cx="485" cy="176" r="14" fill="#1a7f37"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >separar obligación, incentivo personal y presión del entorno</text>
<circle cx="485" cy="230" r="14" fill="#1a7f37"/>
<text x="485" y="235.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >formular opciones que respeten líneas rojas</text>
<circle cx="485" cy="284" r="14" fill="#1a7f37"/>
<text x="485" y="289.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="512" y="280" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >consultar cuando exista conflicto o duda jurídica</text>
<circle cx="485" cy="338" r="14" fill="#1a7f37"/>
<text x="485" y="343.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >documentar la decisión y sus salvaguardas</text>
<text x="28" y="486.6" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="498.6" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="52" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >conflictos declarados</text>
<rect x="208.9" y="498.6" width="219.2" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="221.9" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="232.9" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >excepciones éticas aprobadas</text>
<rect x="438.1" y="498.6" width="164" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="451.1" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="462.1" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >quejas o represalias</text>
<rect x="612.1" y="498.6" width="357.2" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="625.1" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="636.1" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >decisiones revertidas por falta de transparencia</text>
<rect x="28" y="530.6" width="267.5" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="543.6" r="3.5" fill="#1a7f37"/>
<text x="52" y="548.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >hallazgos de auditoría o compliance</text>
<rect x="28" y="576.6" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="576.6" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="596.6" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="614.6" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un marco ético no elimina dilemas reales. A veces dos obligaciones legítimas compiten; la calidad está en hacer visibles los</text>
<text x="48" y="631.85" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >afectados, justificar prioridades y usar revisión independiente cuando el poder propio puede sesgar.</text>
</svg>
