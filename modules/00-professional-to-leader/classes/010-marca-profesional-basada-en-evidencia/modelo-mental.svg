<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 634.36" width="1040" role="img" aria-labelledby="t-g10 d-g10" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g10">Ficha visual de la clase 010: Marca profesional basada en evidencia</title>
<desc id="d-g10">Conceptos: reputación; posicionamiento profesional; prueba de trabajo; señal; capital relacional. Método: definir qué problema quieres que te asocien → inventariar resultados y artefactos verificables → crear pruebas públicas sin violar confidencialidad → pedir referencias específicas sobre contribución → alinear canales y mensajes con la evidencia.</desc>
