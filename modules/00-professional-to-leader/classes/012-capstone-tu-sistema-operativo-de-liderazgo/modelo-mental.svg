<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 634.36" width="1040" role="img" aria-labelledby="t-g12 d-g12" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g12">Ficha visual de la clase 012: Capstone: tu sistema operativo de liderazgo</title>
<desc id="d-g12">Conceptos: principio operativo; cadencia; decision journal; stakeholder map; sistema de feedback. Método: sintetizar principios y límites → diseñar agenda y cadencias → definir arquitectura de decisiones → crear sistema de relaciones y feedback → revisar mensualmente evidencia y ajustar.</desc>
<defs><marker id="p-g12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
