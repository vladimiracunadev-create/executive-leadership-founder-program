id: 264
part: 21
title: "Capstone: empresa operable y checklist de cumplimiento"
duration_minutes: 150
level: "Etapa 6 — Founder en Chile"
outcome: "formalizar y operar una empresa chilena con comprensión ejecutiva de obligaciones y escalamiento profesional"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir una empresa operable de una lista de cumplimiento aprobada una sola vez."
  - "Construir una checklist con fuente, evidencia, fecha de verificación y responsable por punto."
  - "Medir brechas abiertas, cobertura de plazos y completitud documental."
  - "Priorizar brechas por severidad y probabilidad con un criterio explícito."
  - "Presentar el resultado de una simulación de revisión previa, con límites y plan de cierre."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Registro de Empresas y Sociedades (Chile) — *Portal y documentación oficial*"
  - "Servicio de Impuestos Internos (Chile) — *Portal Emprendedor*"
  - "Dirección del Trabajo (Chile) — *Normativa y orientación oficial*"
  - "Biblioteca del Congreso Nacional de Chile — *LeyChile: Código del Trabajo y legislación laboral vigente*"
  - "INAPI (Chile) — *Propiedad industrial y orientación oficial*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
limits:
  - "Una checklist completa hoy puede quedar obsoleta mañana: cada punto registra fuente, fecha de verificación y responsable de actualización."
evidence_signals:
