  - "Definir un resultado medible con línea base, meta y plazo."
  - "Organizar oportunidades en un árbol que conecte resultado, oportunidades y soluciones."
  - "Priorizar oportunidades por importancia, satisfacción actual y alcance."
deliverable: "leadership-decision-brief.md"
references:
  - "Melissa Perri — *Escaping the Build Trap*"
  - "Teresa Torres — *Continuous Discovery Habits*"
  - "Dan Olsen — *The Lean Product Playbook*"
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
  - "Marty Cagan — *Inspired*"
limits:
