<text x="789.4" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >percepción de justicia</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
