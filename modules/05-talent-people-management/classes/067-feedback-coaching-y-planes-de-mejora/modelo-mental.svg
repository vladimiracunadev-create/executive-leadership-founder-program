<text x="48" y="536.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="554.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un PIP no debe usarse como simulación de proceso cuando la decisión de salida ya está tomada, ni como represalia. Requiere asesoría de</text>
