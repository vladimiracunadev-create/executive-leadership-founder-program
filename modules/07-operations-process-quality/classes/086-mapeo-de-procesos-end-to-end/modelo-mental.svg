<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >end-to-end process</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >flujo completo que produce un outcome para un cliente</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >interno o externo</text>
<circle cx="38" cy="184.12" r="5" fill="#0969da"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >handoff</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >transferencia entre roles o sistemas</text>
<circle cx="38" cy="242.12" r="5" fill="#0969da"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >touch time</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tiempo de trabajo activo</text>
<circle cx="38" cy="300.12" r="5" fill="#0969da"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >wait time</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tiempo sin procesamiento</text>
<circle cx="38" cy="358.12" r="5" fill="#0969da"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >rework</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >trabajo repetido por error, cambio o criterio</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >incumplido</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
