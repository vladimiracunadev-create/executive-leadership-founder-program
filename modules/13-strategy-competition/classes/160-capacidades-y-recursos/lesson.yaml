id: 160
part: 13
title: "Capacidades y recursos"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "formular y ejecutar elecciones coherentes sobre dónde jugar y cómo ganar"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir resource de capability mediante evidencia observable."
  - "Aplicar la secuencia: mapear actividades críticas → inventariar recursos y capacidades → aplicar VRIO con evidencia → identificar gaps frente a estrategia → decidir build buy partner o exit."
  - "Interpretar capability maturity, time-to-replicate, talent concentration sin atribuir causalidad automática."
  - "Resolver el caso de capacidades y recursos con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "operating-improvement-brief.md"
references:
  - "Michael E. Porter — *Competitive Strategy*"
  - "Michael E. Porter — *Competitive Advantage*"
  - "Hamilton Helmer — *7 Powers*"
  - "Avinash K. Dixit & Barry J. Nalebuff — *The Art of Strategy*"
  - "Robert S. Kaplan & David P. Norton — *The Balanced Scorecard*"
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
limits:
  - "VRIO puede ser estático. Una capacidad valiosa hoy puede commoditizarse; analiza velocidad de erosión y capacidad dinámica además de rareza actual."
evidence_signals:
  - "capability maturity"
  - "time-to-replicate"
  - "talent concentration"
  - "process performance"
  - "strategic dependency"
