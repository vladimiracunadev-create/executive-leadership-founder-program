<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g20 d-g20" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g20">Ficha visual de la clase 020: Efectos de segundo orden</title>
<desc id="d-g20">Conceptos: primer orden; segundo orden; incentivo; externalidad; path dependence. Método: describir efecto directo esperado → preguntar cómo responderán stakeholders → proyectar repetición de la política → identificar externalidades y dependencia → definir límites o salvaguardas.</desc>
<defs><marker id="p-g20" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 020 · Efectos de segundo orden</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 01 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >primer orden</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >efecto directo e inmediato de una acción</text>
<circle cx="38" cy="170" r="5" fill="#1a7f37"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >segundo orden</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >consecuencia producida por la reacción del sistema al</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >primer efecto</text>
<circle cx="38" cy="242.12" r="5" fill="#1a7f37"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >incentivo</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >estructura que cambia el atractivo relativo de</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >conductas</text>
<circle cx="38" cy="314.24" r="5" fill="#1a7f37"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >externalidad</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >costo o beneficio desplazado hacia otro actor</text>
<circle cx="38" cy="372.24" r="5" fill="#1a7f37"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >path dependence</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >dependencia futura creada por decisiones previas</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#1a7f37" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#1a7f37"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >describir efecto directo esperado</text>
<circle cx="485" cy="176" r="14" fill="#1a7f37"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >preguntar cómo responderán stakeholders</text>
<circle cx="485" cy="230" r="14" fill="#1a7f37"/>
<text x="485" y="235.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >proyectar repetición de la política</text>
<circle cx="485" cy="284" r="14" fill="#1a7f37"/>
<text x="485" y="289.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="512" y="280" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >identificar externalidades y dependencia</text>
<circle cx="485" cy="338" r="14" fill="#1a7f37"/>
<text x="485" y="343.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >definir límites o salvaguardas</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="52" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >conductas inducidas</text>
<rect x="195.1" y="456.24" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="208.1" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="219.1" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >costos trasladados</text>
<rect x="355.3" y="456.24" width="226.1" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="368.3" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="379.3" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >calidad después de incentivos</text>
<rect x="591.4" y="456.24" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="604.4" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="615.4" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >retención tras cambios</text>
<rect x="779.2" y="456.24" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="792.2" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="803.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >dependencia creada</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >El análisis de segundo orden puede convertirse en especulación infinita. Limita la cadena a consecuencias plausibles, materiales y con</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >mecanismo defendible; no uses posibilidades remotas para bloquear toda decisión.</text>
</svg>
