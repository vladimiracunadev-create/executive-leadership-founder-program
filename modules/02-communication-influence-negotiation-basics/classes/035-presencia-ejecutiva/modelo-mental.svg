<circle cx="38" cy="170" r="5" fill="#1a7f37"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >claridad</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad de expresar prioridades y razonamiento sin</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ruido</text>
<circle cx="38" cy="242.12" r="5" fill="#1a7f37"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >composure</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >regulación visible de respuesta emocional</text>
