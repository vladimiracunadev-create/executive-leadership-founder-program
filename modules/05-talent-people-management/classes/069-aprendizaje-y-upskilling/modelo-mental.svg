<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 522.56" width="1040" role="img" aria-labelledby="t-s69 d-s69" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s69">Clase 069 · Aprender una capacidad nueva en el trabajo</title>
<desc id="d-s69">Cinco pasos del aprendizaje de una capacidad: brecha, objetivo exigente, práctica con feedback, transferencia y medición.</desc>
<defs><marker id="p-s69" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="522.56" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 069 · Aprender una capacidad nueva en el trabajo</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Ericsson &amp; Pool (2016) · Ambrose et al. (2010) · Brown et al. (…</text>
<rect x="28" y="96" width="229.5" height="113.75" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<circle cx="52.0" cy="122.0" r="13" fill="#0969da"/>
<text x="52" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="72" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Brecha</text>
<text x="44" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Qué capacidad falta frente</text>
<text x="44" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >al cargo o a la estrategia.</text>
<path d="M260.5,152.875 L276.5,152.875" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s69)"/>
<rect x="279.5" y="96" width="229.5" height="113.75" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<circle cx="303.5" cy="122.0" r="13" fill="#1a7f37"/>
<text x="303.5" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="323.5" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Objetivo al límite</text>
<text x="295.5" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Un paso exigente pero</text>
<text x="295.5" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >alcanzable, con criterios.</text>
<path d="M512,152.875 L528,152.875" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s69)"/>
<rect x="531" y="96" width="229.5" height="113.75" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<circle cx="555.0" cy="122.0" r="13" fill="#bc4c00"/>
<text x="555" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="575" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Práctica con feedback</text>
<text x="547" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Repetición con</text>
<text x="547" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >retroalimentación pronta; no</text>
<text x="547" y="186.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >basta la exposición.</text>
<path d="M763.5,152.875 L779.5,152.875" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s69)"/>
<rect x="782.5" y="96" width="229.5" height="113.75" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<circle cx="806.5" cy="122.0" r="13" fill="#8250df"/>
<text x="806.5" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="826.5" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Transferencia</text>
<text x="798.5" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Aplicar lo aprendido a un</text>
<text x="798.5" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >trabajo real, con apoyo.</text>
<path d="M897.25,211.75 V223.75 H142.75 V241.75" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#p-s69)"/>
<rect x="28" y="243.75" width="229.5" height="113.75" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="1.8" />
<circle cx="52.0" cy="269.75" r="13" fill="#59636e"/>
<text x="52" y="274.75" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="72" y="267.75" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Medición</text>
<text x="44" y="299.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Evidencia de que cambió la</text>
<text x="44" y="317" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >conducta o el resultado.</text>
<path d="M142.75,359.5 V379.5 H142.75 V213.75" stroke="#59636e" stroke-width="2" fill="none" stroke-dasharray="7 6" marker-end="url(#p-s69)"/>
<text x="142.75" y="373.5" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >se ajusta el siguiente paso</text>
<rect x="28" y="395.5" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="417.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La práctica deliberada exige tareas en el límite de la capacidad, feedback inmediato y repetición. Recuperar lo aprendido y espaciar la</text>
<text x="44" y="434.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >práctica fortalece la retención.</text>
<text x="28" y="482" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Asistir a un curso no es aprender: se evalúa si cambió lo que la persona hace.</text>
</svg>
