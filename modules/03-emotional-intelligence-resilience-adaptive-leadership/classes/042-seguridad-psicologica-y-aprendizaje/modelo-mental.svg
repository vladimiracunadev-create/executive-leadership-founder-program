<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" role="img" aria-labelledby="t-042 d-042" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-042">Seguridad psicológica y exigencia son dos ejes, no una disyuntiva</title>
<desc id="d-042">Cuadrante según el nivel de seguridad psicológica y el de estándares: zona de aprendizaje, de ansiedad, de confort y de apatía; y la cadena de la seguridad al desempeño.</desc>
<defs><marker id="p-042" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="600" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 042 · Poder decir lo que se piensa y exigir resultados</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Edmondson (1999, 2018)</text>
<text x="260" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >SEGURIDAD PSICOLÓGICA:  baja</text>
<text x="552" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >alta</text>
<text transform="translate(98,175.0) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">ESTÁNDARES: altos</text>
<text transform="translate(98,337.0) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">ESTÁNDARES: bajos</text>
<rect x="120" y="100" width="280" height="150" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<rect x="120" y="100" width="280" height="34" rx="12" fill="#cf222e"/>
<text x="136" y="123" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Zona de ansiedad</text>
<text x="136" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Se exige mucho y es peligroso</text>
<text x="136" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >hablar: se oculta el error.</text>
<rect x="412" y="100" width="280" height="150" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="412" y="100" width="280" height="34" rx="12" fill="#1a7f37"/>
<text x="428" y="123" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Zona de aprendizaje</text>
<text x="428" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Se exige y se puede decir la</text>
<text x="428" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >verdad: se aprende del error.</text>
<rect x="120" y="262" width="280" height="150" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="1.8" />
<rect x="120" y="262" width="280" height="34" rx="12" fill="#59636e"/>
<text x="136" y="285" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Zona de apatía</text>
<text x="136" y="320" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Poca exigencia y poca seguridad: se</text>
<text x="136" y="337.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >hace lo mínimo.</text>
<rect x="412" y="262" width="280" height="150" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="412" y="262" width="280" height="34" rx="12" fill="#0969da"/>
<text x="428" y="285" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Zona de confort</text>
<text x="428" y="320" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Hay confianza, pero sin reto: se</text>
<text x="428" y="337.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cuida el clima y no el resultado.</text>
<text x="740" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">LA CADENA</text>
<rect x="740" y="104" width="272" height="74" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.7" />
<text x="754" y="128" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Conducta del líder</text>
<text x="754" y="146" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Pide opiniones, admite errores.</text>
<path d="M876,180 L876,192" stroke="#59636e" stroke-width="1.8" fill="none" stroke-linecap="round"  marker-end="url(#p-042)"/>
<rect x="740" y="194" width="272" height="74" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<text x="754" y="218" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Seguridad psicológica</text>
<text x="754" y="236" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Creencia compartida de que hablar es</text>
<text x="754" y="251.87" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >seguro.</text>
<path d="M876,270 L876,282" stroke="#59636e" stroke-width="1.8" fill="none" stroke-linecap="round"  marker-end="url(#p-042)"/>
<rect x="740" y="284" width="272" height="74" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<text x="754" y="308" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Conductas de aprendizaje</text>
<text x="754" y="326" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Preguntar, pedir ayuda, probar,</text>
<text x="754" y="341.87" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >discutir errores.</text>
<path d="M876,360 L876,372" stroke="#59636e" stroke-width="1.8" fill="none" stroke-linecap="round"  marker-end="url(#p-042)"/>
<rect x="740" y="374" width="272" height="74" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<text x="754" y="398" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Desempeño</text>
<text x="754" y="416" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Mediado por el aprendizaje del</text>
<text x="754" y="431.87" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >equipo.</text>
<rect x="28" y="440" width="680" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="462" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Seguridad psicológica no es amabilidad ni bajar el estándar: es la creencia compartida de</text>
<text x="44" y="479.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >que el equipo es seguro para asumir riesgos interpersonales como preguntar, admitir un error</text>
<text x="44" y="496.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >o discrepar.</text>
<text x="28" y="566" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >El efecto sobre el desempeño depende de la tarea y del contexto; la evidencia más fuerte es de equipos de trabajo concretos.</text>
</svg>
