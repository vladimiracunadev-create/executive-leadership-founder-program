<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" role="img" aria-labelledby="t-025 d-025" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-025">Elegir el canal según la ambigüedad del mensaje</title>
<desc id="d-025">Matriz de riqueza del canal: los canales pobres sirven a mensajes sin ambigüedad y los ricos a los equívocos; las esquinas opuestas son desajustes.</desc>
<defs><marker id="p-025" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="600" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 025 · El canal debe corresponder al mensaje</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Daft &amp; Lengel (1986)</text>
<rect x="120" y="84" width="520" height="380" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
<path d="M140,444 L620,104" stroke="#1a7f37" stroke-width="30" stroke-opacity="0.13" stroke-linecap="round"/>
<text x="380" y="492" font-size="12" font-weight="700" fill="#59636e" text-anchor="middle" >MENSAJE:  poca ambigüedad  →  muy ambiguo (varias lecturas posibles)</text>
<text transform="translate(52,274.0) rotate(-90)" font-size="12" font-weight="700" fill="#59636e" text-anchor="middle">CANAL:  pobre  →  rico</text>
<rect x="148" y="366" width="200" height="74" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<text x="160" y="388" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Informe, tablero, correo</text>
<text x="160" y="406" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Un cambio de horario ya</text>
<text x="160" y="421.87" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >decidido.</text>
<rect x="280" y="252" width="210" height="74" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<text x="292" y="274" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Reunión con preguntas</text>
<text x="292" y="292" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Una política nueva que genera</text>
<text x="292" y="307.87" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >dudas.</text>
<rect x="420" y="114" width="205" height="74" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<text x="432" y="136" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start" >Conversación directa</text>
<text x="432" y="154" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >Una reestructuración o una</text>
<text x="432" y="169.87" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >mala noticia.</text>
<text x="630" y="450" font-size="11" font-weight="600" fill="#cf222e" text-anchor="end" >desajuste: canal pobre</text>
<text x="630" y="463" font-size="11" font-weight="600" fill="#cf222e" text-anchor="end" >para algo ambiguo</text>
<text x="132" y="106" font-size="11" font-weight="600" fill="#cf222e" text-anchor="start" >desajuste: canal rico</text>
<text x="132" y="119" font-size="11" font-weight="600" fill="#cf222e" text-anchor="start" >para algo simple</text>
<text x="680" y="92" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ DICE EL MARCO</text>
<rect x="680" y="108" width="332" height="98" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<rect x="680" y="108" width="6" height="98" rx="3" fill="#0969da"/>
<text x="698" y="130" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Incertidumbre</text>
<text x="698" y="148" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Falta información. Se resuelve con más</text>
<text x="698" y="165.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >datos: un canal pobre basta.</text>
<rect x="680" y="220" width="332" height="98" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<rect x="680" y="220" width="6" height="98" rx="3" fill="#cf222e"/>
<text x="698" y="242" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Equivocidad</text>
<text x="698" y="260" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Hay varias interpretaciones posibles. Se</text>
<text x="698" y="277.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >resuelve conversando, con</text>
<text x="698" y="294.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >retroalimentación inmediata: un canal</text>
<text x="698" y="311.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >rico.</text>
<rect x="680" y="332" width="332" height="98" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="680" y="332" width="6" height="98" rx="3" fill="#1a7f37"/>
<text x="698" y="354" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Retroalimentación</text>
<text x="698" y="372" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Pide que repitan el mensaje con sus</text>
<text x="698" y="389.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >palabras: así se sabe que llegó.</text>
<text x="28" y="558" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Lo que se decide por escrito conviene dejarlo también por escrito después de la conversación: el canal rico aclara, el pobre deja registro.</text>
</svg>
