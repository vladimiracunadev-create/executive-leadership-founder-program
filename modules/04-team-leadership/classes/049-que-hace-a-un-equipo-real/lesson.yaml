id: 49
part: 04
title: "Qué hace a un equipo real"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "crear equipos con propósito, coordinación, confianza, aprendizaje y accountability"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir grupo de trabajo, pseudoequipo y equipo real con criterios observables."
  - "Ubicar a un equipo en la curva de desempeño de Katzenbach y Smith."
  - "Enumerar las condiciones habilitantes de Hackman y evaluar cuáles faltan."
  - "Decidir si un conjunto de personas necesita ser un equipo."
  - "Reconocer el costo de crear equipos donde no hacen falta."
deliverable: "people-decision-brief.md"
references:
  - "Jon R. Katzenbach & Douglas K. Smith — *The Wisdom of Teams*"
  - "J. Richard Hackman — *Leading Teams*"
  - "Patrick Lencioni — *The Five Dysfunctions of a Team*"
  - "Stanley McChrystal et al. — *Team of Teams*"
  - "Amy C. Edmondson — *Psychological Safety and Learning Behavior in Work Teams*"
limits:
  - "La curva de Katzenbach y Smith es un modelo derivado de estudios de caso, no una medición, y los autores mismos la presentan como una herramienta de reflexión."
evidence_signals:
  - "ubicación en la curva con evidencia"
  - "condiciones de Hackman evaluadas"
  - "metas del equipo y no solo individuales"
  - "decisión de si debe ser equipo"
