<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 606.12" width="1040" role="img" aria-labelledby="t-g202 d-g202" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g202">Ficha visual de la clase 202: Crisis y decisiones irreversibles</title>
<desc id="d-g202">Conceptos: irreversible decision; pre-mortem; red team; staged commitment; stop rule. Método: clasificar reversibilidad → buscar downside y alternativas → activar challenge independiente → fraccionar compromiso si es posible → definir stop rule y decision log.</desc>
<defs><marker id="p-g202" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
