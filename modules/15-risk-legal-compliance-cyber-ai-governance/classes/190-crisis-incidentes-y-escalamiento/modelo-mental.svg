<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" role="img" aria-labelledby="t-190 d-190" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-190">Escalamiento por niveles y roles de un incidente</title>
<desc id="d-190">Una escalera de cuatro niveles (operación, gerencia, comité de crisis, directorio) con su criterio de paso, cuatro roles separados bajo un mando único y cuatro prioridades en orden.</desc>
<defs><marker id="p-190" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="620" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#0969da"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 190 · Quién actúa, cuándo sube y en qué orden</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Beyer et al. (2016) · Coombs (2007)</text>
<rect x="112" y="82" width="386" height="86" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<circle cx="140" cy="125" r="17" fill="#cf222e"/>
<text x="140" y="131" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="168" y="110" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >Directorio</text>
<text x="168" y="129" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >La decisión excede al comité o compromete la</text>
<text x="168" y="146.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >continuidad o la licencia para operar.</text>
<path d="M112,176 L112,182" stroke="#59636e" stroke-width="1.6" fill="none" stroke-linecap="round"  marker-end="url(#p-190)"/>
<rect x="84" y="180" width="414" height="86" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<circle cx="112" cy="223" r="17" fill="#bc4c00"/>
<text x="112" y="229" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="140" y="208" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >Comité de crisis</text>
<text x="140" y="227" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Afecta a clientes, datos personales, un</text>
<text x="140" y="244.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >regulador, a personas o es público.</text>
<path d="M84,274 L84,280" stroke="#59636e" stroke-width="1.6" fill="none" stroke-linecap="round"  marker-end="url(#p-190)"/>
<rect x="56" y="278" width="442" height="86" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<circle cx="84" cy="321" r="17" fill="#0969da"/>
<text x="84" y="327" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="112" y="306" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >Gerencia</text>
<text x="112" y="325" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Necesita un segundo equipo o no se resuelve tras una</text>
<text x="112" y="342.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >hora de análisis concentrado.</text>
<path d="M56,372 L56,378" stroke="#59636e" stroke-width="1.6" fill="none" stroke-linecap="round"  marker-end="url(#p-190)"/>
<rect x="28" y="376" width="470" height="86" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<circle cx="56" cy="419" r="17" fill="#1a7f37"/>
<text x="56" y="425" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="84" y="404" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >Operación</text>
<text x="84" y="423" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Un equipo lo detecta, lo contiene y lo registra con su</text>
<text x="84" y="440.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >propia autoridad.</text>
<text x="28" y="482" font-size="12.5" font-weight="600" fill="#59636e" text-anchor="start" >Declarar un incidente es una decisión barata; no declararlo, la cara.</text>
<text x="540" y="80" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">UN SOLO MANDO, ROLES SEPARADOS</text>
<rect x="670" y="94" width="230" height="62" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="2" />
<text x="785" y="120" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle" >Mando del incidente</text>
<text x="785" y="139" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" >decide y responde por la decisión</text>
<rect x="540" y="196" width="230" height="58" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<text x="655" y="220" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle" >Operaciones</text>
<text x="655" y="239" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" >contiene y repara</text>
<path d="M785,156 L655,194" stroke="#0969da" stroke-width="1.8" fill="none" stroke-linecap="round"  marker-end="url(#p-190)"/>
<rect x="790" y="196" width="230" height="58" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<text x="905" y="220" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle" >Comunicación</text>
<text x="905" y="239" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" >un solo mensaje</text>
<path d="M785,156 L905,194" stroke="#1a7f37" stroke-width="1.8" fill="none" stroke-linecap="round"  marker-end="url(#p-190)"/>
<rect x="670" y="292" width="230" height="58" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<text x="785" y="316" font-size="14.5" font-weight="700" fill="#1f2328" text-anchor="middle" >Registro y planificación</text>
<text x="785" y="335" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" >hechos, decisiones y relevos</text>
<path d="M785,156 L785,290" stroke="#8250df" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#p-190)"/>
<text x="540" y="386" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Quien opera no habla por la empresa, y quien habla no repara. Legal</text>
<text x="540" y="403.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >y personas asesoran al mando; no lo sustituyen.</text>
<text x="540" y="450" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">PRIORIDADES, EN ESTE ORDEN</text>
<circle cx="554" cy="480" r="13" fill="#0969da"/>
<text x="554" y="485" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="576" y="485" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >Proteger a las personas</text>
<circle cx="804" cy="480" r="13" fill="#0969da"/>
<text x="804" y="485" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="826" y="485" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >Detener el daño</text>
<circle cx="554" cy="524" r="13" fill="#0969da"/>
<text x="554" y="529" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="576" y="529" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >Preservar la evidencia</text>
<circle cx="804" cy="524" r="13" fill="#0969da"/>
<text x="804" y="529" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="826" y="529" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start" >Restablecer</text>
<text x="28" y="594" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Niveles y criterios: adaptación docente de Beyer et al. (2016) y Coombs (2007); cada organización fija los suyos por escrito.</text>
</svg>
