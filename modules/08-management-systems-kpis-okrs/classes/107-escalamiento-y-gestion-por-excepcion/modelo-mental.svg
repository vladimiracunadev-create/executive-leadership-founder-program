<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 491.54" width="1040" role="img" aria-labelledby="t-s107 d-s107" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s107">Clase 107 · Gestión por excepción: umbrales que activan la acción</title>
<desc id="d-s107">Regla de semáforo para gestionar por excepción: estado, criterio, respuesta y quién interviene.</desc>
<defs><marker id="p-s107" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="491.54" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 107 · Gestión por excepción: umbrales que activan la acción</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Grove (1983) · Simons (1995) · Bossidy &amp; Charan (2002)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Estado</text>
<text x="180.571" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Criterio (ejemplo)</text>
<text x="489.829" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Respuesta</text>
<text x="827.2" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Quién</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Verde</text>
<text x="180.571" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dentro de ±5 % del plan.</text>
<text x="489.829" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Sigue; no se discute en la reunión.</text>
<text x="827.2" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dueño</text>
<rect x="28" y="172.56" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Ámbar</text>
<text x="180.571" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Desvío de 5 % a 15 % o tendencia adversa</text>
<text x="180.571" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >dos semanas.</text>
<text x="489.829" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Plan de corrección en 5 días.</text>
<text x="827.2" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dueño informa al jefe</text>
<rect x="28" y="225.68" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="245.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Rojo</text>
<text x="180.571" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Desvío de más de 15 % o riesgo para un</text>
<text x="180.571" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >compromiso clave.</text>
<text x="489.829" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Escala y se decide en 48 horas.</text>
<text x="827.2" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Comité o dirección</text>
<rect x="28" y="278.8" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="298.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Revisión de</text>
<text x="40" y="315.36" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >umbrales</text>
<text x="180.571" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se revisan cada trimestre.</text>
<text x="489.829" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se ajustan con datos de falsos positivos y</text>
<text x="489.829" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >omisiones.</text>
<text x="827.2" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dueño del proceso</text>
<rect x="28" y="347.92" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="369.92" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La gestión por excepción libera atención de la dirección para lo que importa, siempre que los umbrales sean claros y que escalar a</text>
<text x="44" y="387.17" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >tiempo no se castigue.</text>
<text x="28" y="434.42" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Un sistema que solo reporta los problemas puede ocultar los riesgos que aún no cruzan el umbral; se complementa con revisiones periódicas de</text>
<text x="28" y="450.98" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >fondo.</text>
</svg>
