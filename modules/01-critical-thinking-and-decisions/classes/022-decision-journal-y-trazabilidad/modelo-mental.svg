<rect x="28" y="520.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="540.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="558.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No todo acto operativo merece un journal detallado. Registra decisiones de suficiente impacto, incertidumbre o aprendizaje;</text>
<text x="48" y="575.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >burocratizar microdecisiones destruye adopción.</text>
