<title id="t-g267">Ficha visual de la clase 267: Contratar líderes</title>
<desc id="d-g267">Conceptos: leadership mandate; executive scorecard; decision authority; leadership leverage; executive onboarding. Método: definir outcome y contexto → crear scorecard y decision rights → buscar evidence de scale → hacer reference checks → onboard con 90-day learning y decision plan.</desc>
