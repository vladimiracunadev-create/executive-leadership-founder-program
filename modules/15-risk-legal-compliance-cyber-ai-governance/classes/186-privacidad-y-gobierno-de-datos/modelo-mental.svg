<title id="t-g186">Ficha visual de la clase 186: Privacidad y gobierno de datos</title>
<desc id="d-g186">Conceptos: data governance; data minimization; purpose limitation; legal basis; data lineage. Método: inventariar datos y finalidades → clasificar sensibilidad y bases → definir acceso retención y sharing → implementar derechos y controles → monitorear incidentes y cambios de uso.</desc>
