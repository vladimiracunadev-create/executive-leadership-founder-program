id: 183
part: 15
title: "Controles internos y segregación"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "gobernar riesgo, legal, cumplimiento, ciberseguridad, datos e IA de forma integrada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir internal control de segregation of duties mediante evidencia observable."
  - "Aplicar la secuencia: mapear riesgo y objetivo → identificar puntos de fraude o error → diseñar control preventivo y detective → separar funciones incompatibles → testear evidencia y remediar fallas."
  - "Interpretar control exceptions, SoD conflicts, test failure rate sin atribuir causalidad automática."
  - "Resolver el caso de controles internos y segregación con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "COSO — *Enterprise Risk Management—Integrating with Strategy and Performance*"
  - "John C. Hull — *Risk Management and Financial Institutions*"
  - "OECD — *OECD AI Principles*"
  - "Richard A. Clarke & Robert K. Knake — *The Fifth Domain*"
  - "Bob Tricker — *Corporate Governance*"
  - "NIST — *Cybersecurity Framework (CSF) 2.0*"
  - "COSO — *Enterprise Risk Management* / *Internal Control*. Fuente institucional: <https://www.coso.org/>."
limits:
  - "Separar toda función puede ser inviable en equipos pequeños. Usa controles compensatorios —revisión independiente, límites, alertas, reconciliación— proporcionales al riesgo."
evidence_signals:
  - "control exceptions"
  - "SoD conflicts"
  - "test failure rate"
  - "override count"
  - "reconciliation breaks"
