<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g67 d-g67" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g67">Ficha visual de la clase 067: Feedback, coaching y planes de mejora</title>
<desc id="d-g67">Conceptos: performance gap; PIP; support; milestone; documentation. Método: documentar ejemplos y estándar → conversar brecha y escuchar contexto → acordar acciones y apoyo → definir milestones y revisión → cerrar con mejora, extensión justificada o proceso de salida.</desc>
