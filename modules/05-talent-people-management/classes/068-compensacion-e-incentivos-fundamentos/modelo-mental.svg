<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g68 d-g68" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g68">Ficha visual de la clase 068: Compensación e incentivos: fundamentos</title>
<desc id="d-g68">Conceptos: total rewards; pay band; internal equity; variable pay; incentive risk. Método: definir filosofía de compensación → benchmarkear sin delegar decisión al mercado → construir bandas y criterios → diseñar variable con guardrails → auditar equidad y gaming.</desc>
<defs><marker id="p-g68" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
