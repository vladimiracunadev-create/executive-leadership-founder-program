<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g120 d-g120" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g120">Ficha visual de la clase 120: Capstone: comité de inversión</title>
<desc id="d-g120">Conceptos: investment memo; NPV; hurdle rate; real option; post-audit. Método: definir decisión y alternativa base → modelar cash flows incrementales → calcular NPV y sensibilidad → comparar opciones y portfolio → aprobar con milestones y post-audit.</desc>
<defs><marker id="p-g120" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
