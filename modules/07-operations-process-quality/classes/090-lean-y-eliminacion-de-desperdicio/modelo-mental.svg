<text x="504" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >definir valor</text>
<text x="504" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >desde cliente</text>
<rect x="658" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
