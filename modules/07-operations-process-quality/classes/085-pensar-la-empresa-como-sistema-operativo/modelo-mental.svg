<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >mapear demanda a outcome</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#0969da"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#0969da" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >identificar flujos end-to-end</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#0969da"/>
