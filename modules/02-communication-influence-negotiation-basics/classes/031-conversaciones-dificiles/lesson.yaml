id: 31
part: 02
title: "Conversaciones difíciles"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir hechos de intención atribuida mediante evidencia observable."
  - "Aplicar la secuencia: preparar hechos y emociones propias → separar intención de impacto → reconocer contribución propia → abrir con una tercera historia neutral → acordar decisión, límite o próximo experimento."
  - "Interpretar interrupciones y defensividad, hechos disputados, acuerdos concretos sin atribuir causalidad automática."
  - "Resolver el caso de conversaciones difíciles con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Robert B. Cialdini — *Influence*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
  - "Barbara Minto — *The Pyramid Principle*"
  - "Edgar H. Schein — *Humble Inquiry*"
  - "Chris Voss & Tahl Raz — *Never Split the Difference*"
limits:
  - "No toda conversación debe resolverse informalmente. Si hay violencia, acoso, discriminación, riesgo de seguridad o una obligación legal, se activa el proceso formal correspondiente."
evidence_signals:
  - "interrupciones y defensividad"
  - "hechos disputados"
  - "acuerdos concretos"
  - "reincidencia del conflicto"
  - "seguimientos cumplidos"
