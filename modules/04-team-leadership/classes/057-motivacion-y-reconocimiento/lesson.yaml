id: 57
part: 04
title: "Motivación y reconocimiento"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "crear equipos con propósito, coordinación, confianza, aprendizaje y accountability"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Explicar por qué el reconocimiento puede sostener o dañar la motivación según cómo se perciba."
  - "Formular un reconocimiento específico, oportuno y vinculado a un efecto."
  - "Adaptar el reconocimiento a las preferencias de la persona sin suponerlas."
  - "Diseñar rituales de equipo que hagan visible el progreso y la colaboración."
  - "Evitar reconocimientos que generen competencia dañina o sensación de control."
deliverable: "leadership-decision-brief.md"
references:
  - "Richard M. Ryan & Edward L. Deci — *Self-Determination Theory and the Facilitation of Intrinsic Motivation, Social Development, and Well-Being*"
  - "Teresa M. Amabile & Steven J. Kramer — *The Progress Principle*"
  - "Daniel H. Pink — *Drive*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Kim Scott — *Radical Candor*"
limits:
  - "La teoría de Ryan y Deci tiene amplio respaldo, pero los efectos varían según el tipo de recompensa, la tarea y la cultura."
evidence_signals:
  - "reconocimiento específico y oportuno"
  - "preferencia de cada persona preguntada"
  - "progreso hecho visible"
  - "efecto en la colaboración"
