<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >discount leakage</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >erosión de precio por descuentos no controlados</text>
<circle cx="38" cy="344" r="5" fill="#59636e"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >customization debt</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >costo futuro creado por excepciones específicas de</text>
<text x="54" y="383.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >clientes</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
