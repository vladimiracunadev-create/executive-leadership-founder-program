<title id="t-g277">Ficha visual de la clase 277: Independencia: definición económica y profesional</title>
<desc id="d-g277">Conceptos: financial independence; professional independence; runway; income concentration; optionality. Método: definir necesidades y objetivo → medir runway y concentración → mapear capabilities y assets → crear vías de ingreso compatibles → revisar riesgo y optionality trimestralmente.</desc>
