id: 44
part: 03
title: "Liderar en incertidumbre"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir riesgo, incertidumbre y ambigüedad, y qué pide cada uno."
  - "Describir el ciclo de construcción de sentido: notar, interpretar, actuar y corregir."
  - "Comunicar con honestidad lo que se sabe, lo que no y qué se hará mientras tanto."
  - "Elegir acciones acotadas y reversibles para aprender de la situación."
  - "Reconocer cuándo la decisión no debe dilatarse y cuándo la intuición experta es confiable."
deliverable: "leadership-decision-brief.md"
references:
  - "Karl E. Weick — *Sensemaking in Organizations*"
  - "Karl E. Weick & Kathleen M. Sutcliffe — *Managing the Unexpected*"
  - "Gary Klein — *Sources of Power*"
  - "Daniel Kahneman — *Thinking, Fast and Slow*"
  - "Annie Duke — *Thinking in Bets*"
  - "Adam Grant — *Think Again*"
limits:
  - "La construcción de sentido es una teoría interpretativa sin estimaciones cuantitativas, y la decisión por reconocimiento de Klein se basa en entrevistas con expertos en dominios con retroalimentación; en dominios donde la retroalimentación es lenta o engañosa, la intuición es menos confiable, como muestra Kahneman."
evidence_signals:
  - "relato plausible escrito"
  - "señales de refutación"
  - "acción acotada y reversible"
  - "fecha de revisión"
