<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g32 d-g32" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g32">Ficha visual de la clase 032: Conflicto productivo</title>
<desc id="d-g32">Conceptos: conflicto de tarea; conflicto relacional; disenso; commitment; norma de conflicto. Método: nombrar tema y objetivo común → separar persona de argumento → pedir evidencia y alternativa → usar un decisor o regla de cierre → registrar decisión y desacuerdo residual.</desc>
<defs><marker id="p-g32" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 032 · Conflicto productivo</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 02 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >conflicto de tarea</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >desacuerdo sobre contenido, prioridades o método</text>
<circle cx="38" cy="170" r="5" fill="#1a7f37"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >conflicto relacional</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tensión centrada en identidad, respeto o intención</text>
<circle cx="38" cy="228" r="5" fill="#1a7f37"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >disenso</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >expresión explícita de una alternativa o objeción</text>
<circle cx="38" cy="286" r="5" fill="#1a7f37"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >commitment</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >apoyo a la ejecución después de una decisión legítima</text>
<circle cx="38" cy="344" r="5" fill="#1a7f37"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >norma de conflicto</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >regla compartida sobre cómo se debate y se cierra</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#1a7f37" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#1a7f37"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >nombrar tema y objetivo común</text>
<circle cx="485" cy="176" r="14" fill="#1a7f37"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >separar persona de argumento</text>
<circle cx="485" cy="230" r="14" fill="#1a7f37"/>
<text x="485" y="235.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >pedir evidencia y alternativa</text>
