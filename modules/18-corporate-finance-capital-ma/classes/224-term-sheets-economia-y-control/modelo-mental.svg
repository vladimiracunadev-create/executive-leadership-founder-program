<text x="253.6" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >investor preference</text>
<rect x="396.7" y="456.24" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
