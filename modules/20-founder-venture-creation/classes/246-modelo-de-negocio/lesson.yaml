id: 246
part: 20
title: "Modelo de negocio"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir business model de channel mediante evidencia observable."
  - "Aplicar la secuencia: dibujar hipótesis de modelo → identificar riskiest links → estimar revenue y cost → probar canal y delivery → actualizar con evidencia de clientes."
  - "Interpretar ARPU, gross margin, CAC sin atribuir causalidad automática."
  - "Resolver el caso de modelo de negocio con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "strategy-memo.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Alexander Osterwalder & Yves Pigneur — *Business Model Generation*"
  - "Alexander Osterwalder et al. — *Value Proposition Design*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
  - "Eric Ries — *The Lean Startup*"
  - "Noam Wasserman — *The Founder's Dilemmas*"
limits:
  - "Un modelo temprano cambia rápido; no lo conviertas en plan fijo. Mantén hipótesis y fechas de verificación, especialmente sobre canal y costos ocultos."
evidence_signals:
  - "ARPU"
  - "gross margin"
  - "CAC"
  - "retention"
  - "payback"
