id: 34
part: 02
title: "Mapa de stakeholders y poder"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir interesado, poder, legitimidad, urgencia y prominencia con las palabras de la teoría."
  - "Clasificar a un actor en una de las siete clases del modelo, justificando cada atributo con un hecho observable."
  - "Explicar por qué un actor cambia de clase cuando cambia uno de sus atributos y anticipar ese cambio."
  - "Traducir la clase a una conducta de relación: monitorear, institucionalizar, dialogar, proteger la voz o atender de inmediato."
  - "Reconocer el límite del modelo: describe a quién prestan atención los directivos, no a quién se le debe consideración."
deliverable: "stakeholder-legitimacy-map.md"
references:
  - "R. Edward Freeman — *Strategic Management: A Stakeholder Approach*"
  - "Ronald K. Mitchell, Bradley R. Agle & Donna J. Wood — *Toward a Theory of Stakeholder Identification and Salience: Defining the Principle of Who and What Really Counts*"
  - "Bob Tricker — *Corporate Governance*"
  - "Gary Yukl — *Leadership in Organizations*"
  - "Michael D. Watkins — *The First 90 Days*"
limits:
  - "El modelo describe la prominencia percibida por los directivos; no decide a quién se le debe consideración. Los atributos son percepciones de quien mapea y el mapa pierde vigencia con el primer cambio relevante."
evidence_signals:
  - "hecho que respalda cada atributo"
  - "clase asignada y fecha del mapa"
  - "evento que obligaría a rehacerlo"
  - "afectados que no pueden reclamar"
