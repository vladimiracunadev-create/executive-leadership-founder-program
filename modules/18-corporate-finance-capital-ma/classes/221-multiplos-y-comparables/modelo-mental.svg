<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474.98" width="1040" role="img" aria-labelledby="t-s221 d-s221" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s221">Clase 221 · Cuatro múltiplos y cuándo sirven</title>
<desc id="d-s221">Múltiplos habituales de valoración, qué miden, cuándo sirven y un cuidado frecuente.</desc>
<defs><marker id="p-s221" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="474.98" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 221 · Cuatro múltiplos y cuándo sirven</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Koller et al. · Damodaran · Penman</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Múltiplo</text>
<text x="220" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué mide</text>
<text x="472" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cuándo sirve</text>
<text x="736" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cuidado</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Valor empresa / EBITDA</text>
<text x="220" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Precio del negocio por peso de</text>
<text x="220" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >caja operativa.</text>
<text x="472" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Empresas con inversión y deuda</text>
<text x="472" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >distintas.</text>
<text x="736" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Ignora la inversión que exige el</text>
<text x="736" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >crecimiento.</text>
<rect x="28" y="189.12" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Valor empresa / ventas</text>
<text x="220" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Precio por peso de ingresos.</text>
<text x="472" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Negocios sin utilidades todavía.</text>
<text x="736" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >No refleja márgenes ni calidad.</text>
<rect x="28" y="225.68" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="245.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Precio / utilidad</text>
<text x="220" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Precio del capital propio por peso</text>
<text x="220" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >de utilidad.</text>
<text x="472" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Empresas maduras y comparables.</text>
<text x="736" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Afectado por deuda y partidas únicas.</text>
<rect x="28" y="278.8" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="298.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Valor empresa / flujo</text>
<text x="40" y="315.36" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >libre</text>
<text x="220" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Precio por caja realmente</text>
<text x="220" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >disponible.</text>
<text x="472" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cuando la inversión es relevante.</text>
<text x="736" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Flujos volátiles dificultan comparar.</text>
<rect x="28" y="347.92" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="369.92" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Un múltiplo compara con un conjunto de empresas similares; el resultado depende de quiénes se eligen y de que las cifras sean</text>
<text x="44" y="387.17" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >comparables. Se reconcilia siempre con el flujo descontado.</text>
<text x="28" y="434.42" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los múltiplos de mercado cambian con el ciclo: se usan como rango y no como valor único.</text>
</svg>
