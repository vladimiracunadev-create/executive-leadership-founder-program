<title id="t-g140">Ficha visual de la clase 140: Adquisición digital y contenido</title>
<desc id="d-g140">Conceptos: intent; organic acquisition; paid acquisition; content asset; attribution. Método: definir audiencia e intención → seleccionar problemas y formatos → crear distribución orgánica/pagada → instrumentar conversiones → comparar CAC y calidad downstream.</desc>
