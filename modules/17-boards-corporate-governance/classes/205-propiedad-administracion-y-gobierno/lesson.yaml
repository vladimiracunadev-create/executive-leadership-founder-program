id: 205
part: 17
title: "Propiedad, administración y gobierno"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "separar propiedad, administración y supervisión para gobernar estrategia, riesgo y sucesión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir propiedad, gobierno y administración y sus funciones."
  - "Mapear a los propietarios, sus derechos y sus umbrales de decisión."
  - "Definir las materias reservadas y la frontera entre directorio y gerencia."
  - "Estimar los costos de agencia y diseñar mecanismos para reducirlos."
  - "Documentar los sombreros y conflictos cuando los roles coinciden."
deliverable: "board-or-executive-memo.md"
references:
  - "Michael C. Jensen & William H. Meckling — *Theory of the firm: Managerial behavior, agency costs and ownership structure*"
  - "Eugene F. Fama & Michael C. Jensen — *Separation of Ownership and Control*"
  - "Bob Tricker — *Corporate Governance*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "Biblioteca del Congreso Nacional de Chile — *LeyChile: sociedades anónimas (Ley 18.046) y su reglamento*"
limits:
  - "La separación formal no elimina las relaciones de poder: en empresas cerradas y startups los roles pueden coincidir y conviene documentar los sombreros, los conflictos y el proceso de decisión."
evidence_signals:
  - "propiedad y derechos mapeados"
  - "materias reservadas definidas"
  - "costos de agencia estimados"
  - "sombreros y conflictos documentados"
