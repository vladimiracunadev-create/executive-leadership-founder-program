<text x="48" y="568.48" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Derecho laboral es sensible a hechos y cambia. A agosto de 2026 la jornada máxima general ya está en 42 horas; Ley Karin y DS 44</text>
