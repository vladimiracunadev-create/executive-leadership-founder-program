<text x="705.1" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >transferencia a casos nuevos</text>
<rect x="28" y="502.36" width="164" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="515.36" r="3.5" fill="#1a7f37"/>
<text x="52" y="519.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >feedback incorporado</text>
<rect x="28" y="548.36" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="548.36" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="568.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="586.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Aprender más no siempre es la prioridad. Si la brecha es de práctica, incentivo, entorno o autoridad, otro curso puede aumentar</text>
<text x="48" y="603.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >conocimiento sin cambiar desempeño.</text>
