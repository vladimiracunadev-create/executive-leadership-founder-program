<text x="733.333" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Fuente y fecha de verificación.</text>
<rect x="28" y="275" width="984" height="43.25" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="297" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Una checklist completa hoy puede quedar obsoleta mañana: cada punto registra su fuente, la fecha de verificación y quién la actualiza.</text>
<text x="28" y="344.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Una simulación de revisión previa (due diligence) detecta brechas antes de que lo haga un tercero.</text>
