<title id="t-g254">Ficha visual de la clase 254: Persona natural y persona jurídica: decisiones iniciales</title>
<desc id="d-g254">Conceptos: persona natural; persona jurídica; limited liability; separate patrimony; governance. Método: mapear actividad y exposición → definir necesidad de socios y capital → comparar administración y costos → revisar responsabilidad y contratos → validar alternativa con fuentes y asesoría.</desc>
