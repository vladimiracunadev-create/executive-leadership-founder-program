id: 73
part: 06
title: "Proyecto, producto, operación y programa"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir proyecto, producto, operación y programa con sus criterios."
  - "Clasificar una iniciativa en uno de los tipos o en una combinación declarada."
  - "Elegir el método, el gobierno y la medida de éxito según el tipo."
  - "Reconocer los errores de gestión que nacen de una clasificación equivocada."
  - "Decidir cuándo agrupar proyectos en un programa y cuándo no."
deliverable: "operating-improvement-brief.md"
references:
  - "Project Management Institute — *A Guide to the Project Management Body of Knowledge (PMBOK Guide)*"
  - "Harold Kerzner — *Project Management*"
  - "Ken Schwaber & Jeff Sutherland — *The Scrum Guide*"
  - "Bent Flyvbjerg & Dan Gardner — *How Big Things Get Done*"
  - "Donella H. Meadows — *Thinking in Systems*"
limits:
  - "Las definiciones del PMI son convenciones útiles, pero las fronteras en la práctica son borrosas y las organizaciones usan los términos de maneras distintas."
evidence_signals:
  - "tipo de trabajo clasificado"
  - "resultado y dueño definidos"
  - "método acorde al tipo"
  - "ciclo de vida con cierre"
