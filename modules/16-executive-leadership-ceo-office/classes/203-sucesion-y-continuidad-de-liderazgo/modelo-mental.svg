<rect x="28" y="292.25" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="314.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La sucesión no es un nombre en un sobre: es un sistema que mantiene opciones, criterios y desarrollo sin congelar la estrategia ni</text>
<text x="44" y="331.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >anunciar un heredero antes de tiempo.</text>
<text x="28" y="378.75" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La confidencialidad se gradúa: el directorio ve todo; el resto, lo necesario para cumplir su función.</text>
