id: 273
part: 22
title: "Adquisiciones como vía de crecimiento"
duration_minutes: 150
level: "Etapa 6 — Business Owner"
outcome: "reducir dependencia del fundador mediante sistemas, líderes, controles y gobierno proporcional"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Formular una tesis de adquisición con la fuente de valor y sus límites."
  - "Filtrar candidatos con criterios explícitos."
  - "Normalizar los resultados del objetivo y detectar dependencias."
  - "Estimar un rango de precio y la capacidad de servicio de la deuda con supuestos explícitos."
  - "Planificar la integración y diseñar condiciones que transfieran riesgo."
deliverable: "strategy-memo.md"
references:
  - "Philippe C. Haspeslagh & David B. Jemison — *Managing Acquisitions: Creating Value Through Corporate Renewal*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Elad Gil — *High Growth Handbook*"
  - "Jay R. Galbraith — *Designing Organizations*"
  - "Verne Harnish — *Scaling Up*"
  - "Robert I. Sutton & Huggy Rao — *Scaling Up Excellence*"
  - "Michael E. Gerber — *The E-Myth Revisited*"
limits:
  - "Comprar flujo histórico no garantiza que sobreviva al cambio de propietario; las valoraciones por múltiplos son referencias, no verdades; la debida diligencia puede revelar problemas que cambian o frenan la operación."
evidence_signals:
