<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620.24" width="1040" role="img" aria-labelledby="t-g38 d-g38" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g38">Ficha visual de la clase 038: Autorregulación y respuesta bajo presión</title>
<desc id="d-g38">Conceptos: activación; impulso; pausa; reencuadre; regulación. Método: reconocer señal corporal y trigger → nombrar emoción y objetivo → crear pausa física o temporal → elegir reencuadre y respuesta → revisar después si la respuesta produjo el resultado.</desc>
<defs><marker id="p-g38" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="620.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 038 · Autorregulación y respuesta bajo presión</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 03 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >activación</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >nivel fisiológico y emocional que modifica atención y</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >conducta</text>
<circle cx="38" cy="184.12" r="5" fill="#1a7f37"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >impulso</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >acción automática favorecida por el estado emocional</text>
<circle cx="38" cy="242.12" r="5" fill="#1a7f37"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >pausa</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >interrupción breve que permite volver a elegir</text>
<circle cx="38" cy="300.12" r="5" fill="#1a7f37"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >reencuadre</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >interpretación alternativa que cambia respuesta posible</text>
<circle cx="38" cy="358.12" r="5" fill="#1a7f37"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >regulación</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >modificación deliberada de intensidad, duración o</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >expresión emocional</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="486.0" cy="120" r="11" fill="#1a7f37"/>
<text x="486" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="504" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >reconocer señal</text>
<text x="504" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >corporal y trigger</text>
<rect x="658" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="674.0" cy="120" r="11" fill="#1a7f37"/>
