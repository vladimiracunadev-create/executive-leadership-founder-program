id: 52
part: 04
title: "Confianza y vulnerabilidad profesional"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "crear equipos con propósito, coordinación, confianza, aprendizaje y accountability"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Describir las cinco disfunciones de Lencioni y su relación de dependencia."
  - "Definir confianza basada en vulnerabilidad y distinguirla de confianza predictiva."
  - "Distinguir vulnerabilidad profesional de sobreexposición personal."
  - "Practicar conductas de líder que construyen confianza: admitir errores, pedir ayuda, reconocer límites."
  - "Diseñar ejercicios de equipo que fortalezcan la confianza sin forzar la intimidad."
deliverable: "risk-governance-brief.md"
references:
  - "Patrick Lencioni — *The Five Dysfunctions of a Team*"
  - "Roger C. Mayer, James H. Davis & F. David Schoorman — *An Integrative Model of Organizational Trust*"
  - "Amy C. Edmondson — *Psychological Safety and Learning Behavior in Work Teams*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "J. Richard Hackman — *Leading Teams*"
limits:
  - "El modelo de Lencioni es una fábula de gestión, sin validación empírica independiente de su estructura de cinco niveles."
evidence_signals:
  - "nivel de la pirámide que falla"
  - "errores admitidos por el líder"
  - "ejercicios voluntarios y relevantes"
  - "respuesta a una vulnerabilidad"
