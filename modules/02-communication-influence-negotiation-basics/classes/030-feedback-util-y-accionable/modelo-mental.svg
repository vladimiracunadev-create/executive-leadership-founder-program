<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 648.48" width="1040" role="img" aria-labelledby="t-g30 d-g30" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g30">Ficha visual de la clase 030: Feedback útil y accionable</title>
<desc id="d-g30">Conceptos: observación; impacto; feedforward; especificidad; severidad. Método: preparar hechos y propósito → describir conducta concreta → explicar impacto sin leer mente → escuchar contexto y comprobar comprensión → acordar conducta futura y seguimiento.</desc>
<defs><marker id="p-g30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="648.48" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
