<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >evento de escala o riesgo que justifica mayor</text>
<text x="54" y="411.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >formalización</text>
