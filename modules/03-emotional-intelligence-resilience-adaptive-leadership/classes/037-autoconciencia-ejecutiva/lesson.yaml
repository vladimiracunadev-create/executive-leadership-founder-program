id: 37
part: 03
title: "Autoconciencia ejecutiva"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir autoconciencia emocional, autoevaluación exacta y confianza en uno mismo según el modelo de Goleman."
  - "Reconocer una emoción mientras ocurre y nombrarla con precisión."
  - "Identificar tus puntos ciegos y las fuentes de información que pueden revelarlos."
  - "Reconocer sesgos que distorsionan la autoevaluación, como el exceso de confianza."
  - "Diseñar un mecanismo regular para obtener feedback sobre tu efecto en otros."
deliverable: "risk-governance-brief.md"
references:
  - "Daniel Goleman — *Emotional Intelligence*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Douglas Stone & Sheila Heen — *Thanks for the Feedback*"
  - "Daniel Kahneman — *Thinking, Fast and Slow*"
  - "Gary Klein — *Sources of Power*"
limits:
  - "El modelo de Goleman es de uso muy extendido, pero algunas afirmaciones sobre el peso de la inteligencia emocional en el éxito profesional han sido objeto de debate, y los instrumentos de medición varían en calidad."
evidence_signals:
  - "emoción nombrada en el momento"
  - "feedback de varias fuentes"
  - "patrón repetido por más de una persona"
  - "conducta elegida para cambiar"
