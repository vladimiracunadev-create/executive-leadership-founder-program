<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g100 d-g100" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g100">Ficha visual de la clase 100: KPI y métricas operativas</title>
<desc id="d-g100">Conceptos: metric; KPI; definition; denominator; owner. Método: empezar por decisión → definir métrica y fórmula → validar fuente y población → establecer baseline, target y frecuencia → documentar qué acción activa cada rango.</desc>
<defs><marker id="p-g100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
