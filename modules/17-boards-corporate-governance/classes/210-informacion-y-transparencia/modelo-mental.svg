<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616.48" width="1040" role="img" aria-labelledby="t-g210 d-g210" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g210">Ficha visual de la clase 210: Información y transparencia</title>
<desc id="d-g210">Conceptos: materiality; disclosure; information asymmetry; integrated reporting; selective disclosure. Método: definir audiencia y materialidad → seleccionar KPI y riesgos → explicar variaciones y supuestos → asegurar consistencia y controles → publicar o escalar según obligación.</desc>
<defs><marker id="p-g210" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="616.48" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#cf222e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 210 · Información y transparencia</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 17 · Alta dirección y gobierno</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#cf222e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >materiality</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >importancia suficiente para influir en una decisión</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >razonable</text>
<circle cx="38" cy="184.12" r="5" fill="#cf222e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >disclosure</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >comunicación formal de información relevante</text>
<circle cx="38" cy="242.12" r="5" fill="#cf222e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >information asymmetry</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >diferencia de información entre management board y</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >propietarios</text>
<circle cx="38" cy="314.24" r="5" fill="#cf222e"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >integrated reporting</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >visión conectada de estrategia performance riesgos y</text>
<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >recursos</text>
<circle cx="38" cy="386.36" r="5" fill="#cf222e"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >selective disclosure</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >entrega desigual de información que puede crear</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >problemas legales o de confianza</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<circle cx="486.0" cy="120" r="11" fill="#cf222e"/>
<text x="486" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="504" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >definir audiencia</text>
<text x="504" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >y materialidad</text>
<rect x="658" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<circle cx="674.0" cy="120" r="11" fill="#cf222e"/>
<text x="674" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="692" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >seleccionar KPI y</text>
<text x="692" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >riesgos</text>
<rect x="846" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<circle cx="862.0" cy="120" r="11" fill="#cf222e"/>
<text x="862" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="880" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >explicar</text>
<text x="880" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >variaciones y</text>
<text x="880" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >supuestos</text>
<rect x="846" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<circle cx="862.0" cy="240" r="11" fill="#cf222e"/>
<text x="862" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="880" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >asegurar</text>
<text x="880" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >consistencia y</text>
<text x="880" y="276.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >controles</text>
<rect x="658" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<circle cx="674.0" cy="240" r="11" fill="#cf222e"/>
<text x="674" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="692" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >publicar o escalar</text>
<text x="692" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >según obligación</text>
<path d="M638,139 L656,139" stroke="#cf222e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g210)"/>
<path d="M826,139 L844,139" stroke="#cf222e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g210)"/>
<path d="M929,176 L929,222" stroke="#cf222e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g210)"/>
<path d="M844,259 L826,259" stroke="#cf222e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g210)"/>
