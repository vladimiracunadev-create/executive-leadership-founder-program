id: 89
part: 07
title: "Cuellos de botella y teoría de restricciones"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "operar procesos end-to-end con capacidad, calidad, continuidad y mejora"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Identificar la restricción de un proceso con datos de cola, utilización y flujo."
  - "Explicar por qué mejorar un recurso que no es restricción no mejora el resultado."
  - "Aplicar los cinco pasos de enfoque a un caso."
  - "Distinguir una restricción física de una de política o de mercado."
  - "Decidir cuándo conviene elevar la restricción y cuándo explotarla mejor."
deliverable: "risk-governance-brief.md"
references:
  - "Eliyahu M. Goldratt & Jeff Cox — *The Goal*"
  - "John D. C. Little — *A Proof for the Queuing Formula: L = λW*"
  - "James P. Womack & Daniel T. Jones — *Lean Thinking*"
  - "Nigel Slack & Alistair Brandon-Jones — *Operations Management*"
  - "W. Edwards Deming — *Out of the Crisis*"
limits:
  - "La teoría supone que el resultado depende de un punto dominante; con muchas restricciones interactuando o con variabilidad extrema, el análisis es más complejo."
evidence_signals:
  - "restricción identificada con datos"
  - "explotar antes de invertir"
  - "resto subordinado al ritmo"
