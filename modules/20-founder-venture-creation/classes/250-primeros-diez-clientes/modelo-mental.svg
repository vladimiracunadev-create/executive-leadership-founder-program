<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >descripción de cuentas con mayor probabilidad de valor</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >y fit</text>
