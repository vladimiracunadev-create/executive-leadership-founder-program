id: 243
part: 20
title: "Customer discovery"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Formular hipótesis de cliente y de problema que se puedan refutar."
  - "Conducir entrevistas sobre episodios recientes sin inducir respuestas."
  - "Distinguir comprador, usuario e influenciador, y mapear el proceso de compra."
  - "Registrar y analizar la evidencia por tipo y por fuerza."
  - "Decidir con criterios previos si continuar, cambiar de segmento o descartar."
deliverable: "product-evidence-brief.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Rob Fitzpatrick — *The Mom Test*"
  - "Teresa Torres — *Continuous Discovery Habits*"
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
  - "Neil Rackham — *SPIN Selling*"
limits:
  - "Entrevistar hasta oír repetición no prueba mercado: el descubrimiento cualitativo debe complementarse con datos de demanda, tamaño y experimentos de compromiso."
evidence_signals:
  - "preguntas sobre conducta pasada"
  - "sesgos de cortesía controlados"
  - "patrones sintetizados"
  - "decisión de seguir o detener"
