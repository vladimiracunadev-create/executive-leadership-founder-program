<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456.81" width="1040" role="img" aria-labelledby="t-s195 d-s195" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s195">Clase 195 · Equipo ejecutivo frente a defensores de función</title>
<desc id="d-s195">Rasgos de un equipo ejecutivo que decide por la empresa frente a uno compuesto por defensores de sus funciones.</desc>
<defs><marker id="p-s195" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="456.81" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 195 · Equipo ejecutivo frente a defensores de función</text>
<text x="1012" y="43" font-size="11" font-weight="400" fill="#59636e" text-anchor="end" >Lencioni · Wageman et al. (2008) · Hackman (2002)</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">EQUIPO EJECUTIVO</text>
<rect x="28" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Mandato colectivo claro</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Trabaja en asuntos de la empresa y no repite informes.</text>
<rect x="28" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="177.25" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Conflicto sobre ideas</text>
<text x="46" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Discute con franqueza y se compromete después.</text>
<rect x="28" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.7" />
<rect x="28.0" y="250.5" width="6" height="63.25" rx="3" fill="#8250df"/>
<text x="46" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Compromisos cruzados</text>
<text x="46" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Cada miembro responde también por el resultado de los demás.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">DEFENSORES DE FUNCIÓN</text>
<rect x="532" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="63.25" rx="3" fill="#cf222e"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Cada uno defiende su área</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se negocian recursos y se evitan conflictos.</text>
<rect x="532" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="532.0" y="177.25" width="6" height="63.25" rx="3" fill="#bc4c00"/>
<text x="550" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Decisiones que se reabren</text>
<text x="550" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se acepta en la sala y se discute después.</text>
<rect x="532" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="532.0" y="250.5" width="6" height="63.25" rx="3" fill="#59636e"/>
<text x="550" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Reuniones de informe</text>
<text x="550" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se comparte estado y no se decide.</text>
<rect x="28" y="329.75" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="351.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >No todas las decisiones deben ser colectivas: el equipo reserva su tiempo para asuntos de la empresa y deja la responsabilidad</text>
<text x="44" y="369" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >funcional en cada dueño.</text>
<text x="28" y="416.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La confianza y el conflicto constructivo se observan en conductas: quién discrepa, quién cambia de opinión y qué se cumple.</text>
</svg>
