<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 488.06" width="1040" role="img" aria-labelledby="t-s181 d-s181" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s181">Clase 181 · De los objetivos al riesgo residual</title>
<desc id="d-s181">Cinco pasos de la gestión integrada de riesgos: objetivos y contexto, escenarios, exposición inherente, respuesta y controles, y riesgo residual.</desc>
<defs><marker id="p-s181" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="488.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 181 · De los objetivos al riesgo residual</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >COSO ERM · ISO 31000 · Kaplan &amp; Garrick (1981)</text>
<rect x="28" y="96" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<circle cx="52.0" cy="122.0" r="13" fill="#0969da"/>
<text x="52" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="72" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Objetivos y contexto</text>
<text x="44" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Qué se quiere lograr y qué</text>
<text x="44" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >podría impedirlo.</text>
<path d="M260.5,144.25 L276.5,144.25" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s181)"/>
<rect x="279.5" y="96" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<circle cx="303.5" cy="122.0" r="13" fill="#1a7f37"/>
<text x="303.5" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="323.5" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Escenarios de riesgo</text>
<text x="295.5" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Eventos concretos con causa,</text>
<text x="295.5" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >consecuencia y dueño.</text>
<path d="M512,144.25 L528,144.25" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s181)"/>
<rect x="531" y="96" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<circle cx="555.0" cy="122.0" r="13" fill="#bc4c00"/>
<text x="555" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="575" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Exposición inherente</text>
<text x="547" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Probabilidad e impacto antes</text>
<text x="547" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >de controles.</text>
<path d="M763.5,144.25 L779.5,144.25" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s181)"/>
<rect x="782.5" y="96" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<circle cx="806.5" cy="122.0" r="13" fill="#8250df"/>
<text x="806.5" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="826.5" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Respuesta y controles</text>
<text x="798.5" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Evitar, reducir, transferir</text>
<text x="798.5" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >o aceptar con criterio.</text>
<path d="M897.25,194.5 V206.5 H142.75 V224.5" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#p-s181)"/>
<rect x="28" y="226.5" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<circle cx="52.0" cy="252.5" r="13" fill="#cf222e"/>
<text x="52" y="257.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="72" y="250.5" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Residual y agregación</text>
<text x="44" y="282.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Lo que queda y cómo se suma</text>
<text x="44" y="299.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >entre áreas.</text>
<path d="M142.75,325.0 V345.0 H142.75 V196.5" stroke="#59636e" stroke-width="2" fill="none" stroke-dasharray="7 6" marker-end="url(#p-s181)"/>
<text x="142.75" y="339" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >lo observado reabre los escenarios</text>
<rect x="28" y="361" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="383" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El riesgo se define por su efecto sobre los objetivos, no como una lista de peligros. Un registro de riesgos sin objetivos, dueños y</text>
<text x="44" y="400.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >escenarios es un inventario, no una gestión.</text>
<text x="28" y="447.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las matrices de colores simplifican; para riesgos materiales se complementan con escenarios y magnitudes económicas.</text>
</svg>
