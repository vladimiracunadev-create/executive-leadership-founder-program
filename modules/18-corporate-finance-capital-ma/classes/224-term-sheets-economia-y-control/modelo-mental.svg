<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g224 d-g224" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g224">Ficha visual de la clase 224: Term sheets: economía y control</title>
<desc id="d-g224">Conceptos: liquidation preference; participation; anti-dilution; protective provision; vesting. Método: separar economics de control → modelar waterfall en exits → revisar dilution protections → mapear veto y board rights → negociar conjunto y escenarios.</desc>
<defs><marker id="p-g224" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#cf222e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 224 · Term sheets: economía y control</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 18 · Alta dirección y gobierno</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#cf222e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >liquidation preference</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >derecho de inversor a cobrar antes o bajo reglas</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >específicas en liquidez</text>
<circle cx="38" cy="184.12" r="5" fill="#cf222e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >participation</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >posible derecho a cobrar preferencia y luego participar</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >en remanente</text>
<circle cx="38" cy="256.24" r="5" fill="#cf222e"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >anti-dilution</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ajuste frente a futuras emisiones a menor precio</text>
<circle cx="38" cy="314.24" r="5" fill="#cf222e"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >protective provision</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >materia que requiere consentimiento especial</text>
<circle cx="38" cy="372.24" r="5" fill="#cf222e"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >vesting</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >adquisición gradual de derechos sobre equity</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#cf222e" stroke-width="2.5" stroke-opacity="0.35"/>
