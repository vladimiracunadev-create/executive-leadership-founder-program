<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 488.06" width="1040" role="img" aria-labelledby="t-s273 d-s273" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s273">Clase 273 · Comprar una empresa con método</title>
<desc id="d-s273">Cinco pasos de una adquisición: tesis, filtro de objetivos, ganancias normalizadas y dependencias, financiamiento y términos, e integración de cien días.</desc>
<defs><marker id="p-s273" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
