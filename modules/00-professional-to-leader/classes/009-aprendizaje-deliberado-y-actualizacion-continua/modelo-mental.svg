<text x="610" y="240" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >diseñar práctica con dificultad</text>
<text x="628" y="257.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >adecuada</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >obtener feedback y corregir</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >probar transferencia en un caso</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >distinto</text>
<text x="28" y="458.36" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="470.36" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="483.36" r="3.5" fill="#1a7f37"/>
<text x="52" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >errores por intento</text>
<rect x="195.1" y="470.36" width="246.8" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="208.1" cy="483.36" r="3.5" fill="#1a7f37"/>
<text x="219.1" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >tiempo hasta criterio de dominio</text>
<rect x="451.9" y="470.36" width="219.2" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="464.9" cy="483.36" r="3.5" fill="#1a7f37"/>
<text x="475.9" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >retención después de semanas</text>
<rect x="681.1" y="470.36" width="219.2" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
