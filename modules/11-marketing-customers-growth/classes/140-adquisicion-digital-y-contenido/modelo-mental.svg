<text x="44" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Pagados</text>
<circle cx="50.0" cy="154" r="4" fill="#bc4c00"/>
<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Publicidad, patrocinios.</text>
<circle cx="50.0" cy="181.25" r="4" fill="#bc4c00"/>
<text x="64" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Rapidez y escala controlable.</text>
<circle cx="50.0" cy="208.5" r="4" fill="#bc4c00"/>
<text x="64" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Riesgo: el resultado desaparece al</text>
<text x="64" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >dejar de pagar.</text>
<rect x="362.667" y="96" width="314.667" height="180.25" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M362.6666666666667,136 V108 a12,12 0 0 1 12,-12 H665.3333333333334 a12,12 0 0 1 12,12 V136 Z" fill="#0969da"/>
<text x="378.667" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Propios</text>
<circle cx="384.6666666666667" cy="154" r="4" fill="#0969da"/>
<text x="398.667" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Sitio, correo, aplicación, contenido.</text>
<circle cx="384.6666666666667" cy="181.25" r="4" fill="#0969da"/>
<text x="398.667" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Activo acumulable y datos propios.</text>
<circle cx="384.6666666666667" cy="208.5" r="4" fill="#0969da"/>
<text x="398.667" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Riesgo: lento y requiere constancia.</text>
<rect x="697.333" y="96" width="314.667" height="180.25" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M697.3333333333334,136 V108 a12,12 0 0 1 12,-12 H1000.0 a12,12 0 0 1 12,12 V136 Z" fill="#1a7f37"/>
<text x="713.333" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Ganados</text>
<circle cx="719.3333333333334" cy="154" r="4" fill="#1a7f37"/>
<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Prensa, recomendaciones, comunidades.</text>
<circle cx="719.3333333333334" cy="181.25" r="4" fill="#1a7f37"/>
<text x="733.333" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Credibilidad alta y bajo costo</text>
<text x="733.333" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >directo.</text>
<circle cx="719.3333333333334" cy="225.75" r="4" fill="#1a7f37"/>
<text x="733.333" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Riesgo: poco control y poco</text>
<text x="733.333" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >predecible.</text>
<rect x="28" y="292.25" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="314.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El contenido útil responde preguntas reales del cliente en el momento en que las tiene. Se mide por canal el costo por cliente y se</text>
<text x="44" y="331.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >invierte donde el retorno sea sostenible.</text>
<text x="28" y="378.75" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las plataformas cambian sus reglas y algoritmos: depender de un solo canal de adquisición es un riesgo.</text>
</svg>
