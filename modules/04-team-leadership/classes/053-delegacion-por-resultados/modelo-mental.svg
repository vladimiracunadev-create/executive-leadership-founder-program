<text x="281.2" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >checkpoints extraordinarios</text>
<rect x="479.5" y="484.48" width="88.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="492.5" cy="497.48" r="3.5" fill="#0969da"/>
<text x="503.5" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >retrabajo</text>
<rect x="577.6" y="484.48" width="212.3" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="590.6" cy="497.48" r="3.5" fill="#0969da"/>
<text x="601.6" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >tiempo del manager liberado</text>
<rect x="799.9" y="484.48" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="812.9" cy="497.48" r="3.5" fill="#0969da"/>
<text x="823.9" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >autonomía creciente</text>
<rect x="28" y="530.48" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="530.48" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="550.48" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="568.48" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Delegar no es apropiado cuando falta capacidad crítica, cuando la ley exige una decisión específica del cargo o cuando el riesgo no</text>
<text x="48" y="585.73" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >puede tolerar aprendizaje sin supervisión.</text>
