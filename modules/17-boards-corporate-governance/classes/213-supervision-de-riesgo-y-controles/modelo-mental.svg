<title id="t-g213">Ficha visual de la clase 213: Supervisión de riesgo y controles</title>
<desc id="d-g213">Conceptos: risk oversight; critical control; assurance; KRI; three lines. Método: alinear risk appetite con estrategia → seleccionar top risks y scenarios → identificar critical controls → obtener assurance independiente → seguir breaches y remediation.</desc>
