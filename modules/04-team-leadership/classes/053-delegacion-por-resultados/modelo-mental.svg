<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >comprobar recursos y competencia</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#0969da"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#0969da" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >definir checkpoints por riesgo</text>
