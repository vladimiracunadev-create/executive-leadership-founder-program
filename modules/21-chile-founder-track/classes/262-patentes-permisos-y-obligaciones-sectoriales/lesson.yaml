id: 262
part: 21
title: "Patentes, permisos y obligaciones sectoriales"
duration_minutes: 150
level: "Etapa 6 — Founder en Chile"
outcome: "formalizar y operar una empresa chilena con comprensión ejecutiva de obligaciones y escalamiento profesional"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir municipal patent de sector permit mediante evidencia observable."
  - "Aplicar la secuencia: describir actividad y localización → identificar autoridades competentes → mapear permisos y orden → obtener evidencia antes de operar → controlar renovaciones y cambios."
  - "Interpretar permit coverage, days to approval, renewal compliance sin atribuir causalidad automática."
  - "Resolver el caso de patentes, permisos y obligaciones sectoriales con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Registro de Empresas y Sociedades (Chile) — *Portal y documentación oficial*"
  - "Servicio de Impuestos Internos (Chile) — *Guías, normativa y servicios oficiales*"
  - "Dirección del Trabajo (Chile) — *Normativa y orientación oficial*"
  - "Corporación de Fomento de la Producción (Chile) — *Programas, instrumentos y apoyo empresarial*"
  - "Michael Armstrong & Stephen Taylor — *Armstrong's Handbook of Human Resource Management Practice*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "ChileAtiende y municipalidad competente — permisos y patente según giro; verificar autoridad específica."
  - "SII Educa — formalización y permisos: <https://www.sii.cl/siieduca/aprende-con-nosotros/inicio-de-actividades-y-formalizacion-de-un-negocio.html>."
limits:
  - "No existe un listado único para todas las empresas. Municipio, actividad y sector cambian requisitos; consulta autoridades oficiales antes de firmar inversiones irreversibles."
evidence_signals:
  - "permit coverage"
  - "days to approval"
  - "renewal compliance"
  - "operating restrictions"
  - "inspection findings"
