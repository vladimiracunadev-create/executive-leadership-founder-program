<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >delegation</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >transferencia de responsabilidad y autoridad para</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >decidir o ejecutar</text>
<circle cx="38" cy="184.12" r="5" fill="#59636e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >guardrail</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >límite que define espacio seguro de autonomía</text>
<circle cx="38" cy="242.12" r="5" fill="#59636e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >management by exception</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >intervención superior solo cuando se exceden</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tolerancias</text>
<circle cx="38" cy="314.24" r="5" fill="#59636e"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >context</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >información de propósito constraints y economics</text>
<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >necesaria para decidir</text>
<circle cx="38" cy="386.36" r="5" fill="#59636e"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >escalation trigger</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >condición que obliga a elevar una decisión</text>
