<title id="t-g168">Ficha visual de la clase 168: Capstone: strategy memo</title>
<desc id="d-g168">Conceptos: strategy memo; strategic thesis; assumption; resource commitment; strategic control. Método: redactar diagnóstico basado en evidencia → proponer choices y no-opciones → explicar mecanismo de ventaja → asignar recursos y acciones → definir riesgos signposts y revisión.</desc>
