id: 126
part: 10
title: "Pipeline y forecast comercial"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "construir ingresos mediante un proceso comercial medible y negociación disciplinada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir pipeline de coverage mediante evidencia observable."
  - "Aplicar la secuencia: limpiar stages por exit criteria → segmentar commit/best case/pipeline → usar historia y deal evidence → revisar aging y slippage → actualizar forecast sin proteger ego."
  - "Interpretar forecast accuracy, pipeline coverage, stage aging sin atribuir causalidad automática."
  - "Resolver el caso de pipeline y forecast comercial con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "commercial-decision-brief.md"
references:
  - "Neil Rackham — *SPIN Selling*"
  - "Matthew Dixon & Brent Adamson — *The Challenger Sale*"
  - "Aaron Ross & Marylou Tyler — *Predictable Revenue*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
  - "Deepak Malhotra & Max H. Bazerman — *Negotiation Genius*"
  - "Chris Voss & Tahl Raz — *Never Split the Difference*"
limits:
  - "Coverage no es universal: varía por win rate, ciclo y mix. No copies un ratio de otra empresa sin backtest de tu propio funnel."
evidence_signals:
  - "forecast accuracy"
  - "pipeline coverage"
  - "stage aging"
  - "slippage"
  - "win rate"
