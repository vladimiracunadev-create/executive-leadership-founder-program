<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >retirar founder gradualmente y</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >medir performance</text>
<text x="28" y="458.36" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
