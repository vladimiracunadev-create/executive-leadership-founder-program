<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >metric</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >medida cuantitativa de una propiedad</text>
<circle cx="38" cy="170" r="5" fill="#8250df"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >KPI</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >indicador material para una decisión o resultado clave</text>
<circle cx="38" cy="228" r="5" fill="#8250df"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >definition</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >regla exacta de cálculo, población y periodo</text>
<circle cx="38" cy="286" r="5" fill="#8250df"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >denominator</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >base que hace comparables tasas y ratios</text>
<circle cx="38" cy="344" r="5" fill="#8250df"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >owner</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >rol responsable de calidad y uso del indicador</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#8250df" stroke-width="2.5" stroke-opacity="0.35"/>
