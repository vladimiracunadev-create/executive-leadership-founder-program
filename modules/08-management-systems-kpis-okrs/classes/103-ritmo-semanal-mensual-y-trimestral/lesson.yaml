id: 103
part: 08
title: "Ritmo semanal, mensual y trimestral"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "dirigir mediante outcomes, métricas, revisiones y asignación explícita de recursos"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Asignar a cada frecuencia un propósito, un insumo y una decisión."
  - "Diseñar agendas que prioricen decisiones sobre informes."
  - "Calcular el costo del tiempo de reunión y compararlo con su valor."
  - "Coordinar el ritmo de equipo, de área y de empresa."
  - "Detectar reuniones redundantes y proponer su reemplazo o eliminación."
deliverable: "leadership-decision-brief.md"
references:
  - "Andrew S. Grove — *High Output Management*"
  - "Larry Bossidy & Ram Charan — *Execution*"
  - "Michael C. Mankins & Eric Garton — *Time, Talent, Energy*"
  - "Robert S. Kaplan & David P. Norton — *Strategy Maps*"
  - "John Doerr — *Measure What Matters*"
limits:
  - "La frecuencia ideal depende del ritmo del negocio y de su incertidumbre; los ejemplos son ilustrativos."
evidence_signals:
  - "propósito y decisión por ritmo"
  - "costo del tiempo directivo calculado"
  - "insumos previos acordados"
  - "reuniones sin decisión eliminadas"
