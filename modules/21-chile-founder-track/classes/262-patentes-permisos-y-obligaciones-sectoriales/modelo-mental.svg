<path d="M826,139 L844,139" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g262)"/>
<path d="M929,176 L929,222" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g262)"/>
<path d="M844,259 L826,259" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g262)"/>
