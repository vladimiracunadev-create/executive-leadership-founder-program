id: 168
part: 13
title: "Capstone: strategy memo"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "formular y ejecutar elecciones coherentes sobre dónde jugar y cómo ganar"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Estructurar un memo de estrategia con decisión, diagnóstico, política, acciones y renuncias."
  - "Sustentar cada afirmación con evidencia y distinguir hechos de supuestos."
  - "Evaluar alternativas con escenarios y valor esperado."
  - "Definir supuestos críticos, señales, umbrales y criterios de detención."
  - "Someter el memo a una revisión crítica y mejorarlo."
deliverable: "leadership-decision-brief.md"
references:
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
  - "A.G. Lafley & Roger L. Martin — *Playing to Win*"
  - "Michael E. Porter — *Competitive Strategy*"
  - "Hamilton Helmer — *7 Powers*"
  - "Peter Schwartz — *The Art of the Long View*"
limits:
  - "El memo es tan bueno como su diagnóstico y sus datos."
evidence_signals:
  - "decisión solicitada al inicio"
  - "alternativas probadas en escenarios"
  - "renuncias y supuestos explícitos"
  - "revisión crítica con premortem"
