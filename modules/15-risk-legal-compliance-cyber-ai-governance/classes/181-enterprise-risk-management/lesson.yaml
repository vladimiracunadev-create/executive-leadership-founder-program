id: 181
part: 15
title: "Enterprise Risk Management"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "gobernar riesgo, legal, cumplimiento, ciberseguridad, datos e IA de forma integrada"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir el riesgo en relación con los objetivos y distinguir riesgo, incidente y problema."
  - "Describir un escenario de riesgo con causa, evento, consecuencia, dueño y estimación."
  - "Calcular exposición inherente y residual con supuestos explícitos."
  - "Elegir una respuesta (evitar, reducir, transferir o aceptar) comparando costo y beneficio."
  - "Agregar riesgos entre áreas reconociendo correlaciones y colas."
deliverable: "leadership-decision-brief.md"
references:
  - "COSO — *Enterprise Risk Management—Integrating with Strategy and Performance*"
  - "ISO — *ISO 31000 Risk management*"
  - "Stanley Kaplan & B. John Garrick — *On The Quantitative Definition of Risk*"
  - "John C. Hull — *Risk Management and Financial Institutions*"
  - "Nassim Nicholas Taleb — *Antifragile*"
  - "Paul Slovic — *Perception of Risk*"
limits:
  - "Las probabilidades y los impactos son estimaciones inciertas y sesgadas por la percepción."
evidence_signals:
  - "riesgo ligado a objetivos"
  - "escenarios con causa y consecuencia"
  - "exposición inherente y residual calculadas"
  - "colas y correlaciones revisadas"
