id: 152
part: 12
title: "Priorización y costo de oportunidad"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "convertir problemas de clientes en productos validados y outcomes medibles"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir priority de opportunity cost mediante evidencia observable."
  - "Aplicar la secuencia: definir criterio ligado a estrategia → estimar valor riesgo y costo → hacer explícita confianza → comparar cartera y dependencias → decidir y registrar qué se posterga."
  - "Interpretar resource allocation, cost of delay, confidence score sin atribuir causalidad automática."
  - "Resolver el caso de priorización y costo de oportunidad con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Marty Cagan — *Inspired*"
  - "Teresa Torres — *Continuous Discovery Habits*"
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
  - "Dan Olsen — *The Lean Product Playbook*"
  - "Alexander Osterwalder et al. — *Value Proposition Design*"
  - "David J. Bland & Alexander Osterwalder — *Testing Business Ideas*"
limits:
  - "Una fórmula produce precisión aparente si sus entradas son opiniones. Usa scoring como conversación estructurada, no como algoritmo de autoridad; revisa sensibilidad a supuestos."
evidence_signals:
  - "resource allocation"
  - "cost of delay"
  - "confidence score"
  - "dependency load"
  - "outcome impact"
