<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >conciliar financiamiento y saldo final</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
