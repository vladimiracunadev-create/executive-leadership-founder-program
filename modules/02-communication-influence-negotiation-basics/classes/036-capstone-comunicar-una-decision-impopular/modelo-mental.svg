<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 648.48" width="1040" role="img" aria-labelledby="t-g36 d-g36" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g36">Ficha visual de la clase 036: Capstone: comunicar una decisión impopular</title>
<desc id="d-g36">Conceptos: decisión impopular; criterio; impacto humano; Q&amp;A; consistencia. Método: preparar razones y alternativas consideradas → nombrar decisión temprano → explicar criterio y límites → reconocer impacto sin falsa promesa → abrir preguntas y documentar seguimiento.</desc>
<defs><marker id="p-g36" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
