<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g284 d-g284" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g284">Ficha visual de la clase 284: Runway personal y empresarial</title>
<desc id="d-g284">Conceptos: personal runway; business runway; burn rate; cash floor; downside scenario. Método: separar personal y empresa → calcular gastos y burn → definir cash floors → construir base y downside → ligar runway a acciones y trigger dates.</desc>
<defs><marker id="p-g284" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
