<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" width="1040" role="img" aria-labelledby="t-044 d-044" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-044">Dar sentido a una situación incierta mientras se actúa</title>
<desc id="d-044">Ciclo de construcción de sentido: notar señales, construir un relato plausible, actuar de forma acotada y corregir; con las siete propiedades que describe Weick.</desc>
<defs><marker id="p-044" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="590" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 044 · Liderar cuando no hay certeza</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Weick (1995) · Klein (1999)</text>
<rect x="28" y="92" width="232" height="130" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<circle cx="52" cy="118" r="13" fill="#0969da"/>
<text x="52" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="74" y="123" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Notar señales</text>
<text x="44" y="150" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Extraer datos del entorno,</text>
<text x="44" y="167.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >incluidos los que no</text>
<text x="44" y="184.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >encajan.</text>
<path d="M263,157 L281,157" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-044)"/>
<rect x="284" y="92" width="232" height="130" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<circle cx="308" cy="118" r="13" fill="#8250df"/>
<text x="308" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="330" y="123" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Construir un relato plausible</text>
<text x="300" y="150" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Una explicación suficiente</text>
<text x="300" y="167.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >para actuar, no una verdad</text>
<text x="300" y="184.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >definitiva.</text>
<path d="M519,157 L537,157" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-044)"/>
<rect x="540" y="92" width="232" height="130" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<circle cx="564" cy="118" r="13" fill="#1a7f37"/>
<text x="564" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="586" y="123" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Actuar de forma acotada</text>
<text x="556" y="150" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Una acción pequeña y</text>
<text x="556" y="167.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >reversible que revele más.</text>
<path d="M775,157 L793,157" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-044)"/>
<rect x="796" y="92" width="232" height="130" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<circle cx="820" cy="118" r="13" fill="#bc4c00"/>
<text x="820" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="842" y="123" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Corregir con lo que se ve</text>
<text x="812" y="150" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Revisar el relato con la</text>
<text x="812" y="167.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >respuesta del entorno.</text>
<path d="M912.0,224 V250 H144.0 V226" stroke="#59636e" stroke-width="2" fill="none" stroke-dasharray="7 6" marker-end="url(#p-044)"/>
<text x="520" y="270" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >se repite mientras la situación cambia</text>
<text x="28" y="306" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">LAS SIETE PROPIEDADES DEL SENTIDO (WEICK)</text>
<rect x="28" y="322" width="254.5" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.3" />
<text x="42" y="344" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Identidad:</text>
<text x="114.8" y="344" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >quién soy al interpretar</text>
<rect x="292.5" y="322" width="326" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.3" />
<text x="306.5" y="344" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Retrospectivo:</text>
<text x="408.1" y="344" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >se entiende mirando lo ocurrido</text>
<rect x="628.5" y="322" width="339" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.3" />
<text x="642.5" y="344" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Activo:</text>
<text x="693.7" y="344" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >actuar crea el entorno que se interpreta</text>
<rect x="28" y="366" width="222" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.3" />
<text x="42" y="388" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Social:</text>
<text x="93.2" y="388" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >se construye con otros</text>
<rect x="260" y="366" width="202.5" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.3" />
<text x="274" y="388" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Continuo:</text>
<text x="339.6" y="388" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >no tiene un final</text>
<rect x="472.5" y="366" width="280.5" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.3" />
<text x="486.5" y="388" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Señales:</text>
<text x="544.9" y="388" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >se apoya en indicios concretos</text>
<rect x="28" y="410" width="306.5" height="34" rx="17" fill="#ffffff" stroke="#0969da" stroke-width="1.3" />
<text x="42" y="432" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Plausibilidad:</text>
<text x="143.6" y="432" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start" >importa más que la exactitud</text>
<rect x="28" y="452" width="984" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="474" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Klein describe cómo los expertos deciden bajo presión de tiempo: reconocen un patrón, simulan mentalmente una acción y la ajustan.</text>
<text x="44" y="491.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Funciona cuando hay experiencia; si no la hay, conviene acción acotada y consulta.</text>
<text x="28" y="566" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >No elimina la incertidumbre: la hace manejable. Si la acción no es reversible, se necesita más evidencia antes de actuar.</text>
</svg>
