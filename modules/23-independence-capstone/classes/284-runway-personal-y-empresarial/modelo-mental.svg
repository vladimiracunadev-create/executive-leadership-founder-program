<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >cash floor</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >nivel mínimo de liquidez que no se desea cruzar</text>
<circle cx="38" cy="358.12" r="5" fill="#59636e"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >downside scenario</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >escenario adverso plausible para probar resiliencia</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
