<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s286 d-s286" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s286">Clase 286 · Riesgo, ética y reputación en el trabajo independiente</title>
<desc id="d-s286">Cinco áreas de deber y riesgo del profesional independiente: partes interesadas, conflictos, datos y propiedad intelectual, afirmaciones verificables e incidentes.</desc>
<defs><marker id="p-s286" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 286 · Riesgo, ética y reputación en el trabajo independiente</text>
<text x="1012" y="43" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="end" >Drucker · McKeown · Gerber · Anderson</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Área</text>
<text x="289.114" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Pregunta</text>
<text x="700.152" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Control</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Partes interesadas</text>
<text x="289.114" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿A quién debo lealtad y qué le debo?</text>
<text x="700.152" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Mapa de deberes.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Conflictos de interés</text>
<text x="289.114" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué intereses chocan con los del cliente?</text>
<text x="700.152" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Declaración y límites.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Datos y propiedad intelectual</text>
<text x="289.114" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué información ajena manejo y cómo la protejo?</text>
<text x="700.152" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Acuerdos y seguridad básica.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Afirmaciones</text>
<text x="289.114" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Puedo probar lo que prometo o digo?</text>
<text x="700.152" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Evidencia y lenguaje preciso.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Incidentes</text>
<text x="289.114" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué hago si algo sale mal?</text>
<text x="700.152" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Proceso de escalamiento y aviso.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Ser independiente no elimina las obligaciones legales ni profesionales. Cuando un encargo excede la competencia o la habilitación, se</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >deriva o se trabaja con un especialista.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Una reputación se construye con muchos actos pequeños y se pierde con uno solo grave.</text>
</svg>
