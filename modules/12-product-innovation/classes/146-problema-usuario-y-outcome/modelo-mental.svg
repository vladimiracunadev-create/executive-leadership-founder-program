<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g146 d-g146" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g146">Ficha visual de la clase 146: Problema, usuario y outcome</title>
<desc id="d-g146">Conceptos: problem statement; need; pain; outcome; solution bias. Método: observar contexto y conducta → formular problema sin solución embebida → definir outcome observable → recoger evidencia de frecuencia e intensidad → priorizar por valor alcance y riesgo.</desc>
<defs><marker id="p-g146" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#bc4c00"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 146 · Problema, usuario y outcome</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 12 · Dirección, estrategia y organización</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#bc4c00"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >problem statement</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >descripción comprobable de una dificultad en un</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >contexto</text>
<circle cx="38" cy="184.12" r="5" fill="#bc4c00"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >need</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >progreso o condición que el usuario intenta alcanzar</text>
<circle cx="38" cy="242.12" r="5" fill="#bc4c00"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >pain</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >fricción o costo percibido dentro de ese intento</text>
<circle cx="38" cy="300.12" r="5" fill="#bc4c00"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >outcome</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cambio observable que indica progreso del usuario</text>
<circle cx="38" cy="358.12" r="5" fill="#bc4c00"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >solution bias</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tendencia a saltar a funcionalidades antes de entender</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >el problema</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<circle cx="486.0" cy="120" r="11" fill="#bc4c00"/>
<text x="486" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="504" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >observar contexto</text>
<text x="504" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >y conducta</text>
<rect x="658" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<circle cx="674.0" cy="120" r="11" fill="#bc4c00"/>
<text x="674" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="692" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >formular problema</text>
<text x="692" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >sin solución</text>
<text x="692" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >embebida</text>
<rect x="846" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<circle cx="862.0" cy="120" r="11" fill="#bc4c00"/>
<text x="862" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="880" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >definir outcome</text>
<text x="880" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >observable</text>
<rect x="846" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<circle cx="862.0" cy="240" r="11" fill="#bc4c00"/>
<text x="862" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="880" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >recoger evidencia</text>
<text x="880" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >de frecuencia e</text>
<text x="880" y="276.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >intensidad</text>
<rect x="658" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<circle cx="674.0" cy="240" r="11" fill="#bc4c00"/>
<text x="674" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="692" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >priorizar por</text>
<text x="692" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >valor alcance y</text>
<text x="692" y="276.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >riesgo</text>
<path d="M638,139 L656,139" stroke="#bc4c00" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g146)"/>
<path d="M826,139 L844,139" stroke="#bc4c00" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-g146)"/>
