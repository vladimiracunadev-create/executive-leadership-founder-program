<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 474.98" width="1040" role="img" aria-labelledby="t-s199 d-s199" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s199">Clase 199 · Cuatro partes que la empresa debe equilibrar</title>
<desc id="d-s199">Clientes, personas, accionistas y sociedad: qué necesita cada parte, qué aporta a la empresa y una señal de alerta.</desc>
<defs><marker id="p-s199" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="474.98" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 199 · Cuatro partes que la empresa debe equilibrar</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Freeman · Jensen (2002) · Porter &amp; Kramer · Polman &amp; Winston</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Parte</text>
<text x="210.56" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué necesita</text>
<text x="472.96" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué aporta</text>
<text x="735.36" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Señal de alerta</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Clientes</text>
<text x="210.56" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Valor, confianza y trato justo.</text>
<text x="472.96" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Ingresos y recomendación.</text>
<text x="735.36" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Reclamos y bajas crecientes.</text>
<rect x="28" y="172.56" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Personas</text>
<text x="210.56" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Trabajo con sentido, seguridad y</text>
<text x="210.56" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >desarrollo.</text>
<text x="472.96" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Capacidad y compromiso.</text>
<text x="735.36" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Rotación de talento clave.</text>
<rect x="28" y="225.68" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="245.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Accionistas</text>
<text x="210.56" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Retorno ajustado por riesgo y</text>
<text x="210.56" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >claridad.</text>
<text x="472.96" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Capital y paciencia.</text>
<text x="735.36" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Costo de capital que sube.</text>
<rect x="28" y="278.8" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="298.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Sociedad</text>
<text x="210.56" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Impacto acotado y cumplimiento.</text>
<text x="472.96" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Licencia para operar.</text>
<text x="735.36" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Conflictos con comunidades o</text>
<text x="735.36" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >autoridades.</text>
<rect x="28" y="347.92" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="369.92" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Equilibrar no es evitar elegir: se explicitan objetivos, responsables y costos, y se decide con un criterio de largo plazo que todas</text>
<text x="44" y="387.17" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >las partes puedan entender.</text>
<text x="28" y="434.42" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La retórica de las partes interesadas sin rendición de cuentas no es un balance; las obligaciones legales no se negocian.</text>
</svg>
