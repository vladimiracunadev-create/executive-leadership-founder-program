<text x="142.75" y="339" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >la medición reordena el portafolio</text>
<rect x="28" y="361" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="383" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Una gobernanza central puede frenar la experimentación. Se separa el espacio de pruebas de bajo riesgo del escalamiento en la empresa y</text>
<text x="44" y="400.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >se aplican controles proporcionales.</text>
<text x="28" y="447.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las cifras y los casos del capstone son ilustrativos; la regulación de datos, IA y ciberseguridad se verifica en fuentes oficiales.</text>
