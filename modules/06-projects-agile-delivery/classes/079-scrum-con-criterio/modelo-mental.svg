<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g79 d-g79" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g79">Ficha visual de la clase 079: Scrum con criterio</title>
<desc id="d-g79">Conceptos: Product Goal; Sprint Goal; Increment; Product Owner; Developers. Método: definir Product Goal → ordenar backlog por valor y riesgo → seleccionar Sprint Goal y trabajo → construir Increment Done → inspeccionar producto y proceso antes de adaptar.</desc>
<defs><marker id="p-g79" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
