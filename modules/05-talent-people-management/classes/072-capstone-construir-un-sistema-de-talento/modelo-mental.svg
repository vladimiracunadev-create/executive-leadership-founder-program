<circle cx="709.4" cy="483.36" r="3.5" fill="#0969da"/>
<text x="720.4" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >regrettable attrition</text>
<rect x="28" y="516.36" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="516.36" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="536.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="554.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un sistema de talento no debe burocratizar una empresa joven prematuramente. Instala controles proporcionales a escala y riesgo,</text>
<text x="48" y="571.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >priorizando claridad y legalidad antes que ceremonias complejas.</text>
