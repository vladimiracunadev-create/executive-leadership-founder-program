  - "Robert I. Sutton & Huggy Rao — *Scaling Up Excellence*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
  - "Michael E. Gerber — *The E-Myth Revisited*"
limits:
  - "Estandarizar demasiado pronto puede perder clientes estratégicos; el trabajo a medida puede comprar aprendizaje o ventaja si se cuantifica su costo y se fija un criterio de salida."
evidence_signals:
  - "margen de contribución por segmento"
