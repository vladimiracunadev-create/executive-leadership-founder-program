id: 200
part: 16
title: "Comunicación del CEO"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Estructurar un mensaje ejecutivo con lo que se sabe, lo que no se sabe, lo que se hace y cuándo habrá novedades."
  - "Clasificar una situación según la responsabilidad que el público atribuye y elegir la postura de respuesta que le corresponde."
  - "Decidir entre mantener, aclarar o retractarse tras una declaración controvertida, según si fue inexacta, mal expresada o correcta pero discutida."
  - "Responder una pregunta difícil separando hecho, límite de la información y compromiso."
  - "Preparar un manual de vocería y el traspaso cuando el vocero se va."
  - "Reconocer errores y límites de la información sin ocultar hechos relevantes."
deliverable: "executive-spokesperson-manual.md"
references:
  - "W. Timothy Coombs — *Protecting Organization Reputations During a Crisis: The Development and Application of Situational Crisis Communication Theory*"
  - "Peter H. Kim, Donald L. Ferrin, Cecily D. Cooper & Kurt T. Dirks — *Removing the Shadow of Suspicion: The Effects of Apology Versus Denial for Repairing Competence- Versus Integrity-Based Trust Violations*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Roger C. Mayer, James H. Davis & F. David Schoorman — *An Integrative Model of Organizational Trust*"
limits:
  - "La teoría situacional se apoya en estudios experimentales y de casos y en percepciones que varían entre culturas. La disculpa tiene consecuencias legales según la jurisdicción, pero el asesor legal no decide el mensaje por el CEO. Ninguna técnica salva un mensaje que los hechos internos contradicen."
evidence_signals:
  - "coincidencia entre mensaje externo y hechos internos"
  - "hora en que se supo y en que se comunicó cada hecho"
  - "tiempo de corrección de un dato erróneo"
  - "vocero provisional entrenado"
