<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 421.56" width="1040" role="img" aria-labelledby="t-s283 d-s283" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s283">Clase 283 · Qué fuentes de ingreso conservar</title>
<desc id="d-s283">Cuadrante de recurrencia y margen de cada fuente de ingreso para decidir cuáles son motores, cuáles se mejoran, cuáles se mantienen con cuidado y cuáles se retiran.</desc>
<defs><marker id="p-s283" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="421.56" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 283 · Qué fuentes de ingreso conservar</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Aulet · McKeown · Wasserman · Drucker</text>
<text x="362.5" y="100" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >Poco recurrente</text>
<text x="799.5" y="100" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >Muy recurrente</text>
<text transform="translate(120,151.625) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">Margen alto</text>
<text transform="translate(120,242.875) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">Margen bajo</text>
<rect x="150" y="112" width="425" height="79.25" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="150.0" y="112.0" width="425.0" height="34" rx="12" fill="#0969da"/>
<text x="166" y="135" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Alto margen puntual</text>
<text x="166" y="170" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Buen margen pero irregular: mantener sin depender de él.</text>
<rect x="587" y="112" width="425" height="79.25" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="587.0" y="112.0" width="425.0" height="34" rx="12" fill="#1a7f37"/>
<text x="603" y="135" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Motor principal</text>
<text x="603" y="170" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Recurrente y rentable: proteger e invertir.</text>
<rect x="150" y="203.25" width="425" height="79.25" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<rect x="150.0" y="203.25" width="425.0" height="34" rx="12" fill="#cf222e"/>
<text x="166" y="226.25" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Retirar</text>
<text x="166" y="261.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Poco recurrente y de bajo margen: consume foco.</text>
<rect x="587" y="203.25" width="425" height="79.25" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<rect x="587.0" y="203.25" width="425.0" height="34" rx="12" fill="#bc4c00"/>
<text x="603" y="226.25" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Estabilizador a mejorar</text>
<text x="603" y="261.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Recurrente pero de bajo margen: ajustar precio o costo.</text>
<rect x="28" y="294.5" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="316.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Una diversificación nominal puede no reducir el riesgo si las fuentes dependen de los mismos factores. No se sacrifica la profundidad</text>
<text x="44" y="333.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >de una fuente rentable por bajar un porcentaje abstracto.</text>
<text x="28" y="381" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Se mide la concentración por cliente y por fuente.</text>
</svg>
