<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" role="img" aria-labelledby="t-041 d-041" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-041">Resiliencia y recuperación son trayectorias distintas</title>
<desc id="d-041">Tras un evento adverso, algunas personas mantienen un funcionamiento estable (resiliencia), otras caen y vuelven (recuperación) y otras se mantienen deterioradas (crónica).</desc>
<defs><marker id="p-041" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="580" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 041 · Resiliencia: lo común, no lo excepcional</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Bonanno (2004) · Masten (2001)</text>
<path d="M60,96 V426 H660" stroke="#59636e" stroke-width="2" fill="none"/>
<text x="46" y="104" font-size="11" font-weight="600" fill="#59636e" text-anchor="end" >funcionamiento</text>
<text x="660" y="448" font-size="11" font-weight="600" fill="#59636e" text-anchor="end" >tiempo</text>
<path d="M210,96 V426" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="216" y="110" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" >evento adverso</text>
<path d="M60,186 H210 Q250,208 300,192 T660,186" stroke="#1a7f37" stroke-width="3.5" fill="none"/>
<path d="M60,186 H210 Q240,336 360,316 T660,198" stroke="#0969da" stroke-width="3.5" fill="none"/>
<path d="M60,186 H210 Q240,336 360,376 T660,361" stroke="#cf222e" stroke-width="3.5" fill="none"/>
<text x="656" y="178" font-size="12.5" font-weight="700" fill="#1a7f37" text-anchor="end" >Resiliencia</text>
<text x="656" y="216" font-size="12.5" font-weight="700" fill="#0969da" text-anchor="end" >Recuperación</text>
<text x="656" y="346" font-size="12.5" font-weight="700" fill="#cf222e" text-anchor="end" >Deterioro crónico</text>
<rect x="700" y="98" width="312" height="104" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="700" y="98" width="6" height="104" rx="3" fill="#1a7f37"/>
<text x="718" y="120" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Resiliencia</text>
<text x="718" y="138" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Funcionamiento relativamente estable;</text>
<text x="718" y="155.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >es más común de lo que se supone.</text>
<rect x="700" y="214" width="312" height="104" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="700" y="214" width="6" height="104" rx="3" fill="#0969da"/>
<text x="718" y="236" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Recuperación</text>
<text x="718" y="254" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Un período de disfunción y luego el</text>
<text x="718" y="271.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >retorno gradual.</text>
<rect x="700" y="330" width="312" height="104" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.7" />
<rect x="700" y="330" width="6" height="104" rx="3" fill="#8250df"/>
<text x="718" y="352" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Procesos ordinarios</text>
<text x="718" y="370" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Para Masten surge de sistemas</text>
<text x="718" y="387.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >adaptativos comunes: relaciones,</text>
<text x="718" y="404.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >capacidad de resolver, sentido.</text>
<rect x="700" y="446" width="312" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="714" y="468" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Implicancia: no tratar como patología la</text>
<text x="714" y="485.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >reacción esperable, ni exigir que nadie</text>
<text x="714" y="502.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >«se sobreponga».</text>
<text x="28" y="566" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las trayectorias son esquemáticas; los estudios las describen en poblaciones, no predicen a una persona.</text>
</svg>
