id: 213
part: 17
title: "Supervisión de riesgo y controles"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "separar propiedad, administración y supervisión para gobernar estrategia, riesgo y sucesión"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir risk oversight de critical control mediante evidencia observable."
  - "Aplicar la secuencia: alinear risk appetite con estrategia → seleccionar top risks y scenarios → identificar critical controls → obtener assurance independiente → seguir breaches y remediation."
  - "Interpretar KRI trend, control effectiveness, audit findings sin atribuir causalidad automática."
  - "Resolver el caso de supervisión de riesgo y controles con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Bob Tricker — *Corporate Governance*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "Robert A. G. Monks & Nell Minow — *Corporate Governance*"
  - "Michael E. Porter & Mark R. Kramer — *Creating Shared Value*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
  - "Richard Leblanc & James Gillies — *Inside the Boardroom*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*. Fuente primaria: <https://www.oecd.org/corporate/principles-corporate-governance/>."
limits:
  - "El board no puede garantizar ausencia de fallas. Su estándar es supervisión razonable y evidencia de governance, no certificar controles técnicos individuales."
evidence_signals:
  - "KRI trend"
  - "control effectiveness"
  - "audit findings"
  - "risk appetite breaches"
  - "remediation age"
