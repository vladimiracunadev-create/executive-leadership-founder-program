<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grado de compatibilidad entre necesidad, solución y</text>
<text x="54" y="295.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >restricciones</text>
