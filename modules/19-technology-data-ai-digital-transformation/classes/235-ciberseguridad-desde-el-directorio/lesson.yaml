id: 235
part: 19
title: "Ciberseguridad desde el directorio"
duration_minutes: 150
level: "Etapa 5 — CEO → Transformador digital"
outcome: "gobernar tecnología, datos e IA como capacidades económicas y organizacionales"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir pocos escenarios cibernéticos con impacto de negocio."
  - "Identificar los activos críticos («joyas de la corona») y su protección."
  - "Revisar controles y riesgo residual con evidencia independiente."
  - "Ejercitar la respuesta y la recuperación con la participación del directorio."
  - "Aprobar inversiones y excepciones con criterios y registro."
deliverable: "risk-governance-brief.md"
references:
  - "NIST — *Cybersecurity Framework (CSF) 2.0*"
  - "Ross Anderson — *Security Engineering*"
  - "Richard A. Clarke & Robert K. Knake — *The Fifth Domain*"
  - "COSO — *Enterprise Risk Management—Integrating with Strategy and Performance*"
  - "Bob Tricker — *Corporate Governance*"
limits:
  - "El directorio no debe pedir cero riesgo ni evaluar herramientas individuales: debe asegurar gobierno, capacidad de respuesta y exposición coherente con el apetito."
evidence_signals:
  - "escenarios cibernéticos con impacto"
  - "activos críticos identificados"
  - "evidencia independiente de controles"
  - "ejercicio y recuperación probados"
