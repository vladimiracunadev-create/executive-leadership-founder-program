id: 31
part: 02
title: "Conversaciones difíciles"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Describir el camino a la acción —ver, contar una historia, sentir, actuar— y ubicar dónde estás en él."
  - "Separar hechos observables de la historia que les agregas."
  - "Identificar las tres conversaciones presentes: qué ocurrió, los sentimientos y la identidad."
  - "Abrir una conversación difícil con hechos, propósito común y curiosidad."
  - "Cerrarla con acuerdos concretos, responsables y fecha de seguimiento."
deliverable: "leadership-decision-brief.md"
references:
  - "Kerry Patterson et al. — *Crucial Conversations*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Edgar H. Schein — *Humble Inquiry*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
limits:
  - "El camino a la acción es un modelo propuesto por los autores y no una descripción medida del funcionamiento mental; sirve para preparar."
evidence_signals:
  - "hechos separados de historias"
  - "apertura con propósito común"
  - "acuerdo con responsable y fecha"
  - "seguimiento realizado"
