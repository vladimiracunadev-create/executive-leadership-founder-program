id: 129
part: 10
title: "Pricing y concesiones"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "construir ingresos mediante un proceso comercial medible y negociación disciplinada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir list price de value-based pricing mediante evidencia observable."
  - "Aplicar la secuencia: definir segmento y valor → calcular floor económico → establecer arquitectura y paquetes → crear reglas de descuento y give-get → medir realized price y pocket margin."
  - "Interpretar average selling price, discount rate, pocket margin sin atribuir causalidad automática."
  - "Resolver el caso de pricing y concesiones con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "commercial-decision-brief.md"
references:
  - "Neil Rackham — *SPIN Selling*"
  - "Matthew Dixon & Brent Adamson — *The Challenger Sale*"
  - "Chris Voss & Tahl Raz — *Never Split the Difference*"
  - "Neil Rackham — *Major Account Sales Strategy*"
  - "Aaron Ross & Marylou Tyler — *Predictable Revenue*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
limits:
  - "Precio basado en valor requiere evidencia y ética; no significa cobrar arbitrariamente el máximo. Considera competencia, relación, acceso y reglas de mercado."
evidence_signals:
  - "average selling price"
  - "discount rate"
  - "pocket margin"
  - "win rate by price"
  - "price realization"
