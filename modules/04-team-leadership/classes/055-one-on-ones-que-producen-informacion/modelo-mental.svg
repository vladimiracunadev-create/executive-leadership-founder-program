<text x="535" y="292" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >4</text>
<text x="555" y="292" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >tratar un tema de desarrollo</text>
<rect x="538" y="328" width="406" height="50" rx="9" fill="#0969da" stroke="#0969da" stroke-width="0" fill-opacity="0.7"/>
<text x="552" y="348" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >5</text>
<text x="572" y="348" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >registrar compromisos y volver a ellos</text>
<text x="28" y="430.12" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="442.12" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="41" cy="455.12" r="3.5" fill="#0969da"/>
<text x="52" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cancelaciones</text>
<rect x="153.7" y="442.12" width="233" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="166.7" cy="455.12" r="3.5" fill="#0969da"/>
<text x="177.7" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >ratio status versus desarrollo</text>
<rect x="396.7" y="442.12" width="205.4" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="409.7" cy="455.12" r="3.5" fill="#0969da"/>
<text x="420.7" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >temas repetidos sin cierre</text>
<rect x="612.1" y="442.12" width="219.2" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="625.1" cy="455.12" r="3.5" fill="#0969da"/>
<text x="636.1" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >bloqueos detectados temprano</text>
<rect x="841.3" y="442.12" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#0969da" stroke-width="1.2" />
<circle cx="854.3" cy="455.12" r="3.5" fill="#0969da"/>
<text x="865.3" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >acciones de carrera</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="488.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Los one-on-ones no deben ser canales secretos para decisiones que afectan a otros. Mantén privacidad personal, pero documenta acuerdos</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >operativos y usa procesos formales cuando corresponda.</text>
</svg>
