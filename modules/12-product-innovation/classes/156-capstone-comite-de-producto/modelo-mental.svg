<title id="t-g156">Ficha visual de la clase 156: Capstone: comité de producto</title>
<desc id="d-g156">Conceptos: product portfolio; product thesis; kill criteria; evidence ladder; portfolio balance. Método: presentar tesis y evidencia → comparar outcomes y economics → examinar riesgos y dependencias → asignar capacidad con kill criteria → registrar decisiones y próximas pruebas.</desc>
