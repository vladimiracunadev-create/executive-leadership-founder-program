id: 99
part: 08
title: "OKR: cuándo sirven y cuándo no"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "dirigir mediante outcomes, métricas, revisiones y asignación explícita de recursos"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Redactar un objetivo cualitativo inspirador y de dos a cinco resultados clave medibles."
  - "Diferenciar OKR de KPI, de tareas y de evaluación del desempeño."
  - "Decidir si la organización está lista para adoptar OKR y con qué alcance."
  - "Diseñar un ciclo de OKR con cascada, revisión y cierre."
  - "Reconocer los modos de fallo y proponer correcciones."
deliverable: "leadership-decision-brief.md"
references:
  - "John Doerr — *Measure What Matters*"
  - "John Doerr — *Speed & Scale*"
  - "Andrew S. Grove — *High Output Management*"
  - "Lisa D. Ordóñez, Maurice E. Schweitzer, Adam D. Galinsky & Max H. Bazerman — *Goals Gone Wild: The Systematic Side Effects of Overprescribing Goal Setting*"
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
limits:
  - "La evidencia de efectividad proviene sobre todo de relatos de empresas que los adoptaron, sin comparaciones controladas; el éxito puede deberse a otros factores."
evidence_signals:
  - "objetivo cualitativo y resultados clave medibles"
  - "compromiso separado de estiramiento"
  - "contrapeso definido"
  - "seguimiento semanal con decisión"
