<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s147 d-s147" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s147">Clase 147 · Preguntas que sirven y preguntas que engañan en una entrevista</title>
<desc id="d-s147">Preguntas típicas de una entrevista de descubrimiento: por qué fallan y cómo reformularlas hacia hechos pasados.</desc>
<defs><marker id="p-s147" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 147 · Preguntas que sirven y preguntas que engañan en una entrevista</text>
<text x="1012" y="43" font-size="10" font-weight="400" fill="#59636e" text-anchor="end" >Fitzpatrick (2013)…</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Pregunta que engaña</text>
<text x="349.257" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Por qué falla</text>
<text x="658.514" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Pregunta que sirve</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Te gustaría una aplicación que…?</text>
<text x="349.257" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Invita a una cortesía.</text>
<text x="658.514" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Cómo lo resolviste la última vez?</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Pagarías USD 20 por esto?</text>
<text x="349.257" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Es una intención hipotética.</text>
<text x="658.514" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Cuánto gastas hoy en resolverlo?</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Siempre te pasa esto?</text>
<text x="349.257" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Fuerza una generalización.</text>
<text x="658.514" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cuéntame la última vez que ocurrió.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Qué funciones quisieras?</text>
<text x="349.257" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Pide soluciones, no problemas.</text>
<text x="658.514" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué te frustró de lo que usaste?</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >¿Qué opinas de nuestra idea?</text>
<text x="349.257" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Premia la amabilidad.</text>
<text x="658.514" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué otras alternativas probaste?</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Las personas son buenas contando lo que hicieron y malas prediciendo lo que harán. Se pregunta por hechos concretos, por alternativas</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >usadas y por el costo real del problema.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las entrevistas generan hipótesis y ejemplos, no estadísticas; se complementan con datos de comportamiento.</text>
</svg>
