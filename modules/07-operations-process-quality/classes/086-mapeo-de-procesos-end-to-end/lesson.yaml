id: 86
part: 07
title: "Mapeo de procesos end-to-end"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "operar procesos end-to-end con capacidad, calidad, continuidad y mejora"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Delimitar un proceso con disparador, salida, cliente y dueño."
  - "Construir un mapa con pasos, responsables, traspasos y tiempos."
  - "Distinguir tiempo activo, tiempo de espera y tiempo total del proceso."
  - "Validar el mapa observando el trabajo real y no solo la versión oficial."
  - "Priorizar oportunidades de mejora a partir del mapa."
deliverable: "process-map.md"
references:
  - "Geary A. Rummler & Alan P. Brache — *Improving Performance*"
  - "Mike Rother & John Shook — *Learning to See*"
  - "Nigel Slack & Alistair Brandon-Jones — *Operations Management*"
  - "James P. Womack & Daniel T. Jones — *Lean Thinking*"
  - "ISO — *ISO 9001 Quality management systems*"
limits:
  - "Un mapa fija el proceso en un momento y puede quedar obsoleto."
evidence_signals:
  - "disparador, salida y dueño definidos"
  - "tiempo activo y de espera medidos"
  - "traspasos señalados"
  - "mapa validado en terreno"
