<circle cx="166.7" cy="483.36" r="3.5" fill="#1a7f37"/>
<text x="177.7" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >nuevas conductas</text>
<rect x="300.1" y="470.36" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
