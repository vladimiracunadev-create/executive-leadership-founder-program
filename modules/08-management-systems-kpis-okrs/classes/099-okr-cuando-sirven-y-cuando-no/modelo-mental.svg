<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g99 d-g99" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g99">Ficha visual de la clase 099: OKR: cuándo sirven y cuándo no</title>
<desc id="d-g99">Conceptos: Objective; Key Result; initiative; commitment; check-in. Método: seleccionar pocos Objectives → escribir KRs de outcome o driver → separar iniciativas → etiquetar commitments → hacer check-ins y cambiar iniciativas según evidencia.</desc>
<defs><marker id="p-g99" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
