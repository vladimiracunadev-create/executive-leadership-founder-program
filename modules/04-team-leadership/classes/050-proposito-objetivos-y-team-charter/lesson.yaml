id: 50
part: 04
title: "Propósito, objetivos y team charter"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "crear equipos con propósito, coordinación, confianza, aprendizaje y accountability"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Redactar un propósito de equipo en una frase que oriente decisiones."
  - "Formular objetivos específicos y exigentes con medida y fecha."
  - "Explicar qué condiciones hacen que una meta mejore el desempeño según Locke y Latham."
  - "Construir un acta de equipo con propósito, objetivos, roles, normas y decisiones."
  - "Revisar el acta en el tiempo sin convertirla en un documento muerto."
deliverable: "team-charter.md"
references:
  - "Edwin A. Locke & Gary P. Latham — *Building a Practically Useful Theory of Goal Setting and Task Motivation: A 35-Year Odyssey*"
  - "J. Richard Hackman — *Leading Teams*"
  - "Jon R. Katzenbach & Douglas K. Smith — *The Wisdom of Teams*"
  - "John Doerr — *Measure What Matters*"
  - "Amy C. Edmondson — *Psychological Safety and Learning Behavior in Work Teams*"
limits:
  - "La investigación de Locke y Latham muestra que las metas funcionan en promedio y con condiciones; no todo se debe medir ni toda meta mejora el desempeño."
evidence_signals:
  - "propósito en una frase verificable"
  - "objetivos específicos y exigentes"
  - "acta construida con el equipo"
  - "fecha de revisión del acta"
