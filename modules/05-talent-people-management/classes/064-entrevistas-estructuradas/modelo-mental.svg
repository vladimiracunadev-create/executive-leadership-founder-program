<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >predeterminados</text>
<circle cx="38" cy="184.12" r="5" fill="#0969da"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >behavioral question</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >pregunta sobre conducta pasada en contexto relevante</text>
<circle cx="38" cy="242.12" r="5" fill="#0969da"/>
