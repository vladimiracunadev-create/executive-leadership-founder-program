id: 87
part: 07
title: "SOP y trabajo estandarizado"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "operar procesos end-to-end con capacidad, calidad, continuidad y mejora"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Decidir qué tareas merecen estándar y cuáles no."
  - "Redactar un procedimiento breve con propósito, pasos, puntos de control y responsable."
  - "Involucrar a quienes hacen el trabajo en escribirlo y mejorarlo."
  - "Entrenar y auditar observando el trabajo real, no solo el documento."
  - "Distinguir estándar que ayuda de burocracia que estorba."
deliverable: "leadership-decision-brief.md"
references:
  - "Taiichi Ohno — *Toyota Production System*"
  - "Jeffrey K. Liker — *The Toyota Way*"
  - "W. Edwards Deming — *Out of the Crisis*"
  - "ISO — *ISO 9001 Quality management systems*"
  - "Nigel Slack & Alistair Brandon-Jones — *Operations Management*"
limits:
  - "Estandarizar en exceso mata la iniciativa y el juicio; estandarizar pocas cosas deja errores costosos sin control."
evidence_signals:
  - "tarea elegida con criterio"
  - "escrito con quienes la hacen"
  - "puntos de control verificables"
  - "auditoría en el puesto"
