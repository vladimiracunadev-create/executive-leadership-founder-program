<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 162 · Trade-offs y coherencia</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 13 · Dirección, estrategia y organización</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#bc4c00"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >trade-off</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >elección donde perseguir una opción limita otra</text>
<circle cx="38" cy="170" r="5" fill="#bc4c00"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >fit</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grado en que actividades se refuerzan como sistema</text>
<circle cx="38" cy="228" r="5" fill="#bc4c00"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >activity system</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >mapa de actividades que materializan una posición</text>
<circle cx="38" cy="286" r="5" fill="#bc4c00"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >straddling</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >intento de ocupar posiciones incompatibles</text>
<text x="54" y="325.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >simultáneamente</text>
<circle cx="38" cy="358.12" r="5" fill="#bc4c00"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >strategic consistency</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >coherencia entre propuesta operaciones y recursos</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
