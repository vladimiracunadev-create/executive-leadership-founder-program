id: 94
part: 07
title: "Continuidad operacional"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "operar procesos end-to-end con capacidad, calidad, continuidad y mejora"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Identificar procesos críticos con un análisis de impacto."
  - "Fijar tiempos máximos de interrupción y de pérdida de información tolerables."
  - "Comparar estrategias de continuidad con su costo y su cobertura."
  - "Escribir un plan que otra persona pueda ejecutar bajo presión."
  - "Ejercitar y mejorar el plan con simulaciones y lecciones de incidentes."
deliverable: "operating-improvement-brief.md"
references:
  - "ISO — *ISO 22301 Business continuity management systems*"
  - "W. Edwards Deming — *Out of the Crisis*"
  - "Jeffrey K. Liker — *The Toyota Way*"
  - "Nigel Slack & Alistair Brandon-Jones — *Operations Management*"
  - "Betsy Beyer, Chris Jones, Jennifer Petoff & Niall Richard Murphy — *Site Reliability Engineering*"
limits:
  - "No se pueden prever todos los escenarios; los planes basados en causas concretas fallan ante sorpresas, por lo que se diseñan por **consecuencias** (sin sistema, sin instalaciones, sin personas, sin proveedor)."
evidence_signals:
  - "procesos críticos priorizados"
  - "RTO y RPO por proceso"
  - "plan ejecutable por otra persona"
  - "ejercicio con lecciones incorporadas"
