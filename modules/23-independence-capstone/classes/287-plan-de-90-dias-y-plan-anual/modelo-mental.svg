<title id="t-g287">Ficha visual de la clase 287: Plan de 90 días y plan anual</title>
<desc id="d-g287">Conceptos: 90-day sprint; annual plan; leading activity; checkpoint; kill criterion. Método: definir 12-month outcomes → seleccionar 90-day bets → traducir a weekly activities → crear metrics y checkpoints → review monthly y reallocate.</desc>
