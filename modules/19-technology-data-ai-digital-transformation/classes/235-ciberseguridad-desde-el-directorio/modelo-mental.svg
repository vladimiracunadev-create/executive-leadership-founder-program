<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 402.06" width="1040" role="img" aria-labelledby="t-s235 d-s235" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s235">Clase 235 · Lo que el directorio supervisa en ciberseguridad</title>
<desc id="d-s235">Tres focos del directorio en ciberseguridad: escenarios y activos críticos, controles y riesgo residual, y capacidad de respuesta y recuperación.</desc>
<defs><marker id="p-s235" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="402.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 235 · Lo que el directorio supervisa en ciberseguridad</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >NIST CSF 2.0 · Anderson · Clarke &amp; Knake</text>
<rect x="28" y="96" width="314.667" height="163" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M28.0,136 V108 a12,12 0 0 1 12,-12 H330.6666666666667 a12,12 0 0 1 12,12 V136 Z" fill="#0969da"/>
<text x="44" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Escenarios y activos críticos</text>
<circle cx="50.0" cy="154" r="4" fill="#0969da"/>
<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Pocos escenarios con impacto de</text>
<text x="64" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >negocio.</text>
<circle cx="50.0" cy="198.5" r="4" fill="#0969da"/>
<text x="64" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Los activos que no pueden fallar.</text>
<circle cx="50.0" cy="225.75" r="4" fill="#0969da"/>
<text x="64" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Apetito alineado con la exposición.</text>
<rect x="362.667" y="96" width="314.667" height="163" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M362.6666666666667,136 V108 a12,12 0 0 1 12,-12 H665.3333333333334 a12,12 0 0 1 12,12 V136 Z" fill="#1a7f37"/>
<text x="378.667" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Controles y riesgo residual</text>
<circle cx="384.6666666666667" cy="154" r="4" fill="#1a7f37"/>
<text x="398.667" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Controles clave con pruebas</text>
<text x="398.667" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >independientes.</text>
<circle cx="384.6666666666667" cy="198.5" r="4" fill="#1a7f37"/>
<text x="398.667" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Brechas con dueño y plazo.</text>
<circle cx="384.6666666666667" cy="225.75" r="4" fill="#1a7f37"/>
<text x="398.667" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Exposición de proveedores críticos.</text>
<rect x="697.333" y="96" width="314.667" height="163" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M697.3333333333334,136 V108 a12,12 0 0 1 12,-12 H1000.0 a12,12 0 0 1 12,12 V136 Z" fill="#bc4c00"/>
<text x="713.333" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Respuesta y recuperación</text>
<circle cx="719.3333333333334" cy="154" r="4" fill="#bc4c00"/>
<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Plan ensayado con la dirección.</text>
<circle cx="719.3333333333334" cy="181.25" r="4" fill="#bc4c00"/>
<text x="733.333" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Tiempos reales de recuperación.</text>
<circle cx="719.3333333333334" cy="208.5" r="4" fill="#bc4c00"/>
<text x="733.333" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Decisiones previas sobre</text>
<text x="733.333" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >comunicación.</text>
<rect x="28" y="275" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="297" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El directorio no pide riesgo cero ni evalúa herramientas una por una: asegura gobierno, capacidad de respuesta y una exposición</text>
<text x="44" y="314.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >coherente con el apetito.</text>
<text x="28" y="361.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las obligaciones de reporte de incidentes se verifican en la fuente oficial vigente.</text>
</svg>
