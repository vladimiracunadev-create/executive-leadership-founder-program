<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g97 d-g97" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g97">Ficha visual de la clase 097: De actividad a outcome</title>
<desc id="d-g97">Conceptos: activity; output; outcome; impact; theory of change. Método: nombrar outcome y stakeholder → mapear outputs que plausiblemente lo habilitan → explicitar mecanismo causal → seleccionar métricas de outcome y driver → revisar si los outputs realmente mueven la señal.</desc>
<defs><marker id="p-g97" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="574.12" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#8250df"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 097 · De actividad a outcome</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 08 · Gestión de negocio</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#8250df"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >activity</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >acción ejecutada que consume recursos</text>
<circle cx="38" cy="170" r="5" fill="#8250df"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >output</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >producto directo y controlable de una actividad</text>
<circle cx="38" cy="228" r="5" fill="#8250df"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >outcome</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cambio observable en cliente, negocio o capacidad</text>
<circle cx="38" cy="286" r="5" fill="#8250df"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >impact</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >efecto de largo plazo al que contribuyen múltiples</text>
<text x="54" y="325.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >factores</text>
<circle cx="38" cy="358.12" r="5" fill="#8250df"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >theory of change</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >hipótesis que conecta actividades, outputs y outcomes</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
