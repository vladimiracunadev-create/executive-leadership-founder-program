id: 185
part: 15
title: "Contratos: riesgos que un ejecutivo debe detectar"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "gobernar riesgo, legal, cumplimiento, ciberseguridad, datos e IA de forma integrada"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Identificar los riesgos económicos, operativos y de dependencia de un contrato."
  - "Cuantificar la exposición frente a límites de responsabilidad, créditos y costos de salida."
  - "Reconocer cláusulas que crean dependencia o atrapan a la empresa."
  - "Preparar una negociación con prioridades, alternativas y concesiones."
  - "Escalar a asesoría con una lista concreta de puntos a revisar."
deliverable: "risk-governance-brief.md"
references:
  - "Oliver E. Williamson — *Transaction-Cost Economics: The Governance of Contractual Relations*"
  - "Stewart Macaulay — *Non-Contractual Relations in Business: A Preliminary Study*"
  - "Max H. Bazerman & Don A. Moore — *Judgment in Managerial Decision Making*"
  - "Chris Voss & Tahl Raz — *Never Split the Difference*"
  - "Bent Flyvbjerg & Dan Gardner — *How Big Things Get Done*"
limits:
  - "Los contratos son incompletos y su interpretación depende de la ley aplicable y de los hechos."
evidence_signals:
  - "exposición contractual cuantificada"
  - "dependencia y costo de salida medidos"
  - "límite de responsabilidad comparado"
  - "negociación con prioridades y alternativas"
