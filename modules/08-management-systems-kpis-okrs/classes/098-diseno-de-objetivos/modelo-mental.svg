<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g98 d-g98" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g98">Ficha visual de la clase 098: Diseño de objetivos</title>
<desc id="d-g98">Conceptos: objective; target; constraint; stretch; commitment. Método: partir de prioridad estratégica → definir outcome y horizonte → seleccionar 1–3 medidas → declarar constraints y trade-offs → alinear recursos y revisión.</desc>
<defs><marker id="p-g98" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
