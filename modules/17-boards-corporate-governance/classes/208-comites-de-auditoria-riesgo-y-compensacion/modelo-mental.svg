<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g208 d-g208" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g208">Ficha visual de la clase 208: Comités de auditoría, riesgo y compensación</title>
<desc id="d-g208">Conceptos: board committee; audit committee; risk committee; compensation committee; committee charter. Método: mapear riesgos y requisitos → crear charters → seleccionar independencia y expertise → definir calendario e información → reportar recomendaciones y excepciones al board.</desc>
<defs><marker id="p-g208" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="602.36" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#cf222e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 208 · Comités de auditoría, riesgo y compensación</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 17 · Alta dirección y gobierno</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#cf222e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >board committee</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >subgrupo con mandato delegado para profundizar una</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >materia</text>
<circle cx="38" cy="184.12" r="5" fill="#cf222e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >audit committee</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >comité que supervisa reporting financiero auditoría y</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >controles</text>
<circle cx="38" cy="256.24" r="5" fill="#cf222e"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >risk committee</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >comité que supervisa framework y exposiciones</text>
<text x="54" y="295.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >materiales</text>
<circle cx="38" cy="328.36" r="5" fill="#cf222e"/>
<text x="54" y="333.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >compensation committee</text>
<text x="54" y="351.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >comité que diseña y supervisa remuneración ejecutiva</text>
<circle cx="38" cy="386.36" r="5" fill="#cf222e"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >committee charter</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >documento que define alcance autoridad y reporting</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<path d="M485,122 V338" stroke="#cf222e" stroke-width="2.5" stroke-opacity="0.35"/>
<circle cx="485" cy="122" r="14" fill="#cf222e"/>
<text x="485" y="127.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="512" y="118" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >mapear riesgos y requisitos</text>
<circle cx="485" cy="176" r="14" fill="#cf222e"/>
<text x="485" y="181.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="512" y="172" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >crear charters</text>
<circle cx="485" cy="230" r="14" fill="#cf222e"/>
<text x="485" y="235.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="512" y="226" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >seleccionar independencia y expertise</text>
<circle cx="485" cy="284" r="14" fill="#cf222e"/>
<text x="485" y="289.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="512" y="280" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >definir calendario e información</text>
<circle cx="485" cy="338" r="14" fill="#cf222e"/>
<text x="485" y="343.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="512" y="334" font-size="13.5" font-weight="500" fill="#1f2328" text-anchor="start" >reportar recomendaciones y excepciones al board</text>
<text x="28" y="458.36" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="470.36" width="164" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="41" cy="483.36" r="3.5" fill="#cf222e"/>
<text x="52" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >committee attendance</text>
<rect x="202" y="470.36" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="215" cy="483.36" r="3.5" fill="#cf222e"/>
<text x="226" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >open findings</text>
<rect x="327.7" y="470.36" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="340.7" cy="483.36" r="3.5" fill="#cf222e"/>
<text x="351.7" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >control assurance</text>
<rect x="481" y="470.36" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="494" cy="483.36" r="3.5" fill="#cf222e"/>
<text x="505" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >compensation alignment</text>
<rect x="668.8" y="470.36" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="681.8" cy="483.36" r="3.5" fill="#cf222e"/>
<text x="692.8" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >escalation timeliness</text>
<rect x="28" y="516.36" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="516.36" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="536.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="554.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Más comités pueden fragmentar accountability y duplicar trabajo. Crea solo donde escala, regulación o complejidad justifican</text>
<text x="48" y="571.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >profundidad adicional.</text>
