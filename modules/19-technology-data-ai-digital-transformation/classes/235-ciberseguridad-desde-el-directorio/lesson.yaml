id: 235
part: 19
title: "Ciberseguridad desde el directorio"
duration_minutes: 150
level: "Etapa 5 — CEO → Transformador digital"
outcome: "gobernar tecnología, datos e IA como capacidades económicas y organizacionales"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir cyber oversight de threat scenario mediante evidencia observable."
  - "Aplicar la secuencia: definir top cyber scenarios → mapear crown jewels → revisar controles y residual risk → ejercitar crisis y recovery → aprobar inversiones y track KRIs."
  - "Interpretar recovery test, critical control coverage, MTTD-MTTR sin atribuir causalidad automática."
  - "Resolver el caso de ciberseguridad desde el directorio con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Marco Iansiti & Karim R. Lakhani — *Competing in the Age of AI*"
  - "Thomas H. Davenport & Nitin Mittal — *All-In on AI*"
  - "Thomas H. Davenport & Jeanne G. Harris — *Competing on Analytics*"
  - "NIST — *AI Risk Management Framework (AI RMF 1.0)*"
  - "Andrew McAfee & Erik Brynjolfsson — *Machine, Platform, Crowd*"
  - "George Westerman, Didier Bonnet & Andrew McAfee — *Leading Digital*"
  - "NIST — *Cybersecurity Framework 2.0*. <https://www.nist.gov/cyberframework>."
limits:
  - "El board no debe pedir cero riesgo ni evaluar herramientas individuales. Debe asegurar governance, capacidad de respuesta y exposición consistente con apetito."
evidence_signals:
  - "recovery test"
  - "critical control coverage"
  - "MTTD-MTTR"
  - "scenario loss"
  - "third-party concentration"
