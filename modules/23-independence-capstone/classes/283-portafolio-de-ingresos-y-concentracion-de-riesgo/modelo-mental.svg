<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >income portfolio</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >conjunto de fuentes de ingreso gestionadas como cartera</text>
<circle cx="38" cy="170" r="5" fill="#59636e"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >concentration risk</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >exposición excesiva a una fuente cliente o mercado</text>
<circle cx="38" cy="228" r="5" fill="#59636e"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >correlation</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grado en que fuentes se mueven juntas ante shocks</text>
