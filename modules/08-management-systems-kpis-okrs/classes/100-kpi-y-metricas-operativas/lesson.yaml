id: 100
part: 08
title: "KPI y métricas operativas"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "dirigir mediante outcomes, métricas, revisiones y asignación explícita de recursos"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Elegir pocos indicadores a partir de las decisiones que deben informar."
  - "Escribir la ficha de un KPI con definición, fuente, frecuencia, dueño y umbral."
  - "Distinguir métricas operativas, KPI e indicadores estratégicos."
  - "Anticipar los efectos de convertir un indicador en meta."
  - "Diseñar contrapesos y revisiones para mantener la confiabilidad del indicador."
deliverable: "leadership-decision-brief.md"
references:
  - "Bernard Marr — *Key Performance Indicators*"
  - "Jerry Z. Muller — *The Tyranny of Metrics*"
  - "Robert S. Kaplan & David P. Norton — *The Balanced Scorecard*"
  - "W. Edwards Deming — *Out of the Crisis*"
  - "Robert Simons — *Levers of Control*"
limits:
  - "No todo lo importante se mide con precisión (confianza, cultura, reputación)."
evidence_signals:
  - "decisión que informa cada indicador"
  - "ficha con definición, fuente y dueño"
  - "contrapeso frente a manipulación"
  - "revisión y retiro periódicos"
