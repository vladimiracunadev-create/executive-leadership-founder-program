<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s254 d-s254" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s254">Clase 254 · Persona natural o jurídica: qué comparar</title>
<desc id="d-s254">Cinco decisiones para comparar persona natural y persona jurídica, qué se pregunta en cada una y dónde se verifica.</desc>
<defs><marker id="p-s254" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 254 · Persona natural o jurídica: qué comparar</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Registro de Empresas y Sociedades · SII · LeyChile</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Decisión</text>
<text x="279.692" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Qué se pregunta</text>
<text x="696" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Dónde se verifica</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Responsabilidad</text>
<text x="279.692" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué patrimonio responde por las deudas del negocio?</text>
<text x="696" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >LeyChile y asesoría legal.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Socios y capital</text>
<text x="279.692" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Habrá socios o aportes externos ahora o pronto?</text>
<text x="696" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Registro de Empresas y Sociedades.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Administración y costos</text>
<text x="279.692" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué trámites y registros exige cada alternativa?</text>
<text x="696" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >RES, SII y contador.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Contratos y clientes</text>
<text x="279.692" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Quién firma y a nombre de quién se factura?</text>
<text x="696" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Asesoría legal y SII.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Tributación</text>
<text x="279.692" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Cómo tributa cada alternativa en este caso?</text>
<text x="696" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >SII y asesoría contable.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La forma jurídica no protege frente a toda responsabilidad ni corrige una mala gestión. La elección depende de hechos y se confirma con</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >fuentes oficiales y profesionales.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La decisión se registra con la fecha y la fuente consultada.</text>
</svg>
