<text x="571" y="251" font-size="11" font-weight="600" fill="#59636e" text-anchor="start" >revisar y volver a empezar</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="41" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="52" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >problem frequency</text>
<rect x="181.3" y="456.24" width="81.2" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="194.3" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="205.3" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >severity</text>
<rect x="272.5" y="456.24" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="285.5" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="296.5" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >current workaround</text>
<rect x="432.7" y="456.24" width="129.5" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="445.7" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="456.7" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >desired outcome</text>
<rect x="572.2" y="456.24" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="585.2" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="596.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >segment prevalence</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Un outcome demasiado abstracto no guía decisiones; uno demasiado específico congela la solución. Debe expresar progreso sin</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >predeterminar la interfaz.</text>
