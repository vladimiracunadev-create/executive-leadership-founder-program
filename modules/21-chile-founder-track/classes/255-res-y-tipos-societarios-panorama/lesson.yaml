  - "Interpretar shareholder flexibility, representation clarity, capital registration sin atribuir causalidad automática."
  - "Resolver el caso de rES y tipos societarios: panorama con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
