<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 473.81" width="1040" role="img" aria-labelledby="t-s61 d-s61" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s61">Clase 061 · Cómo el diseño del cargo produce motivación</title>
<desc id="d-s61">Modelo de características del puesto: cinco características centrales producen tres estados psicológicos y de ellos resultados personales y laborales.</desc>
<defs><marker id="p-s61" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="473.81" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 061 · Cómo el diseño del cargo produce motivación</text>
<text x="1012" y="43" font-size="12" font-weight="400" fill="#59636e" text-anchor="end" >Hackman &amp; Oldham (1976) · Morgeson &amp; Humphrey (2006)</text>
<rect x="28" y="96" width="314.667" height="234.75" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M28.0,136 V108 a12,12 0 0 1 12,-12 H330.6666666666667 a12,12 0 0 1 12,12 V136 Z" fill="#0969da"/>
<text x="44" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Cinco características del cargo</text>
<circle cx="50.0" cy="154" r="4" fill="#0969da"/>
<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Variedad de habilidades.</text>
<circle cx="50.0" cy="181.25" r="4" fill="#0969da"/>
<text x="64" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Identidad de la tarea: hacer algo</text>
<text x="64" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >completo.</text>
<circle cx="50.0" cy="225.75" r="4" fill="#0969da"/>
<text x="64" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Significado: efecto en otras</text>
<text x="64" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >personas.</text>
<circle cx="50.0" cy="270.25" r="4" fill="#0969da"/>
<text x="64" y="274.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Autonomía para decidir cómo.</text>
<circle cx="50.0" cy="297.5" r="4" fill="#0969da"/>
<text x="64" y="301.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Retroalimentación del propio trabajo.</text>
<rect x="362.667" y="96" width="314.667" height="234.75" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<path d="M362.6666666666667,136 V108 a12,12 0 0 1 12,-12 H665.3333333333334 a12,12 0 0 1 12,12 V136 Z" fill="#8250df"/>
<text x="378.667" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Tres estados psicológicos</text>
<circle cx="384.6666666666667" cy="154" r="4" fill="#8250df"/>
<text x="398.667" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Percibir el trabajo como</text>
<text x="398.667" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >significativo.</text>
<circle cx="384.6666666666667" cy="198.5" r="4" fill="#8250df"/>
<text x="398.667" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Sentirse responsable de los</text>
<text x="398.667" y="219.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >resultados.</text>
<circle cx="384.6666666666667" cy="243.0" r="4" fill="#8250df"/>
<text x="398.667" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Conocer los resultados reales.</text>
<rect x="697.333" y="96" width="314.667" height="234.75" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M697.3333333333334,136 V108 a12,12 0 0 1 12,-12 H1000.0 a12,12 0 0 1 12,12 V136 Z" fill="#1a7f37"/>
<text x="713.333" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Resultados</text>
<circle cx="719.3333333333334" cy="154" r="4" fill="#1a7f37"/>
<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Motivación interna y satisfacción.</text>
<circle cx="719.3333333333334" cy="181.25" r="4" fill="#1a7f37"/>
<text x="733.333" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Desempeño de calidad.</text>
<circle cx="719.3333333333334" cy="208.5" r="4" fill="#1a7f37"/>
<text x="733.333" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Menor ausentismo y rotación.</text>
<rect x="28" y="346.75" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="368.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El diseño del cargo es una palanca de gestión: cambiar el trabajo puede motivar más que cambiar a la persona. Morgeson y Humphrey</text>
<text x="44" y="386" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >amplían el modelo con más dimensiones, incluidas las sociales.</text>
<text x="28" y="433.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >El efecto depende de la necesidad de crecimiento de cada persona y de que el cargo pueda rediseñarse sin romper el proceso.</text>
</svg>
