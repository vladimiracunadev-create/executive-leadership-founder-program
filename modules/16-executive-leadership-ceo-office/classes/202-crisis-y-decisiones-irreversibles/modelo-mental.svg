<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ejercicio que imagina fracaso futuro para revelar</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >riesgos</text>
<circle cx="38" cy="242.12" r="5" fill="#cf222e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >red team</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grupo que desafía supuestos y plan</text>
