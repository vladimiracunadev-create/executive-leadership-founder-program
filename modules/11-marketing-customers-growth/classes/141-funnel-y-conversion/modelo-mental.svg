<text x="461.714" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >35,0 %</text>
<text x="630.4" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Guía de inicio y primer resultado rápido.</text>
