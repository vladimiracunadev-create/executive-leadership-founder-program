<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 436.56" width="1040" role="img" aria-labelledby="t-s50 d-s50" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s50">Clase 050 · Qué debe decir un acta de equipo</title>
<desc id="d-s50">Cinco partes de un team charter: propósito, objetivos, roles, normas y decisiones, con el criterio de cada una.</desc>
<defs><marker id="p-s50" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="436.56" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 050 · Qué debe decir un acta de equipo</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Hackman (2002) · Locke &amp; Latham (2002)</text>
<rect x="28" y="96" width="231" height="197.5" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M28.0,136 V108 a12,12 0 0 1 12,-12 H247.0 a12,12 0 0 1 12,12 V136 Z" fill="#0969da"/>
<text x="44" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Propósito</text>
<circle cx="50.0" cy="154" r="4" fill="#0969da"/>
<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Por qué existe el equipo.</text>
<circle cx="50.0" cy="181.25" r="4" fill="#0969da"/>
<text x="64" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Para quién crea valor.</text>
<circle cx="50.0" cy="208.5" r="4" fill="#0969da"/>
<text x="64" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Se entiende en una frase.</text>
<rect x="279" y="96" width="231" height="197.5" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<path d="M279.0,136 V108 a12,12 0 0 1 12,-12 H498.0 a12,12 0 0 1 12,12 V136 Z" fill="#1a7f37"/>
<text x="295" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Objetivos</text>
<circle cx="301.0" cy="154" r="4" fill="#1a7f37"/>
<text x="315" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Específicos y exigentes.</text>
<circle cx="301.0" cy="181.25" r="4" fill="#1a7f37"/>
<text x="315" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Con un resultado medible.</text>
<circle cx="301.0" cy="208.5" r="4" fill="#1a7f37"/>
<text x="315" y="212.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Con una fecha de</text>
<text x="315" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >revisión.</text>
<rect x="530" y="96" width="231" height="197.5" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M530.0,136 V108 a12,12 0 0 1 12,-12 H749.0 a12,12 0 0 1 12,12 V136 Z" fill="#bc4c00"/>
<text x="546" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Roles</text>
<circle cx="552.0" cy="154" r="4" fill="#bc4c00"/>
<text x="566" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Quién decide qué.</text>
<circle cx="552.0" cy="181.25" r="4" fill="#bc4c00"/>
<text x="566" y="185.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Quién ejecuta y quién se</text>
<text x="566" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >informa.</text>
<circle cx="552.0" cy="225.75" r="4" fill="#bc4c00"/>
<text x="566" y="229.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Sin solapes ni vacíos.</text>
<rect x="781" y="96" width="231" height="197.5" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<path d="M781.0,136 V108 a12,12 0 0 1 12,-12 H1000.0 a12,12 0 0 1 12,12 V136 Z" fill="#8250df"/>
<text x="797" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Normas</text>
<circle cx="803.0" cy="154" r="4" fill="#8250df"/>
<text x="817" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Cómo nos tratamos al</text>
<text x="817" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >discrepar.</text>
<circle cx="803.0" cy="198.5" r="4" fill="#8250df"/>
<text x="817" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Cómo se reportan</text>
<text x="817" y="219.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >problemas.</text>
<circle cx="803.0" cy="243.0" r="4" fill="#8250df"/>
<text x="817" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Qué hacemos con los</text>
<text x="817" y="264.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >errores.</text>
<rect x="28" y="309.5" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="331.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Locke y Latham resumen décadas de investigación: las metas específicas y difíciles mejoran el desempeño más que las vagas o las de «haz</text>
<text x="44" y="348.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >lo mejor que puedas», si hay compromiso y retroalimentación.</text>
<text x="28" y="396" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La mejora por metas depende de la complejidad de la tarea y del compromiso; metas excesivas pueden incentivar atajos.</text>
</svg>
