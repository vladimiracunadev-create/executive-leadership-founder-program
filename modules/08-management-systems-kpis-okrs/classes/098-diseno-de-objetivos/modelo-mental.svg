<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 458.42" width="1040" role="img" aria-labelledby="t-s98 d-s98" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s98">Clase 098 · Un objetivo que se puede juzgar</title>
<desc id="d-s98">Cuatro características de un objetivo bien formulado, con un ejemplo débil y su versión corregida.</desc>
<defs><marker id="p-s98" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="458.42" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 098 · Un objetivo que se puede juzgar</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Locke &amp; Latham (2002) · Ordóñez et al. (2009) · Doerr</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Característica</text>
<text x="260.299" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Versión débil</text>
<text x="583.403" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Versión que se puede juzgar</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Específico</text>
<text x="260.299" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Mejorar la atención al cliente.</text>
<text x="583.403" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Responder el primer contacto en menos de 4 horas hábiles.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Medible</text>
<text x="260.299" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Aumentar las ventas.</text>
<text x="583.403" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Subir de 120 a 150 contratos mensuales.</text>
<rect x="28" y="209.12" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Con plazo y dueño</text>
<text x="260.299" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Reducir los reclamos.</text>
<text x="583.403" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Bajar de 9 % a 5 % antes del cierre del trimestre; responde la</text>
<text x="583.403" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >jefa de postventa.</text>
<rect x="28" y="262.24" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="282.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Con resultado y límites</text>
<text x="260.299" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cerrar 30 ventas, cueste lo que cueste.</text>
<text x="583.403" y="282.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cerrar 30 ventas sin bajar el margen de 22 % ni aumentar las</text>
<text x="583.403" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >devoluciones.</text>
<rect x="28" y="331.36" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="353.36" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Los objetivos exigentes y específicos mejoran el desempeño en tareas bien comprendidas, pero un objetivo mal diseñado puede empujar a</text>
<text x="44" y="370.61" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >conductas dañinas. Por eso se acompañan de límites.</text>
<text x="28" y="417.86" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Con tareas nuevas o complejas, fijar el aprendizaje como objetivo funciona mejor que fijar un número de resultado.</text>
</svg>
