  - "Eliyahu M. Goldratt & Jeff Cox — *The Goal*"
  - "W. Edwards Deming — *Out of the Crisis*"
limits:
  - "El modelo de entradas y salidas simplifica: deja fuera poder, cultura, incentivos y emociones, que afectan el funcionamiento real."
evidence_signals:
  - "proceso seguido de punta a punta"
  - "medida común con dueño"
  - "metas locales contrastadas"
