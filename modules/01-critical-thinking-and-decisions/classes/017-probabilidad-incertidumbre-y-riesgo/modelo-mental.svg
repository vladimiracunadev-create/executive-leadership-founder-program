<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >estimar impacto y reversibilidad</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
