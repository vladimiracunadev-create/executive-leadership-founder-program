<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Estandarizar demasiado pronto puede perder clientes estratégicos. Acepta custom work cuando compra aprendizaje o ventaja, pero</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cuantifica costo y criterio de salida.</text>
