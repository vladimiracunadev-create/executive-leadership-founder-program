id: 211
part: 17
title: "Board pack y calidad de información"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "separar propiedad, administración y supervisión para gobernar estrategia, riesgo y sucesión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Diseñar un pack que parta de las preguntas del directorio."
  - "Seleccionar la información material y retirar la que no lo es."
  - "Explicar variaciones y causas con una narrativa causal."
  - "Separar decisiones de actualizaciones y distribuir con antelación."
  - "Medir la calidad del pack y cerrar la lista de acciones."
deliverable: "operating-improvement-brief.md"
references:
  - "Ram Charan — *Boards That Deliver*"
  - "Bob Tricker — *Corporate Governance*"
  - "Richard Leblanc & James Gillies — *Inside the Boardroom*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "Michael C. Mankins & Eric Garton — *Time, Talent, Energy*"
limits:
  - "Reducir páginas no basta: un pack breve puede omitir riesgos."
evidence_signals:
  - "pack diseñado desde las preguntas del directorio"
  - "decisiones separadas de informes"
  - "narrativa causal de variaciones"
  - "calidad del pack medida"
