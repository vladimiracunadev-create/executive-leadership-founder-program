<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 662.6" width="1040" role="img" aria-labelledby="t-g1 d-g1" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g1">Ficha visual de la clase 001: Qué significa liderar sin cargo formal</title>
<desc id="d-g1">Conceptos: influencia sin autoridad; legitimidad; iniciativa; alineamiento; escalamiento. Método: detectar una brecha relevante → formular un resultado y no solo una actividad → construir apoyo con evidencia y contexto → proponer una acción proporcional a la autoridad disponible → cerrar el ciclo informando resultado y aprendizaje.</desc>
<defs><marker id="p-g1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="662.6" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 001 · Qué significa liderar sin cargo formal</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 00 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >influencia sin autoridad</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad de mover una decisión mediante credibilidad,</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >evidencia y relación, no por poder formal</text>
<circle cx="38" cy="184.12" r="5" fill="#1a7f37"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >legitimidad</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >permiso social y profesional que otros conceden porque</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >perciben competencia e intención…</text>
<circle cx="38" cy="256.24" r="5" fill="#1a7f37"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >iniciativa</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >acción que reduce una brecha sin esperar instrucciones</text>
<text x="54" y="295.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >detalladas</text>
<circle cx="38" cy="328.36" r="5" fill="#1a7f37"/>
<text x="54" y="333.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >alineamiento</text>
<text x="54" y="351.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >grado en que personas distintas entienden el mismo</text>
<text x="54" y="367.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >resultado, prioridades y restricciones</text>
<circle cx="38" cy="400.48" r="5" fill="#1a7f37"/>
<text x="54" y="405.48" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >escalamiento</text>
<text x="54" y="423.48" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >acto de elevar una decisión cuando excede autoridad,</text>
<text x="54" y="440.04" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >riesgo o impacto propio</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >detectar una brecha relevante</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >formular un resultado y no solo una</text>
<text x="566" y="315.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >actividad</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >construir apoyo con evidencia y</text>
<text x="628" y="257.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >contexto</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >proponer una acción proporcional a</text>
<text x="690" y="199.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >la autoridad disponible</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cerrar el ciclo informando</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >resultado y aprendizaje</text>
<text x="28" y="486.6" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="498.6" width="191.6" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="52" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >aceptación de propuestas</text>
<rect x="229.6" y="498.6" width="233" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="242.6" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="253.6" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >tiempo desde problema a acción</text>
<rect x="472.6" y="498.6" width="226.1" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="485.6" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="496.6" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >retrabajo por desalineamiento</text>
<rect x="708.7" y="498.6" width="198.5" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="721.7" cy="511.6" r="3.5" fill="#1a7f37"/>
<text x="732.7" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >confianza de stakeholders</text>
<rect x="28" y="530.6" width="288.2" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="543.6" r="3.5" fill="#1a7f37"/>
<text x="52" y="548.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >escalamientos correctos versus tardíos</text>
<rect x="28" y="576.6" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="576.6" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="596.6" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="614.6" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Influir sin autoridad no autoriza a saltarse derechos de decisión. La iniciativa madura reduce fricción y propone; no captura</text>
<text x="48" y="631.85" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >decisiones que pertenecen legítimamente a otra función.</text>
</svg>
