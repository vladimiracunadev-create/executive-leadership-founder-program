<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >meses que la empresa puede operar al burn proyectado</text>
<circle cx="38" cy="242.12" r="5" fill="#59636e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >burn rate</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >consumo neto de caja por periodo</text>
