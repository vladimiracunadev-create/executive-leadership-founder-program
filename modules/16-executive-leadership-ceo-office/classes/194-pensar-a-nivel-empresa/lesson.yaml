id: 194
part: 16
title: "Pensar a nivel empresa"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Mapear los motores de valor de la empresa: caja, retorno sobre el capital y ventaja."
  - "Identificar la restricción que limita el desempeño del sistema completo."
  - "Comparar el impacto de una decisión sobre varias funciones con números."
  - "Equilibrar resultados de corto plazo y capacidades de largo plazo."
  - "Comunicar el trade-off elegido, incluyendo lo que se sacrifica."
deliverable: "leadership-decision-brief.md"
references:
  - "Richard Rumelt — *Good Strategy/Bad Strategy*"
  - "Eliyahu M. Goldratt & Jeff Cox — *The Goal*"
  - "Robert S. Kaplan & David P. Norton — *Strategy Maps*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Donella H. Meadows — *Thinking in Systems*"
limits:
  - "La perspectiva de empresa no justifica ignorar la rendición de cuentas local: las funciones necesitan métricas propias, subordinadas a los objetivos del sistema."
evidence_signals:
  - "motores de valor mapeados"
  - "restricción del sistema identificada"
  - "impactos entre funciones comparados"
  - "trade-off comunicado con su costo"
