<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 498.42" width="1040" role="img" aria-labelledby="t-s112 d-s112" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s112">Clase 112 · Por qué la utilidad no es caja</title>
<desc id="d-s112">Partidas que separan la utilidad neta del flujo de caja operativo, con su efecto y la razón.</desc>
<defs><marker id="p-s112" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="498.42" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 112 · Por qué la utilidad no es caja</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Palepu, Healy &amp; Peek · Penman · Brealey, Myers &amp; Allen</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Partida</text>
<text x="342.769" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Efecto en la caja</text>
<text x="569.846" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Por qué</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Utilidad neta</text>
<text x="342.769" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Punto de partida</text>
<text x="569.846" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Incluye ingresos aún no cobrados y gastos aún no pagados.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >+ Depreciación y amortización</text>
<text x="342.769" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se suma</text>
<text x="569.846" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Es un gasto contable que no sale de caja en el período.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >− Aumento de cuentas por cobrar</text>
<text x="342.769" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Resta</text>
<text x="569.846" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se vendió, pero el dinero aún no entró.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >− Aumento de inventario</text>
<text x="342.769" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Resta</text>
<text x="569.846" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se pagó o comprometió mercadería que aún no se vendió.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >+ Aumento de cuentas por pagar</text>
<text x="342.769" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Suma</text>
<text x="569.846" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se recibió el bien, pero todavía no se pagó.</text>
<rect x="28" y="318.8" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="338.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >= Flujo de caja operativo</text>
<text x="342.769" y="338.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Resultado</text>
<text x="569.846" y="338.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >La caja que generó el negocio antes de invertir y financiar.</text>
<rect x="28" y="371.36" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="393.36" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Una empresa que crece rápido suele consumir caja porque invierte en cuentas por cobrar e inventario antes de cobrar: puede quebrar con</text>
<text x="44" y="410.61" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >utilidades.</text>
<text x="28" y="457.86" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los signos dependen del método de presentación (directo o indirecto); la lógica es la misma.</text>
</svg>
