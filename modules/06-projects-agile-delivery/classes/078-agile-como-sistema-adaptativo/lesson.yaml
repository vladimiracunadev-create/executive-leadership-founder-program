id: 78
part: 06
title: "Agile como sistema adaptativo"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir iteración de feedback loop mediante evidencia observable."
  - "Aplicar la secuencia: evaluar incertidumbre de problema y solución → reducir batch de trabajo → entregar incremento verificable → inspeccionar outcome y proceso → adaptar backlog y plan."
  - "Interpretar lead time, frecuencia de feedback, rework sin atribuir causalidad automática."
  - "Resolver el caso de agile como sistema adaptativo con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Project Management Institute — *A Guide to the Project Management Body of Knowledge (PMBOK Guide)*"
  - "Harold Kerzner — *Project Management*"
  - "Michael Hammer & James Champy — *Reengineering the Corporation*"
  - "Ken Schwaber & Jeff Sutherland — *The Scrum Guide*"
  - "Nicole Forsgren, Jez Humble & Gene Kim — *Accelerate*"
  - "Atul Gawande — *The Checklist Manifesto*"
limits:
  - "Agile no elimina planificación, arquitectura, compliance ni compromisos. Significa planificar de manera adaptativa donde el costo de aprender tarde es alto."
evidence_signals:
  - "lead time"
  - "frecuencia de feedback"
  - "rework"
  - "release cadence"
  - "outcome por iteración"
