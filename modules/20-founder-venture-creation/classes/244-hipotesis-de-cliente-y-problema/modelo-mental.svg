<title id="t-g244">Ficha visual de la clase 244: Hipótesis de cliente y problema</title>
<desc id="d-g244">Conceptos: customer hypothesis; problem hypothesis; falsifiability; early adopter; assumption map. Método: especificar segmento y contexto → redactar problema y consecuencia → listar evidencia esperada y contraria → priorizar supuesto de mayor riesgo → diseñar test y actualizar.</desc>
