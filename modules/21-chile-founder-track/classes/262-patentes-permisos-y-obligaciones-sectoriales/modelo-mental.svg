<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g262 d-g262" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g262">Ficha visual de la clase 262: Patentes, permisos y obligaciones sectoriales</title>
<desc id="d-g262">Conceptos: municipal patent; sector permit; sanitary authorization; permit dependency; renewal. Método: describir actividad y localización → identificar autoridades competentes → mapear permisos y orden → obtener evidencia antes de operar → controlar renovaciones y cambios.</desc>
<defs><marker id="p-g262" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="602.36" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#59636e"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 262 · Patentes, permisos y obligaciones sectoriales</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 21 · Fundador, propietario e independencia</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#59636e"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >municipal patent</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >autorización o tributo municipal asociado al ejercicio</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >de actividades según normativa</text>
<circle cx="38" cy="184.12" r="5" fill="#59636e"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >sector permit</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >autorización específica de una autoridad por tipo de</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >actividad</text>
<circle cx="38" cy="256.24" r="5" fill="#59636e"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >sanitary authorization</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >permiso sanitario cuando la actividad lo requiere</text>
<circle cx="38" cy="314.24" r="5" fill="#59636e"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >permit dependency</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >relación donde iniciar operación depende de</text>
<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >autorización previa</text>
<circle cx="38" cy="386.36" r="5" fill="#59636e"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >renewal</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >renovación periódica de un permiso o registro</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<circle cx="486.0" cy="120" r="11" fill="#59636e"/>
<text x="486" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="504" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >describir</text>
<text x="504" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >actividad y</text>
<text x="504" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >localización</text>
<rect x="658" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<circle cx="674.0" cy="120" r="11" fill="#59636e"/>
<text x="674" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="692" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >identificar</text>
<text x="692" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >autoridades</text>
<text x="692" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >competentes</text>
<rect x="846" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<circle cx="862.0" cy="120" r="11" fill="#59636e"/>
<text x="862" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="880" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >mapear permisos y</text>
<text x="880" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >orden</text>
<rect x="846" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<circle cx="862.0" cy="240" r="11" fill="#59636e"/>
<text x="862" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="880" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >obtener evidencia</text>
<text x="880" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >antes de operar</text>
<rect x="658" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<circle cx="674.0" cy="240" r="11" fill="#59636e"/>
<text x="674" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="692" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >controlar</text>
<text x="692" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >renovaciones y</text>
<text x="692" y="276.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >cambios</text>
