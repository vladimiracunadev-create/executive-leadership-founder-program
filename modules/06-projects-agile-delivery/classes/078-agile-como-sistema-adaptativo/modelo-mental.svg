<title id="t-g78">Ficha visual de la clase 078: Agile como sistema adaptativo</title>
<desc id="d-g78">Conceptos: iteración; feedback loop; batch size; adaptación; empiricism. Método: evaluar incertidumbre de problema y solución → reducir batch de trabajo → entregar incremento verificable → inspeccionar outcome y proceso → adaptar backlog y plan.</desc>
