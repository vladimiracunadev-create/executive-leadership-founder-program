id: 33
part: 02
title: "Persuasión ética e influencia"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir reciprocidad de prueba social mediante evidencia observable."
  - "Aplicar la secuencia: definir interés legítimo de la audiencia → seleccionar evidencia relevante → hacer visibles costos y alternativas → usar influencia sin ocultar información material → dejar espacio real para disentir o rechazar."
  - "Interpretar conversión informada, objeciones resueltas sin ocultarlas, retractaciones posteriores sin atribuir causalidad automática."
  - "Resolver el caso de persuasión ética e influencia con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Chip Heath & Dan Heath — *Made to Stick*"
  - "Robert B. Cialdini — *Influence*"
  - "Kerry Patterson et al. — *Crucial Conversations*"
  - "Edgar H. Schein — *Humble Inquiry*"
  - "Chris Voss & Tahl Raz — *Never Split the Difference*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
limits:
  - "La influencia deja de ser ética cuando usa falsedad, urgencia fabricada, amenaza impropia o vulnerabilidad. El resultado comercial no justifica deteriorar autonomía o confianza."
evidence_signals:
  - "conversión informada"
  - "objeciones resueltas sin ocultarlas"
  - "retractaciones posteriores"
  - "quejas por presión"
  - "calidad de consentimiento"
