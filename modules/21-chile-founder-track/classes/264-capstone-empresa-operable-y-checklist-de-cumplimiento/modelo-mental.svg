<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 384.81" width="1040" role="img" aria-labelledby="t-s264 d-s264" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s264">Clase 264 · Una empresa operable: existe, opera y se mantiene</title>
<desc id="d-s264">Tres bloques de una checklist de empresa operable: existe (sociedad, SII, permisos), opera (laboral, propiedad intelectual, contratos y bancos) y se mantiene (calendario, controles y responsables).</desc>
<defs><marker id="p-s264" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
