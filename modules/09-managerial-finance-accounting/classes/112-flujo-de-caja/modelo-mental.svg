<text x="351.7" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cash conversion</text>
<rect x="467.2" y="456.24" width="88.1" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="480.2" cy="469.24" r="3.5" fill="#8250df"/>
<text x="491.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >burn rate</text>
<rect x="565.3" y="456.24" width="101.9" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="578.3" cy="469.24" r="3.5" fill="#8250df"/>
<text x="589.3" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >ending cash</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No existe una única definición universal de free cash flow o burn. Declara fórmula y propósito antes de comparar; evita tratar caja</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >puntual como capacidad recurrente.</text>
