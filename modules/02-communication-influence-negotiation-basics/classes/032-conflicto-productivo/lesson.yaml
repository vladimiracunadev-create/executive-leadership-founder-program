id: 32
part: 02
title: "Conflicto productivo"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir conflicto de tarea y de relación."
  - "Explicar qué mostró la investigación sobre sus efectos y bajo qué condiciones."
  - "Conducir un debate de tarea separando personas y problema."
  - "Pasar de posiciones a intereses en una discusión."
  - "Detectar cuando un conflicto de tarea se está contaminando de conflicto personal."
deliverable: "leadership-decision-brief.md"
references:
  - "Karen A. Jehn — *A Multimethod Examination of the Benefits and Detriments of Intragroup Conflict*"
  - "Amy C. Edmondson — *The Fearless Organization*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Kerry Patterson et al. — *Crucial Conversations*"
limits:
  - "El estudio de Jehn es una investigación de grupos específicos y la relación entre conflicto de tarea y desempeño depende del tipo de tarea y de otras variables; no hay un nivel óptimo universal."
evidence_signals:
  - "tipo de conflicto clasificado"
  - "posiciones e intereses explícitos"
  - "decisión con responsable"
  - "quién calla en el equipo"
