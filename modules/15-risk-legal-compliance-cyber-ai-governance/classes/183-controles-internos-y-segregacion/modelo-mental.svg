<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g183 d-g183" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g183">Ficha visual de la clase 183: Controles internos y segregación</title>
<desc id="d-g183">Conceptos: internal control; segregation of duties; preventive control; detective control; control owner. Método: mapear riesgo y objetivo → identificar puntos de fraude o error → diseñar control preventivo y detective → separar funciones incompatibles → testear evidencia y remediar fallas.</desc>
<defs><marker id="p-g183" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#bc4c00"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 183 · Controles internos y segregación</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 15 · Dirección, estrategia y organización</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#bc4c00"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >internal control</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >proceso diseñado para dar seguridad razonable sobre</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >objetivos</text>
<circle cx="38" cy="184.12" r="5" fill="#bc4c00"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >segregation of duties</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >separación de funciones incompatibles para reducir</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >fraude o error</text>
<circle cx="38" cy="256.24" r="5" fill="#bc4c00"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >preventive control</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >control que evita ocurrencia</text>
<circle cx="38" cy="314.24" r="5" fill="#bc4c00"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >detective control</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >control que identifica después de ocurrir</text>
<circle cx="38" cy="372.24" r="5" fill="#bc4c00"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >control owner</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >rol responsable de diseño y operación del control</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="104" width="542" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.98"/>
<text x="484" y="124" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >1</text>
<text x="504" y="124" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >mapear riesgo y objetivo</text>
<rect x="487" y="160" width="508" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.9099999999999999"/>
<text x="501" y="180" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >2</text>
<text x="521" y="180" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >identificar puntos de fraude o error</text>
<rect x="504" y="216" width="474" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.84"/>
<text x="518" y="236" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >3</text>
<text x="538" y="236" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >diseñar control preventivo y detective</text>
<rect x="521" y="272" width="440" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.77"/>
<text x="535" y="292" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >4</text>
<text x="555" y="292" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >separar funciones incompatibles</text>
<rect x="538" y="328" width="406" height="50" rx="9" fill="#bc4c00" stroke="#bc4c00" stroke-width="0" fill-opacity="0.7"/>
<text x="552" y="348" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >5</text>
<text x="572" y="348" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >testear evidencia y remediar fallas</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="41" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="52" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >control exceptions</text>
<rect x="188.2" y="456.24" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="201.2" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="212.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >SoD conflicts</text>
<rect x="313.9" y="456.24" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="326.9" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="337.9" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >test failure rate</text>
<rect x="467.2" y="456.24" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="480.2" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="491.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >override count</text>
<rect x="599.8" y="456.24" width="170.9" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="612.8" cy="469.24" r="3.5" fill="#bc4c00"/>
<text x="623.8" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >reconciliation breaks</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Separar toda función puede ser inviable en equipos pequeños. Usa controles compensatorios —revisión independiente, límites, alertas,</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >reconciliación— proporcionales al riesgo.</text>
</svg>
