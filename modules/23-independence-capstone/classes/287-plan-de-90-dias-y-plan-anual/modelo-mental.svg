<text x="44" y="279.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Planificar no garantiza demanda. Las apuestas se mantienen pequeñas hasta tener evidencia y se protege el runway: no se llena un año de</text>
