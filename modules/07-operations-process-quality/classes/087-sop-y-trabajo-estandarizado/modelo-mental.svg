<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 461.86" width="1040" role="img" aria-labelledby="t-s87 d-s87" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s87">Clase 087 · Qué hace útil a un procedimiento estándar</title>
<desc id="d-s87">Elementos de un procedimiento operativo estándar, para qué sirve cada uno y cómo se comprueba que funciona.</desc>
<defs><marker id="p-s87" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="461.86" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 087 · Qué hace útil a un procedimiento estándar</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Ohno (1988) · Liker (2004) · Deming (1986)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Elemento</text>
<text x="286" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Para qué sirve</text>
<text x="655" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cómo se comprueba</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Propósito y alcance</text>
<text x="286" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Evita aplicarlo donde no corresponde.</text>
<text x="655" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cualquiera puede decir cuándo no aplica.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Pasos y secuencia</text>
<text x="286" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Hace repetible el trabajo y permite comparar.</text>
<text x="655" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Una persona nueva lo sigue sin ayuda.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Puntos de control</text>
<text x="286" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Detecta el error donde nace.</text>
<text x="655" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Hay una señal visible de pasar o no pasar.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Responsable y versión</text>
<text x="286" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Evita copias obsoletas.</text>
<text x="655" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se sabe quién lo cambia y cuándo.</text>
<rect x="28" y="282.24" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="302.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Entrenamiento y auditoría</text>
<text x="286" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cierra la brecha entre lo escrito y lo hecho.</text>
<text x="655" y="302.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se observa el trabajo real, no solo el papel.</text>
<rect x="28" y="334.8" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="356.8" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Estandarizar no es congelar: el estándar es la mejor forma conocida hoy y la base sobre la que se mejora. Quien hace el trabajo debe</text>
<text x="44" y="374.05" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >participar en escribirlo.</text>
<text x="28" y="421.3" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Un procedimiento que nadie usa es una señal del proceso o de la cultura, no solo del documento.</text>
</svg>
