<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g121 d-g121" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g121">Ficha visual de la clase 121: Ventas como sistema, no como improvisación</title>
<desc id="d-g121">Conceptos: sales process; stage; exit criteria; conversion rate; velocity. Método: definir ICP y proceso comprador → crear etapas con exit criteria → instrumentar conversiones y aging → revisar pérdidas por etapa → mejorar cuello antes de aumentar volumen.</desc>
<defs><marker id="p-g121" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#8250df"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 121 · Ventas como sistema, no como improvisación</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 10 · Gestión de negocio</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#8250df"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >sales process</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >secuencia definida de decisiones y evidencias desde</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >oportunidad hasta cliente</text>
<circle cx="38" cy="184.12" r="5" fill="#8250df"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >stage</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >estado de una oportunidad basado en evidencia, no</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >optimismo</text>
<circle cx="38" cy="256.24" r="5" fill="#8250df"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >exit criteria</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >evidencia mínima para avanzar de etapa</text>
<circle cx="38" cy="314.24" r="5" fill="#8250df"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >conversion rate</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >proporción de oportunidades que pasan entre etapas</text>
<circle cx="38" cy="372.24" r="5" fill="#8250df"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >velocity</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ritmo con que el pipeline se convierte en revenue</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#8250df"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >definir ICP y proceso comprador</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#8250df"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >crear etapas con exit criteria</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#8250df"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >instrumentar conversiones y aging</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#8250df"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >revisar pérdidas por etapa</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#8250df" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#8250df"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#8250df" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >mejorar cuello antes de aumentar</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >volumen</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="41" cy="469.24" r="3.5" fill="#8250df"/>
<text x="52" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >stage conversion</text>
<rect x="174.4" y="456.24" width="81.2" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="187.4" cy="469.24" r="3.5" fill="#8250df"/>
<text x="198.4" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >win rate</text>
<rect x="265.6" y="456.24" width="101.9" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="278.6" cy="469.24" r="3.5" fill="#8250df"/>
<text x="289.6" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >sales cycle</text>
<rect x="377.5" y="456.24" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="390.5" cy="469.24" r="3.5" fill="#8250df"/>
<text x="401.5" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >pipeline velocity</text>
<rect x="530.8" y="456.24" width="101.9" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
<circle cx="543.8" cy="469.24" r="3.5" fill="#8250df"/>
<text x="554.8" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >stage aging</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No todo buyer sigue la misma secuencia. El sistema debe reflejar señales de compra y permitir iteración, no obligar al cliente a</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >comportarse como el CRM.</text>
</svg>
