<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >comprensión de la perspectiva del otro</text>
<circle cx="38" cy="170" r="5" fill="#1a7f37"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >empatía afectiva</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >resonancia emocional con su experiencia</text>
<circle cx="38" cy="228" r="5" fill="#1a7f37"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >compasión</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >motivación por aliviar sufrimiento cuando es apropiado</text>
