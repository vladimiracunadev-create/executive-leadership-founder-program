<text x="142.75" y="373.5" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >lo negociado alimenta el plan de la cuenta</text>
<rect x="28" y="395.5" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="417.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >En ventas enterprise intervienen varios decisores con intereses distintos; ganar al usuario no basta si finanzas, seguridad o legal</text>
<text x="44" y="434.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >bloquean. El plan se actualiza semanalmente.</text>
<text x="28" y="482" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las cifras y plazos del capstone son ilustrativos; los contratos y las cláusulas se revisan con asesoría legal.</text>
</svg>
