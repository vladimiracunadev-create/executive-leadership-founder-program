<title id="t-g234">Ficha visual de la clase 234: Automatización y rediseño de trabajo</title>
<desc id="d-g234">Conceptos: task decomposition; augmentation; straight-through processing; exception handling; job redesign. Método: mapear workflow end-to-end → clasificar tareas por repetición judgment y risk → diseñar target workflow y exceptions → redefinir roles y controles → pilotear y medir productivity y quality.</desc>
