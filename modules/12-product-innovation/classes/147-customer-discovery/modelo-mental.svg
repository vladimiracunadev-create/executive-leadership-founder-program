<text x="539.5" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >switching trigger</text>
<rect x="668.8" y="456.24" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
