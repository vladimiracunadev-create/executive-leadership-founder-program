<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456.81" width="1040" role="img" aria-labelledby="t-s99 d-s99" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s99">Clase 099 · Cuándo los OKR ayudan y cuándo estorban</title>
<desc id="d-s99">Condiciones en que los OKR suelen aportar y condiciones en que conviene otro mecanismo de gestión.</desc>
<defs><marker id="p-s99" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="456.81" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 099 · Cuándo los OKR ayudan y cuándo estorban</text>
<text x="1012" y="43" font-size="12" font-weight="400" fill="#59636e" text-anchor="end" >Doerr (2018, 2022) · Grove (1983) · Ordóñez et al. (2009)</text>
<text x="28" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">SUELEN AYUDAR CUANDO</text>
<rect x="28" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.7" />
<rect x="28.0" y="104" width="6" height="63.25" rx="3" fill="#1a7f37"/>
<text x="46" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Hay que alinear esfuerzos</text>
<text x="46" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Varios equipos deben empujar en la misma dirección.</text>
<rect x="28" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.7" />
<rect x="28.0" y="177.25" width="6" height="63.25" rx="3" fill="#0969da"/>
<text x="46" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >El foco se dispersa</text>
<text x="46" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Hay demasiadas prioridades y se necesitan pocas apuestas.</text>
<rect x="28" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.7" />
<rect x="28.0" y="250.5" width="6" height="63.25" rx="3" fill="#8250df"/>
<text x="46" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se aprende midiendo</text>
<text x="46" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Los resultados clave se revisan y se ajustan a menudo.</text>
<text x="532" y="90" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">SUELEN ESTORBAR CUANDO</text>
<rect x="532" y="104" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.7" />
<rect x="532.0" y="104" width="6" height="63.25" rx="3" fill="#cf222e"/>
<text x="550" y="126" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Se usan para evaluar personas</text>
<text x="550" y="144" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Se esconden metas ambiciosas y se fijan metas seguras.</text>
<rect x="532" y="177.25" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="1.7" />
<rect x="532.0" y="177.25" width="6" height="63.25" rx="3" fill="#bc4c00"/>
<text x="550" y="199.25" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Son una lista de tareas</text>
<text x="550" y="217.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Los resultados clave son actividades, no cambios.</text>
<rect x="532" y="250.5" width="480" height="63.25" rx="10" fill="#ffffff" stroke="#59636e" stroke-width="1.7" />
<rect x="532.0" y="250.5" width="6" height="63.25" rx="3" fill="#59636e"/>
<text x="550" y="272.5" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Hay trabajo de rutina</text>
<text x="550" y="290.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Operar bien exige KPI estables, no apuestas trimestrales.</text>
<rect x="28" y="329.75" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="351.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Los OKR son una forma de fijar y revisar objetivos, no un reemplazo de la estrategia ni de los indicadores de operación. Sin una</text>
<text x="44" y="369" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >estrategia que priorice, solo ordenan el desorden.</text>
<text x="28" y="416.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La evidencia sobre OKR es mayormente de casos publicados por quienes los practican; se evalúa en el propio contexto.</text>
</svg>
