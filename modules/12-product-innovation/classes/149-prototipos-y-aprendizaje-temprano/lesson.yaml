  - "Diseñar una prueba con usuarios con tareas, observación y criterios."
  - "Interpretar los resultados distinguiendo problemas de usabilidad, de valor y de viabilidad."
  - "Decidir cuándo parar, iterar o construir."
deliverable: "product-evidence-brief.md"
references:
  - "Dan Olsen — *The Lean Product Playbook*"
