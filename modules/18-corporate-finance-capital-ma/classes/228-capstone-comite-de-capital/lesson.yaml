id: 228
part: 18
title: "Capstone: comité de capital"
duration_minutes: 150
level: "Etapa 5 — CEO → Capital allocator"
outcome: "decidir estructura de capital, valoración, fundraising y transacciones"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir capital allocation framework de capital budget mediante evidencia observable."
  - "Aplicar la secuencia: establecer cash floor y constraints → comparar oportunidades por return y risk → considerar strategic options → asignar capital y talent → revisar post-investment y recycle."
  - "Interpretar ROIC, FCF, capital concentration sin atribuir causalidad automática."
  - "Resolver el caso de capstone: comité de capital con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Stephen Ross, Randolph Westerfield et al. — *Corporate Finance*"
  - "Noam Wasserman — *The Founder's Dilemmas*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Brad Feld & Jason Mendelson — *Venture Deals*"
  - "David Skok — *SaaS Metrics resources*"
limits:
  - "Un framework único no captura todas las opciones, pero comparaciones sin lenguaje común favorecen política. Normaliza economics y declara explícitamente factores estratégicos no cuantificados."
evidence_signals:
  - "ROIC"
  - "FCF"
  - "capital concentration"
  - "post-investment review"
  - "cash headroom"
