id: 244
part: 20
title: "Hipótesis de cliente y problema"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir la hipótesis de cliente de la de problema y escribirlas de forma refutable."
  - "Listar la evidencia esperada y la contraria para cada hipótesis."
  - "Priorizar los supuestos por impacto e incertidumbre."
  - "Diseñar pruebas con umbrales previos y evaluar su capacidad de discriminar."
  - "Decidir si continuar, pivotar o descartar con base en los resultados."
deliverable: "commercial-decision-brief.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "David J. Bland & Alexander Osterwalder — *Testing Business Ideas*"
  - "Eric Ries — *The Lean Startup*"
  - "William R. Kerr, Ramana Nanda & Matthew Rhodes-Kropf — *Entrepreneurship as Experimentation*"
  - "Alexander Osterwalder & Yves Pigneur — *Business Model Generation*"
limits:
  - "Falsar una hipótesis no invalida todo el emprendimiento: permite pivotar el segmento, el problema o la propuesta, y evita el apego a la formulación inicial."
evidence_signals:
  - "hipótesis explícitas y falsables"
  - "riesgo mayor priorizado"
  - "umbral y fecha definidos"
  - "registro del aprendizaje"
