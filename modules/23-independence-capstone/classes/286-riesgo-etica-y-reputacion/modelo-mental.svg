<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620.24" width="1040" role="img" aria-labelledby="t-g286 d-g286" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g286">Ficha visual de la clase 286: Riesgo, ética y reputación</title>
<desc id="d-g286">Conceptos: professional ethics; conflict of interest; confidentiality; reputation risk; scope competence. Método: identificar stakeholders y deberes → declarar conflictos y límites → proteger datos e IP → hacer claims verificables → crear incident y escalation process.</desc>
