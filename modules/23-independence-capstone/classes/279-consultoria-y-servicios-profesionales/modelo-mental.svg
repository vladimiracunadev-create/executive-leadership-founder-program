<text x="44" y="159.26" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Quién tiene el problema y</text>
<text x="44" y="176.51" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >paga por resolverlo.</text>
<path d="M260.5,144.25 L276.5,144.25" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#p-s279)"/>
<rect x="279.5" y="96" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
