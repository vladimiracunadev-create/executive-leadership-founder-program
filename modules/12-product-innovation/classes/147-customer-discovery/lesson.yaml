id: 147
part: 12
title: "Customer discovery"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "convertir problemas de clientes en productos validados y outcomes medibles"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir customer discovery de behavioral evidence mediante evidencia observable."
  - "Aplicar la secuencia: definir hipótesis y segmento → reclutar muestra relevante → preguntar por episodios pasados y conducta → capturar patrones y contradicciones → sintetizar evidencia y decidir siguiente experimento."
  - "Interpretar interviews by segment, problem recurrence, workaround spend sin atribuir causalidad automática."
  - "Resolver el caso de customer discovery con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "product-evidence-brief.md"
references:
  - "Marty Cagan — *Inspired*"
  - "Teresa Torres — *Continuous Discovery Habits*"
  - "Alexander Osterwalder et al. — *Value Proposition Design*"
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
  - "Melissa Perri — *Escaping the Build Trap*"
  - "David J. Bland & Alexander Osterwalder — *Testing Business Ideas*"
limits:
  - "Discovery no produce verdad estadística por sí solo. Entrevistas pequeñas sirven para descubrir mecanismos e hipótesis; la prevalencia y tamaño de mercado requieren triangulación cuantitativa."
evidence_signals:
  - "interviews by segment"
  - "problem recurrence"
  - "workaround spend"
  - "switching trigger"
  - "contradictory evidence"
