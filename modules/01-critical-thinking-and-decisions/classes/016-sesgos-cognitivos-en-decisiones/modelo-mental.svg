<title id="t">Modelo mental de la clase 016: Sesgos cognitivos en decisiones</title>
<desc id="d">1. identificar decisión y sesgos plausibles → 2. obtener estimaciones independientes → 3. usar tasas base antes de historias particulares → 4. crear una voz de desacuerdo o premortem → 5. comparar predicción con resultado sin hindsight</desc>
