id: 171
part: 14
title: "Spans, layers y managerial load"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "diseñar estructura, derechos de decisión, cultura y cambio como un sistema"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir span of control de layer mediante evidencia observable."
  - "Aplicar la secuencia: medir capas y spans reales → segmentar por complejidad del trabajo → cuantificar carga de management → identificar capas sin valor decisional → rediseñar y monitorear calidad de liderazgo."
  - "Interpretar median span, layers to CEO, manager time allocation sin atribuir causalidad automática."
  - "Resolver el caso de spans, layers y managerial load con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "Jay R. Galbraith — *Designing Organizations*"
  - "Edgar H. Schein & Peter A. Schein — *Organizational Culture and Leadership*"
  - "John P. Kotter — *Leading Change*"
  - "Frederic Laloux — *Reinventing Organizations*"
  - "Stanley McChrystal et al. — *Team of Teams*"
  - "John P. Kotter — *Accelerate*"
limits:
  - "Spans más amplios pueden empoderar o abandonar. No optimices solo headcount de managers; mide calidad de decisión, desarrollo y coordinación."
evidence_signals:
  - "median span"
  - "layers to CEO"
  - "manager time allocation"
  - "decision latency"
  - "engagement by span"
