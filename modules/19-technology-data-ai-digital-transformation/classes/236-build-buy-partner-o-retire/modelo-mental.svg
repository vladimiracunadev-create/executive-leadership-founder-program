<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 425.3" width="1040" role="img" aria-labelledby="t-s236 d-s236" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s236">Clase 236 · Construir, comprar, aliarse o retirar</title>
<desc id="d-s236">Cuatro caminos para una capacidad tecnológica con cuándo conviene cada uno y su riesgo principal.</desc>
<defs><marker id="p-s236" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="425.3" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 236 · Construir, comprar, aliarse o retirar</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Williamson · Shapiro &amp; Varian · Henderson &amp; Clark</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Camino</text>
<text x="236.8" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Conviene cuando…</text>
<text x="669.76" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Riesgo principal</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Construir</text>
<text x="236.8" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >La capacidad diferencia y exige control de datos y ritmo.</text>
<text x="669.76" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Costo, tiempo y mantenimiento propios.</text>
<rect x="28" y="172.56" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Comprar</text>
<text x="236.8" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Es estándar y hay buenos proveedores.</text>
<text x="669.76" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dependencia, integración y costo de salida.</text>
<rect x="28" y="209.12" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="229.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Aliarse</text>
<text x="236.8" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se necesita acceso o velocidad sin propiedad.</text>
<text x="669.76" y="229.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Control limitado y objetivos distintos.</text>
<rect x="28" y="245.68" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="265.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Retirar</text>
<text x="236.8" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Ya no aporta valor o su costo supera el beneficio.</text>
<text x="669.76" y="265.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Migrar usuarios y datos sin romper procesos.</text>
<rect x="28" y="298.24" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="320.24" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Comprar no transfiere la responsabilidad ni elimina la integración. Para capacidades centrales, la dependencia estratégica de un</text>
<text x="44" y="337.49" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >proveedor puede costar más que construir.</text>
<text x="28" y="384.74" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las condiciones de contratos, datos y licencias se revisan con asesoría legal.</text>
</svg>
