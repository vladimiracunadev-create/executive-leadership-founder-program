<text x="413.8" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >lead time</text>
<rect x="487.9" y="484.48" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
