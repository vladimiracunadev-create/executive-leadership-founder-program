<text x="520.3" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >metric disputes</text>
<rect x="28" y="474" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
