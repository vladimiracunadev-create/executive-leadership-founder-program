<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g160 d-g160" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g160">Ficha visual de la clase 160: Capacidades y recursos</title>
<desc id="d-g160">Conceptos: resource; capability; VRIO; dynamic capability; capability gap. Método: mapear actividades críticas → inventariar recursos y capacidades → aplicar VRIO con evidencia → identificar gaps frente a estrategia → decidir build buy partner o exit.</desc>
