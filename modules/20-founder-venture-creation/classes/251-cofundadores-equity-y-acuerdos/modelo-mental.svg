<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g251 d-g251" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g251">Ficha visual de la clase 251: Cofundadores, equity y acuerdos</title>
<desc id="d-g251">Conceptos: cofounder agreement; vesting; cliff; deadlock; IP assignment. Método: alinear visión y compromiso → definir roles y decision rights → negociar equity y vesting → establecer IP y confidentiality → planificar departure deadlock y dispute.</desc>
<defs><marker id="p-g251" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
