<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" role="img" aria-labelledby="t-g173 d-g173" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g173">Ficha visual de la clase 173: RACI, RAPID y derechos de decisión</title>
<desc id="d-g173">Conceptos: RACI; RAPID; decision right; single accountable; consultation. Método: inventariar decisiones recurrentes → distinguir trabajo de decisión → elegir RACI o RAPID según problema → asignar un D o Accountable claro → medir latencia y conflictos para ajustar.</desc>
<defs><marker id="p-g173" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="560" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#bc4c00"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 173 · RACI, RAPID y derechos de decisión</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 14 · Dirección, estrategia y organización</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#bc4c00"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >RACI</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >matriz de Responsible Accountable Consulted e Informed</text>
<circle cx="38" cy="170" r="5" fill="#bc4c00"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >RAPID</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >marco Recommend Agree Perform Input Decide</text>
<circle cx="38" cy="228" r="5" fill="#bc4c00"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >decision right</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >autoridad explícita para tomar una decisión</text>
<circle cx="38" cy="286" r="5" fill="#bc4c00"/>
<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >single accountable</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >principio de un owner final claramente identificable</text>
<circle cx="38" cy="344" r="5" fill="#bc4c00"/>
<text x="54" y="349" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >consultation</text>
<text x="54" y="367" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >aporte previo que no equivale a veto</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >inventariar decisiones recurrentes</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >distinguir trabajo de decisión</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >elegir RACI o RAPID según problema</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >asignar un D o Accountable claro</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >medir latencia y conflictos para</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >ajustar</text>
<text x="28" y="416" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="428" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="41" cy="441" r="3.5" fill="#bc4c00"/>
<text x="52" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >decision time</text>
<rect x="153.7" y="428" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="166.7" cy="441" r="3.5" fill="#bc4c00"/>
<text x="177.7" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >approval count</text>
<rect x="286.3" y="428" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="299.3" cy="441" r="3.5" fill="#bc4c00"/>
<text x="310.3" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >reopened decisions</text>
<rect x="446.5" y="428" width="101.9" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="459.5" cy="441" r="3.5" fill="#bc4c00"/>
<text x="470.5" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >escalations</text>
<rect x="558.4" y="428" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="571.4" cy="441" r="3.5" fill="#bc4c00"/>
<text x="582.4" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >role ambiguity</text>
<rect x="28" y="474" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="474" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="494" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="512" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Ninguna matriz arregla una distribución de poder que la dirección no respeta. Si los líderes revierten decisiones por fuera del</text>
<text x="48" y="529.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >sistema, la herramienta se vuelve teatro.</text>
</svg>
