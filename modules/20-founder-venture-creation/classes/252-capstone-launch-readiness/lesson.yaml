  - "Ubicar el proyecto en un cuadrante y derivar una acción."
  - "Definir condiciones de lanzamiento, métricas de las primeras semanas y criterios de detención."
  - "Presentar una decisión de go / no-go con riesgos, caja y plan de contingencia."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Bill Aulet — *Disciplined Entrepreneurship*"
  - "Eric Ries — *The Lean Startup*"
  - "Atul Gawande — *The Checklist Manifesto*"
  - "Noam Wasserman — *The Founder's Dilemmas*"
  - "Clayton M. Christensen et al. — *Competing Against Luck*"
limits:
  - "Los puntajes son subjetivos; dos revisores pueden diferir y ese desacuerdo es información."
evidence_signals:
  - "evidencia puntuada por eslabón"
  - "preparación operativa evaluada"
