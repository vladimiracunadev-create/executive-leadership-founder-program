id: 199
part: 16
title: "Balance entre clientes, personas, accionistas y sociedad"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir stakeholder de shareholder return mediante evidencia observable."
  - "Aplicar la secuencia: mapear stakeholders materiales → identificar obligaciones y externalidades → cuantificar trade-offs cuando sea posible → definir principios y límites → decidir y explicar horizonte y compensaciones."
  - "Interpretar customer trust, employee retention, ROIC sin atribuir causalidad automática."
  - "Resolver el caso de balance entre clientes, personas, accionistas y sociedad con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "commercial-decision-brief.md"
references:
  - "Ben Horowitz — *The Hard Thing About Hard Things*"
  - "Matt Mochary — *The Great CEO Within*"
  - "Peter F. Drucker — *The Effective Executive*"
  - "Michael D. Watkins — *The First 90 Days*"
  - "Ram Charan — *What the CEO Wants You to Know*"
  - "Larry Bossidy & Ram Charan — *Execution*"
limits:
  - "La retórica stakeholder puede justificar decisiones sin accountability. Mantén objetivos, responsables y economics claros; no uses balance para evitar elegir."
evidence_signals:
  - "customer trust"
  - "employee retention"
  - "ROIC"
  - "regulatory incidents"
  - "reputation indicators"
