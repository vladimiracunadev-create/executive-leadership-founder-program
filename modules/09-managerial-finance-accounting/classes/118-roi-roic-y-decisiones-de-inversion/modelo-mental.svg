<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g118 d-g118" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g118">Ficha visual de la clase 118: ROI, ROIC y decisiones de inversión</title>
<desc id="d-g118">Conceptos: ROI; NOPAT; invested capital; ROIC; WACC. Método: definir cash flows y capital → separar incremental de sunk cost → calcular retorno y timing → comparar con hurdle/WACC → hacer sensibilidad y post-audit.</desc>
<defs><marker id="p-g118" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
