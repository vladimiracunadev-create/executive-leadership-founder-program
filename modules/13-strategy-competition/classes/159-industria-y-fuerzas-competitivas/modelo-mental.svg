<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 511.54" width="1040" role="img" aria-labelledby="t-s159 d-s159" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s159">Clase 159 · Cinco fuerzas que determinan la rentabilidad de una industria</title>
<desc id="d-s159">Las cinco fuerzas competitivas, qué las intensifica y cómo afectan la rentabilidad.</desc>
<defs><marker id="p-s159" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="511.54" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 159 · Cinco fuerzas que determinan la rentabilidad de una industria</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Porter (1980) · Dixit &amp; Nalebuff</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Fuerza</text>
<text x="300.471" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Se intensifica cuando…</text>
<text x="734.588" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Efecto en la rentabilidad</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Rivalidad entre competidores</text>
<text x="300.471" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Muchos rivales parecidos, crecimiento lento, costos fijos</text>
<text x="300.471" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >altos.</text>
<text x="734.588" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Presión de precios.</text>
<rect x="28" y="189.12" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Entrada de nuevos competidores</text>
<text x="300.471" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Barreras bajas, capital accesible, canales abiertos.</text>
<text x="734.588" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Margen acotado.</text>
<rect x="28" y="225.68" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="245.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Sustitutos</text>
<text x="300.471" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Alternativas de otra categoría con buena relación</text>
<text x="300.471" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >valor–precio.</text>
<text x="734.588" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Techo de precios.</text>
<rect x="28" y="278.8" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="298.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Poder de los compradores</text>
<text x="300.471" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Pocos clientes grandes, bajo costo de cambio.</text>
<text x="734.588" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Descuentos y exigencias.</text>
<rect x="28" y="315.36" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="335.36" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Poder de los proveedores</text>
<text x="300.471" y="335.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Pocos proveedores, insumos críticos, costo de cambio alto.</text>
<text x="734.588" y="335.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Costos más altos.</text>
<rect x="28" y="367.92" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="389.92" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Las fuerzas explican por qué algunas industrias son más rentables que otras y dónde puede una empresa posicionarse o cambiar la</text>
<text x="44" y="407.17" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >estructura.</text>
<text x="28" y="454.42" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >El análisis es estático y toma la industria como dada; en industrias de plataformas o de cambio rápido se complementa con el análisis de</text>
<text x="28" y="470.98" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ecosistemas.</text>
</svg>
