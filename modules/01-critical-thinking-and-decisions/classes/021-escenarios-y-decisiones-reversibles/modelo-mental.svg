<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g21 d-g21" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g21">Ficha visual de la clase 021: Escenarios y decisiones reversibles</title>
<desc id="d-g21">Conceptos: reversibilidad; opción; experimento; trigger; escenario. Método: clasificar costo de reversa → dividir decisión en etapas → diseñar experimento y criterio de éxito → preservar opciones donde exista incertidumbre → escalar cuando la evidencia alcance umbral.</desc>
<defs><marker id="p-g21" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 021 · Escenarios y decisiones reversibles</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 01 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >reversibilidad</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad de volver atrás con costo y tiempo aceptables</text>
<circle cx="38" cy="170" r="5" fill="#1a7f37"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >opción</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >facultad de actuar más tarde sin obligación de hacerlo</text>
<circle cx="38" cy="228" r="5" fill="#1a7f37"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >experimento</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >intervención diseñada para producir evidencia antes de</text>
<text x="54" y="267.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >escalar</text>
<circle cx="38" cy="300.12" r="5" fill="#1a7f37"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >trigger</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >condición observable que activa una acción previamente</text>
<text x="54" y="339.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >acordada</text>
<circle cx="38" cy="372.24" r="5" fill="#1a7f37"/>
<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >escenario</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >estado futuro coherente usado para probar robustez</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >clasificar costo de reversa</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >dividir decisión en etapas</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >diseñar experimento y criterio de</text>
<text x="628" y="257.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >éxito</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >preservar opciones donde exista</text>
<text x="690" y="199.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >incertidumbre</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >escalar cuando la evidencia alcance</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >umbral</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="52" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >costo de reversa</text>
<rect x="174.4" y="456.24" width="164" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="187.4" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="198.4" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >tiempo para aprender</text>
<rect x="348.4" y="456.24" width="164" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="361.4" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="372.4" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >capital comprometido</text>
<rect x="522.4" y="456.24" width="164" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="535.4" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="546.4" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >opciones preservadas</text>
<rect x="696.4" y="456.24" width="253.7" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="709.4" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="720.4" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >experimentos que cambian decisión</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Reversibilidad no justifica experimentar eternamente. Algunas oportunidades caducan; el valor de información debe compararse con el</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >costo de esperar y con la velocidad competitiva.</text>
</svg>
