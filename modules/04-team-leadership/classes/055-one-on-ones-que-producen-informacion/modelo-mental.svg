<text x="484" y="124" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >1</text>
<text x="504" y="124" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >mantener cadencia estable</text>
<rect x="487" y="160" width="508" height="50" rx="9" fill="#0969da" stroke="#0969da" stroke-width="0" fill-opacity="0.9099999999999999"/>
<text x="501" y="180" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >2</text>
<text x="521" y="180" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >recoger temas antes de la reunión</text>
<rect x="504" y="216" width="474" height="50" rx="9" fill="#0969da" stroke="#0969da" stroke-width="0" fill-opacity="0.84"/>
<text x="518" y="236" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" >3</text>
<text x="538" y="236" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" >escuchar antes de convertirlo en status</text>
