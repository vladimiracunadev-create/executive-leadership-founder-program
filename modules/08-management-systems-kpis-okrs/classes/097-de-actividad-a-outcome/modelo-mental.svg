<text x="212.2" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >outcome trend</text>
<rect x="313.9" y="442.12" width="219.2" height="26" rx="13" fill="#ffffff" stroke="#8250df" stroke-width="1.2" />
