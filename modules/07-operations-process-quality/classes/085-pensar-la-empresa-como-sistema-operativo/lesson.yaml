  - "Detectar una optimización local que perjudica el resultado global."
  - "Identificar dónde se decide, dónde se espera y dónde se corrige el trabajo."
  - "Formular una pregunta de diagnóstico operativo antes de proponer una solución."
deliverable: "leadership-decision-brief.md"
references:
  - "Nigel Slack & Alistair Brandon-Jones — *Operations Management*"
