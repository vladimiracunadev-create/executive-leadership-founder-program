<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620.24" width="1040" role="img" aria-labelledby="t-g147 d-g147" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g147">Ficha visual de la clase 147: Customer discovery</title>
<desc id="d-g147">Conceptos: customer discovery; behavioral evidence; leading question; workaround; sample bias. Método: definir hipótesis y segmento → reclutar muestra relevante → preguntar por episodios pasados y conducta → capturar patrones y contradicciones → sintetizar evidencia y decidir siguiente experimento.</desc>
<defs><marker id="p-g147" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="620.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
