<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g65 d-g65" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g65">Ficha visual de la clase 065: Onboarding y primeros 90 días</title>
<desc id="d-g65">Conceptos: onboarding; time-to-productivity; role clarity; network building; quick win. Método: preparar accesos y contexto antes del ingreso → acordar 30-60-90 outcomes → construir mapa de stakeholders → combinar aprendizaje con entregas pequeñas → revisar ajuste y soporte cada etapa.</desc>
