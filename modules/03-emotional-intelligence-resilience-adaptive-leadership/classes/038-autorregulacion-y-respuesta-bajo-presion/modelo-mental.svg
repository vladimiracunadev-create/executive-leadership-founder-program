<text x="692" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >nombrar emoción y</text>
<text x="692" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >objetivo</text>
<rect x="846" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="862.0" cy="120" r="11" fill="#1a7f37"/>
<text x="862" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="880" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >crear pausa física</text>
<text x="880" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >o temporal</text>
<rect x="846" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="862.0" cy="240" r="11" fill="#1a7f37"/>
<text x="862" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="880" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >elegir reencuadre</text>
<text x="880" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >y respuesta</text>
<rect x="658" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="674.0" cy="240" r="11" fill="#1a7f37"/>
<text x="674" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="692" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >revisar después si</text>
<text x="692" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >la respuesta</text>
<text x="692" y="276.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >produjo el</text>
<text x="692" y="292.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >resultado</text>
