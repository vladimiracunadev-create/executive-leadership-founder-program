<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >priorizar inversiones por value y</text>
<text x="690" y="199.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >risk</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#cf222e"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#cf222e" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >medir outcome y retire legacy</text>
<text x="28" y="472.48" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="484.48" width="233" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
