<title id="t-g135">Ficha visual de la clase 135: Segmentación y cliente ideal</title>
<desc id="d-g135">Conceptos: segmentation; needs-based segment; behavioral segment; ideal customer; serviceability. Método: analizar jobs y comportamiento → crear segmentos accionables → medir tamaño y economics → seleccionar target → definir no-targets y testear mensajes.</desc>
