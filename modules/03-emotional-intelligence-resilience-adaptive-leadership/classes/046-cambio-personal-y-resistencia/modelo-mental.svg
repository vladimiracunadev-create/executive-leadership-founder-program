<text x="692" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >escuchar</text>
<text x="692" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >objeciones como</text>
<text x="692" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >datos</text>
<rect x="846" y="104" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="862.0" cy="120" r="11" fill="#1a7f37"/>
<text x="862" y="124.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="880" y="123" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >distinguir falta</text>
<text x="880" y="139.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >de skill, voluntad</text>
<text x="880" y="156.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >o confianza</text>
<rect x="846" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="862.0" cy="240" r="11" fill="#1a7f37"/>
<text x="862" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="880" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >diseñar apoyo y</text>
<text x="880" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >participación</text>
<rect x="658" y="224" width="166" height="70" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<circle cx="674.0" cy="240" r="11" fill="#1a7f37"/>
<text x="674" y="244.5" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="692" y="243" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >medir adopción por</text>
<text x="692" y="259.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >conducta y</text>
<text x="692" y="276.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >resultado</text>
