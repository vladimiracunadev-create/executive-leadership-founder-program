id: 226
part: 18
title: "Due diligence"
duration_minutes: 150
level: "Etapa 5 — CEO → Capital allocator"
outcome: "decidir estructura de capital, valoración, fundraising y transacciones"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir due diligence de quality of earnings mediante evidencia observable."
  - "Aplicar la secuencia: partir de deal thesis → convertir supuestos en questions → asignar workstreams y materiality → analizar findings y cuantificar → actualizar price terms o walk-away."
  - "Interpretar QoE adjustments, customer concentration, legal exposure sin atribuir causalidad automática."
  - "Resolver el caso de due diligence con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Richard Brealey, Stewart Myers & Franklin Allen — *Principles of Corporate Finance*"
  - "Stephen Ross, Randolph Westerfield et al. — *Corporate Finance*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Brad Feld & Jason Mendelson — *Venture Deals*"
  - "Aswath Damodaran — *Investment Valuation*"
limits:
  - "Diligence nunca elimina toda incertidumbre y tiene tiempo limitado. Prioriza supuestos que pueden cambiar decisión o terms, no exhaustividad imposible."
evidence_signals:
  - "QoE adjustments"
  - "customer concentration"
  - "legal exposure"
  - "security findings"
  - "deal assumption changes"
