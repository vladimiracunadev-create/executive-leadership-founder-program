<text x="60" y="352.375" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="88" y="339.75" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >Bosquejo en papel</text>
<text x="88" y="357.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >¿Es este el problema y el flujo que esperan? Horas y costo mínimo.</text>
<rect x="28" y="395" width="984" height="43.25" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="417" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Cada nivel cuesta más y responde preguntas distintas. Se sube de nivel cuando el anterior ya no revela problemas importantes.</text>
<text x="28" y="464.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Un prototipo bonito puede esconder que nadie necesita la solución: la fidelidad no reemplaza la evidencia.</text>
