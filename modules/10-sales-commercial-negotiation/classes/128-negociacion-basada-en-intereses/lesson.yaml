id: 128
part: 10
title: "Negociación basada en intereses"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "construir ingresos mediante un proceso comercial medible y negociación disciplinada"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir posiciones de intereses y explorarlos."
  - "Determinar la mejor alternativa a un acuerdo negociado (BATNA) y el punto de reserva."
  - "Generar opciones que creen valor para ambas partes."
  - "Usar criterios objetivos y el efecto de anclaje con ética."
  - "Decidir cuándo cerrar, ajustar o retirarse."
deliverable: "commercial-decision-brief.md"
references:
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
  - "Deepak Malhotra & Max H. Bazerman — *Negotiation Genius*"
  - "Chris Voss & Tahl Raz — *Never Split the Difference*"
  - "Adam D. Galinsky & Thomas Mussweiler — *First offers as anchors: The role of perspective-taking and negotiator focus*"
  - "Robert B. Cialdini — *Influence*"
limits:
  - "El método supone contrapartes con voluntad mínima de colaborar; frente a tácticas coercitivas o de mala fe, se necesitan otras defensas (BATNA, terceros, retirada)."
evidence_signals:
  - "intereses de ambas partes explorados"
  - "BATNA y punto de reserva definidos"
  - "paquete que crea valor"
  - "criterio objetivo y condición de retiro"
