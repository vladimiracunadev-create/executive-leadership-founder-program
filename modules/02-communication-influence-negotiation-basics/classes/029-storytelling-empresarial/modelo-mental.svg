<circle cx="215" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="226" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >claridad del problema</text>
<rect x="382.9" y="456.24" width="226.1" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="395.9" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="406.9" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >datos integrados en narrativa</text>
<rect x="619" y="456.24" width="164" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="632" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="643" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >acciones posteriores</text>
<rect x="28" y="488.24" width="371" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="501.24" r="3.5" fill="#1a7f37"/>
<text x="52" y="505.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >distorsiones detectadas entre historia y evidencia</text>
<rect x="28" y="534.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="534.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="554.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="572.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Una historia convincente puede manipular. Evita seleccionar un caso extremo como representativo, exagerar causalidad o borrar</text>
<text x="48" y="589.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >incertidumbre para aumentar impacto emocional.</text>
