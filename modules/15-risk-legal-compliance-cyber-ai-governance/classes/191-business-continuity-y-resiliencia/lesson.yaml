id: 191
part: 15
title: "Business continuity y resiliencia"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "gobernar riesgo, legal, cumplimiento, ciberseguridad, datos e IA de forma integrada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir BIA de RTO mediante evidencia observable."
  - "Aplicar la secuencia: realizar BIA → priorizar servicios y dependencias → definir RTO y RPO → diseñar estrategias y planes → ejercitar medir brechas y mejorar."
  - "Interpretar RTO achievement, RPO achievement, exercise findings sin atribuir causalidad automática."
  - "Resolver el caso de business continuity y resiliencia con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "risk-governance-brief.md"
references:
  - "COSO — *Enterprise Risk Management—Integrating with Strategy and Performance*"
  - "John C. Hull — *Risk Management and Financial Institutions*"
  - "NIST — *Cybersecurity Framework (CSF) 2.0*"
  - "ISO — *ISO 31000 Risk management*"
  - "Richard A. Clarke & Robert K. Knake — *The Fifth Domain*"
  - "Bob Tricker — *Corporate Governance*"
  - "NIST — *AI Risk Management Framework*. Fuente primaria: <https://www.nist.gov/itl/ai-risk-management-framework>."
limits:
  - "RTO y RPO no deben inventarse por tecnología; derivan de impacto del negocio. Una continuidad demasiado costosa puede ser irracional para procesos no críticos."
evidence_signals:
  - "RTO achievement"
  - "RPO achievement"
  - "exercise findings"
  - "single points of failure"
  - "recovery dependency"
