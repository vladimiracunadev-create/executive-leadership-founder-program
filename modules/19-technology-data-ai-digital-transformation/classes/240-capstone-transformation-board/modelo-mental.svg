<title id="t-s240">Clase 240 · Un tablero de transformación que decide</title>
<desc id="d-s240">Cinco pasos del tablero de transformación: resultados y restricciones, comparar casos, dependencias y capacidad, puertas y dueños, y medición.</desc>
