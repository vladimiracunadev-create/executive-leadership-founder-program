<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >AI governance</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >sistema de responsabilidades y controles para</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >desarrollar o usar IA</text>
<circle cx="38" cy="184.12" r="5" fill="#bc4c00"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >AI risk</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >posible daño o pérdida derivada de comportamiento uso o</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >dependencia de IA</text>
<circle cx="38" cy="256.24" r="5" fill="#bc4c00"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >human oversight</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >intervención humana con autoridad y capacidad real de</text>
<text x="54" y="295.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >revisar</text>
<circle cx="38" cy="328.36" r="5" fill="#bc4c00"/>
<text x="54" y="333.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >model evaluation</text>
<text x="54" y="351.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >medición de desempeño robustez y riesgos en contexto</text>
<circle cx="38" cy="386.36" r="5" fill="#bc4c00"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >AI inventory</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >registro de sistemas owners finalidad datos y</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >criticidad</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
