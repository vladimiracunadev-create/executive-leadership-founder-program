<text x="713.5" y="459.62" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >learning cost</text>
<rect x="28" y="488.12" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="488.12" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="508.12" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="526.12" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Prototipos de baja fidelidad no responden bien preguntas de performance, seguridad o confianza visual. El tipo de prototipo debe</text>
<text x="48" y="543.37" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >corresponder al riesgo que se intenta reducir.</text>
