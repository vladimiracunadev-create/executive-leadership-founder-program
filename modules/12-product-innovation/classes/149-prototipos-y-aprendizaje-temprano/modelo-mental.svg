<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 149 · Prototipos y aprendizaje temprano</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 12 · Dirección, estrategia y organización</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#bc4c00"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >prototype</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >representación temporal para probar una hipótesis</text>
<circle cx="38" cy="170" r="5" fill="#bc4c00"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >fidelity</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >nivel de detalle y realismo del prototipo</text>
<circle cx="38" cy="228" r="5" fill="#bc4c00"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >desirability risk</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >incertidumbre sobre si el usuario quiere o valora la</text>
<text x="54" y="267.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >solución</text>
<circle cx="38" cy="300.12" r="5" fill="#bc4c00"/>
