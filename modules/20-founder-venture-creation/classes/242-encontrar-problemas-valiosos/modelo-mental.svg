<title id="t-g242">Ficha visual de la clase 242: Encontrar problemas valiosos</title>
<desc id="d-g242">Conceptos: problem value; frequency; urgency; budget; access. Método: listar problemas desde experiencia y observación → puntuar dolor frecuencia y budget → entrevistar segmentos accesibles → buscar workarounds y spend → seleccionar problema para validar.</desc>
