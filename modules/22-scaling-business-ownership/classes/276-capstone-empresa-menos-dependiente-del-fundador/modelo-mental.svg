<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >definidos</text>
<circle cx="38" cy="386.36" r="5" fill="#59636e"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >institutional memory</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >conocimiento preservado en sistemas personas y</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >documentación</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
