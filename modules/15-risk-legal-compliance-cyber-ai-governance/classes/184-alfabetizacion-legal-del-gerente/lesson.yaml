  - "ISO — *ISO 31000 Risk management*"
  - "Biblioteca del Congreso Nacional de Chile — *LeyChile: responsabilidad penal de las personas jurídicas (Ley 20.393)*"
limits:
  - "Esta clase no interpreta ninguna ley ni sustituye asesoría profesional."
evidence_signals:
