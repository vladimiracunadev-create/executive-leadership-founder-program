<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 458.42" width="1040" role="img" aria-labelledby="t-s244 d-s244" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s244">Clase 244 · Escribir hipótesis que se puedan refutar</title>
<desc id="d-s244">Elementos de una hipótesis de cliente y de problema, cómo se redactan y qué evidencia las apoyaría o las refutaría.</desc>
<defs><marker id="p-s244" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="458.42" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 244 · Escribir hipótesis que se puedan refutar</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Blank · Bland &amp; Osterwalder · Ries</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Elemento</text>
<text x="212.2" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Cómo se escribe</text>
<text x="507.4" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Evidencia a favor</text>
<text x="765.7" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Evidencia en contra</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Segmento</text>
<text x="212.2" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Quién es y en qué contexto actúa.</text>
<text x="507.4" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se les encuentra y responden.</text>
<text x="765.7" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >No existen o no son alcanzables.</text>
<rect x="28" y="172.56" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="192.56" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Problema</text>
<text x="212.2" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué intentan lograr y qué se los impide.</text>
<text x="507.4" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Lo describen con detalle y</text>
<text x="507.4" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >ejemplos.</text>
<text x="765.7" y="192.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Solo lo mencionan si se les</text>
<text x="765.7" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >pregunta.</text>
<rect x="28" y="225.68" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="245.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Consecuencia</text>
<text x="212.2" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Qué pierden si no se resuelve.</text>
<text x="507.4" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cuantifican tiempo, dinero o</text>
<text x="507.4" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >riesgo.</text>
<text x="765.7" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Dicen que «no es tan grave».</text>
<rect x="28" y="278.8" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="298.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Alternativa actual</text>
<text x="212.2" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cómo lo resuelven hoy.</text>
<text x="507.4" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Gastan tiempo o dinero en ello.</text>
<text x="765.7" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >No hacen nada y no les importa.</text>
<rect x="28" y="331.36" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="353.36" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Una hipótesis útil dice qué evidencia la contradiría. Falsar una hipótesis no invalida el emprendimiento: permite cambiar de segmento,</text>
<text x="44" y="370.61" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >problema o propuesta.</text>
<text x="28" y="417.86" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Se priorizan primero las hipótesis cuya falsedad destruiría todo el negocio.</text>
</svg>
