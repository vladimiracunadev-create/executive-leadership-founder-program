<text x="386.2" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >sales cycle</text>
<rect x="474.1" y="498.6" width="88.1" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="487.1" cy="511.6" r="3.5" fill="#bc4c00"/>
<text x="498.1" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >expansion</text>
<rect x="572.2" y="498.6" width="108.8" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="585.2" cy="511.6" r="3.5" fill="#bc4c00"/>
<text x="596.2" y="516.1" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >gross margin</text>
<rect x="28" y="544.6" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="544.6" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="564.6" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="582.6" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >PMF puede existir en un nicho y no transferirse a otro. Escalar canales o equipo antes de entender qué segmento retiene puede</text>
<text x="48" y="599.85" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >amplificar churn y costos.</text>
</svg>
