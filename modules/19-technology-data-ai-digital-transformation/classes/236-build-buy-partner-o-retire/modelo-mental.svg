<circle cx="41" cy="441" r="3.5" fill="#cf222e"/>
<text x="52" y="445.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >time-to-value</text>
<rect x="153.7" y="428" width="46.7" height="26" rx="13" fill="#ffffff" stroke="#cf222e" stroke-width="1.2" />
<circle cx="166.7" cy="441" r="3.5" fill="#cf222e"/>
