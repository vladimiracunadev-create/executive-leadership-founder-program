<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616.48" width="1040" role="img" aria-labelledby="t-g145 d-g145" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g145">Ficha visual de la clase 145: Producto versus proyecto</title>
<desc id="d-g145">Conceptos: product; project; output; outcome; product lifecycle. Método: identificar problema y usuario persistente → separar outputs de outcomes → definir ownership continuo → alinear funding y métricas al ciclo de vida → decidir continuar, pivotar o retirar según evidencia.</desc>
<defs><marker id="p-g145" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="616.48" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#bc4c00"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 145 · Producto versus proyecto</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 12 · Dirección, estrategia y organización</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#bc4c00"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >product</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >vehículo continuo para crear valor a un usuario y</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capturarlo para la organización</text>
<circle cx="38" cy="184.12" r="5" fill="#bc4c00"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >project</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >esfuerzo temporal con inicio y fin para producir un</text>
<text x="54" y="223.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >resultado</text>
<circle cx="38" cy="256.24" r="5" fill="#bc4c00"/>
<text x="54" y="261.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >output</text>
<text x="54" y="279.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >entregable producido por el equipo</text>
<circle cx="38" cy="314.24" r="5" fill="#bc4c00"/>
<text x="54" y="319.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >outcome</text>
<text x="54" y="337.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cambio observable en conducta, capacidad o resultado</text>
<text x="54" y="353.8" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >del usuario</text>
<circle cx="38" cy="386.36" r="5" fill="#bc4c00"/>
<text x="54" y="391.36" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >product lifecycle</text>
<text x="54" y="409.36" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >secuencia desde descubrimiento y crecimiento hasta</text>
<text x="54" y="425.92" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >madurez o retiro</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >identificar problema y usuario</text>
<text x="504" y="373.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >persistente</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >separar outputs de outcomes</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >definir ownership continuo</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >alinear funding y métricas al ciclo</text>
<text x="690" y="199.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >de vida</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#bc4c00" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#bc4c00"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#bc4c00" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >decidir continuar, pivotar o</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >retirar según evidencia</text>
<text x="28" y="472.48" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="484.48" width="81.2" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="41" cy="497.48" r="3.5" fill="#bc4c00"/>
<text x="52" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >adoption</text>
<rect x="119.2" y="484.48" width="122.6" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="132.2" cy="497.48" r="3.5" fill="#bc4c00"/>
<text x="143.2" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >outcome metric</text>
<rect x="251.8" y="484.48" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="264.8" cy="497.48" r="3.5" fill="#bc4c00"/>
<text x="275.8" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >time-to-value</text>
<rect x="377.5" y="484.48" width="115.7" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="390.5" cy="497.48" r="3.5" fill="#bc4c00"/>
<text x="401.5" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >cost-to-serve</text>
<rect x="503.2" y="484.48" width="88.1" height="26" rx="13" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2" />
<circle cx="516.2" cy="497.48" r="3.5" fill="#bc4c00"/>
<text x="527.2" y="501.98" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >retention</text>
<rect x="28" y="530.48" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="530.48" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="550.48" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="568.48" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No todo trabajo debe convertirse en producto permanente. Migraciones, cumplimiento puntual o infraestructura con final claro pueden</text>
<text x="48" y="585.73" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >gestionarse mejor como proyectos; evita productizar por moda.</text>
</svg>
