<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g63 d-g63" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g63">Ficha visual de la clase 063: Atracción y selección</title>
<desc id="d-g63">Conceptos: talent funnel; selection validity; job-relevant evidence; adverse impact; candidate experience. Método: definir scorecard y criterios antes de publicar → atraer en canales adecuados → usar screening consistente → combinar entrevistas y muestras de trabajo → registrar decisión y revisar calidad de contratación.</desc>
<defs><marker id="p-g63" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
