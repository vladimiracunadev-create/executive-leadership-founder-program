id: 190
part: 15
title: "Crisis, incidentes y escalamiento"
duration_minutes: 150
level: "Etapa 4 — Gerente → Director"
outcome: "gobernar riesgo, legal, cumplimiento, ciberseguridad, datos e IA de forma integrada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir incident de crisis mediante evidencia observable."
  - "Aplicar la secuencia: detectar y clasificar → activar roles y war room → proteger personas y contener impacto → comunicar hechos y decisiones → recuperar investigar y aprender."
  - "Interpretar time-to-escalate, MTTR, stakeholder update latency sin atribuir causalidad automática."
  - "Resolver el caso de crisis, incidentes y escalamiento con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "COSO — *Enterprise Risk Management—Integrating with Strategy and Performance*"
  - "John C. Hull — *Risk Management and Financial Institutions*"
  - "OECD — *OECD AI Principles*"
  - "Ross Anderson — *Security Engineering*"
  - "OECD — *G20/OECD Principles of Corporate Governance 2023*"
  - "NIST — *Cybersecurity Framework (CSF) 2.0*"
limits:
  - "Centralizar crisis no significa que el CEO decida cada acción. Define incident command y delegación; reserva nivel ejecutivo para trade-offs, stakeholders y decisiones materiales."
evidence_signals:
  - "time-to-escalate"
  - "MTTR"
  - "stakeholder update latency"
  - "decision reversals"
  - "recovery objective"
