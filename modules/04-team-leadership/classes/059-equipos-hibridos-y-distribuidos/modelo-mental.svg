<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 436.56" width="1040" role="img" aria-labelledby="t-s59 d-s59" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s59">Clase 059 · Por qué la distancia daña a los equipos</title>
<desc id="d-s59">Tres problemas de los equipos distribuidos: conocimiento mutuo, conflicto de distancia y diferencias de contexto, con una práctica de respuesta para cada uno.</desc>
<defs><marker id="p-s59" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="436.56" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 059 · Por qué la distancia daña a los equipos</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Cramton (2001) · Hinds &amp; Bailey (2003)</text>
<rect x="28" y="96" width="314.667" height="197.5" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<path d="M28.0,136 V108 a12,12 0 0 1 12,-12 H330.6666666666667 a12,12 0 0 1 12,12 V136 Z" fill="#0969da"/>
<text x="44" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Conocimiento mutuo</text>
<circle cx="50.0" cy="154" r="4" fill="#0969da"/>
<text x="64" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No se sabe qué sabe o qué pasa en el</text>
<text x="64" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >otro lugar.</text>
<circle cx="50.0" cy="198.5" r="4" fill="#0969da"/>
<text x="64" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Se interpreta el silencio como</text>
<text x="64" y="219.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >desinterés.</text>
<circle cx="50.0" cy="243.0" r="4" fill="#0969da"/>
<text x="64" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Práctica: compartir contexto de forma</text>
<text x="64" y="264.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >explícita.</text>
<rect x="362.667" y="96" width="314.667" height="197.5" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<path d="M362.6666666666667,136 V108 a12,12 0 0 1 12,-12 H665.3333333333334 a12,12 0 0 1 12,12 V136 Z" fill="#bc4c00"/>
<text x="378.667" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Conflicto por distancia</text>
<circle cx="384.6666666666667" cy="154" r="4" fill="#bc4c00"/>
<text x="398.667" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Surge de la falta de información y de</text>
<text x="398.667" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >las atribuciones.</text>
<circle cx="384.6666666666667" cy="198.5" r="4" fill="#bc4c00"/>
<text x="398.667" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Se agrava con la diferencia de</text>
<text x="398.667" y="219.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >ritmos.</text>
<circle cx="384.6666666666667" cy="243.0" r="4" fill="#bc4c00"/>
<text x="398.667" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Práctica: acuerdos de comunicación y</text>
<text x="398.667" y="264.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >revisión de supuestos.</text>
<rect x="697.333" y="96" width="314.667" height="197.5" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.8" />
<path d="M697.3333333333334,136 V108 a12,12 0 0 1 12,-12 H1000.0 a12,12 0 0 1 12,12 V136 Z" fill="#8250df"/>
<text x="713.333" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="start" >Diferencias de contexto</text>
<circle cx="719.3333333333334" cy="154" r="4" fill="#8250df"/>
<text x="733.333" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Husos horarios, cultura y recursos</text>
<text x="733.333" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >distintos.</text>
<circle cx="719.3333333333334" cy="198.5" r="4" fill="#8250df"/>
<text x="733.333" y="202.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Inequidad entre quienes están en la</text>
<text x="733.333" y="219.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >sala y en remoto.</text>
<circle cx="719.3333333333334" cy="243.0" r="4" fill="#8250df"/>
<text x="733.333" y="247" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Práctica: reglas de reunión híbrida</text>
<text x="733.333" y="264.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >igualitarias.</text>
<rect x="28" y="309.5" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="331.5" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La investigación sugiere que gran parte del problema es de información y atribución, no de las personas: lo que no se ve se interpreta</text>
<text x="44" y="348.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >de manera desfavorable.</text>
<text x="28" y="396" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los estudios provienen de equipos concretos y de antes de la normalización del trabajo remoto; las prácticas deben revisarse.</text>
</svg>
