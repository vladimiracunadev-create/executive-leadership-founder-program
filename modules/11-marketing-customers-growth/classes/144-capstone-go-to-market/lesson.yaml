id: 144
part: 11
title: "Capstone: go-to-market"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "entender mercado, posicionamiento, canales, conversión, retención y crecimiento"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir GTM de beachhead mediante evidencia observable."
  - "Aplicar la secuencia: seleccionar beachhead → definir positioning y offer → diseñar channel/sales motion → instrumentar funnel y economics → iterar desde wins, losses y retention."
  - "Interpretar pipeline, CAC, win rate sin atribuir causalidad automática."
  - "Resolver el caso de capstone: go-to-market con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "leadership-decision-brief.md"
references:
  - "Philip Kotler & Kevin Lane Keller — *Marketing Management*"
  - "Byron Sharp — *How Brands Grow*"
  - "Al Ries & Jack Trout — *Positioning*"
  - "Aaron Ross & Jason Lemkin — *From Impossible to Inevitable*"
  - "April Dunford — *Obviously Awesome*"
  - "Geoffrey A. Moore — *Crossing the Chasm*"
limits:
  - "No escales un GTM antes de señal de fit. Aumentar gasto sobre un mensaje, segmento o producto inestable multiplica desperdicio."
evidence_signals:
  - "pipeline"
  - "CAC"
  - "win rate"
  - "sales cycle"
  - "retention"
