<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 491.54" width="1040" role="img" aria-labelledby="t-s170 d-s170" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s170">Clase 170 · Tres estructuras básicas, cuándo sirven y qué cuestan</title>
<desc id="d-s170">Estructuras funcional, divisional y matricial: cuándo conviene cada una, su ventaja y su costo.</desc>
<defs><marker id="p-s170" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="491.54" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 170 · Tres estructuras básicas, cuándo sirven y qué cuestan</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Galbraith · Lawrence &amp; Lorsch (1967) · Skelton &amp; Pais (2019)</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Estructura</text>
<text x="221.263" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Conviene cuando…</text>
<text x="532" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Ventaja</text>
<text x="765.053" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Costo</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Funcional</text>
<text x="221.263" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Hay un producto o mercado principal y</text>
<text x="221.263" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >eficiencia por especialidad.</text>
<text x="532" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Pericia y escala por función.</text>
<text x="765.053" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Silos y decisiones lentas entre</text>
<text x="765.053" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >áreas.</text>
<rect x="28" y="189.12" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Divisional</text>
<text x="221.263" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Hay productos, mercados o regiones con</text>
<text x="221.263" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >necesidades distintas.</text>
<text x="532" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Foco y responsabilidad por</text>
<text x="532" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >resultado.</text>
<text x="765.053" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Duplicación y competencia por</text>
<text x="765.053" y="225.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >recursos.</text>
<rect x="28" y="242.24" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="262.24" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Matricial</text>
<text x="221.263" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Se necesita coordinar dos dimensiones a la</text>
<text x="221.263" y="278.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >vez (función y producto).</text>
<text x="532" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Equilibra especialización y</text>
<text x="532" y="278.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >foco.</text>
<text x="765.053" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Doble mando, conflicto y lentitud.</text>
<rect x="28" y="295.36" width="984" height="53.12" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="315.36" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Por equipos y</text>
<text x="40" y="331.92" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >plataformas</text>
<text x="221.263" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Equipos autónomos con propósito de flujo</text>
<text x="221.263" y="331.92" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >continuo.</text>
<text x="532" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Velocidad y claridad de</text>
<text x="532" y="331.92" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >responsabilidad.</text>
<text x="765.053" y="315.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Exige interfaces y gobierno claros.</text>
<rect x="28" y="364.48" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="386.48" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >No existe estructura perfecta: cada una resuelve un problema de coordinación y crea otro. Se elige la que resuelve mejor el problema</text>
<text x="44" y="403.73" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >que más importa para la estrategia.</text>
<text x="28" y="450.98" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >La estructura formal es solo parte: los procesos y las relaciones informales determinan cómo se trabaja de verdad.</text>
</svg>
