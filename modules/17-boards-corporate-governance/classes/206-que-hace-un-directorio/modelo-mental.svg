<text x="44" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Qué decide el directorio y</text>
<text x="44" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >qué se reserva.</text>
