<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >change diagnosis</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >análisis de fuerzas que sostienen estado actual y</text>
<text x="54" y="151.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >obstaculizan estado deseado</text>
<circle cx="38" cy="184.12" r="5" fill="#bc4c00"/>
<text x="54" y="189.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >stakeholder</text>
<text x="54" y="207.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >actor afectado o capaz de afectar el cambio</text>
<circle cx="38" cy="242.12" r="5" fill="#bc4c00"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >readiness</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >capacidad y disposición para adoptar</text>
