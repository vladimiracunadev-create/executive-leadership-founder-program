<title id="t-g248">Ficha visual de la clase 248: MVP y concierge tests</title>
<desc id="d-g248">Conceptos: concierge MVP; Wizard of Oz; manual-first; service blueprint; automation candidate. Método: definir outcome a entregar → operar manualmente para pocos clientes → registrar steps y exceptions → medir value y willingness → automatizar solo patrón estable.</desc>
