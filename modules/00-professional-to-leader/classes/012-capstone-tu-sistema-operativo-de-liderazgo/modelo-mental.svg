<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >regla explícita que orienta decisiones repetidas</text>
<circle cx="38" cy="170" r="5" fill="#1a7f37"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >cadencia</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ritmo periódico de revisión y coordinación</text>
<circle cx="38" cy="228" r="5" fill="#1a7f37"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >decision journal</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >registro de contexto, supuestos, opciones y resultado</text>
<text x="54" y="267.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >esperado</text>
