<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" role="img" aria-labelledby="t-037 d-037" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-037">Lo que sé de mí y lo que otros ven de mí</title>
<desc id="d-037">Cuadrante de conocimiento de uno mismo: lo que sé y los demás ven, lo que solo yo sé, lo que solo los demás ven (punto ciego) y lo que nadie ve todavía, con la práctica que reduce cada zona de desconocimiento.</desc>
<defs><marker id="p-037" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="580" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 037 · Verse con exactitud</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Goleman (1996) · Stone &amp; Heen (2014)</text>
<text x="315" y="92" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" letter-spacing="1.2">LO QUE YO SÉ DE MÍ</text>
<text x="657" y="92" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" letter-spacing="1.2">LO QUE NO SÉ DE MÍ</text>
<text transform="translate(116,184.0) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" letter-spacing="1.2">LO QUE LOS DEMÁS VEN</text>
<text transform="translate(116,364.0) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" letter-spacing="1.2">LO QUE NO VEN</text>
<rect x="150" y="100" width="330" height="168" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="150" y="100" width="330" height="34" rx="12" fill="#1a7f37"/>
<text x="166" y="123" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Visible y conocido</text>
<text x="166" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Lo que sabes de ti y los demás confirman.</text>
<text x="166" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Es la base de la credibilidad.</text>
<rect x="492" y="100" width="330" height="168" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<rect x="492" y="100" width="330" height="34" rx="12" fill="#cf222e"/>
<text x="508" y="123" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Punto ciego</text>
<text x="508" y="158" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Lo que otros ven y tú no. Solo se reduce</text>
<text x="508" y="175.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >pidiendo feedback concreto.</text>
<rect x="150" y="280" width="330" height="168" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="150" y="280" width="330" height="34" rx="12" fill="#0969da"/>
<text x="166" y="303" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Reservado</text>
<text x="166" y="338" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Lo que sabes y no muestras. Decide qué</text>
<text x="166" y="355.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >compartir para que te conozcan.</text>
<rect x="492" y="280" width="330" height="168" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="1.8" />
<rect x="492" y="280" width="330" height="34" rx="12" fill="#59636e"/>
<text x="508" y="303" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Aún desconocido</text>
<text x="508" y="338" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Ni tú ni otros lo ven. Aparece con</text>
<text x="508" y="355.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >experiencias nuevas.</text>
<rect x="28" y="478" width="984" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="500" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Autoconciencia, en el modelo de Goleman, es reconocer una emoción mientras ocurre, evaluarse con exactitud y confiar en las propias</text>
<text x="44" y="517.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >capacidades. La exactitud necesita datos de otros: la sola introspección no basta.</text>
<text x="28" y="566" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >El cuadrante es una herramienta de trabajo de la clase; Goleman y Stone y Heen describen los conceptos, no este esquema.</text>
</svg>
