<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >board mandate</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >conjunto de responsabilidades reservadas al directorio</text>
<circle cx="38" cy="170" r="5" fill="#cf222e"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >oversight</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >supervisión mediante información challenge y</text>
<text x="54" y="209.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >seguimiento</text>
<circle cx="38" cy="242.12" r="5" fill="#cf222e"/>
<text x="54" y="247.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >management accountability</text>
<text x="54" y="265.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >obligación del equipo ejecutivo de responder por</text>
<text x="54" y="281.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >ejecución</text>
<circle cx="38" cy="314.24" r="5" fill="#cf222e"/>
