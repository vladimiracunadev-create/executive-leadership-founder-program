<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >legal basis</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >fundamento jurídico que autoriza tratamiento cuando la</text>
