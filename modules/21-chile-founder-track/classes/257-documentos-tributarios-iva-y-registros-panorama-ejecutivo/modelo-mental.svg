<title id="t-s257">Clase 257 · Documentar, registrar y revisar el IVA</title>
<desc id="d-s257">Tres bloques de la gestión de documentos tributarios: documentar transacciones, registrar y conciliar, y revisar el tratamiento del IVA y cerrar el período.</desc>
