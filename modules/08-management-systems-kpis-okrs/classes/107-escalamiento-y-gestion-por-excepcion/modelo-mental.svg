<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 574.12" width="1040" role="img" aria-labelledby="t-g107 d-g107" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g107">Ficha visual de la clase 107: Escalamiento y gestión por excepción</title>
<desc id="d-g107">Conceptos: tolerance; exception; threshold; decision right; early warning. Método: definir tolerancias por objetivo → asignar derechos de decisión → instrumentar early warnings → escalar con opciones y recomendación → revisar umbrales según aprendizaje.</desc>
