<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602.36" width="1040" role="img" aria-labelledby="t-g256 d-g256" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g256">Ficha visual de la clase 256: Inicio de actividades y ciclo tributario en SII</title>
<desc id="d-g256">Conceptos: inicio de actividades; giro; domicilio tributario; RUT; carpeta tributaria. Método: confirmar entidad y RUT → definir giros y domicilio → reunir antecedentes exigidos → realizar inicio y verificar estado → configurar documentos y calendario tributario.</desc>
