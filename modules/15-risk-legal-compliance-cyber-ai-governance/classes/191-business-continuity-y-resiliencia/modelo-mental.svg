<text x="806.5" y="127" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="826.5" y="120" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Pruebas y simulacros</text>
<text x="798.5" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Ensayar para encontrar</text>
<text x="798.5" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >fallas antes del evento.</text>
<path d="M897.25,194.5 V206.5 H142.75 V224.5" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#p-s191)"/>
<rect x="28" y="226.5" width="229.5" height="96.5" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.8" />
<circle cx="52.0" cy="252.5" r="13" fill="#cf222e"/>
<text x="52" y="257.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="72" y="250.5" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="start" >Mejora continua</text>
<text x="44" y="282.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Corregir lo aprendido y</text>
<text x="44" y="299.75" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >revisar tras cambios.</text>
<path d="M142.75,325.0 V345.0 H142.75 V196.5" stroke="#59636e" stroke-width="2" fill="none" stroke-dasharray="7 6" marker-end="url(#p-s191)"/>
<text x="142.75" y="339" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle" >cada prueba corrige los planes</text>
<rect x="28" y="361" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="383" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >Un plan que no se ha ensayado es una hipótesis. La resiliencia no se compra con un documento: se construye con ensayo, redundancia</text>
<text x="44" y="400.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >donde importa y capacidad de improvisar con criterio.</text>
<text x="28" y="447.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Los objetivos de recuperación son decisiones de negocio que comparan costo de protección y costo de la interrupción.</text>
</svg>
