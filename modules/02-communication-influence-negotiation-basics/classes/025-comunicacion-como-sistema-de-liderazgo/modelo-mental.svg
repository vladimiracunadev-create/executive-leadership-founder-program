<text x="54" y="291" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >closed loop</text>
<text x="54" y="309" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >cierre donde receptor confirma comprensión y acción</text>
