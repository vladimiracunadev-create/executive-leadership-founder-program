<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 494.98" width="1040" role="img" aria-labelledby="t-s125 d-s125" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s125">Clase 125 · Las partes de un business case que un comprador puede defender</title>
<desc id="d-s125">Componentes del caso de negocio de una propuesta, la pregunta que responde cada uno y la evidencia necesaria.</desc>
<defs><marker id="p-s125" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="494.98" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 125 · Las partes de un business case que un comprador puede defender</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Nagle, Hogan &amp; Zale · Rackham · Brealey, Myers &amp; Allen</text>
<rect x="28" y="96" width="984" height="34" rx="10" fill="#1a7f37"/>
<text x="40" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Componente</text>
<text x="308.364" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Pregunta que responde</text>
<text x="666.182" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Evidencia</text>
<rect x="28" y="136" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Costo del problema actual</text>
<text x="308.364" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Cuánto cuesta no cambiar?</text>
<text x="666.182" y="156" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Datos del cliente: tiempo, errores, ventas</text>
<text x="666.182" y="172.56" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >perdidas.</text>
<rect x="28" y="189.12" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="209.12" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Beneficio esperado</text>
<text x="308.364" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué mejora y cuándo?</text>
<text x="666.182" y="209.12" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Casos comparables, piloto o supuestos declarados.</text>
<rect x="28" y="225.68" width="984" height="53.12" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="245.68" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Inversión total</text>
<text x="308.364" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Cuánto cuesta realmente?</text>
<text x="666.182" y="245.68" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Precio, implantación, cambio interno y</text>
<text x="666.182" y="262.24" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >mantenimiento.</text>
<rect x="28" y="278.8" width="984" height="36.56" rx="0" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="298.8" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Riesgos y supuestos</text>
<text x="308.364" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Qué podría no cumplirse?</text>
<text x="666.182" y="298.8" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Lista con probabilidades y mitigaciones.</text>
<rect x="28" y="315.36" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="335.36" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Retorno y plazo</text>
<text x="308.364" y="335.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >¿Cuándo se recupera y cuánto rinde?</text>
<text x="666.182" y="335.36" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" >Cálculo con rangos y sensibilidad.</text>
<rect x="28" y="367.92" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="389.92" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El comprador debe poder llevar el caso a su comité sin el vendedor. Por eso se construye con sus números y se escribe en su lenguaje</text>
<text x="44" y="407.17" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >financiero.</text>
<text x="28" y="454.42" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Un caso con beneficios exagerados destruye credibilidad; es preferible un rango prudente y verificable.</text>
</svg>
