<text x="48" y="554.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="572.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Etiquetar una afirmación no la vuelve verdadera. Incluso un 'hecho' puede estar mal medido, desactualizado o sesgado por selección; la</text>
<text x="48" y="589.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >calidad de la fuente importa tanto como la categoría.</text>
