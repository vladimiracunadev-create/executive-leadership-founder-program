<text x="44" y="152" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >Nicho con criterios</text>
<text x="44" y="169.25" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start" >observables.</text>
