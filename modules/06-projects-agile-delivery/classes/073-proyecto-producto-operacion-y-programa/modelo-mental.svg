<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588.24" width="1040" role="img" aria-labelledby="t-g73 d-g73" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g73">Ficha visual de la clase 073: Proyecto, producto, operación y programa</title>
<desc id="d-g73">Conceptos: proyecto; producto; operación; programa; portfolio. Método: clasificar naturaleza del trabajo → definir horizonte y outcome → seleccionar funding y governance → diseñar transición a operación o producto → revisar si la categoría sigue siendo válida.</desc>
<defs><marker id="p-g73" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="588.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
