id: 47
part: 03
title: "Recuperación, límites y sostenibilidad"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "regularse, sostener exigencia humana y liderar adaptación bajo presión"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Describir las tres dimensiones del *burnout* y distinguirlo del cansancio normal."
  - "Identificar las seis áreas donde el trabajo se desajusta con la persona."
  - "Explicar las cuatro experiencias de recuperación y cómo se favorecen."
  - "Establecer límites concretos de disponibilidad, carga y descanso."
  - "Distinguir qué es responsabilidad individual y qué es del sistema de trabajo."
deliverable: "leadership-decision-brief.md"
references:
  - "Christina Maslach, Wilmar B. Schaufeli & Michael P. Leiter — *Job Burnout*"
  - "Sabine Sonnentag & Charlotte Fritz — *The Recovery Experience Questionnaire: Development and Validation of a Measure for Assessing Recuperation and Unwinding From Work*"
  - "Michael C. Mankins & Eric Garton — *Time, Talent, Energy*"
  - "Ronald Heifetz & Marty Linsky — *Leadership on the Line*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
limits:
  - "El *burnout* no se reconoce igual en todos los sistemas de salud como diagnóstico y las escalas de medición son instrumentos de investigación, no herramientas de diagnóstico individual."
evidence_signals:
  - "dimensiones de agotamiento"
  - "áreas de desajuste"
  - "límites de disponibilidad cumplidos"
  - "experiencias de recuperación"
