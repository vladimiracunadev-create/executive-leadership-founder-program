<text x="52" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >permit coverage</text>
<rect x="167.5" y="470.36" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="180.5" cy="483.36" r="3.5" fill="#59636e"/>
<text x="191.5" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >days to approval</text>
<rect x="313.9" y="470.36" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="326.9" cy="483.36" r="3.5" fill="#59636e"/>
<text x="337.9" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >renewal compliance</text>
<rect x="474.1" y="470.36" width="177.8" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="487.1" cy="483.36" r="3.5" fill="#59636e"/>
<text x="498.1" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >operating restrictions</text>
<rect x="661.9" y="470.36" width="157.1" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="674.9" cy="483.36" r="3.5" fill="#59636e"/>
<text x="685.9" y="487.86" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >inspection findings</text>
<rect x="28" y="516.36" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="516.36" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="536.36" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="554.36" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >No existe un listado único para todas las empresas. Municipio, actividad y sector cambian requisitos; consulta autoridades oficiales</text>
<text x="48" y="571.61" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >antes de firmar inversiones irreversibles.</text>
