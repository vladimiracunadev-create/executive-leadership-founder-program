<text x="44" y="279.75" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >El tratamiento del IVA depende del hecho y de la norma vigente. Esta clase no determina un impuesto específico: se revisa en el SII y</text>
<text x="44" y="297" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >con asesoría contable.</text>
<text x="28" y="344.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Un documento sin soporte o sin conciliar es un riesgo, aunque el número cuadre.</text>
