id: 58
part: 04
title: "Accountability sin microgestión"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "crear equipos con propósito, coordinación, confianza, aprendizaje y accountability"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir rendición de cuentas, control y microgestión."
  - "Establecer acuerdos claros con resultado, plazo, medida y consecuencia."
  - "Diseñar un seguimiento visible que no requiera preguntar."
  - "Conducir la conversación sobre un compromiso incumplido con hechos y sin atribuir intención."
  - "Fomentar la responsabilidad entre pares y no solo ante el jefe."
deliverable: "leadership-decision-brief.md"
references:
  - "Jon R. Katzenbach & Douglas K. Smith — *The Wisdom of Teams*"
  - "Patrick Lencioni — *The Five Dysfunctions of a Team*"
  - "Edwin A. Locke & Gary P. Latham — *Building a Practically Useful Theory of Goal Setting and Task Motivation: A 35-Year Odyssey*"
  - "Andrew S. Grove — *High Output Management*"
  - "Amy C. Edmondson — *The Fearless Organization*"
limits:
  - "Parte de lo que se sostiene sobre responsabilidad mutua procede de estudios de casos y de la experiencia de consultoría."
evidence_signals:
  - "acuerdos con resultado, fecha y medida"
  - "seguimiento visible"
  - "conversación iniciada con hechos"
  - "consecuencias proporcionales"
