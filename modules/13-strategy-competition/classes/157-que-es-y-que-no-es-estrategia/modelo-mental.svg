<text x="54" y="377.24" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >coherent actions</text>
<text x="54" y="395.24" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >acciones coordinadas que materializan la política</text>
