id: 242
part: 20
title: "Encontrar problemas valiosos"
duration_minutes: 150
level: "Etapa 6 — Founder"
outcome: "descubrir, validar y lanzar una empresa antes de escalarla"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir problem value de frequency mediante evidencia observable."
  - "Aplicar la secuencia: listar problemas desde experiencia y observación → puntuar dolor frecuencia y budget → entrevistar segmentos accesibles → buscar workarounds y spend → seleccionar problema para validar."
  - "Interpretar problem frequency, current spend, time loss sin atribuir causalidad automática."
  - "Resolver el caso de encontrar problemas valiosos con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "founder-owner-decision-brief.md"
references:
  - "Steve Blank — *The Four Steps to the Epiphany*"
  - "Alexander Osterwalder & Yves Pigneur — *Business Model Generation*"
  - "Noam Wasserman — *The Founder's Dilemmas*"
  - "Rob Fitzpatrick — *The Mom Test*"
  - "Ben Horowitz — *The Hard Thing About Hard Things*"
  - "Bill Aulet — *Disciplined Entrepreneurship*"
limits:
  - "Elegir por accesibilidad puede sesgar hacia oportunidades pequeñas; úsala como ventaja de aprendizaje inicial y luego valida tamaño y competencia antes de comprometer."
evidence_signals:
  - "problem frequency"
  - "current spend"
  - "time loss"
  - "decision urgency"
  - "customer access"
