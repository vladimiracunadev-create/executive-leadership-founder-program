id: 203
part: 16
title: "Sucesión y continuidad de liderazgo"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir escenarios de sucesión: planificada, de emergencia y por desempeño."
  - "Construir el perfil del próximo CEO a partir de la estrategia futura."
  - "Evaluar candidatos internos y externos con criterios, pesos y evidencia."
  - "Preparar un plan de emergencia y ensayar la transición."
  - "Gestionar la confidencialidad, la comunicación y el desarrollo de candidatos."
deliverable: "people-decision-brief.md"
references:
  - "Ram Charan — *Boards That Deliver*"
  - "Elena L. Botelho, Kim R. Powell & Tahl Raz — *The CEO Next Door*"
  - "Ram Charan, Stephen Drotter & James Noel — *The Leadership Pipeline*"
  - "Jim Collins — *Good to Great*"
  - "Bob Tricker — *Corporate Governance*"
limits:
  - "Un plan de sucesión no debe anunciar un heredero de forma prematura ni congelar la estrategia."
evidence_signals:
  - "escenarios de sucesión distinguidos"
  - "perfil derivado de la estrategia"
  - "evaluación con criterios y sensibilidad"
  - "plan de emergencia ensayado"
