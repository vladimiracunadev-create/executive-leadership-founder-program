id: 98
part: 08
title: "Diseño de objetivos"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "dirigir mediante outcomes, métricas, revisiones y asignación explícita de recursos"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Formular un objetivo específico, medible, con dueño, plazo y resultado esperado."
  - "Distinguir objetivos de resultado, de proceso y de aprendizaje."
  - "Calibrar la dificultad: exigente pero alcanzable según el contexto."
  - "Anticipar efectos secundarios y fijar límites y medidas de contrapeso."
  - "Revisar un objetivo ante nueva información sin perder credibilidad."
deliverable: "leadership-decision-brief.md"
references:
  - "Edwin A. Locke & Gary P. Latham — *Building a Practically Useful Theory of Goal Setting and Task Motivation: A 35-Year Odyssey*"
  - "Lisa D. Ordóñez, Maurice E. Schweitzer, Adam D. Galinsky & Max H. Bazerman — *Goals Gone Wild: The Systematic Side Effects of Overprescribing Goal Setting*"
  - "John Doerr — *Measure What Matters*"
  - "Peter F. Drucker — *Management: Tasks, Responsibilities, Practices*"
  - "Daniel Kahneman, Olivier Sibony & Cass R. Sunstein — *Noise*"
limits:
  - "La evidencia de laboratorio y de estudios de campo sobre metas no cubre todos los contextos; el efecto depende de la tarea, la cultura y la forma de evaluación."
evidence_signals:
  - "objetivo específico y medible"
  - "dueño y plazo definidos"
  - "límites y contrapesos"
  - "revisión con criterios y registro"
