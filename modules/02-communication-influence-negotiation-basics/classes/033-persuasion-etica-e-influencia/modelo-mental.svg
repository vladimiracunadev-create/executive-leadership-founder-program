<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620.24" width="1040" role="img" aria-labelledby="t-g33 d-g33" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-g33">Ficha visual de la clase 033: Persuasión ética e influencia</title>
<desc id="d-g33">Conceptos: reciprocidad; prueba social; autoridad; escasez; coerción. Método: definir interés legítimo de la audiencia → seleccionar evidencia relevante → hacer visibles costos y alternativas → usar influencia sin ocultar información material → dejar espacio real para disentir o rechazar.</desc>
<defs><marker id="p-g33" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="620.24" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="120.67" height="24" rx="12" fill="#1a7f37"/>
<text x="88.335" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MODELO MENTAL</text>
<text x="164.67" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 033 · Persuasión ética e influencia</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Parte 02 · Autoliderazgo y fundamentos ejecutivos</text>
<text x="28" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ HAY QUE DISTINGUIR</text>
<circle cx="38" cy="112" r="5" fill="#1a7f37"/>
<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >reciprocidad</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >tendencia a corresponder beneficios o concesiones</text>
<circle cx="38" cy="170" r="5" fill="#1a7f37"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >prueba social</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >uso de conducta de otros como señal de qué es apropiado</text>
<circle cx="38" cy="228" r="5" fill="#1a7f37"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >autoridad</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >señal de expertise o legitimidad que influye en</text>
<text x="54" y="267.56" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >confianza</text>
<circle cx="38" cy="300.12" r="5" fill="#1a7f37"/>
<text x="54" y="305.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >escasez</text>
<text x="54" y="323.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >mayor valor percibido cuando una opción parece limitada</text>
<circle cx="38" cy="358.12" r="5" fill="#1a7f37"/>
<text x="54" y="363.12" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >coerción</text>
<text x="54" y="381.12" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >presión que reduce de manera impropia la libertad real</text>
<text x="54" y="397.68" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >de elección</text>
<text x="470" y="88" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">CÓMO SE RAZONA, EN ORDEN</text>
<rect x="470" y="336" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="470" y="336" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="486" y="356" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >1</text>
<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >definir interés legítimo de la</text>
<text x="504" y="373.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >audiencia</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >seleccionar evidencia relevante</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >hacer visibles costos y</text>
<text x="628" y="257.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >alternativas</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >usar influencia sin ocultar</text>
<text x="690" y="199.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >información material</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#1a7f37"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >dejar espacio real para disentir o</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >rechazar</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="164" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="52" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >conversión informada</text>
<rect x="202" y="456.24" width="267.5" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="215" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="226" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >objeciones resueltas sin ocultarlas</text>
<rect x="479.5" y="456.24" width="205.4" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="492.5" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="503.5" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >retractaciones posteriores</text>
<rect x="694.9" y="456.24" width="150.2" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="707.9" cy="469.24" r="3.5" fill="#1a7f37"/>
<text x="718.9" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >quejas por presión</text>
<rect x="28" y="488.24" width="198.5" height="26" rx="13" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2" />
<circle cx="41" cy="501.24" r="3.5" fill="#1a7f37"/>
<text x="52" y="505.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >calidad de consentimiento</text>
<rect x="28" y="534.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="534.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="554.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="572.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >La influencia deja de ser ética cuando usa falsedad, urgencia fabricada, amenaza impropia o vulnerabilidad. El resultado comercial no</text>
<text x="48" y="589.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >justifica deteriorar autonomía o confianza.</text>
</svg>
