<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456.06" width="1040" role="img" aria-labelledby="t-s139 d-s139" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t-s139">Clase 139 · Elegir canales: alcance frente a control</title>
<desc id="d-s139">Cuadrante de alcance y control del canal para decidir entre distribuidores, plataformas, venta directa y canales propios.</desc>
<defs><marker id="p-s139" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#59636e"/></marker></defs>
<rect width="1040" height="456.06" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="28" y="24" width="59.95" height="24" rx="12" fill="#1a7f37"/>
<text x="57.975" y="40" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARCO</text>
<text x="103.95" y="43" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start" >Clase 139 · Elegir canales: alcance frente a control</text>
<text x="1012" y="43" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end" >Kotler &amp; Keller · Porter · Weinberg &amp; Mares</text>
<text x="362.5" y="100" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >Poco control</text>
<text x="799.5" y="100" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle" >Mucho control</text>
<text transform="translate(120,160.25) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">Mucho alcance</text>
<text transform="translate(120,268.75) rotate(-90)" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="middle">Poco alcance</text>
<rect x="150" y="112" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" />
<rect x="150.0" y="112.0" width="425.0" height="34" rx="12" fill="#bc4c00"/>
<text x="166" y="135" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Alcance sin control</text>
<text x="166" y="170" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Distribuidores y plataformas: llegan lejos, pero fijan</text>
<text x="166" y="187.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >reglas y se quedan con parte del margen y de los datos.</text>
<rect x="587" y="112" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<rect x="587.0" y="112.0" width="425.0" height="34" rx="12" fill="#1a7f37"/>
<text x="603" y="135" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Alcance con control</text>
<text x="603" y="170" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Canal propio digital y red propia: llegan a muchos con</text>
<text x="603" y="187.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >control de la experiencia, con más inversión.</text>
<rect x="150" y="220.5" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#59636e" stroke-width="1.8" />
<rect x="150.0" y="220.5" width="425.0" height="34" rx="12" fill="#59636e"/>
<text x="166" y="243.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Evitar</text>
<text x="166" y="278.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Poco alcance y poco control: consume gestión sin dar</text>
<text x="166" y="295.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >escala.</text>
<rect x="587" y="220.5" width="425" height="96.5" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8" />
<rect x="587.0" y="220.5" width="425.0" height="34" rx="12" fill="#0969da"/>
<text x="603" y="243.5" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start" >Control en nichos</text>
<text x="603" y="278.5" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Venta directa especializada: control alto en un público</text>
<text x="603" y="295.75" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >acotado.</text>
<rect x="28" y="329" width="984" height="60.5" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
<text x="44" y="351" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >La elección de canales cambia el margen, la propiedad de los datos del cliente y la experiencia. Cada canal se evalúa por costo por</text>
<text x="44" y="368.25" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start" >cliente, retención y dependencia.</text>
<text x="28" y="415.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >Las relaciones con distribuidores y plataformas tienen condiciones contractuales y de competencia que se revisan con asesoría.</text>
</svg>
