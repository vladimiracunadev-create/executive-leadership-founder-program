id: 64
part: 05
title: "Entrevistas estructuradas"
duration_minutes: 150
level: "Etapa 2 — Líder → Jefe"
outcome: "diseñar un sistema de talento desde el cargo hasta la salida responsable"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Describir los componentes que hacen estructurada una entrevista."
  - "Diseñar preguntas basadas en conductas pasadas y en situaciones hipotéticas."
  - "Construir una escala de puntaje con descripciones ancla."
  - "Conducir la entrevista y registrar evidencia sin interpretar."
  - "Combinar evaluaciones independientes y documentar la decisión."
deliverable: "leadership-decision-brief.md"
references:
  - "Julia Levashina, Christopher J. Hartwell, Frederick P. Morgeson & Michael A. Campion — *The Structured Employment Interview: Narrative and Quantitative Review of the Research Literature*"
  - "Daniel Kahneman, Olivier Sibony & Cass R. Sunstein — *Noise*"
  - "Laszlo Bock — *Work Rules!*"
  - "Frank L. Schmidt & John E. Hunter — *The validity and utility of selection methods in personnel psychology: Practical and theoretical implications of 85 years of research findings*"
  - "Paul R. Sackett, Charlene Zhang, Christopher M. Berry & Filip Lievens — *Revisiting meta-analytic estimates of validity in personnel selection: Addressing systematic overcorrection for restriction of range*"
limits:
  - "La estructura mejora la predicción en promedio, pero no elimina el sesgo: las preguntas y las anclas pueden reflejar los valores de quien las escribe."
evidence_signals:
  - "mismas preguntas a todos"
  - "escala con anclas"
  - "puntaje independiente"
  - "razón de la decisión registrada"
