<title id="t-g282">Ficha visual de la clase 282: SaaS y modelos recurrentes</title>
<desc id="d-g282">Conceptos: MRR; ARR; logo churn; net revenue retention; CAC payback. Método: definir recurring job → modelar pricing y unit economics → construir minimal reliable service → medir cohort retention → optimizar acquisition y expansion después de fit.</desc>
