id: 221
part: 18
title: "Múltiplos y comparables"
duration_minutes: 150
level: "Etapa 5 — CEO → Capital allocator"
outcome: "decidir estructura de capital, valoración, fundraising y transacciones"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Distinguir valor de empresa y valor del patrimonio y los múltiplos que corresponden a cada uno."
  - "Elegir una métrica consistente y un grupo de comparables por su economía."
  - "Normalizar los estados financieros antes de comparar."
  - "Comparar crecimiento, margen y riesgo para ajustar el rango."
  - "Reconciliar el resultado con el flujo descontado."
deliverable: "leadership-decision-brief.md"
references:
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Aswath Damodaran — *Investment Valuation*"
  - "Stephen H. Penman — *Financial Statement Analysis and Security Valuation*"
  - "Krishna G. Palepu, Paul M. Healy & Erik Peek — *Business Analysis and Valuation*"
  - "Donald DePamphilis — *Mergers, Acquisitions, and Other Restructuring Activities*"
limits:
  - "Los múltiplos son relativos: si el mercado está caro o barato, la valoración lo refleja."
evidence_signals:
  - "métrica coherente con el valor de empresa"
  - "comparables por su economía"
  - "cifras normalizadas"
  - "reconciliación con el flujo descontado"
