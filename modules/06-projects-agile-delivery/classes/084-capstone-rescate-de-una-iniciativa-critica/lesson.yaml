id: 84
part: 06
title: "Capstone: rescate de una iniciativa crítica"
duration_minutes: 150
level: "Etapa 2 — Jefe → Manager"
outcome: "entregar proyectos con alcance, flujo, riesgo, calidad y gobernanza adaptativa"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Diagnosticar una iniciativa crítica con los marcos de la parte."
  - "Secuenciar un rescate en estabilización, replanificación y entrega."
  - "Elegir el enfoque de trabajo —plan, ciclos o flujo— según la naturaleza del trabajo."
  - "Diseñar la gobernanza, la comunicación y los criterios de calidad del rescate."
  - "Decidir con el patrocinador entre continuar, redefinir o cerrar, con evidencia."
deliverable: "risk-governance-brief.md"
references:
  - "Bent Flyvbjerg & Dan Gardner — *How Big Things Get Done*"
  - "Harold Kerzner — *Project Management*"
  - "Ken Schwaber & Jeff Sutherland — *The Scrum Guide*"
  - "David J. Anderson — *Kanban*"
  - "Amy C. Edmondson — *Psychological Safety and Learning Behavior in Work Teams*"
limits:
  - "El plan de noventa días es una guía; el tiempo real depende del tamaño y de la complejidad."
evidence_signals:
  - "estabilización en siete días"
  - "plan de 90 días"
  - "gobierno ligero con tolerancias"
  - "decisión continuar, redefinir o cerrar"
