<title id="t-g87">Ficha visual de la clase 087: SOP y trabajo estandarizado</title>
<desc id="d-g87">Conceptos: SOP; standard work; control point; exception path; version control. Método: seleccionar proceso estable y crítico → observar cómo se ejecuta realmente → documentar pasos y controles mínimos → probar con una persona nueva → versionar y revisar tras incidentes.</desc>
