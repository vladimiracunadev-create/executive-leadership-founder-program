id: 201
part: 16
title: "Leadership pipeline"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Mapear los niveles de liderazgo y los cargos críticos de la empresa."
  - "Definir qué cambia en cada pasaje: trabajo, uso del tiempo y valores."
  - "Calibrar potencial y preparación con evidencia y sin sesgos evidentes."
  - "Diseñar asignaciones de desarrollo y acompañamiento."
  - "Medir cobertura de sucesores, tiempo de cobertura y calidad de las promociones."
deliverable: "commercial-decision-brief.md"
references:
  - "Ram Charan, Stephen Drotter & James Noel — *The Leadership Pipeline*"
  - "John J. Gabarro — *The Dynamics of Taking Charge*"
  - "Elena L. Botelho, Kim R. Powell & Tahl Raz — *The CEO Next Door*"
  - "Robert Kegan & Lisa Laskow Lahey — *Immunity to Change*"
  - "Michael C. Mankins & Eric Garton — *Time, Talent, Energy*"
limits:
  - "El pipeline no debe convertirse en una jerarquía rígida ni sesgar contra carreras expertas."
evidence_signals:
  - "pasajes con trabajo, tiempo y valores"
  - "cargos críticos con cobertura"
  - "potencial y preparación calibrados"
  - "caso de negocio con sensibilidad"
