id: 121
part: 10
title: "Ventas como sistema, no como improvisación"
duration_minutes: 150
level: "Etapa 3 — Manager → Gerente"
outcome: "construir ingresos mediante un proceso comercial medible y negociación disciplinada"
depth_standard: deep-class-v2
source_mode: books-plus-primary
pedagogy: retrieval-case-deliberate-practice
objectives:
  - "Distinguir sales process de stage mediante evidencia observable."
  - "Aplicar la secuencia: definir ICP y proceso comprador → crear etapas con exit criteria → instrumentar conversiones y aging → revisar pérdidas por etapa → mejorar cuello antes de aumentar volumen."
  - "Interpretar stage conversion, win rate, sales cycle sin atribuir causalidad automática."
  - "Resolver el caso de ventas como sistema, no como improvisación con dos alternativas y trade-offs."
  - "Contrastar dos fuentes y modificar la decisión cuando la evidencia lo exija."
deliverable: "commercial-decision-brief.md"
references:
  - "Neil Rackham — *SPIN Selling*"
  - "Matthew Dixon & Brent Adamson — *The Challenger Sale*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
  - "Neil Rackham — *Major Account Sales Strategy*"
  - "Aaron Ross & Marylou Tyler — *Predictable Revenue*"
  - "Robert B. Cialdini — *Influence*"
limits:
  - "No todo buyer sigue la misma secuencia. El sistema debe reflejar señales de compra y permitir iteración, no obligar al cliente a comportarse como el CRM."
evidence_signals:
  - "stage conversion"
  - "win rate"
  - "sales cycle"
  - "pipeline velocity"
  - "stage aging"
