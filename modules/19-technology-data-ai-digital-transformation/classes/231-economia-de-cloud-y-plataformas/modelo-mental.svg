<title id="t-g231">Ficha visual de la clase 231: Economía de cloud y plataformas</title>
<desc id="d-g231">Conceptos: cloud economics; elasticity; unit cost; FinOps; vendor lock-in. Método: mapear workloads y value drivers → calcular unit cost → identificar waste y commitments → modelar resilience y lock-in → optimizar arquitectura y governance.</desc>
