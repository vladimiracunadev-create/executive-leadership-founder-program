objectives:
  - "Preparar un pack con resumen ejecutivo, documentos de decisión y tablero."
  - "Identificar las dos o tres decisiones que el directorio debe tomar en la sesión."
  - "Conducir el desafío y la deliberación con información y respeto."
  - "Registrar acuerdos, razones y disidencias con precisión."
  - "Cerrar con acciones, responsables y una sesión ejecutiva útil."
