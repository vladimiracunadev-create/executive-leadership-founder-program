<text x="504" y="356" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >elegir problema repetible</text>
<rect x="532" y="278" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="532" y="278" width="6" height="52" rx="3" fill="#59636e"/>
<text x="548" y="298" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >2</text>
<text x="566" y="298" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >crear minimum paid asset</text>
<rect x="594" y="220" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="594" y="220" width="6" height="52" rx="3" fill="#59636e"/>
<text x="610" y="240" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >3</text>
<text x="628" y="240" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >definir IP y license</text>
<rect x="656" y="162" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="656" y="162" width="6" height="52" rx="3" fill="#59636e"/>
<text x="672" y="182" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >4</text>
<text x="690" y="182" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >probar distribution y price</text>
<rect x="718" y="104" width="294" height="52" rx="9" fill="#ffffff" stroke="#59636e" stroke-width="1.6" />
<rect x="718" y="104" width="6" height="52" rx="3" fill="#59636e"/>
<text x="734" y="124" font-size="13" font-weight="800" fill="#59636e" text-anchor="start" >5</text>
<text x="752" y="124" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >medir support y maintenance e</text>
<text x="752" y="141.25" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >iterate</text>
<text x="28" y="444.24" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1.4">QUÉ OBSERVAR</text>
<rect x="28" y="456.24" width="129.5" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="41" cy="469.24" r="3.5" fill="#59636e"/>
<text x="52" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >paid conversion</text>
<rect x="167.5" y="456.24" width="101.9" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="180.5" cy="469.24" r="3.5" fill="#59636e"/>
<text x="191.5" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >refund rate</text>
<rect x="279.4" y="456.24" width="108.8" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="292.4" cy="469.24" r="3.5" fill="#59636e"/>
<text x="303.4" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >support time</text>
<rect x="398.2" y="456.24" width="136.4" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="411.2" cy="469.24" r="3.5" fill="#59636e"/>
<text x="422.2" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >distribution CAC</text>
<rect x="544.6" y="456.24" width="143.3" height="26" rx="13" fill="#ffffff" stroke="#59636e" stroke-width="1.2" />
<circle cx="557.6" cy="469.24" r="3.5" fill="#59636e"/>
<text x="568.6" y="473.74" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >maintenance hours</text>
<rect x="28" y="502.24" width="984" height="62" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.4" />
<rect x="28" y="502.24" width="6" height="62" rx="3" fill="#cf222e"/>
<text x="48" y="522.24" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">LÍMITE</text>
<text x="48" y="540.24" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >Digital no significa pasivo. Productos requieren marketing, soporte, actualización y defensa de reputación; modela carga futura antes</text>
<text x="48" y="557.49" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start" >de escalar catálogo.</text>
</svg>
