<text x="630.4" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="start" >Acción de mejora</text>
<rect x="28" y="136" width="984" height="36.56" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<text x="40" y="156" font-size="12" font-weight="700" fill="#1f2328" text-anchor="start" >Visitantes</text>
