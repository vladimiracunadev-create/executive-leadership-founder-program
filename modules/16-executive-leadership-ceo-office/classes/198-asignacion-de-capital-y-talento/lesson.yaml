id: 198
part: 16
title: "Asignación de capital y talento"
duration_minutes: 150
level: "Etapa 5 — Director → CEO"
outcome: "pensar y decidir a nivel empresa, construir el equipo ejecutivo y asignar capital y talento"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Inventariar cómo se usan hoy el capital y el talento clave."
  - "Evaluar propuestas con retorno, riesgo y ajuste estratégico."
  - "Comparar con un umbral de retorno y con alternativas, incluidas las no financieras."
  - "Reasignar recursos desde usos de bajo valor hacia las prioridades."
  - "Revisar resultados reales frente a lo prometido y aprender del proceso."
deliverable: "modelo-financiero-y-memo-de-decision.md"
references:
  - "Joseph L. Bower — *Managing the Resource Allocation Process*"
  - "William N. Thorndike — *The Outsiders*"
  - "Tim Koller, Marc Goedhart & David Wessels — *Valuation: Measuring and Managing the Value of Companies*"
  - "Michael C. Mankins & Eric Garton — *Time, Talent, Energy*"
  - "Jim Collins — *Good to Great*"
limits:
  - "No hay que reducir la asignación al VAN cuando hay opciones estratégicas, capacidades o impactos difíciles de monetizar; se hacen explícitos."
evidence_signals:
  - "inventario de capital y talento"
  - "retorno y umbral aplicados"
  - "reasignación desde lo de bajo valor"
  - "revisión posterior independiente"
