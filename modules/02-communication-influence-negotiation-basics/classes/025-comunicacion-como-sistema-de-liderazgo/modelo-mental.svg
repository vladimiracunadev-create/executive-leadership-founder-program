<text x="54" y="117" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >mensaje</text>
<text x="54" y="135" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >contenido que intenta modificar comprensión o acción</text>
<circle cx="38" cy="170" r="5" fill="#1a7f37"/>
<text x="54" y="175" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >canal</text>
<text x="54" y="193" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >medio con distinta riqueza, velocidad y persistencia</text>
<circle cx="38" cy="228" r="5" fill="#1a7f37"/>
<text x="54" y="233" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" >ruido</text>
<text x="54" y="251" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" >interferencia que altera significado o atención</text>
