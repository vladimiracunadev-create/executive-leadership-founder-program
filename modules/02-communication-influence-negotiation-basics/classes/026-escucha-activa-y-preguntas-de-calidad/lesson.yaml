id: 26
part: 02
title: "Escucha activa y preguntas de calidad"
duration_minutes: 150
level: "Etapa 1 — Profesional → Líder"
outcome: "convertir comunicación, influencia y negociación en sistemas de decisión y relación"
depth_standard: deep-class-v2
source_mode: primary-literature
pedagogy: retrieval-case-deliberate-practice
authoring: manual
objectives:
  - "Definir indagación humilde y distinguirla de las otras tres formas de preguntar."
  - "Reconocer cuándo una pregunta es en realidad una opinión disfrazada."
  - "Formular preguntas abiertas que obtengan hechos, y comprobar tu comprensión resumiendo."
  - "Detectar tus propios obstáculos para escuchar: juicio, solución prematura, defensa."
  - "Conducir una conversación de diagnóstico de un problema de trabajo sin imponer tu interpretación."
deliverable: "operating-improvement-brief.md"
references:
  - "Edgar H. Schein — *Humble Inquiry*"
  - "Douglas Stone, Bruce Patton & Sheila Heen — *Difficult Conversations*"
  - "Kerry Patterson et al. — *Crucial Conversations*"
  - "Daniel Goleman, Richard Boyatzis & Annie McKee — *Primal Leadership*"
  - "Roger Fisher, William Ury & Bruce Patton — *Getting to Yes*"
limits:
  - "Los tipos de pregunta de Schein son una clasificación de trabajo derivada de su experiencia en consultoría, no el resultado de una medición."
evidence_signals:
  - "proporción de preguntas abiertas"
  - "resumen confirmado por el otro"
  - "hechos nuevos obtenidos"
  - "cierre del circuito con fecha"
